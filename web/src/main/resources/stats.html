<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="What this deployment holds and is doing: the relay's corpus, the mirror's coverage, and the monitor's verdicts — one page, served by whichever of the three you point it at." />
<title>Relay stats</title>
<!-- Every reference is document-relative: this one file is served by the relay,
     the mirror and the monitor, two of which may sit under a path prefix. The
     leading `./` on an import is required: a bare `web/...` is an import-map key. -->
<link rel="icon" href="./web/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="./web/favicon.ico" sizes="16x16 32x32 48x48" />
<!--
  On the relay, every corpus number is asked live of the relay itself over its
  websocket (web/relay/): NIP-45 COUNTs over time windows, which the engine
  answers in milliseconds. GET /stats.json carries only who this relay is and
  what its router mirrors. On the mirror and the monitor the panels chart that
  service's own /stats.json. Every number describes this store, counted
  anonymously; an unanswered ask is a dash, never a zero.
-->
<link rel="stylesheet" href="./web/shared/stats.css" />
</head>
<body>
<main>
  <!-- Replaced from the document's own `title` on the first render. -->
  <h1>Relay stats</h1>
  <p class="sub" id="scope">Loading…</p>

  <div id="body"></div>

  <footer id="foot"></footer>
</main>
<div class="tip" id="tip"></div>

<script type="module">
import { KNOWN_KINDS } from "./web/shared/kinds.js";
import { mountStatsPage } from "./web/shared/statspage.js";
import { Relay } from "./web/shared/relay.js";
import { LiveCounts, socketUrlOf } from "./web/relay/live.js";
import { liveCards } from "./web/relay/cards.js";
// Imported unconditionally: one page serves all three services (see PANELS).
import { syncCard } from "./web/sync/cards.js";
import { monitorCard, verdictsCard } from "./web/monitor/cards.js";

/** The document schema this page reads; see SCHEMA_VERSION in StatsRollup. */
const SCHEMA = 3;

/**
 * The relay's document, as against the mirror's (which names no relay) and the monitor's
 * (which carries `monitor`). Only the relay's page counts the store over a socket.
 */
const isRelayDoc = (doc) => !!doc.relay && !doc.monitor;

/** Started on the first relay document and kept for the life of the tab. */
let live = null;

/** The router's kind set; absent when it names none, or when a stream mirrors every kind (`allKinds`). */
const mirroredKinds = (doc) => doc.sync?.data?.mirrors?.kinds || null;

function livePanel(doc) {
  if (!live) {
    // Same-origin, beside this page: `doc.relay` is the public url, which a local or tunnelled
    // reader may not be able to reach.
    const socketUrl = socketUrlOf(location.href);
    const relay = new Relay(socketUrl, { lensless: true });
    let cards = null;
    live = new LiveCounts(relay, { fallbackKinds: KNOWN_KINDS, onChange: () => cards && cards.update() });
    live.setMirrored(mirroredKinds(doc));
    cards = liveCards(live, socketUrl);
    live.cards = cards.cards;
    // Closed on pagehide, which keeps the page eligible for the back-forward cache.
    window.addEventListener("pagehide", () => { try { relay.ws && relay.ws.close(); } catch (e) {} });
    live.start();
  }
  return live.cards;
}

/**
 * The body, panel by panel. `reads` is the redraw key: a panel is rebuilt only when a section
 * it reads was recomputed. `reads: []` builds once, for the panels that hold their own state.
 */
const has = (doc, ...members) => members.some((m) => doc[m]);

const PANELS = [
  { name: "live", reads: [], build: (doc) => (isRelayDoc(doc) ? livePanel(doc) : []) },
  // The mirror's card is guarded on the coverage itself, not the section: the relay's document
  // carries a `sync` section too, holding only the manifest. `relays` counts as coverage: an
  // entirely refused roster has no bands.
  { name: "sync", reads: ["sync"], build: (doc) => (doc.sync?.data?.progress || doc.sync?.data?.streams || doc.sync?.data?.relays ? [syncCard(doc.sync)] : []) },
  { name: "monitor", reads: ["monitor"], build: (doc) => (has(doc, "monitor") ? [monitorCard(doc.monitor)].filter(Boolean) : []) },
  // `doc.relay` is the served relay's ws url; a page on the monitor's port must not derive its
  // socket from `location`.
  { name: "verdicts", reads: [], build: (doc) => (has(doc, "monitor") ? [verdictsCard(doc.relay)] : []) },
];

mountStatsPage({
  panels: PANELS,
  // Every schema this page can read, one per publishing service.
  schema: { relay: SCHEMA, sync: 1, monitor: 1 },
  // The cadences named in the footer, in reading order; a tier not listed here still gets a line.
  tiers: [["counters", "Counters"], ["status", "Status"]],
  pendingNote:
    "This is computed behind the server. On the relay it lands within a minute of boot (check that " +
    "STATS_COUNTERS_INTERVAL_SECONDS is not 0); on the mirror and the monitor it is a fold over state already in " +
    "memory and lands on the first tick (check the sync log for `router:` lines).",
  // A new manifest changes which kinds the table counts.
  beforePanels: (doc) => { if (live && isRelayDoc(doc)) live.setMirrored(mirroredKinds(doc)); },
});
</script>
</body>
</html>
