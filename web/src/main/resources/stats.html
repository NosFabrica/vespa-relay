<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="What this deployment holds and is doing: the relay's corpus, the mirror's coverage, and the monitor's verdicts — one page, served by whichever of the three you point it at." />
<title>Relay stats</title>
<!-- Every reference is document-relative: this one file is served by the relay,
     the mirror and the monitor, two of which may sit under a path prefix. -->
<link rel="icon" href="./web/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="./web/favicon.ico" sizes="16x16 32x32 48x48" />
<!--
  The corpus this deployment holds, charted from GET /stats.json.

  The JSON is the artifact and this page is one reader of it. Two things speak the
  relay protocol instead: the relay's live panels at the top, since a rollup hours
  old cannot say what is happening now, and the verdicts panel, which has no rollup
  to read. Every number describes this store, counted anonymously. A stale or
  missing rollup is said, never drawn as zeros. Charts are single-series: events
  and pubkeys are two charts, never two y-axes.

  The logic is web/stats/page.js, which hands each service's panels to
  mountStatsPage (web/shared/statspage.js); the relay's own panels are
  web/relay/cards.js (live) and web/relay/charts.js (rolled up). No inline
  script: the page's policy refuses one.
-->
<link rel="stylesheet" href="./web/shared/stats.css" />
</head>
<body>
<main>
  <!-- Replaced from the document's own `title` on the first render. -->
  <h1>Relay stats</h1>
  <p class="sub" id="scope">Loading…</p>

  <div id="body"></div>

  <footer id="foot"></footer>
</main>
<div class="tip" id="tip"></div>

<link rel="modulepreload" href="./web/monitor/cards.js" />
<link rel="modulepreload" href="./web/relay/cards.js" />
<link rel="modulepreload" href="./web/relay/charts.js" />
<link rel="modulepreload" href="./web/relay/live.js" />
<link rel="modulepreload" href="./web/shared/format.js" />
<link rel="modulepreload" href="./web/shared/kinds.js" />
<link rel="modulepreload" href="./web/shared/lens.js" />
<link rel="modulepreload" href="./web/shared/page.js" />
<link rel="modulepreload" href="./web/shared/processors.js" />
<link rel="modulepreload" href="./web/shared/relay.js" />
<link rel="modulepreload" href="./web/shared/relayurl.js" />
<link rel="modulepreload" href="./web/shared/statspage.js" />
<link rel="modulepreload" href="./web/shared/sync.js" />
<link rel="modulepreload" href="./web/shared/verdicts.js" />
<link rel="modulepreload" href="./web/sync/cards.js" />
<script type="module" src="./web/stats/page.js"></script>
</body>
</html>
