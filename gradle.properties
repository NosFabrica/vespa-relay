# The build's own JVMs. Gradle's defaults are -Xmx512m for its daemon, and the Kotlin compile
# daemon inherits the same, which a clean build of this repo outgrows: the modules' compiles run at
# once in that one daemon and die with "GC overhead limit exceeded" (main's CI, twice, and locally).
# A GitHub runner has 16 GB; the test JVMs are sized separately (-PtestHeap).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
