<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="What this router has decided about the relay urls it discovers: which are one server wearing several addresses, which cannot answer the same question twice, and which are graded prime." />
<title>Relay monitor</title>
<link rel="icon" href="/web/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/web/favicon.ico" sizes="16x16 32x32 48x48" />
<link rel="stylesheet" href="/web/shared/stats.css" />
<!--
  WHAT IS OUT THERE, AND HOW MUCH OF IT CAN WE USE.

  The monitor's own page, served by the plane that measures. It was two panels
  living elsewhere: the pass rows were a card on the mirror's page, drawn out of
  a processor array both planes shared, and the per-url verdicts were on the
  RELAY's, because that was the only page with a websocket to read kind-30166
  records over.

  Neither belonged there, and the giveaway is that the two pages answered
  different questions with the same card. Sync coverage is measured in EVENTS
  and asks whether the mirror is keeping up; everything here is measured in
  RELAY URLS and asks which of them may be dialled at all. An operator arrives
  with one of those two questions. Splitting the pages is what lets them stop
  reading at the answer.

  The verdicts panel below reads the records over this relay's OWN websocket,
  which makes it a protocol check as much as a view: a verdict that cannot be
  read here cannot be read by any client either.
-->
</head>
<body>
<main>
  <h1>Relay monitor</h1>
  <p class="sub" id="scope">Loading…</p>

  <div id="body"></div>

  <footer id="foot"></footer>
</main>
<div class="tip" id="tip"></div>

<script type="module">
import { mountStatsPage } from "/web/shared/statspage.js";
import { monitorCard, verdictsCard } from "/web/monitor/cards.js";

/**
 * The body, panel by panel — what each draws and which sections it reads from.
 *
 * `reads: []` on the verdicts panel is on purpose: it is built ONCE and never
 * rebuilt by the poller. It holds what the reader asked for over a websocket
 * and what they typed into its filter, and a rebuild on every tick would throw
 * both away. It is also the only panel drawn whatever the document says — the
 * verdicts live in the store rather than in `/stats.json`, so a deployment
 * whose passes have not run yet can still be holding thousands of them.
 */
const PANELS = [
  { name: "monitor", reads: ["monitor"], build: (doc) => (doc.monitor ? [monitorCard(doc.monitor)].filter(Boolean) : []) },
  // `doc.relay` is the SERVED relay's ws url, published by MonitorStatus: this
  // page is on the monitor's own port, so the socket the panel opens has to be
  // named for the relay rather than derived from `location`.
  { name: "verdicts", reads: [], build: (doc) => [verdictsCard(doc.relay)] },
];

mountStatsPage({
  panels: PANELS,
  // MonitorStatus.SCHEMA_VERSION — its own number: the three documents are
  // published by different planes and version independently.
  schema: 1,
  // One cadence. Nothing here queries or dials to build the document: the rows
  // are a read of atomics the passes already keep.
  tiers: [["status", "Status"]],
  pendingNote:
    "The passes run on their own clock — the fold and the consistency gate on a sweep, fitness on the fast lane — so " +
    "a router that has just started has decided nothing yet. If this persists, check the sync log for `router:` lines, " +
    "and that this deployment has a RELAY_NSEC: without a key there is nothing to sign a verdict as, and the monitor " +
    "does not run at all.",
  footNote: "Counted over the relay urls this router discovers, not over its corpus.",
});
</script>
</body>
</html>
