<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="How many events of each kind this relay holds." />
<title>Kind stats</title>
<!--
  One NIP-45 COUNT per kind, over the same WebSocket that serves this page.

  Deliberately not an http endpoint: COUNT is a protocol feature, so asking for
  it the way a client would means this page also TESTS it. A kind that comes
  back "no reply" is a finding about the relay, not a blank cell — the relay
  advertises NIP-45 in supported_nips, and whether it answers is exactly the
  sort of thing that goes unnoticed until someone asks.

  Counts are the relay's own: a COUNT is answered from the store's index, not
  by walking events, so this stays cheap on a 50M-event corpus.
-->
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --text: #14171a; --muted: #6b7580;
    --line: #e3e6ea; --accent: #4a5fd9; --warn: #a8611a; --bar: #d9def7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --surface: #1c1f24; --text: #e8eaed; --muted: #9aa3ad;
      --line: #2b3038; --accent: #8b9cf0; --warn: #d99b56; --bar: #2c3350;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 1.25rem; font-size: .9rem; }
  .bar-row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  button, input {
    font: inherit; padding: .4rem .7rem; border-radius: .4rem;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
  }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  input { width: 22rem; max-width: 100%; }
  .status { color: var(--muted); font-size: .9rem; }
  .wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: .6rem; }
  table { border-collapse: collapse; width: 100%; min-width: 34rem; }
  th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.kind { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  .name { color: var(--muted); }
  .pending { color: var(--muted); font-style: italic; }
  .none { color: var(--warn); }
  .barcell { width: 40%; min-width: 8rem; }
  .barfill { height: .55rem; border-radius: .3rem; background: var(--bar); }
  footer { margin-top: 1.25rem; color: var(--muted); font-size: .85rem; }
  code { background: var(--bar); padding: .1rem .3rem; border-radius: .25rem; }
</style>
</head>
<body>
<main>
  <h1>Kind stats</h1>
  <p class="sub">One NIP-45 <code>COUNT</code> per kind, asked over the relay's own WebSocket.</p>

  <div class="bar-row">
    <button id="run">Count all kinds</button>
    <input id="extra" placeholder="also count these kinds, comma separated" />
    <span class="status" id="status">idle</span>
  </div>

  <div class="wrap">
    <table>
      <thead>
        <tr><th>Kind</th><th>Name</th><th class="n">Events</th><th class="barcell">Share</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer id="foot"></footer>
</main>

<script>
// Same origin as the page, so this works wherever the relay is served from.
// Override when developing against a remote relay.
const RELAY_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;

// The kinds worth asking about by default. Not exhaustive — the protocol has no
// registry a client can enumerate, and COUNT needs a kind to ask about, so a
// fixed list plus the free-text box is the honest shape. Names are for reading,
// not identity.
const KINDS = [
  [0, "profile metadata"], [1, "short note"], [3, "follow list"], [4, "encrypted DM (legacy)"],
  [5, "deletion request"], [6, "repost"], [7, "reaction"], [9, "chat message"],
  [40, "channel create"], [42, "channel message"], [1059, "gift wrap"], [1063, "file metadata"],
  [1111, "comment"], [1984, "report"], [9735, "zap receipt"], [9802, "highlight"],
  [10000, "mute list"], [10002, "relay list (NIP-65)"], [10040, "trust providers (NIP-85)"],
  [10050, "DM relay list"], [10063, "blossom servers"],
  [30000, "follow set"], [30002, "relay set"], [30008, "profile badges"],
  [30017, "stall"], [30018, "product"], [30023, "long-form article"], [30024, "article draft"],
  [30166, "relay discovery (NIP-66)"], [30311, "live event"], [30315, "user status"],
  [30382, "trust assertion (NIP-85)"], [30402, "classified listing"], [31922, "date event"],
  [31923, "time event"], [31924, "calendar"], [34550, "community"], [39000, "group metadata"],
];

const PER_KIND_TIMEOUT_MS = 20000;
// One at a time. A COUNT is cheap for the relay to answer but this is a status
// page, not a load generator, and a wedged relay should degrade to slow rather
// than to a burst of forty stalled subscriptions.
const rowsEl = document.getElementById("rows");
const statusEl = document.getElementById("status");
const footEl = document.getElementById("foot");
const runEl = document.getElementById("run");
const extraEl = document.getElementById("extra");

const fmt = (n) => n.toLocaleString();

function render(results, total) {
  const max = Math.max(1, ...results.map((r) => (typeof r.count === "number" ? r.count : 0)));
  rowsEl.innerHTML = "";
  for (const r of results) {
    const tr = document.createElement("tr");
    const val =
      r.count === undefined ? '<span class="pending">…</span>'
      : r.count === null ? '<span class="none">no reply</span>'
      : fmt(r.count) + (r.approximate ? ' <span class="name">≈</span>' : "");
    const pct = typeof r.count === "number" && total > 0 ? (r.count / total) * 100 : 0;
    const width = typeof r.count === "number" ? (r.count / max) * 100 : 0;
    tr.innerHTML =
      `<td class="kind">${r.kind}</td>` +
      `<td class="name">${r.name || ""}</td>` +
      `<td class="n">${val}</td>` +
      `<td class="barcell"><div class="barfill" style="width:${width.toFixed(2)}%"></div>` +
      `<span class="name">${pct ? pct.toFixed(pct < 1 ? 2 : 1) + "%" : ""}</span></td>`;
    rowsEl.appendChild(tr);
  }
}

// A minimal client: connect, answer the NIP-42 challenge if a NIP-07 extension
// is present, then one COUNT per kind.
function connect() {
  return new Promise((resolve, reject) => {
    const ws = new WebSocket(RELAY_URL);
    const pending = new Map();     // subId -> {resolve, timer}
    ws.challenge = null;
    ws.onopen = () => resolve(ws);
    ws.onerror = () => reject(new Error("could not connect to " + RELAY_URL));
    ws.onclose = () => {
      for (const [, p] of pending) { clearTimeout(p.timer); p.resolve(null); }
      pending.clear();
    };
    ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      const [type, id] = msg;
      if (type === "AUTH") { ws.challenge = id; return; }
      if (type === "COUNT") {
        const p = pending.get(id);
        if (p) { clearTimeout(p.timer); pending.delete(id); p.resolve(msg[2] || null); }
        return;
      }
      // CLOSED/NOTICE against a live COUNT is a refusal — surface it as such
      // rather than letting the row sit on "…" until the timeout.
      if (type === "CLOSED" || type === "NOTICE") {
        const p = pending.get(id);
        if (p) { clearTimeout(p.timer); pending.delete(id); p.resolve(null); }
      }
    };
    ws.count = (kind) =>
      new Promise((res) => {
        const subId = "kc" + kind + "-" + Math.random().toString(36).slice(2, 8);
        const timer = setTimeout(() => { pending.delete(subId); res(null); }, PER_KIND_TIMEOUT_MS);
        pending.set(subId, { resolve: res, timer });
        ws.send(JSON.stringify(["COUNT", subId, { kinds: [kind] }]));
      });
  });
}

async function maybeAuth(ws) {
  if (!ws.challenge || !window.nostr) return false;
  try {
    const signed = await window.nostr.signEvent({
      kind: 22242,
      created_at: Math.floor(Date.now() / 1000),
      tags: [["relay", RELAY_URL], ["challenge", ws.challenge]],
      content: "",
    });
    ws.send(JSON.stringify(["AUTH", signed]));
    return true;
  } catch { return false; }
}

async function run() {
  runEl.disabled = true;
  footEl.textContent = "";
  const extra = extraEl.value
    .split(",").map((s) => parseInt(s.trim(), 10))
    .filter((n) => Number.isInteger(n) && n >= 0 && !KINDS.some(([k]) => k === n));
  const results = [...KINDS.map(([kind, name]) => ({ kind, name })), ...extra.map((kind) => ({ kind, name: "" }))];
  render(results, 0);

  let ws;
  try {
    statusEl.textContent = "connecting…";
    ws = await connect();
  } catch (e) {
    statusEl.textContent = e.message;
    runEl.disabled = false;
    return;
  }

  // Give the relay a moment to send its challenge before the first COUNT, so a
  // relay that gates reads behind NIP-42 gets a signed session rather than a
  // page full of "no reply".
  await new Promise((r) => setTimeout(r, 400));
  const authed = await maybeAuth(ws);

  const started = Date.now();
  let done = 0, answered = 0, total = 0;
  for (const r of results) {
    statusEl.textContent = `counting ${++done}/${results.length} (kind ${r.kind})…`;
    const res = await ws.count(r.kind);
    if (res && typeof res.count === "number") {
      r.count = res.count; r.approximate = !!res.approximate; answered++; total += res.count;
    } else {
      r.count = null;
    }
    const shown = [...results].sort((a, b) => (b.count || 0) - (a.count || 0));
    render(shown, total);
  }

  ws.close();
  const secs = ((Date.now() - started) / 1000).toFixed(1);
  statusEl.textContent = `done in ${secs}s`;
  footEl.innerHTML =
    `${answered}/${results.length} kind(s) answered · ${fmt(total)} event(s) counted · ` +
    (authed ? "signed in with NIP-07" : "anonymous") +
    (answered === 0
      ? ' · <span class="none">the relay answered no COUNT at all — it advertises NIP-45, so this is worth chasing</span>'
      : "");
  runEl.disabled = false;
}

runEl.addEventListener("click", run);
run();
</script>
</body>
</html>
