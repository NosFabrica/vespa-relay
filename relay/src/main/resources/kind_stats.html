<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="How many events of each kind this relay holds." />
<title>Kind stats</title>
<!--
  One NIP-45 COUNT per kind, THREE TIMES — once anonymous, once as you, once
  through the relay's own key.

  The store trust-gates an AUTHENTICATED reader: it counts and filters only
  authors that reader has scored. An UNAUTHENTICATED reader gets everything —
  this relay applies no default observer, so signed out means the whole corpus
  rather than somebody else's view of it. The third column asks through whatever
  observer you name, which is how a lens is requested now that none is imposed.

  Read the columns as a diff, not as three facts:

    anonymous == as you        your web of trust is not being applied
    as you    == 0             nothing you scored is in this kind
    as you    >  named         you reach further than the observer you named
    anonymous <  either        something is wrong: gating should only REMOVE

  Deliberately not an http endpoint: COUNT is a protocol feature, and asking for
  it the way a client would means this page also TESTS it — including whether
  the relay answers COUNT at all, and whether AUTH changes what it says.

  Counts are the relay's own: a COUNT is answered from the store's index, not
  by walking events, so this stays cheap on a 50M-event corpus.
-->
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --text: #14171a; --muted: #6b7580;
    --line: #e3e6ea; --accent: #4a5fd9; --warn: #a8611a; --bar: #d9def7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --surface: #1c1f24; --text: #e8eaed; --muted: #9aa3ad;
      --line: #2b3038; --accent: #8b9cf0; --warn: #d99b56; --bar: #2c3350;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 1.25rem; font-size: .9rem; }
  .bar-row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  button, input {
    font: inherit; padding: .4rem .7rem; border-radius: .4rem;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
  }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  input { width: 22rem; max-width: 100%; }
  .status { color: var(--muted); font-size: .9rem; }
  .wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: .6rem; }
  table { border-collapse: collapse; width: 100%; min-width: 34rem; }
  th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.kind { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  .name { color: var(--muted); }
  .pending { color: var(--muted); font-style: italic; }
  .none { color: var(--warn); }
  footer { margin-top: 1.25rem; color: var(--muted); font-size: .85rem; }
  code { background: var(--bar); padding: .1rem .3rem; border-radius: .25rem; }
</style>
</head>
<body>
<main>
  <h1>Kind stats</h1>
  <p class="sub">One NIP-45 <code>COUNT</code> per kind, asked three ways. The store gates an
     authenticated reader to authors that reader has scored; an anonymous reader sees everything.</p>

  <div class="bar-row">
    <button id="run">Count</button>
    <input id="extra" placeholder="also count these kinds, comma separated" />
    <input id="obs" placeholder="observer pubkey (64-hex) for the third column" />
    <span class="status" id="status">idle</span>
  </div>

  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>Kind</th><th>Name</th>
          <th class="n">Anonymous</th>
          <th class="n">As you</th>
          <th class="n">As a named observer</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer id="foot"></footer>
</main>

<script>
// Same origin as the page, so this works wherever the relay is served from.
// Override when developing against a remote relay.
const RELAY_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;

// What this relay is actually for. Ranked search needs profiles to rank, scores
// to rank them BY, and the two lists that say where to find each — so these five
// are the ones whose numbers mean something here, and a page that answers in
// five rows gets read.
//
// Anything else goes in the box: COUNT needs a kind to ask about and the
// protocol has no registry a client can enumerate, so there is no "all kinds"
// to offer.
const KINDS = [
  [0, "Profiles"],
  [1, "Notes"],
  [10002, "Relay lists (NIP-65)"],
  [10040, "Observers (NIP-85)"],
  [30382, "User Scores"],
];

const PER_KIND_TIMEOUT_MS = 20000;
// One at a time. A COUNT is cheap for the relay to answer but this is a status
// page, not a load generator, and a wedged relay should degrade to slow rather
// than to a burst of forty stalled subscriptions.
const rowsEl = document.getElementById("rows");
const statusEl = document.getElementById("status");
const footEl = document.getElementById("foot");
const runEl = document.getElementById("run");
const extraEl = document.getElementById("extra");
const obsEl = document.getElementById("obs");

const fmt = (n) => n.toLocaleString();

function cell(v) {
  if (v === undefined) return '<span class="pending">…</span>';
  if (v === null) return '<span class="none">no reply</span>';
  return fmt(v.count) + (v.approximate ? ' <span class="name">≈</span>' : "");
}

function render(results) {
  rowsEl.innerHTML = "";
  for (const r of results) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td class="kind">${r.kind}</td>` +
      `<td class="name">${r.name || ""}</td>` +
      `<td class="n">${cell(r.anon)}</td>` +
      `<td class="n">${cell(r.you)}</td>` +
      `<td class="n">${cell(r.house)}</td>`;
    rowsEl.appendChild(tr);
  }
}

/**
 * The pubkey typed into the observer box, or null.
 *
 * This column used to read the relay's NIP-11 `self` and call it "the house
 * key", which was wrong twice over: `self` is the relay's IDENTITY (NIP-42,
 * NIP-66 signing) and has scored nobody, and the separate DEFAULT_OBSERVER it
 * was standing in for has since been removed — anonymous readers now get the
 * whole corpus rather than someone else's lens. Any lens is now something a
 * caller asks for explicitly, so the page asks explicitly too.
 */
function namedObserver() {
  const v = (obsEl.value || "").trim().toLowerCase();
  return /^[0-9a-f]{64}$/.test(v) ? v : null;
}

// A connection is either authenticated or not for its whole life, so each mode
// needs its own. `observer` forces a specific ranking lens through the NIP-50
// extension the store parses out of `search`; without it an authenticated
// reader is its own observer.
function connect(sign, observer) {
  return new Promise((resolve, reject) => {
    const ws = new WebSocket(RELAY_URL);
    const pending = new Map();
    let challenge = null;
    ws.onerror = () => reject(new Error("could not connect to " + RELAY_URL));
    ws.onclose = () => { for (const [, p] of pending) { clearTimeout(p.timer); p.resolve(null); } pending.clear(); };
    ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      const [type, id] = msg;
      if (type === "AUTH") { challenge = id; return; }
      const p = pending.get(id);
      if (!p) return;
      if (type === "COUNT") { clearTimeout(p.timer); pending.delete(id); p.resolve(msg[2] || null); }
      else if (type === "CLOSED" || type === "NOTICE") { clearTimeout(p.timer); pending.delete(id); p.resolve(null); }
    };
    ws.onopen = async () => {
      // Wait briefly for the challenge — signing is the whole point of this
      // connection, and counting before AUTH lands would silently measure the
      // anonymous case a second time.
      if (sign) {
        for (let i = 0; i < 20 && !challenge; i++) await new Promise((r) => setTimeout(r, 100));
        if (challenge && window.nostr) {
          try {
            const signed = await window.nostr.signEvent({
              kind: 22242,
              created_at: Math.floor(Date.now() / 1000),
              tags: [["relay", RELAY_URL], ["challenge", challenge]],
              content: "",
            });
            ws.send(JSON.stringify(["AUTH", signed]));
            ws.authed = true;
            await new Promise((r) => setTimeout(r, 300));
          } catch { ws.authed = false; }
        }
      }
      resolve(ws);
    };
    ws.count = (kind) =>
      new Promise((res) => {
        const subId = "k" + kind + "-" + Math.random().toString(36).slice(2, 8);
        const filter = { kinds: [kind] };
        if (observer) filter.search = "observer:" + observer;
        const timer = setTimeout(() => { pending.delete(subId); res(null); }, PER_KIND_TIMEOUT_MS);
        pending.set(subId, { resolve: res, timer });
        ws.send(JSON.stringify(["COUNT", subId, filter]));
      });
  });
}

async function run() {
  runEl.disabled = true;
  footEl.textContent = "";
  const extra = extraEl.value
    .split(",").map((s) => parseInt(s.trim(), 10))
    .filter((n) => Number.isInteger(n) && n >= 0 && !KINDS.some(([k]) => k === n));
  const results = [...KINDS.map(([kind, name]) => ({ kind, name })), ...extra.map((kind) => ({ kind, name: "" }))];
  render(results);

  const house = namedObserver();
  const modes = [
    ["anon", false, null],
    ["you", true, null],
    ["house", true, house],
  ];

  const started = Date.now();
  const notes = [];
  for (const [key, sign, observer] of modes) {
    if (key === "house" && !house) { notes.push("no observer pubkey given, so that column was skipped"); continue; }
    let ws;
    try {
      statusEl.textContent = `connecting (${key})…`;
      ws = await connect(sign, observer);
    } catch (e) { notes.push(`${key}: ${e.message}`); continue; }
    if (sign && !ws.authed) {
      notes.push(`${key}: not signed in — no NIP-07 extension, or the challenge was declined`);
      ws.close();
      continue;
    }
    let i = 0;
    for (const r of results) {
      statusEl.textContent = `${key}: ${++i}/${results.length} (kind ${r.kind})…`;
      r[key] = await ws.count(r.kind);
      render(results);
    }
    ws.close();
  }

  const answered = results.filter((r) => r.anon || r.you || r.house).length;
  statusEl.textContent = `done in ${((Date.now() - started) / 1000).toFixed(1)}s`;
  // Gating may only ever REMOVE rows. Anything above the anonymous count means
  // the observer is not a filter on the same set, which is a bug worth seeing
  // on the page rather than in a log.
  const impossible = results.filter(
    (r) => r.anon && ((r.you && r.you.count > r.anon.count) || (r.house && r.house.count > r.anon.count)),
  );
  footEl.innerHTML =
    `${answered}/${results.length} kind(s) answered` +
    (house ? ` · observer <code>${house.slice(0, 12)}…</code>` : "") +
    (impossible.length
      ? ` · <span class="none">kind(s) ${impossible.map((r) => r.kind).join(", ")} count MORE when authenticated than anonymous — gating should only remove</span>`
      : "") +
    (notes.length ? " · " + notes.join(" · ") : "") +
    (answered === 0
      ? ' · <span class="none">no COUNT answered at all — the relay advertises NIP-45, so this is worth chasing</span>'
      : "");
  runEl.disabled = false;
}

runEl.addEventListener("click", run);
run();
</script>
</body>
</html>
