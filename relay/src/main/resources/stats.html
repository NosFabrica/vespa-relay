  // differ by orders of magnitude, and aligning two scales on one plot invents
  // a correlation that is not in the data.
  if (series.some((x) => x.pubkeys != null)) {
    out.push(chartCard(
      `Publishing pubkeys per ${g.unit}${spanNote(span)}`,
      null,
      series.map((x) => ({ label: g.tip(x.period), tick: g.tick(x.period), value: x.pubkeys || 0 })),
      null,
      "publishing pubkeys",
    ));
  }

  // "14:00", not "14": a bare number under a bar reads as a count on a page
  // whose every other axis label is one. The tooltip names the whole hour and
  // the zone, because "14:00" alone invites the reader to apply their own.
  out.push(chartCard(
    `Events by hour of day${spanNote(d.hourWindowDays == null ? null : `last ${d.hourWindowDays} days`)}`,
    null,
    hours.map((x) => {
      const hh = String(x.hour).padStart(2, "0");
      return { label: `${hh}:00–${hh}:59 UTC`, tick: `${hh}:00`, value: x.events };
    }),
    null,
  ));
  return out;
}

/**
 * A compact bar chart with no axis — the small-multiple mark.
 *
 * Each kind gets its OWN vertical scale, and the peak is printed beside the
 * title because of it. A shared scale is the obvious default and it is wrong
 * here: kind 1 outnumbers the rest by an order of magnitude, so a common axis
 * would flatten every other kind to a line of pixels and the panel would show
 * one series and seven blanks. Shape is what this panel is for — the levels are
 * in the Kinds table above it — but a reader will assume a shared scale unless
 * told, so the peak is on every card.
 */
function sparkline(points) {
  const W = 240, H = 40;
  const svg = svgEl("svg", { class: "chart spark", viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  const max = Math.max(1, ...points.map((p) => p.value));
  const band = W / Math.max(1, points.length);
  const w = Math.max(1, Math.min(10, band - 1));
  points.forEach((p, i) => {
    if (!p.value) return;
    const h = Math.max(1, (p.value / max) * H);
    svg.appendChild(svgEl("rect", { class: "mark", x: i * band + (band - w) / 2, y: H - h, width: w, height: h, rx: 1 }));
  });
  return svg;
}

function kindActivityCard(section) {
  const d = (section && section.data) || {};
  const kinds = d.kinds || [];
  const card = el("div", "card");
  // "peak N/day" on every cell is what stands in for the removed sentence about
  // per-kind scales. Do not drop it as prose: without a stated peak a reader
  // assumes one shared axis and compares heights across cells, which is the one
  // thing this panel does not mean.
  cardHead(
    card,
    kinds.length
      ? `Event types over time · ${kinds.length} largest kinds, last ${d.windowDays} days`
      : "Event types over time",
    kinds.length ? null : "No per-kind series in this document.",
    section,
  );
  if (!kinds.length) return card;

  const grid = el("div", "sparks");
  for (const k of kinds) {
    const cell = el("div", "spark-cell");
    const head = el("div", "spark-head");
    // Number FIRST, name second — same order as the Kinds table, and it is the
    // order that survives the ellipsis. These heads truncate (a narrow column
    // beside a "peak N/day"), and with the name leading, Quartz's longer
    // registry names pushed the kind NUMBER off the end: "Outbox Relays ·…"
    // drops the one part of the label that is unambiguous. The full text is on
    // the title, since this is the string most likely to be cut.
    const name = kindName(k.kind, k.name);
    const label = el("span", "spark-kind", `${k.kind} · ${name}`);
    label.title = `${name} — kind ${k.kind}`;
    head.appendChild(label);
    const peak = Math.max(0, ...k.days.map((x) => x.events));
    head.appendChild(el("span", "spark-peak", `peak ${short(peak)}/day`));
    cell.appendChild(head);
    cell.appendChild(sparkline(k.days.map((x) => ({ label: x.day, value: x.events }))));
    grid.appendChild(cell);
  }
  card.appendChild(grid);
  return card;
}

/**
 * Whether ranked search can rank at all.
 *
 * The four numbers are a CHAIN — observers name providers, providers publish
 * scores, scores project onto pubkeys — and reading them together localises a
 * break that every other panel on this page is blind to. `TrustReconcile` warns
 * about exactly this failure: "a corpus mirrored before its provider lists
 * arrived stays silently unprojected, and every ranked search comes back
 * empty." A relay in that state looks perfectly healthy on the charts above.
 *
 * Drawn as a bare `.panel`, not a `.card`: four headline counts are the same
 * kind of mark as the corpus totals immediately above, so they get the same
 * bare tiles on the page background. In a card they were tiles-in-a-box —
 * their border inside the card's, both on `--surface` — which made the one
 * panel that can report the relay broken read as the busiest thing on screen.
 */
function trustCard(section) {
  const d = (section && section.data) || {};
  const card = el("div", "panel");
  cardHead(card, "Trust", null, section);

  // Plain `.tiles`, matching the corpus row's 11rem track rather than the 8rem
  // one the in-card rows use: standing on the same background at the same
  // width, the two rows have to size their tiles identically or the seam shows.
  const row = el("div", "tiles");
  for (const [key, label, help] of [
    ["observers", "Observers", "Distinct authors of a kind-10040 list naming a score provider"],
    // "Service Keys", not "Providers". The count is of KEYS that signed
    // kind-30382 scores, and one provider may sign under several of them — the
    // pubkey is what a kind-10040 list names and what this number can actually
    // vouch for, so it is what the label says.
    ["providers", "Service Keys", "Distinct authors of kind-30382 scores"],
    ["scores", "Scores", "Stored kind-30382 events"],
    ["scoredPubkeys", "Scored pubkeys", "Pubkeys carrying projected trust state — what a ranked search can order by"],
  ]) {
    const t = el("div", "tile");
    t.appendChild(el("div", "v", d[key] == null ? "—" : fmt(d[key])));
    t.appendChild(el("div", "k", label));
    t.title = help;
    row.appendChild(t);
  }
  card.appendChild(fitTiles(row));

  // The one state worth shouting about, and the reason this panel exists.
  if (d.scoredPubkeys === 0) {
    card.appendChild(el("p", "err",
      "No pubkey carries trust state, so every ranked search is falling back to unranked — " +
      (d.scores ? "scores are stored but not projected; a trust reconcile is what fixes that."
                : "no kind-30382 scores are stored yet; the mirror has not fetched them.")));
  }
  return card;
}

/**
 * WHAT THE ROUTER IS DOING RIGHT NOW — one cycle, live, with an outcome.
 *
 * This sits above the coverage bars because it answers the questions asked
 * first and because the coverage card cannot answer any of them. Coverage is
 * accumulated across every run this router has ever made; this is one cycle.
 *
 * ## Marks, not sentences
 *
 * The half of this card that describes the live state used to be prose: a
 * paragraph of clauses per stream, a second for the accounting, a third naming
 * the held relays, and a fourth per processor. Measured on a two-stream
 * deployment it came to 520 words, and it had the failure modes prose always
 * has against a table of numbers — it is read serially, two streams cannot be
 * compared without holding both paragraphs in your head, and a number inside a
 * clause cannot be scanned down a column. The same facts as chips, bars and
 * one table come to 66.
 *
 * So: every quantity is a mark, and the MEANING lives on the mark's `title`,
 * taken from the glossary the document already ships (see [term]). The card
 * spends words on exactly one thing — damage — through `.alarm`.
 *
 * ## Three readings the arrangement is meant to make impossible
 *
 *  - **"16,747/16,752" as progress.** That number counts legs that RETURNED,
 *    including every one that came back unreachable or capped. The stacked bar
 *    is what actually became of them, and it is drawn from members that sum to
 *    the total by construction — a stack cannot be drawn from counts that do
 *    not.
 *  - **"discovered" as "dialled".** Most of the gap between a fan-out's two big
 *    numbers is duplicate urls rather than lost relays, so the url partition is
 *    its own bar above the disposition rather than a clause beside it.
 *  - **A stopped router as a quiet one.** `staleForSec` is a heartbeat, and the
 *    `live` chip is the first mark on the card — a phase frozen mid-`fetching`
 *    is exactly what a dead process leaves behind.
 */

/**
 * WHAT THE ROUTER IS DOING RIGHT NOW — one cycle, live, with an outcome.
 *
 * This sits above the coverage bars because it answers the questions asked
 * first and because the coverage card cannot answer any of them. Coverage is
 * accumulated across every run this router has ever made; this is one cycle.
 *
 * ## Marks, not sentences
 *
 * The half of this card that describes the live state used to be prose: a
 * paragraph of clauses per stream, a second for the accounting, a third naming
 * the held relays, and a fourth per processor. Measured on a two-stream
 * deployment it came to 520 words, and it had the failure modes prose always
 * has against a table of numbers — it is read serially, two streams cannot be
 * compared without holding both paragraphs in your head, and a number inside a
 * clause cannot be scanned down a column. The same facts as chips, bars and one
 * table come to 66.
 *
 * So: every quantity is a mark, and the MEANING lives on the mark's `title`,
 * taken from the glossary the document already ships (see [term]). The card
 * spends words on exactly one thing — damage — through `.alarm`.
 *
 * ## Where the decisions live
 *
 * Not here. Which legs are worth naming, what a bar is a proportion OF, whether
 * a partition divides, whether a health object is drawable — all of that is
 * `/web/shared/sync.js`, because it is the half that can be wrong silently and
 * the half nothing could reach while it was inline. What is left below is DOM
 * and the document's own words. See that module's head for the five bugs that
 * shipped behind a string grep.
 *
 * ## Three readings the arrangement is meant to make impossible
 *
 *  - **"16,747/16,752" as progress.** That number counts legs that RETURNED,
 *    including every one that came back unreachable or capped. The stacked bar
 *    is what actually became of them, and it is drawn from members that sum to
 *    the total by construction — a stack cannot be drawn from counts that do
 *    not.
 *  - **"discovered" as "dialled".** Most of the gap between a fan-out's two big
 *    numbers is duplicate urls rather than lost relays, so the url partition is
 *    its own bar above the disposition rather than a clause beside it.
 *  - **A stopped router as a quiet one.** `staleForSec` is a heartbeat, and the
 *    `live` chip is the first mark on the card — a phase frozen mid-`fetching`
 *    is exactly what a dead process leaves behind.
 */

/**
 * The glossary the document ships, for the current card's `title` attributes.
 *
 * Set by [syncCard] before anything below draws. The words are the ROUTER's —
 * `SyncVocabulary` publishes them and `SyncVocabularyTest` pins the two
 * directions, no published count without a term and no term without a count —
 * so a mark that explains itself here cannot drift from the member it explains.
 */
let TERMS = {};

/** What the document says a member means, or nothing at all. */
function term(key) {
  return TERMS[key] || "";
}

/** One labelled pill. `tone` is `live`, `busy`, `warn`, or nothing. */
function chip(text, tone, title) {
  const c = el("span", tone ? `chip ${tone}` : "chip", text);
  if (title) c.title = title;
  return c;
}

/** How wide a spark is drawn, and how tall. Small enough to sit inside a chip without changing its height. */
const SPARK_W = 46, SPARK_H = 11, SPARK_PAD = 1;

/**
 * One gauge's last hour, as a line — see `sparkOf` for the geometry and for why
 * `x` comes from each sample's own clock rather than from its index.
 *
 * Drawn as one path PER UNBROKEN RUN. A gap is a gap: joining across it would
 * draw a straight line through an outage, which is the one shape a reader would
 * take as evidence that nothing happened.
 */
function spark(series, member) {
  const s = sparkOf(series, member);
  if (!s) return null;
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("class", "trend");
  svg.setAttribute("viewBox", `0 0 ${SPARK_W} ${SPARK_H}`);
  svg.setAttribute("width", SPARK_W);
  svg.setAttribute("height", SPARK_H);
  const at = (pt) => [
    SPARK_PAD + pt.x * (SPARK_W - 2 * SPARK_PAD),
    SPARK_H - SPARK_PAD - pt.y * (SPARK_H - 2 * SPARK_PAD),
  ];
  let run = [];
  const flush = () => {
    if (run.length > 1) {
      const path = document.createElementNS(SVG, "path");
      path.setAttribute("d", run.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(2)} ${y.toFixed(2)}`).join(" "));
      svg.appendChild(path);
    } else if (run.length === 1) {
      const dot = document.createElementNS(SVG, "circle");
      dot.setAttribute("cx", run[0][0].toFixed(2));
      dot.setAttribute("cy", run[0][1].toFixed(2));
      dot.setAttribute("r", "1");
      svg.appendChild(dot);
    }
    run = [];
  };
  for (const pt of s.points) {
    if (!pt) flush();
    else run.push(at(pt));
  }
  flush();
  return { svg, note: sparkNote(s, member) };
}

/** What the line says, for the title beside it — the direction, the range, and the window. */
function sparkNote(s, member) {
  const range = s.flat ? `flat at ${fmt(s.lo)}` : `${fmt(s.lo)}–${fmt(s.hi)}`;
  return `${trendOf(s)} over the last ${fmtDur(s.span)} · ${range}` +
    `\n\nThe line is scaled to its OWN range, not to the chip's — the chip carries the level, the line carries the shape.` +
    `\n\n${term("series")}`;
}

/** …and the same, folded onto a chip that already carries the level. */
function gaugeChip(text, tone, title, series, member) {
  const c = chip(text, tone, title);
  const s = spark(series, member);
  if (s) {
    c.appendChild(s.svg);
    c.title = `${title}\n\n${s.note}`;
  }
  return c;
}

/**
 * A bar and its key, over one partition — see `partitionOf` for what counts as
 * a segment and what the shares are taken against.
 */
function partitionBar(rows, counts, total, meaning) {
  const wrap = el("div");
  const bar = el("div", "disp");
  const keys = el("div", "keys");
  for (const seg of partitionOf(rows, counts, total)) {
    const i = el("i", seg.member);
    i.style.width = seg.share * 100 + "%";
    const why = (meaning && meaning(seg.member)) || term(seg.member);
    i.title = `${fmt(seg.n)} of ${fmt(total)} ${seg.label}\n\n${why}`;
    bar.appendChild(i);
    const k = el("span");
    // The SAME class the segment carries, so one CSS rule paints both and the
    // key cannot drift from the bar. Never read back a computed style here:
    // the card is still detached from the document, so nothing resolves.
    k.appendChild(el("b", seg.member));
    k.appendChild(el("em", null, fmt(seg.n)));
    // EVERY segment named, however small. Hiding the name under a share
    // threshold was tried and it hides the wrong ones: `delivered` and
    // `nothingNew` are the two outcomes that mean the relay WORKED, and on a
    // fan-out mostly made of dead urls they are the small slivers — so the
    // rule left the reader a bare "38" beside a labelled "8,569 pending".
    // What made the old key long was the labels being sentences; they are one
    // or two words now, and six of them fit on a line.
    k.append(" " + seg.label);
    k.title = i.title;
    keys.appendChild(k);
  }
  wrap.appendChild(bar);
  wrap.appendChild(keys);
  return wrap;
}

/**
 * One pass: what it is, what became of its urls, and what it pulled.
 *
 * A stream draws one of these per RUNNING PASS. The distinction is the whole
 * reason they are drawn separately — "pass 11, handed out, 41 relays still
 * finishing" and "pass 12, walking" are two jobs running at once, and a reader
 * who sees one bar concludes either that the old walk stopped or that the new
 * one has not started.
 */
function passBlock(p, held, alone) {
  const wrap = el("div");
  const total = (p.urls || {}).taken || 0;
  if (!total) return wrap;
  // The label is skipped when a stream has only one pass: "pass 3 · walking"
  // above a stream head that already says `fetching 20m` is the same fact
  // twice, and the head carries the pass number as a chip.
  if (!alone) {
    const label = passLabelOf(p);
    const head = el("p", "foot");
    head.append(`pass ${label.number}`);
    if (label.owner) head.append(` · ${label.owner}`);
    head.append(label.state === "finishing"
      ? ` · handed out, ${fmt(label.outstanding)} still finishing`
      : ` · ${label.state}`);
    head.title =
      "A pass ends when its last url is handed out, not when its last worker returns — so a finished walk with" +
      " relays still finishing is the rotation working, and the next pass simply has fewer urls to hand out.";
    wrap.appendChild(head);
  }
  wrap.appendChild(partitionBar(DISPOSITION, p.taken || {}, total, (m) =>
    m === "pending" ? pendingMeaning(p.outcome, held) : null));
  const foot = el("p", "foot");
  foot.append(`${fmt(p.received || 0)} event(s) at the socket`);
  if (p.hosts != null) foot.append(` · ${fmt(total)} url(s) on ${fmt(p.hosts)} host(s)`);
  foot.title =
    "Events as they arrived on the wire. Ingest drops the copies other relays already sent, so the store gains" +
    " fewer than this — see the Ingest row below for what was actually stored.";
  wrap.appendChild(foot);
  if (p.accountedFor === false) {
    const bad = el("p", "alarm", "these counts do not add up to their own total — read them as approximate");
    bad.title = term("accountedFor");
    wrap.appendChild(bad);
  }
  return wrap;
}

/**
 * The two pools, nested: every worker this stream is running, and the few of
 * them holding a transfer slot.
 *
 * Nested rather than side by side because one is a subset of the other, and
 * that containment is the answer to why `pending` runs to five thousand while
 * `transferring` sits at eight — the admission gate is far wider than the
 * transfer pool, by design.
 */
function poolsRow(s) {
  if (s.running == null && s.slotsFree == null && s.returned == null) return null;
  const row = el("div", "pools");
  // Drawn only where there ARE workers. An idle stream between passes has
  // none, and "0/0 on a slot" beside an empty bar is filler in the one place
  // this card is trying to keep marks meaningful.
  if (s.running) {
    const bar = el("div", "bar");
    const w = el("i", "w");
    w.style.width = "100%";
    const t = el("i", "t");
    t.style.width = ((s.transferring || 0) / s.running) * 100 + "%";
    bar.appendChild(w);
    bar.appendChild(t);
    bar.title = `${fmt(s.transferring || 0)} of ${fmt(s.running)} workers hold a transfer slot\n\n${term("transferring")}`;
    row.appendChild(bar);
    const lab = el("span", null, `${fmt(s.transferring || 0)}/${fmt(s.running)} on a slot`);
    lab.title = term("running");
    row.appendChild(lab);
  }
  // What `holding` is waiting for — the phase most easily read as a stall.
  if (s.slotsFree != null) {
    const gate = el("span", null, `· gate ${fmt(s.slotsFree)}/${fmt(s.slotsNeeded)}`);
    gate.title = `${term("slotsFree")} The next pass waits for half the pool.`;
    row.appendChild(gate);
  }
  if (s.returned != null) {
    const ret = el("span", null, `· ${fmt(s.returned)} returned`);
    // The most misread number this router publishes, so the correction rides
    // on the mark itself.
    ret.title = `${term("returned")} It counts legs that CAME BACK, including unreachable and capped ones — not progress.`;
    row.appendChild(ret);
  }
  if (s.collected != null) {
    const col = el("span", null, `· ${short(s.collected)}${s.collectedTotal ? `/${short(s.collectedTotal)}` : ""} ids`);
    col.title = term("collected");
    row.appendChild(col);
  }
  return row;
}

/**
 * WHICH relays are running right now — the half the disposition bar cannot
 * draw, as a table.
 *
 * A stacked segment says `pending: 2`; it cannot say *which two*, and that is
 * the question an operator has when a stream has received two events in eleven
 * hours. Nothing else on this page can answer it either — the coverage card
 * only draws relays that have EARNED a band, and a relay stuck mid-leg never
 * does.
 *
 * Four clocks per relay across five relays is a MATRIX, and it was being read
 * out as a sentence per row — the one shape that makes "which of these is the
 * worst" un-scannable. See `legsOf` for what the quiet bar is a proportion of,
 * and `RelayRotation.held` for why these five are the five.
 */
function legsTable(s) {
  const { rows, more } = legsOf(s.inFlight);
  if (!rows.length) return null;
  // WHICH WALK handed each leg out, when the stream is running more than one.
  // A leg outlives its pass, so with two live walks a row cannot otherwise say
  // which one it belongs to.
  const many = (s.passes || []).length > 1;
  const wrap = el("div");
  const table = el("table", "legs");
  const head = el("tr");
  for (const [label, key, right] of [["relay", "inFlight", false], ["pass", "pass", false],
                                     ["held", "heldForSec", true], ["events", "events", true],
                                     ["quiet", "quietForSec", false]]) {
    if (key === "pass" && !many) continue;
    const th = el("th", null, label);
    th.title = term(key);
    if (right) th.style.textAlign = "right";
    head.appendChild(th);
  }
  table.appendChild(head);
  for (const r of rows) {
    const tr = el("tr");
    tr.appendChild(el("td", "u", r.short));
    if (many) tr.appendChild(el("td", "r", r.pass ?? "—"));
    const held = el("td", "r", fmtDur(r.heldForSec));
    held.title = term("heldForSec");
    tr.appendChild(held);
    tr.appendChild(el("td", "r", fmt(r.events)));
    const q = el("td");
    const bar = el("div", "qbar");
    const fill = el("i", r.hot ? "hot" : "");
    fill.style.width = r.quietShare * 100 + "%";
    bar.appendChild(fill);
    bar.title = `quiet ${fmtDur(r.quietForSec)} of the ${fmtDur(STUCK_LEG_SEC)} that counts as stuck` +
      (r.slotless
        ? " · NO TRANSFER SLOT — in the guards or queued behind other legs, so this is our pool rather than their relay"
        : ` · holding a slot for ${fmtDur(r.transferringForSec)}`) +
      `\n\n${term("quietForSec")}`;
    q.appendChild(bar);
    tr.appendChild(q);
    table.appendChild(tr);
  }
  wrap.appendChild(table);
  // Never silent about the tail: most of a fan-out's workers are connect
  // timeouts to dead hosts, and a list that hides them reads as the whole set.
  if (more) {
    const p = el("p", "foot", `+${fmt(more)} more held, quietest shown first`);
    p.title = term("omitted");
    wrap.appendChild(p);
  }
  return wrap;
}

/** One stream: its head, its two partitions, its pools and its legs. */
function streamLane(s) {
  const box = el("div", "stream");
  const c = s.cycle;
  const head = el("div", "sh");
  head.appendChild(el("span", "nm", s.name));
  // The phase, toned by what it means for movement: `holding` and `failed`
  // will not move on their own, everything else is work in progress.
  const stalled = s.phase === "holding" || s.phase === "failed";
  head.appendChild(chip(
    `${s.phase || "unknown"}${s.phaseForSec != null ? ` ${fmtDur(s.phaseForSec)}` : ""}`,
    stalled ? "warn" : "busy", term(s.phase)));
  if (c && c.number != null) head.appendChild(chip(`pass ${passLabelOf(c).number}`, null, term("passes")));
  if (c && c.owner && c.owner !== "dynamic") head.appendChild(chip(c.owner, null, term("owner")));
  // `reached` is the only evidence a DEEP walk is moving — `fraction` rounds
  // to zero for hours on an unbounded one while this date moves every page.
  if (s.reached != null) head.appendChild(chip(`back to ${isoOf(s.reached).slice(0, 10)}`, null, term("reached")));
  if (s.fraction != null) head.appendChild(chip(`${(s.fraction * 100).toFixed(1)}%`, null, term("fraction")));
  if (s.etaSec != null) head.appendChild(chip(`ETA ${fmtDur(s.etaSec)}`, null, term("etaSec")));
  if (s.phase === "idle" && s.nextInSec != null) head.appendChild(chip(`next ${fmtDur(s.nextInSec)}`, null, term("nextInSec")));
  if (s.retryInSec != null) head.appendChild(chip(`retry ${fmtDur(s.retryInSec)}`, "warn", term("retryInSec")));
  head.appendChild(el("span", "grow"));
  if (c && c.received != null) {
    const r = el("span", "r", `${short(c.received)} ev`);
    r.title = term("received");
    head.appendChild(r);
  }
  box.appendChild(head);

  // The one thing a failed stream never said: what it threw. It is a message
  // rather than a quantity, so it is one of the two places words are spent.
  if (s.reason) {
    const why = el("p", "alarm", s.reason);
    why.title = term("reason");
    box.appendChild(why);
  }
  if (!c) {
    if (!s.reason) box.appendChild(el("p", "foot", "no cycle has run yet on this stream"));
    // Drawn even with no cycle — the workers of the LAST one outlive it and
    // are exactly what a stream stuck between passes is holding.
    const only = legsTable(s);
    if (only) box.appendChild(only);
    return box;
  }

  const u = c.urls || {};
  if (dividesOn(u)) box.appendChild(partitionBar(DISCOVERY, u, u.discovered, () => null));
  const pools = poolsRow(s);
  if (pools) box.appendChild(pools);

  // EVERY WALK STILL RUNNING, not just the newest. A walk ends when its last
  // url is handed out and its slowest legs run on past it, so the ordinary
  // state of a rotation is the previous pass finishing while the new one hands
  // out. One bar for both showed the old walk's live legs as the new walk's
  // `busy` and its counters not at all.
  const passes = Array.isArray(s.passes) && s.passes.length > 1 ? s.passes : [c];
  const held = heldCount(s.inFlight);
  passes.forEach((p, i) => {
    const last = i === passes.length - 1;
    box.appendChild(passBlock(p, last ? held : passHeld(p), passes.length === 1));
  });

  const legs = legsTable(s);
  if (legs) box.appendChild(legs);
  return box;
}

/**
 * The NOW line: is it running, and what is holding it back, in chips.
 *
 * Everything here was already on the card as prose. The heartbeat was a
 * sentence, the constraint another, and the gauges did not exist outside the
 * router's log — and a reader wanting "is it up and why is it slow" had to
 * read both sentences to the end to find out.
 */
function nowLine(progress, data) {
  const row = el("div", "now");
  const live = isLive(progress);
  row.appendChild(chip(live ? "live" : progress.staleForSec == null ? "no heartbeat" : "not running",
    live ? "live" : "warn",
    (live
      ? `the router wrote its progress file ${fmtDur(progress.staleForSec)} before this rollup`
      : "a phase frozen mid-fetching is exactly what a dead process leaves behind — everything below is what it" +
        " was doing then, not what is happening now") +
    `\n\nlast written ${isoOf(progress.writtenAt)}`));

  const facts = [];
  const streams = (progress.streams || []).length;
  if (streams) facts.push(`${fmt(streams)} stream(s)`);
  if (data.relays != null) facts.push(`${fmt(data.relays)} relay(s) on ${fmt(data.hosts || 0)} host(s) touched`);
  if (live) facts.push(`heard ${fmtDur(progress.staleForSec)} ago`);
  else if (progress.staleForSec != null) facts.push(`silent ${fmtDur(progress.staleForSec)}`);
  if (facts.length) {
    const f = el("span", "fact", facts.join(" · "));
    f.title = term("relays");
    row.appendChild(f);
  }

  const constraint = constraintOf(progress.health, live);
  if (constraint) {
    row.appendChild(chip(constraint.text, constraint.tone, `${term("bottleneck")}\n\n${constraint.why}`));
  }
  // Each level with its own last hour beside it. Three of the four have a
  // series; `servingMs` is not sampled, so its chip is a bare level and says so
  // by simply not carrying a line.
  const series = progress.series;
  for (const g of gaugesOf(progress.health)) {
    if (g.id === "eventsPerSec") {
      row.appendChild(gaugeChip(`${fmt(g.value)} ev/s`, g.tone, term("eventsPerSec"), series, "eventsPerSec"));
    }
    if (g.id === "heap") {
      row.appendChild(gaugeChip(`heap ${g.pct}%`, g.tone,
        `${fmt(g.value)} of ${fmt(g.of)}MB\n\n${term("heapUsedMb")}` +
        (g.tone ? "\n\nAt the ceiling the collector runs continuously and throughput collapses without anything failing." : ""),
        series, "heapPct"));
    }
    if (g.id === "sockets") {
      row.appendChild(gaugeChip(`${fmt(g.value)}/${fmt(g.of)} sockets`, g.tone,
        `${term("sockets")}\n\n${term("socketCeiling")}`, series, "sockets"));
    }
    if (g.id === "servingMs") row.appendChild(chip(`${fmt(g.value)}ms reads`, g.tone, term("servingMs")));
  }
  return row;
}

function progressPanel(progress, data) {
  if (!progress) return null;
  const wrap = el("div");
  wrap.appendChild(nowLine(progress, data));
  // ABOVE the streams, because a router that is alive and DAMAGED is worse
  // than one that stopped: an uncaught error kills whichever thread it lands
  // on, nothing restarts it, and every phase below carries on looking healthy.
  if (progress.fatals) {
    const dead = el("p", "alarm",
      `${fmt(progress.fatals)} fatal error(s) killed threads in this router — it is DEGRADED and should be restarted`);
    dead.title = term("fatals");
    wrap.appendChild(dead);
  }
  for (const s of progress.streams || []) wrap.appendChild(streamLane(s));
  return wrap;
}

/**
 * WHAT ELSE IS RUNNING — the router's jobs that are not streams.
 *
 * Everything above describes work an operator CONFIGURED. Several long-running
 * jobs sit beside those streams with nothing configured about them, and until
 * they were published the only trace any of them left was a stderr line on a
 * container whose logs rotate inside the hour:
 *
 *  - the **alias fold** and the **stability gate**, on the alias monitor's own
 *    six-hour clock, deciding which discovered urls the fan-out may stop
 *    dialling. "This server is still wearing forty urls" is a question about
 *    the fold's progress and nothing on this page could answer it;
 *  - the **NIP-66 reachability monitor**, which is NOT the same processor as
 *    those two even though all three write onto the same kind-30166 records —
 *    it watches every socket the client opens rather than dialling on a
 *    schedule, and its `knownDead` set is what a stream's `knownDead` outcome
 *    is counting against;
 *  - **ingest**, where every mirrored event actually lands, and the first thing
 *    to look at when the streams read busy and the store is not growing;
 *  - the **healer** and the **upstream push**, the two paths that write out.
 *
 * A processor that is absent is one this router does not run — a deployment
 * with no signer has no fold and no monitor at all — so nothing is drawn for a
 * name the document does not carry. That is a fact rather than missing data,
 * and inventing a zeroed row would say the opposite.
 */
const PROCESSORS = [
  ["aliasFold", "Alias fold",
    "Fingerprints the urls of one host against each other and signs a `same-as` verdict when they are the same server," +
    " so the fan-out stops dialling forty urls of one relay. Runs on the alias monitor's clock, not a stream's."],
  ["consistency", "Self-consistency",
    "Asks each relay one filter twice, at a week-old anchor, and refuses the ones that answer differently: a server" +
    " whose window is a fresh slice each time holds no stable cursor, so every cycle re-downloads what the last took." +
    " The verdict it writes is the `self-consistent` tag, which is where the name comes from."],
  ["reachability", "NIP-66 reachability",
    "Quartz's monitor. It watches every socket this client opens, measures the round trips and signs what it learns" +
    " into the same kind-30166 records the two passes above write their tags onto — one document per url, three writers."],
  ["ingest", "Ingest",
    "The bounded queue every mirrored event passes through: dedup, supersede, verify, batch insert. Read `queued`" +
    " against `capacity` — full means the downloads are backpressured behind it, empty means the limit is upstream."],
  ["heal", "Healer",
    "Repairs discovered by ingest and handed back to the relays serving them. Only where a stream opted in."],
  ["upstreamPush", "Upstream push",
    "Reconciles the store against an upstream configured `dir = up` and publishes what it is missing."],
];

/**
 * What a big number is MADE OF — in numbers, not a second bar.
 *
 * Ingest's rejections and a probe pass's undecided hosts are the same shape of
 * fact: a total nobody can act on until it is split. A mirror is offered the
 * same event once per relay holding it, so rejecting most of what arrives is
 * the pipeline working — and the total alone cannot say that.
 *
 * This drew the split as a stacked bar under the row's meter, and it had to
 * go. Two bars of identical form, stacked, dividing DIFFERENT wholes and
 * neither of them labelled: the top one is the queue against its capacity, the
 * bottom one is a share of `rejected`, a total that appears nowhere on the row.
 * The first question it got was "why does ingest have two bars", which is the
 * only question a mark like that can produce. The numbers are the split, and
 * they say it in the space the bar was taking.
 */
function breakdown(p) {
  const rows = ((p.rejections || {}).reasons || []).map((r) => [r.reason, r.events])
    .concat((((p.streams || [])[0] || {}).undecided?.reasons || []).map((r) => [r.reason, r.hosts]));
  if (!rows.length) return null;
  // The two biggest named, the rest on the title. Four of the fold's five
  // reasons recover on their own and one never will, and from outside the
  // router they are the same silence — which is why the reasons are published
  // at all.
  const lab = el("p", "foot", rows.slice(0, 2).map(([reason, n]) => `${short(n)} ${reason}`).join(" · "));
  lab.title = rows.map(([reason, n]) => `${fmt(n)} — ${reason}`).join("\n");
  lab.style.gridColumn = "3 / -1";
  return lab;
}

/**
 * One processor as one row: name, state, how far along, and the one number that
 * matters for it.
 *
 * A grid rather than a paragraph so the meters line up down a column, which is
 * what makes "the fold is stuck and ingest is not" a glance instead of a read —
 * and see `meterOf` for why the two kinds of meter in that column are drawn
 * differently rather than identically.
 */
function processorRow(p, series) {
  const known = PROCESSORS.find((row) => row[0] === p.name);
  const row = el("div", "dec");
  const nm = el("span", "nm", known ? known[1] : p.name);
  if (known) nm.title = known[2];
  row.appendChild(nm);

  // `off` is the one phase whose elapsed clock says nothing: it means this
  // deployment gives the processor no work at all — the probe passes on a
  // router whose upstreams are every one of them named by hand — and "off for
  // 24h" reads as an outage rather than as a configuration.
  const state = el("span");
  state.appendChild(chip(
    p.phase === "off"
      ? "off"
      : `${p.phase || "unknown"}${p.nextInSec != null ? (p.nextInSec === 0 ? " · due" : ` · ${fmtDur(p.nextInSec)}`) : ""}`,
    p.phase === "off" ? "warn" : p.phase === "measuring" || p.phase === "running" ? "busy" : null,
    (p.phase === "off"
      ? "this router discovers no relays, so there is nothing for this pass to measure"
      : term(p.phase) || "") +
    (p.nextInSec != null ? `\n\nnext pass: ${term("nextInSec")}` : "") +
    (p.lastPassSec != null ? `\n\nthe last pass took ${fmtDur(p.lastPassSec)}` : "") +
    (p.passesRun != null ? `\n\n${fmt(p.passesRun)} pass(es) so far` : "")));
  row.appendChild(state);

  const bar = el("span", "frac");
  const meter = meterOf(p);
  let right = "";
  let meterSpark = null;
  if (meter && meter.kind === "progress") {
    const i = el("i");
    i.style.width = meter.share * 100 + "%";
    bar.appendChild(i);
    bar.title = `progress: ${fmt(meter.decided)} of ${fmt(meter.candidates)} url(s) carry a verdict\n\n${term("unmeasured")}`;
    right = `${fmt(meter.left)} left`;
  } else if (meter && meter.kind === "level") {
    // A LEVEL, not progress — see the `.frac i.level` rule. Nothing about a
    // half-full queue is half-done, and drawing it in the same tone as the
    // fold's progress said it was.
    const q = el("i", meter.tone ? "level warn" : "level");
    q.style.width = meter.share * 100 + "%";
    bar.appendChild(q);
    bar.title = `queue level: ${fmt(meter.queued)} of ${fmt(meter.capacity)}` +
      (meter.full ? " — FULL, downloads are backpressured behind it" : " — a level, not progress; empty is healthy") +
      `\n\n${term("queued")}`;
    // The split, never the bare total: `rejected` is mostly the same event
    // offered once per relay holding it, and `dropped` is the sweep declining
    // to backpressure itself. Both are on the title; the numbers under the row
    // are where `rejected` is broken out.
    right = `${short(p.accepted || 0)} stored`;
    bar.title += `\n\n${fmt(p.rejected || 0)} rejected` +
      (p.dropped != null ? `, ${fmt(p.dropped)} dropped rather than backpressure the sweep` : "");
    // THE ONE METER WHOSE HISTORY DECIDES ANYTHING. A queue at its ceiling is
    // the constraint if it has been there ten minutes and noise if it filled
    // this second, and the level alone cannot say which. Drawn as a LINE beside
    // the filled bar rather than as a second bar — the last thing under this
    // meter was a second bar, and the only question it produced was why there
    // were two of them.
    meterSpark = p.name === "ingest" ? spark(series, "queued") : null;
  } else if (p.observed != null) {
    // NO METER. `knownDead` is read from the STORE and `observed` is this
    // process's sockets since boot — different populations, so there is no
    // whole for either to be a part of. A restarted mirror reports 1,609
    // known dead against 5 observed, and any bar dividing them is arithmetic
    // on unrelated sets.
    bar.style.visibility = "hidden";
    right = `${short(p.knownDead || 0)} dead`;
    row.title = `${fmt(p.knownDead || 0)} url(s) carry an unreachability record in the store — skipped by every` +
      ` fan-out until it ages out\n\n${fmt(p.observed)} url(s) watched on a socket since this router started` +
      `\n\n${term("knownDead")}`;
  } else if (p.pushed != null) {
    bar.style.visibility = "hidden";
    right = `${fmt(p.pushed)} pushed`;
  } else {
    // Built and never run. An empty meter is a claim of zero progress;
    // absence is the honest mark.
    bar.style.visibility = "hidden";
    right = p.phase === "off" ? "nothing to measure" : "no pass yet";
  }
  const cell = el("div", "meter");
  cell.appendChild(bar);
  if (meterSpark) {
    cell.appendChild(meterSpark.svg);
    bar.title += `\n\n${meterSpark.note}`;
  }
  row.appendChild(cell);
  row.appendChild(el("span", "r", right));

  const stack = breakdown(p);
  if (stack) row.appendChild(stack);
  // The one number here that means DATA LOSS: events that passed every check
  // and then could not be written. Drawn only when non-zero and never folded
  // into a count, because a loss counter at 0 belongs in the JSON and a loss
  // counter above 0 belongs in front of an operator.
  if (p.lostToStore) {
    const a = el("p", "alarm",
      `${fmt(p.lostToStore)} event(s) LOST to store errors — good events, accepted and then not written`);
    a.title = `${term("lostToStore")}\n\nThat is a store problem to chase, not a mirror one.`;
    a.style.gridColumn = "1 / -1";
    row.appendChild(a);
  }
  return row;
}

/** The processors, in the order [PROCESSORS] names them, with anything unrecognised kept at the end. */
function processorsPanel(progress) {
  const rows = (progress && progress.processors) || [];
  if (!rows.length) return null;
  const order = PROCESSORS.map((r) => r[0]);
  // Unknown names sort last rather than being dropped: a row this page has not
  // been taught about is still the router saying something is running.
  const sorted = rows.slice().sort((a, b) => {
    const ai = order.indexOf(a.name), bi = order.indexOf(b.name);
    return (ai < 0 ? order.length : ai) - (bi < 0 ? order.length : bi);
  });
  const wrap = el("div");
  // The boundary between the streams and the jobs beside them, for the reason
  // `cyc-end` exists at all: every gap in this card is 12-14px, so without a
  // rule the first processor reads as one more stream.
  wrap.appendChild(el("hr", "cyc-end"));
  const head = el("p", "card-sub");
  head.appendChild(el("b", null, "Also running: "));
  head.append(
    "the two probe passes that decide which discovered urls are worth dialling, the NIP-66 monitor that watches every" +
    " socket, and the pipelines events pass through. All three of the first group write onto the same kind-30166" +
    " record per url — the Monitor verdicts panel below is where one url's whole record is read.");
  wrap.appendChild(head);
  for (const p of sorted) wrap.appendChild(processorRow(p, progress.series));
  return wrap;
}

/** `4m` / `2h 10m` — a duration in seconds, for the phase clock. */
function fmtDur(sec) {
  if (sec < 90) return `${sec}s`;
  if (sec < 5400) return `${Math.round(sec / 60)}m`;
  const h = Math.floor(sec / 3600);
  return `${h}h ${Math.round((sec - h * 3600) / 60)}m`;
}

/**
 * How much of each stream's relay list is in sync, and how far the current
 * sweeps have got.
 *
 * Three facts per relay, on one mark. The bar's EXTENT is the created_at span
 * already walked; its TONE is whether that span was reconciled (negentropy
 * finished — provably identical) or merely paged (we asked and stored what came
 * back); and its right edge against `now` is freshness. The sweep cursor rides
 * the same row in a warm tone with a leading edge at `downTo`, because a sweep
 * killed at 80% records no band at all — without the cursor a relay mid-walk is
 * indistinguishable from one nobody has touched, which is the state this card
 * exists to reveal.
 *
 * THE FRAME IS NOT A TARGET. These filters carry no `since`, so "100% covered"
 * is not a defined quantity; the frame is the oldest span anything here reaches
 * and exists to make two relays comparable, not to grade them. The note under
 * the card says so, and should not be trimmed for the same reason the scope
 * line under the title is not.
 *
 * `relays` counts the relays a stream has TOUCHED, never the relays it was
 * configured with. The router's manifest says which streams exist and what
 * kinds they ask for but names no urls — a dynamic stream's
 * relay list is discovered, so there is no configured list to publish. A "never
 * asked" count would be the honest headline and it is still not available here;
 * see SyncCoverageReport.
 *
 * The URL FILTER is the same bargain as the Kinds one: a fan-out puts thousands
 * of rows in this card and "how far back is nos.lol" should not be a scroll.
 * What it hides it hides EVERYWHERE — the depth strip and the group counts are
 * recomputed over the rows still on screen, because a strip drawn over 4,000
 * relays above three visible rows is a mark answering a question the reader is
 * no longer asking. See [statOf] for the one number a subset cannot restate.
 */
function syncCard(section) {
  const d = (section && section.data) || {};
  const streams = d.streams || [];
  const card = el("div", "card");
  cardHead(card, "Sync coverage", streams.length ? null : "No sync state in this document.", section);
  // ABOVE the bars, and before the early return: what the router is doing right
  // now is the question asked first, and it is the one thing on this card that
  // still has an answer when the mirror has walked nothing at all. A router
  // three minutes into its first cycle used to render as an empty card.
  // The glossary this card's marks explain themselves with, before anything
  // below draws. It is the document's own, so a chip cannot describe a member
  // in words the router would not use — see `term` and `SyncVocabularyTest`.
  TERMS = d.terms || {};
  const progress = progressPanel(d.progress, d);
  if (progress) card.appendChild(progress);
  // …and the work that is not a stream at all. Under the streams because a
  // reader asks "is the mirror running" before "has the fold got to this host
  // yet", and above the coverage bars because both halves are about what the
  // router is doing NOW rather than where it has walked.
  const others = processorsPanel(d.progress);
  if (others) card.appendChild(others);
  // The boundary between the card's two subjects — what the router is doing
  // now, and how far it has walked. Every gap in here was 12-14px, including
  // the one between those two, so they never separated; the rule plus the space
  // above it is what makes the cycle blocks read as members of the panel rather
  // than as peers of the section below.
  //
  // Appended only when BOTH sides exist. A router mid-first-cycle has progress
  // and no coverage, and an unconditional rule would end that card with a line
  // ruling off nothing.
  if ((progress || others) && streams.length) card.appendChild(el("hr", "cyc-end"));
  if (!streams.length) return card;

  const from = d.from, to = d.to;
  const span = Math.max(1, to - from);
  // CLAMPED to the frame. A band's `max` is the newest created_at an upstream
  // served, and created_at is author-signed — quartz accepts one up to about a
  // day ahead of now (further is refused as implausible), so a bar can legally
  // want to start or end past the frame's right edge. Unclamped it paints
  // outside its own track, and the arithmetic that produces it is the same
  // arithmetic that would run away entirely if `to - from` were ever negative.
  const pct = (t) => Math.max(0, Math.min(100, ((t - from) / span) * 100));
  const day = (t) => new Date(t * 1000).toISOString().slice(0, 10);

  const legend = el("div", "legend");
  for (const [tone, text] of [
    // The words are the document's, not this page's — see `sync.terms`. "done"
    // used to cover three different states here and elsewhere; these are the
    // two the bar can actually distinguish.
    ["done", "settled — nothing outstanding below this span"],
    ["paged", "open — walked, not proven exhaustive"],
    ["live", "sweeping now"],
  ]) {
    const s = el("span");
    const b = el("b");
    b.style.background = tone === "paged" ? "var(--bar)" : tone === "done" ? "var(--accent)" : "var(--warn)";
    if (tone === "live") b.style.opacity = ".55";
    s.appendChild(b);
    s.append(text);
    legend.appendChild(s);
  }
  // NOT appended here. It is built with the tones it describes, but it belongs
  // BESIDE the bars — it went in directly under the cycle panel, 14px from the
  // stacked bars it says nothing about and ~60px above the coverage bars it is
  // the key to. It is placed below, under the filter row.

  /** Year ticks, plus the two ends — the frame spans years, so months would be a smear. */
  const axis = () => {
    const outer = el("div", "axis");
    const track = el("div", "axis-track");
    outer.appendChild(track);
    const marks = [[from, day(from)]];
    for (let y = new Date(from * 1000).getUTCFullYear() + 1; y <= new Date(to * 1000).getUTCFullYear(); y++) {
      marks.push([Date.UTC(y, 0, 1) / 1000, String(y)]);
    }
    marks.push([to, "now"]);
    marks.forEach(([t, label], i) => {
      if (t < from || t > to) return;
      const s = el("span", i === 0 ? "first" : i === marks.length - 1 ? "last" : null, label);
      s.style.left = pct(t) + "%";
      track.appendChild(s);
    });
    return outer;
  };

  /**
   * Lay one mark on the track, never past either edge.
   *
   * Every mark carries a MINIMUM width, because a single day inside a
   * five-year frame is a fraction of a pixel and a relay that has covered one
   * day has not covered nothing. That minimum is what makes the ends
   * dangerous: a band starting at the frame's right edge — a future-dated
   * `created_at`, which quartz accepts up to about a day out — placed its
   * sliver outside the track. So the start is pulled back far enough to fit
   * the minimum, and the width is capped by what is left. The track also
   * clips, which covers any future slip in this arithmetic.
   */
  const MIN_MARK = 0.3;
  const place = (node, a, b) => {
    const left = Math.min(pct(a), 100 - MIN_MARK);
    node.style.left = left + "%";
    node.style.width = Math.max(MIN_MARK, Math.min(100 - left, pct(b) - left)) + "%";
  };

  const row = (r) => {
    const wrap = el("div", "cov-row");
    const lab = el("div", "cov-lab");
    // The url in its own LTR isolate inside the rtl box — see `.cov-lab`. The
    // box being rtl is what puts the ellipsis on the left; the isolate is what
    // stops that direction leaking into the url's own punctuation and quietly
    // rewriting the address.
    const url = el("span", null, String(r.relay).replace(/^wss:\/\//, ""));
    url.dir = "ltr";
    lab.appendChild(url);
    lab.title = r.relay;
    wrap.appendChild(lab);
    const track = el("div", "track");
    if (r.min != null && r.max != null) {
      const seg = el("i", `cov-seg ${r.complete ? "done" : "paged"}`);
      place(seg, r.min, r.max);
      seg.title =
        `${r.relay}\n${day(r.min)} → ${day(r.max)} — the span this stream WALKED here\n` +
        // A band is walk state, not holdings, and the two were read as one. A
        // floor newer than the oldest stored event of that kind is ordinary:
        // another stream, or an earlier config, put those events in the store.
        `(walk state for this stream, not what the store holds)\n` +
        // `complete` stopped meaning "negentropy" when a drained paged walk
        // started earning it too — an EOSE on an empty page proves the same
        // thing a finished reconcile does, that there is nothing left below.
        // Saying "negentropy" here would report every `sync = "fetch"` relay
        // as reconciled, which is a claim about HOW, not about what is covered.
        (r.complete ? "settled — nothing left outstanding below this span" : "paged — walked, not proven exhaustive") +
        (r.target ? `\nwindow ${fmt(r.target)}${r.cap ? ` (peer cap ${fmt(r.cap)})` : ""}` : "");
      track.appendChild(seg);
      // Present only when the per-kind spans disagree — one band holds a span
      // per kind and min/max are the outer edges, so the widest kind sets them.
      // This is the intersection: the part no kind is missing evidence for.
      //
      // EVIDENCE, not coverage, and the wording says so. A band's span is built
      // from the events actually received per kind, so a floor above the outer
      // one means "the oldest event of that kind we have seen", which is not
      // the same as "we never walked below it" — a walk that ran that deep and
      // found nothing looks identical here. Calling it "covered only from"
      // asserted a gap the data cannot support.
      if (r.everyKindMin != null) {
        const inner = el("i", "cov-seg every");
        place(inner, r.everyKindMin, r.everyKindMax);
        inner.title =
          `evidence for every kind in this filter reaches only ${day(r.everyKindMin)} → ${day(r.everyKindMax)}\n` +
          `outside it at least one kind has none, so the band cannot vouch for it`;
        track.appendChild(inner);
      }
    }
    if (r.sweep) {
      const live = el("i", "cov-seg live");
      place(live, r.sweep.downTo, r.sweep.upTo);
      live.title = `sweeping — reconciled down to ${day(r.sweep.downTo)}, last advanced ${ago(r.sweep.at)}`;
      track.appendChild(live);
      const edge = el("i", "cov-seg edge");
      edge.style.left = Math.min(pct(r.sweep.downTo), 100 - MIN_MARK) + "%";
      track.appendChild(edge);
    }
    wrap.appendChild(track);
    return wrap;
  };

  /**
   * For each bucket, how many of the group's relays cover it.
   *
   * ONE pass over the relays, adding each into the bucket range it spans —
   * not a `filter()` per bucket. A band is one contiguous interval, so its
   * first and last bucket are arithmetic and everything between is covered by
   * definition; scanning all relays per bucket asked the same question 96
   * times and allocated an array each time. Measured on 4,172 relays: 26ms of
   * every render, down to 3ms.
   */
  const depthStrip = (rows, buckets = 96) => {
    const strip = el("div", "depth");
    const step = span / buckets;
    const n = new Int32Array(buckets), done = new Int32Array(buckets);
    for (const r of rows) {
      if (r.min == null || r.max == null) continue;
      const lo = Math.max(0, Math.floor((r.min - from) / step));
      const hi = Math.min(buckets - 1, Math.floor((r.max - from) / step));
      for (let i = lo; i <= hi; i++) {
        n[i]++;
        if (r.complete) done[i]++;
      }
    }
    for (let b = 0; b < buckets; b++) {
      const i = el("i", done[b] ? null : "thin");
      // OVER EVERY ROW IN THE GROUP, which is the same denominator the tooltip
      // prints. The height used to divide by the relays that have a band at all,
      // so a bucket every banded relay covered drew FULL while its own tooltip
      // read "14 of 28 relays" — a mark claiming the list is in sync over a
      // number saying half of it is. A relay nobody has got a band from covers
      // nothing, and this card exists to make that visible rather than to
      // normalise it away; it is the closest this page gets to the "never asked"
      // count SyncCoverageReport says it cannot give.
      i.style.height = Math.max(1, (n[b] / Math.max(1, rows.length)) * 24) + "px";
      i.title = `${day(from + b * step)} — ${fmt(n[b])} of ${fmt(rows.length)} relays walked here (${fmt(done[b])} settled)`;
      strip.appendChild(i);
    }
    return strip;
  };

  /**
   * A group's counts, restated over whichever of its rows are on screen.
   *
   * Every term here is derivable from the rows themselves and agrees with the
   * document's own numbers when nothing is filtered — one row per relay, a band
   * carries min/max, `sweeping` is the rows with a cursor. That is why the
   * filtered head can be recomputed at all rather than left to contradict the
   * list under it.
   *
   * `legs` is the exception and is dropped the moment a filter is on: it counts
   * BANDS across a narrow's legs, not relays, and no arithmetic over a subset of
   * rows can recover the number for that subset. Carrying the group's total
   * down beside three rows would be a count of something not on screen, which
   * is the failure mode every other number on this card is arranged to avoid.
   */
  const statOf = (rows, total) => {
    let reconciled = 0, paged = 0, sweeping = 0;
    for (const r of rows) {
      if (r.min != null && r.max != null) {
        if (r.complete) reconciled++;
        else paged++;
      }
      if (r.sweep) sweeping++;
    }
    return (
      `${fmt(reconciled)} settled · ${fmt(paged)} open` +
      (sweeping ? ` · ${fmt(sweeping)} sweeping` : "") +
      // The denominator stays visible, same rule as the Kinds table: a head
      // reading "3 relays walked" describes a stream that walked thousands.
      ` · ${fmt(rows.length)} of ${fmt(total)} relays walked`
    );
  };

  // Above the list and below the legend, so the control sits against the thing
  // it controls. Matching on the FULL url including `wss://`, not on the text
  // the row draws with that scheme stripped: the displayed form is a substring
  // of the full one, so this can only ever show a row the visible text also
  // matches — while still answering a reader who typed the whole address in.
  const controls = el("div", "bar-row");
  const filter = el("input");
  filter.type = "search";
  // Named, because render() restores what was typed by name — there are two
  // search boxes on this page now and they must not restore into each other.
  filter.name = "sync";
  filter.placeholder = "filter by relay url";
  filter.setAttribute("aria-label", "filter relays by url");
  const status = el("span", "status");
  controls.appendChild(filter);
  controls.appendChild(status);
  card.appendChild(controls);
  // The key, immediately above the track it is a key to.
  card.appendChild(legend);

  // One scroll box for every stream, and one axis pinned at its top: the frame
  // is shared by design — that is what makes two streams comparable — so a
  // per-stream axis would be the same ruler drawn N times and would stop being
  // sticky the moment its stream scrolled past.
  const scroll = el("div", "wrap tall cov");
  const pinned = axis();
  pinned.classList.add("pin");
  scroll.appendChild(pinned);

  const groups = [];
  for (const s of streams) {
    const box = el("div", "grp");
    const head = el("div", "grp-head");
    const name = el("div", "grp-name");
    // The router's own stream name, when the state files carry one. They did
    // not before the format nested by stream, so a group read from a
    // pre-stream key still falls back to being labelled by its filter alone —
    // which is what every group used to be.
    if (s.name) {
      const who = el("span", "grp-stream", s.name);
      who.title = `router stream "${s.name}"`;
      name.appendChild(who);
    } else if (s.unnamed) {
      // SAID, not left to be inferred from a missing label. Two of these turned
      // up on a production card carrying 2,600 relays between them and no
      // identity at all, which reads as two undocumented mirrors rather than as
      // one migration shim.
      const who = el("span", "grp-stream", "unnamed");
      who.title =
        "state written before the router's files nested by stream, so these keys name no stream. " +
        "Not a second mirror — it disappears once every deployment has booted on a build that writes the nested shape.";
      name.appendChild(who);
    }
    const kinds = (s.filter && s.filter.kinds) || [];
    // What the group's legs were split BY, spelled out. A `relaySource` that
    // binds authors gives every relay its own filter, so this one group is
    // thousands of per-author asks — and without saying so, its chip is
    // indistinguishable from the same kinds asked of every relay whole, which
    // is a different and much stronger claim.
    const narrowedBy = s.narrowedBy || [];
    // Singular, because the phrase is "per author" — the member's name is the
    // filter's plural array and reads as "per authors" straight out of it.
    const per = (m) => (m.startsWith("#") ? `tag ${m.slice(1)}` : m.replace(/s$/, ""));
    const label =
      (kinds.length ? `kinds ${kinds.join(", ")}` : "every kind") +
      (narrowedBy.length ? ` · per ${narrowedBy.map(per).join(" + ")}` : "");
    const chip = el("code", null, label);
    // The chip is clipped to one line, so the full list has to live somewhere:
    // "kinds 1, 6, 7, 16, 1111, …" and "kinds 1, 6, 7, 16, 30023, …" are two
    // different streams and the ellipsis is exactly where they differ.
    chip.title = label;
    name.appendChild(chip);
    head.appendChild(name);
    const stat = el("div", "grp-stat",
      `${fmt(s.reconciled || 0)} settled · ${fmt(s.paged || 0)} open` +
      (s.sweeping ? ` · ${fmt(s.sweeping)} sweeping` : "") +
      ` · ${fmt(s.relays || 0)} relays walked` +
      // Beside the url count, never instead of it. One server answers on every
      // path, so a relay list mints urls without limit and every url-keyed
      // number here is inflated until the alias fold decides them — measured,
      // 3,272 urls on 850 hosts. The GAP is the disclosure.
      (s.hosts != null && s.hosts !== s.relays ? ` on ${fmt(s.hosts)} host(s)` : "") +
      // Present only when a narrow asked one relay more than once, and then it
      // is the number that explains the other three: these counts are per
      // RELAY, and a relay counts as reconciled only when every leg of it did.
      (s.legs ? ` · ${fmt(s.legs)} legs` : ""));
    head.appendChild(stat);
    box.appendChild(head);
    const rows = s.rows || [];
    // The strip gets a slot of its own rather than being appended straight to
    // the group: filtering redraws it from the surviving rows, and it comes and
    // goes with the 24-row threshold, so the filter needs somewhere to put the
    // new one that is still between the head and the first row.
    const stripBox = el("div");
    box.appendChild(stripBox);
    if (rows.length > 24) stripBox.appendChild(depthStrip(rows));
    // EVERY relay, no top-N: the relays a cap would drop are the ones the
    // question is about. Same argument as the Kinds table.
    const nodes = rows.map(row);
    for (const node of nodes) box.appendChild(node);
    scroll.appendChild(box);
    // Lowercased ONCE per relay rather than per keystroke: this array runs to
    // thousands of urls on a fan-out and the filter re-reads all of them on
    // every character typed.
    groups.push({ box, stat, stripBox, rows, nodes, urls: rows.map((r) => String(r.relay).toLowerCase()) });
  }
  card.appendChild(scroll);

  // Distinct across streams, because the same relay is a row in every stream
  // that walked it — summing the rows would report a list several times its own
  // length. The set is the card's denominator and does not change, so it is
  // built once and only the matching side is recounted.
  const every = [...new Set(groups.flatMap((g) => g.urls))];
  // Shown only when a query empties the card. The scroll box goes with it: what
  // is left in there is the pinned axis over nothing, which reads as a card
  // that failed to load rather than as a filter that matched nothing.
  const none = el("p", "why cov-none");
  none.hidden = true;
  card.appendChild(none);

  // What the heads read as built: the document's own numbers, `legs` and all,
  // restored verbatim when the box is emptied rather than recomputed — an
  // unfiltered card should print exactly what SyncCoverageReport published.
  const statText = groups.map((g) => g.stat.textContent);
  // Whether the last pass drew a narrowed view. Without it the first render —
  // and every keystroke that leaves the box empty — pays to rebuild strips and
  // heads that already hold the values it is about to write back.
  let narrowed = false;

  const applyFilter = () => {
    const q = filter.value.trim().toLowerCase();
    let live = 0;
    groups.forEach((g, gi) => {
      const kept = [];
      g.nodes.forEach((node, i) => {
        const hit = !q || g.urls[i].includes(q);
        node.hidden = !hit;
        if (hit) kept.push(g.rows[i]);
      });
      // A stream with nothing left is hidden whole — its head and depth strip
      // are about relays that are no longer on screen.
      g.box.hidden = !kept.length;
      if (kept.length) live++;
      if (!q && !narrowed) return;
      g.stripBox.replaceChildren();
      const drawn = q ? kept : g.rows;
      if (drawn.length > 24) g.stripBox.appendChild(depthStrip(drawn));
      g.stat.textContent = q ? statOf(kept, g.rows.length) : statText[gi];
    });
    narrowed = !!q;
    const hits = q ? every.reduce((n, u) => n + (u.includes(q) ? 1 : 0), 0) : every.length;
    status.textContent =
      (q ? `${fmt(hits)} of ${fmt(every.length)} relays` : `${fmt(every.length)} relays`) +
      // Named only while filtering, and only when it costs the reader a group:
      // a vanished stream is otherwise a silent omission on the one card whose
      // job is to show what is missing.
      (q && live < groups.length ? ` · ${fmt(live)} of ${fmt(groups.length)} streams` : "");
    // Gated on the QUERY, not just on `live`. A document whose streams carry no
    // rows would otherwise hide its own list and print "…contains “”" — nothing
    // upstream can produce that shape today, but `s.rows || []` above says this
    // function does not assume so, and "no match" and "nothing to show" are not
    // the same state to report.
    const empty = !!q && !live;
    scroll.hidden = empty;
    none.hidden = !empty;
    if (empty) none.textContent = `No relay in this document's sync state contains “${filter.value.trim()}”.`;
  };
  filter.addEventListener("input", applyFilter);
  applyFilter();
  // Measured, not guessed: a hardcoded rem offset is wrong at any root font
  // size but the author's, and 2px out hides a sliver of one sticky element
  // behind the other.
  //
  // On a ResizeObserver rather than the one rAF this was, because BOTH of these
  // measurements go stale the moment the card changes width — the axis loses or
  // regains a tick and `--pin-h` is off by whatever the pinned strip now is,
  // which pins every group head to the wrong offset. The observer fires once on
  // insertion too, which is all the rAF was there for.
  const remeasure = () => {
    const h = pinned.getBoundingClientRect().height + "px";
    if (scroll.style.getPropertyValue("--pin-h") !== h) scroll.style.setProperty("--pin-h", h);
    thinTicks(pinned.querySelector(".axis-track"));
  };
  new ResizeObserver(remeasure).observe(scroll);

  card.appendChild(el("p", "card-sub",
    `Frame: ${day(from)} → now. Not a target — these filters carry no lower bound, so a full row means ` +
    `"as deep as anything here reaches", not "done". Counts relays each stream has walked, not the relays it names.`));
  return card;
}

/**
 * WHAT THE MONITOR HAS DECIDED ABOUT EACH RELAY URL, asked over the wire.
 *
 * Every other panel here reads `/stats.json`, which is a rollup: the fold's
 * summary says 373 urls collapsed onto 909 relays and stops there. That number
 * cannot answer the question an operator actually has when a duplicate is still
 * being dialled — *what does this store say about THIS url, and when was it
 * measured?* The verdict is a signed kind-30166 record and nothing on this page
 * read one.
 *
 * A plain NIP-01 REQ over this relay's own websocket, so the panel is a
 * protocol check as much as a view: a verdict that cannot be read here cannot
 * be read by any client either. The note at the top of this file records that
 * the kind histogram lost exactly this property when it stopped asking NIP-45
 * COUNTs, and judged the check better as a test than a page. That was right
 * about counts, which have a rollup to fall back on. It is wrong about
 * verdicts, which have no other reader at all.
 *
 * NOT DRAWN UNTIL ASKED, and that is why it takes a button. This page polls
 * itself every minute; opening a websocket and paging thousands of records on
 * that cadence would make a debugging aid into a load source. `reads: []` in
 * PANELS keeps the poller from rebuilding it, so what the reader loaded and
 * typed survives every refresh underneath it.
 */
function verdictsCard() {
  const card = el("div", "card");
  cardHead(card, "Monitor verdicts (NIP-66)", null, null);
  card.appendChild(el("p", "card-sub",
    `Reads kind ${MONITOR_KIND} out of this relay over its own websocket — the same ask any client makes. ` +
    "Grouped by host, because a duplicate is never a property of one url: it is a property of a url next to another one."));

  // ONE toolbar, not `.grp-head` — which this borrowed and should not have.
  // That class is a STICKY heading for the inside of a scroll box: it carries
  // `position: sticky`, a z-index and its own background, none of which mean
  // anything at the top of a card, and the background made the control row read
  // as a header band.
  const bar = el("div", "vd-bar");
  const load = el("button", "btn", "Read verdicts from this relay");
  const filter = el("input");
  filter.type = "search";
  // Named like the others so render()'s restore loop cannot carry one search
  // box's text into another — there are three on this page now.
  filter.name = "verdicts";
  filter.placeholder = "filter by host or url";
  filter.setAttribute("aria-label", "filter verdicts by host or url");
  filter.hidden = true;
  const status = el("span", "status", "");
  bar.append(load, filter, status);
  card.appendChild(bar);

  const sumBox = el("div");
  card.appendChild(sumBox);

  const scroll = el("div", "wrap tall");
  scroll.hidden = true;
  card.appendChild(scroll);
  const none = el("p", "cov-none");
  none.hidden = true;
  card.appendChild(none);

  let groups = [];

  const applyFilter = () => {
    const q = filter.value.trim().toLowerCase();
    let live = 0;
    for (const g of groups) {
      // A hit on the HOST keeps the whole group — that is what someone typing a
      // hostname means, and hiding the non-matching urls of the very host they
      // asked for would take away the comparison the panel exists to give.
      const wholeHost = !q || g.host.includes(q);
      let kept = 0;
      for (const r of g.rows) {
        const hit = wholeHost || r.needle.includes(q);
        r.node.hidden = !hit;
        if (hit) kept++;
      }
      // Heads and rows go together. Hiding only rows left a heading on screen
      // for every host in the store, each with nothing beneath it.
      g.box.hidden = !kept;
      if (kept) live++;
    }
    const empty = !!q && !live;
    none.hidden = !empty;
    if (empty) none.textContent = `No url in this store's verdicts contains “${filter.value.trim()}”.`;
  };
  filter.addEventListener("input", applyFilter);

  load.addEventListener("click", async () => {
    load.disabled = true;
    status.textContent = "asking…";
    try {
      const { events, complete, self, others } = await readVerdicts((n) => { status.textContent = `${fmt(n)} record(s)…`; });
      const nowSec = Math.floor(Date.now() / 1000);
      const byHost = groupByHost(events, nowSec);
      const sum = summarise(byHost, nowSec);
      groups = drawVerdicts(scroll, byHost, nowSec);
      // The numbers as NUMBERS, over the list rather than as a run-on sentence
      // beside the button. `not folded` is the one that separates two very
      // different diagnoses: a record with no verdict tag is quartz's passive
      // monitor writing reachability, so a store full of those beside zero
      // folds says the monitor is running and the FOLD is not — where no
      // records at all says neither is.
      // `replaceChildren`, not `fill`: that helper exists to carry a reader's
      // filter text and scroll position across a rebuild, and this box holds
      // neither. Using it here would imply a preservation that is not happening.
      sumBox.replaceChildren(tally([
        ["urls", sum.urls],
        ["hosts", sum.hosts],
        ["folded away", sum.folded],
        ["measured, kept", sum.cleared],
        ["not folded", sum.silent],
        ...(sum.expired ? [["verdict expired", sum.expired]] : []),
        ...(sum.unstable ? [["refused as inconsistent", sum.unstable]] : []),
      ]));
      // What the read did NOT cover comes first: every number above is over the
      // records we actually got, and one taken from a partial read means
      // something different from one taken from a whole store.
      // WHOSE RECORDS THESE ARE comes before what they say. Every number below
      // is over one monitor's observations, and a reader who assumes otherwise
      // reads the panel as a census of the store.
      const whose = self
        ? (others === null
            ? `this relay's own monitor (${self.slice(0, 8)}…)`
            : others > 0
              ? `this relay's own monitor (${self.slice(0, 8)}…) — ${fmt(others)} more 30166 record(s) here belong to other monitors and are not counted`
              : `this relay's own monitor (${self.slice(0, 8)}…), the only one with records here`)
        : "EVERY monitor in this store — this relay advertises no key of its own, so these are not necessarily its verdicts";
      status.textContent =
        (complete ? "" : `partial read — stopped at ${fmt(events.length)} record(s); the store holds more. `) +
        whose +
        (sum.inferred ? `. ${fmt(sum.inferred)} survivor(s) inferred from the folds that point at them` : "");
      status.className = complete && self ? "status" : "status vd-stale";
      filter.hidden = false;
      scroll.hidden = false;
      applyFilter();
    } catch (e) {
      // The relay's own message. A panel that speaks the protocol has to report
      // a protocol failure as one — "0 records" and "the socket closed" are not
      // the same finding, and this is the panel whose whole job is telling
      // states apart.
      status.textContent = "";
      none.hidden = false;
      none.textContent = `Could not read verdicts: ${(e && e.message) || e}`;
    } finally {
      load.disabled = false;
    }
  });
  return card;
}

/** A row of labelled numbers — the panel's own small tiles. */
function tally(pairs) {
  const box = el("div", "vd-sum");
  for (const [label, n] of pairs) {
    const cell = el("div");
    cell.appendChild(el("b", null, fmt(n)));
    cell.append(label);
    box.appendChild(cell);
  }
  return box;
}

/**
 * Page every kind-30166 record out of this relay, newest first.
 *
 * Paged on `until`, because a fan-out of five figures carries five figures of
 * records and one REQ is bounded by whatever this relay's own limit happens to
 * be — the same reason `AliasProbe` walks rather than asking once. The cursor
 * steps strictly below the oldest `created_at` seen when a page adds nothing
 * new, or a page that is entirely one timestamp cannot move it at all.
 *
 * No `authors` filter. The question is what this STORE holds, which includes
 * records signed by another monitor or by a router sharing the key — and a
 * verdict we cannot see because we guessed the wrong author reads exactly like
 * a verdict that was never written, which is the confusion this panel exists to
 * end. The author is drawn per row instead.
 */
async function readVerdicts(onProgress) {
  const relay = new Relay(location.origin.replace(/^http/, "ws"));
  // What this relay says it will serve in one ask, and WHO IT IS. Same origin,
  // so this is the relay describing itself rather than us guessing at it.
  const { maxPage, self } = await relayIdentity();
  try {
    // SCOPED TO THIS RELAY'S OWN MONITOR, and that scoping is load-bearing on a
    // real store rather than tidiness.
    //
    // A router discovers relays from other monitors' reports — the documented
    // outbox source reads `kinds: [10002, 10050, 30002, 30166]` — so a mirror
    // holds strangers' 30166s by design, and public monitors publish them by
    // the tens of thousands. Unscoped, every count on this panel would be our
    // verdicts plus an unknown quantity of somebody else's observations, which
    // is worse than no number: "1,621 folded away" would silently include
    // relays this router never probed.
    //
    // `self` is the relay's OWN key, which `RELAY_NSEC` also gives the sync
    // process precisely so its monitor records speak as the relay it feeds.
    // Absent — an anonymous relay, or one whose sync was given a different key
    // — there is nothing to scope to, and the panel says so rather than
    // guessing an author and hiding every verdict signed under another.
    const scope = self ? { authors: [self] } : {};
    const walk = await walkRecords({
      // Longer than the class's 10s default: a page of signed records off a
      // loaded relay is a bigger answer than the search box ever asks for, and
      // a timeout here is indistinguishable from an empty store to the reader.
      ask: (limit, until) =>
        relay.req({ kinds: [MONITOR_KIND], limit, ...scope, ...(until == null ? {} : { until }) }, 25000),
      pageSize: Math.min(500, maxPage),
      maxPage,
      onProgress,
    });
    // …and then count what we DIDN'T read, so the scoping never hides anything.
    // A COUNT is one round trip against an index; walking every monitor's
    // records to arrive at the same number is not worth a debugging panel's
    // bandwidth. A relay that will not answer it leaves this null, which the
    // caller renders as "unknown" rather than as zero.
    const total = self ? await relay.count({ kinds: [MONITOR_KIND] }) : walk.events.length;
    return { ...walk, self, others: typeof total === "number" ? Math.max(0, total - walk.events.length) : null };
  } finally {
    // Always, and through the socket rather than a method: [Relay] has no
    // close() — the pages that use it keep one connection for their lifetime.
    // This panel opens one per click, so a leak here is one socket per press
    // that the reader cannot see and cannot close.
    try { relay.ws && relay.ws.close(); } catch (e) {}
  }
}

/**
 * What this relay says about itself, out of its own NIP-11 document: the
 * biggest single ask it will answer, and its own key.
 *
 * `maxPage` defaults to 500, which is the conservative reading rather than a
 * guess at generosity: with no stated ceiling the walk cannot grow its page,
 * and a run of records longer than that is reported as an incomplete read
 * instead of stepped over.
 *
 * `self` is the relay's OWN key and NOT `pubkey`, which is the admin contact —
 * two different fields that a reader coming from NIP-11 will expect to be one.
 * Scoping the panel to the contact key would return nothing at all.
 */
async function relayIdentity() {
  try {
    const doc = await fetch("/", { headers: { Accept: "application/nostr+json" } }).then((r) => r.json());
    const stated = doc && doc.limitation && Number(doc.limitation.max_limit);
    return {
      maxPage: stated > 0 ? Math.min(stated, 5000) : 500,
      self: (doc && typeof doc.self === "string" && /^[0-9a-f]{64}$/i.test(doc.self) && doc.self) || null,
    };
  } catch (e) {
    return { maxPage: 500, self: null };
  }
}

/**
 * Draw the host groups into [box]; returns the filterable groups.
 *
 * A url is drawn as its PATH, not its whole url. The host is already the box's
 * heading, so repeating `wss://articles.layer3.news/` on all 23 rows spent the
 * width that tells them apart on the part they share — and these lists are
 * nothing but minted paths on one host, so the path is the entire signal.
 */
function drawVerdicts(box, groups, nowSec) {
  box.replaceChildren();
  const out = [];
  for (const group of groups) {
    const wrap = el("div", "vd-group");
    const head = el("div", "vd-ghead");
    const folded = group.folded;
    const meter = el("div", "vd-meter");
    const fill = el("i");
    fill.style.width = `${group.urls.length ? Math.round((folded / group.urls.length) * 100) : 0}%`;
    meter.appendChild(fill);
    meter.title = `${fmt(folded)} of ${fmt(group.urls.length)} url(s) fold away`;
    head.append(
      el("div", "vd-name", group.host),
      el("span", "vd-count",
        `${fmt(group.urls.length)} url(s) → ${fmt(group.survivors)} dialled` +
        (group.expired ? ` · ${fmt(group.expired)} expired` : "")),
      meter,
    );
    wrap.appendChild(head);
    const rows = [];
    for (const u of group.urls) {
      const row = el("div", "vd-row");
      const left = el("div", "vd-path");
      const right = el("div", "vd-when");
      // The path alone, with the bare url named rather than drawn as an empty
      // cell — "/" is a row that looks like a rendering failure.
      const path = u.url.replace(/^wss?:\/\/[^/]+/i, "") || "/";
      left.append(el("span", null, path === "/" ? "(no path)" : path));
      // The VERDICT's age, not the record's. Kind 30166 is addressable and
      // shared — quartz's monitor rewrites it on every connection — so
      // `created_at` tracks the last time we TALKED to the relay, not the last
