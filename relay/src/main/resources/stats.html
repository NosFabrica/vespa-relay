  // protocol rather than a fact about this relay, and it was sitting between
  // the totals and everything worth reading.

  // The totals have no card header for cardHead to hang an error on, and
  // without this an em dash where a number belongs is the ONLY sign anything
  // went wrong — with the engine's message, which names the failing pipeline,
  // dropped on the floor. Carried in its own strip instead.
  //
  // Both sections feeding this row, and each error PREFIXED with the one it
  // came from: these keys used to be unique because they came from one section,
  // and a bare "pubkeys:" beside a bare "events:" now says nothing about which
  // half of the document to go and read.
  const strip = el("div", "card");
  for (const [name, section] of [["corpus", doc.corpus], ["authors", doc.authors]]) {
    for (const [k, v] of Object.entries((section && section.errors) || {})) {
      const p = el("p", "err");
      p.append(`${name}.${k}: `);
      p.appendChild(el("code", null, v));
      strip.appendChild(p);
    }
  }
  if (strip.firstChild) out.push(strip);
  return out;
}

/**
 * One chart card, or a stated empty window.
 *
 * A series that is present but all-zero must NOT be dropped — an omitted chart
 * is indistinguishable from a panel this page does not know about, and "no
 * events in the last 30 days" is a real and alarming fact about a relay that is
 * supposed to be mirroring. This drew nothing at all until a corpus whose
 * newest event predated the window rendered a page with the daily charts simply
 * missing and no indication anything was wrong.
 */
function chartCard(title, sub, points, section, noun = "events") {
  const card = el("div", "card");
  cardHead(card, title, sub, section);
  if (!points.length) {
    card.appendChild(el("p", "why", "Not in this document."));
  } else if (points.every((p) => !p.value)) {
    // [noun] names what the series counts, because this sentence is the whole
    // finding when a window is empty and it was hardcoded to "events" — so the
    // pubkeys chart reported "No events in this window." over a chart that is
    // not counting events, next to an events chart that might be full of them.
    card.appendChild(el("p", "err", `No ${noun} in this window.`));
  } else {
    card.appendChild(barChart(points, { label: title }));
  }
  return card;
}

/**
 * The three granularities, and why they are three separate answers rather than
 * one re-aggregated.
 *
 * Events sum across buckets; DISTINCT AUTHORS DO NOT. Someone posting every day
 * is one author in the week and seven in the sum of that week's days, so a
 * weekly "publishing pubkeys" has to be asked of the engine at weekly
 * granularity. The rollup does exactly that, and this toggle picks between the
 * three series it returns — it never adds days together to make a week.
 */
const GRAINS = [
  // [tick] is the axis label, [tip] the hover. They differ on purpose: the axis
  // gets the shortest form that still reads ("Jul 9"), the tooltip gets the
  // unambiguous one — and for weeks it has to say WHICH day that key is, since
  // a week bucket is keyed by the Monday it starts on and "Jul 9" alone would
  // read as a single day's bar.
  // [span] returns NULL rather than a string built around a missing field. When
  // the whole activity section fails the engine, `data` is absent and every one
  // of these read `undefined` straight into the card title — "Events per day ·
  // last undefined days", printed in bold above the badge that already said
  // `failed`. A window this page cannot state is one it should not mention.
  //
  // It is the WHOLE phrase, "last" included, and it was a bare length the
  // caller prefixed with that word. The monthly series is anchored to a date
  // and grows rather than trailing the present, so "last 44 months" described a
  // rolling window this chart deliberately is not.
  { key: "days", label: "Daily", unit: "day", span: (d) => (d.windowDays == null ? null : `last ${d.windowDays} days`), tick: dayTick, tip: (p) => p },
  { key: "weeks", label: "Weekly", unit: "week", span: (d) => (d.windowWeeks == null ? null : `last ${d.windowWeeks} weeks`), tick: dayTick, tip: (p) => `week of ${p}` },
  { key: "months", label: "Monthly", unit: "month", span: monthSpan, tick: monthTick, tip: (p) => p },
];

/**
 * "since Jan ’23" — the monthly window stated as where it starts.
 *
 * Falls back to the count for a document written before `monthsSince` existed,
 * rather than dropping the window from the title entirely: an older rollup's
 * monthly chart really was a rolling N months, and that is what its own field
 * says.
 */
function monthSpan(d) {
  if (d.monthsSince) return `since ${monthTick(d.monthsSince)}`;
  return d.windowMonths == null ? null : `last ${d.windowMonths} months`;
}

/** "· last 30 days" when the document states a window, and nothing at all when it does not. */
const spanNote = (span) => (span ? ` · ${span}` : "");
let grain = null;

/** The granularities this document actually carries, finest first. */
const grainsIn = (activity) => {
  const d = (activity && activity.data) || {};
  return GRAINS.filter((g) => (d[g.key] || []).length);
};

/**
 * Settle [grain] on something the document can actually draw.
 *
 * The default used to be a hardcoded "days", which is wrong whenever the daily
 * series is the empty one — a store whose newest event predates the 30-day
 * window opens on "Not in this document." with weekly and monthly data sitting
 * right there. Worse, the toggle hides itself below two granularities, so a
 * document carrying ONLY months could never be switched to and its data was
 * unreachable. Reconciling here means the page opens on the finest granularity
 * that has something to show, and a reader's explicit choice is kept as long as
 * it stays valid.
 */
function settleGrain(activity) {
  const available = grainsIn(activity);
  if (!available.length) return;
  if (!available.some((g) => g.key === grain)) grain = available[0].key;
}

function grainToggle(activity, onChange) {
  const row = el("div", "seg");
  // Only the granularities the document actually carries — a control that
  // switches to an empty chart is worse than one that is not offered.
  const available = grainsIn(activity);
  if (available.length < 2) return null;
  for (const g of available) {
    const b = el("button", g.key === grain ? "on" : null, g.label);
    b.addEventListener("click", () => {
      grain = g.key;
      onChange();
    });
    row.appendChild(b);
  }
  return row;
}

function activityCards(activity) {
  const d = (activity && activity.data) || {};
  const g = GRAINS.find((x) => x.key === grain) || grainsIn(activity)[0] || GRAINS[0];
  const series = d[g.key] || [];
  const hours = d.hours || [];
  const span = g.span(d);
  const out = [];

  // The window is in the title because it is the one thing a bare "Events per
  // day" cannot be read without: 30 days and 30 months are the same 30 bars.
  out.push(chartCard(
    `Events per ${g.unit}${spanNote(span)}`,
    null,
    series.map((x) => ({ label: g.tip(x.period), tick: g.tick(x.period), value: x.events })),
    activity,
  ));

  // A SECOND chart, never a second y-axis on the first: events and pubkeys
  // differ by orders of magnitude, and aligning two scales on one plot invents
  // a correlation that is not in the data.
  if (series.some((x) => x.pubkeys != null)) {
    out.push(chartCard(
      `Publishing pubkeys per ${g.unit}${spanNote(span)}`,
      null,
      series.map((x) => ({ label: g.tip(x.period), tick: g.tick(x.period), value: x.pubkeys || 0 })),
      null,
      "publishing pubkeys",
    ));
  }

  // "14:00", not "14": a bare number under a bar reads as a count on a page
  // whose every other axis label is one. The tooltip names the whole hour and
  // the zone, because "14:00" alone invites the reader to apply their own.
  out.push(chartCard(
    `Events by hour of day${spanNote(d.hourWindowDays == null ? null : `last ${d.hourWindowDays} days`)}`,
    null,
    hours.map((x) => {
      const hh = String(x.hour).padStart(2, "0");
      return { label: `${hh}:00–${hh}:59 UTC`, tick: `${hh}:00`, value: x.events };
    }),
    null,
  ));
  return out;
}

/**
 * A compact bar chart with no axis — the small-multiple mark.
 *
 * Each kind gets its OWN vertical scale, and the peak is printed beside the
 * title because of it. A shared scale is the obvious default and it is wrong
 * here: kind 1 outnumbers the rest by an order of magnitude, so a common axis
 * would flatten every other kind to a line of pixels and the panel would show
 * one series and seven blanks. Shape is what this panel is for — the levels are
 * in the Kinds table above it — but a reader will assume a shared scale unless
 * told, so the peak is on every card.
 */
function sparkline(points) {
  const W = 240, H = 40;
  const svg = svgEl("svg", { class: "chart spark", viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  const max = Math.max(1, ...points.map((p) => p.value));
  const band = W / Math.max(1, points.length);
  const w = Math.max(1, Math.min(10, band - 1));
  points.forEach((p, i) => {
    if (!p.value) return;
    const h = Math.max(1, (p.value / max) * H);
    svg.appendChild(svgEl("rect", { class: "mark", x: i * band + (band - w) / 2, y: H - h, width: w, height: h, rx: 1 }));
  });
  return svg;
}

function kindActivityCard(section) {
  const d = (section && section.data) || {};
  const kinds = d.kinds || [];
  const card = el("div", "card");
  // "peak N/day" on every cell is what stands in for the removed sentence about
  // per-kind scales. Do not drop it as prose: without a stated peak a reader
  // assumes one shared axis and compares heights across cells, which is the one
  // thing this panel does not mean.
  cardHead(
    card,
    kinds.length
      ? `Event types over time · ${kinds.length} largest kinds, last ${d.windowDays} days`
      : "Event types over time",
    kinds.length ? null : "No per-kind series in this document.",
    section,
  );
  if (!kinds.length) return card;

  const grid = el("div", "sparks");
  for (const k of kinds) {
    const cell = el("div", "spark-cell");
    const head = el("div", "spark-head");
    // Number FIRST, name second — same order as the Kinds table, and it is the
    // order that survives the ellipsis. These heads truncate (a narrow column
    // beside a "peak N/day"), and with the name leading, Quartz's longer
    // registry names pushed the kind NUMBER off the end: "Outbox Relays ·…"
    // drops the one part of the label that is unambiguous. The full text is on
    // the title, since this is the string most likely to be cut.
    const name = kindName(k.kind, k.name);
    const label = el("span", "spark-kind", `${k.kind} · ${name}`);
    label.title = `${name} — kind ${k.kind}`;
    head.appendChild(label);
    const peak = Math.max(0, ...k.days.map((x) => x.events));
    head.appendChild(el("span", "spark-peak", `peak ${short(peak)}/day`));
    cell.appendChild(head);
    cell.appendChild(sparkline(k.days.map((x) => ({ label: x.day, value: x.events }))));
    grid.appendChild(cell);
  }
  card.appendChild(grid);
  return card;
}

/**
 * Whether ranked search can rank at all.
 *
 * The four numbers are a CHAIN — observers name providers, providers publish
 * scores, scores project onto pubkeys — and reading them together localises a
 * break that every other panel on this page is blind to. `TrustReconcile` warns
 * about exactly this failure: "a corpus mirrored before its provider lists
 * arrived stays silently unprojected, and every ranked search comes back
 * empty." A relay in that state looks perfectly healthy on the charts above.
 *
 * Drawn as a bare `.panel`, not a `.card`: four headline counts are the same
 * kind of mark as the corpus totals immediately above, so they get the same
 * bare tiles on the page background. In a card they were tiles-in-a-box —
 * their border inside the card's, both on `--surface` — which made the one
 * panel that can report the relay broken read as the busiest thing on screen.
 */
function trustCard(section) {
  const d = (section && section.data) || {};
  const card = el("div", "panel");
  cardHead(card, "Trust", null, section);

  // Plain `.tiles`, matching the corpus row's 11rem track rather than the 8rem
  // one the in-card rows use: standing on the same background at the same
  // width, the two rows have to size their tiles identically or the seam shows.
  const row = el("div", "tiles");
  for (const [key, label, help] of [
    ["observers", "Observers", "Distinct authors of a kind-10040 list naming a score provider"],
    // "Service Keys", not "Providers". The count is of KEYS that signed
    // kind-30382 scores, and one provider may sign under several of them — the
    // pubkey is what a kind-10040 list names and what this number can actually
    // vouch for, so it is what the label says.
    ["providers", "Service Keys", "Distinct authors of kind-30382 scores"],
    ["scores", "Scores", "Stored kind-30382 events"],
    ["scoredPubkeys", "Scored pubkeys", "Pubkeys carrying projected trust state — what a ranked search can order by"],
  ]) {
    const t = el("div", "tile");
    t.appendChild(el("div", "v", d[key] == null ? "—" : fmt(d[key])));
    t.appendChild(el("div", "k", label));
    t.title = help;
    row.appendChild(t);
  }
  card.appendChild(fitTiles(row));

  // The one state worth shouting about, and the reason this panel exists.
  if (d.scoredPubkeys === 0) {
    card.appendChild(el("p", "err",
      "No pubkey carries trust state, so every ranked search is falling back to unranked — " +
      (d.scores ? "scores are stored but not projected; a trust reconcile is what fixes that."
                : "no kind-30382 scores are stored yet; the mirror has not fetched them.")));
  }
  return card;
}

/**
 * WHAT THE ROUTER IS DOING RIGHT NOW — one cycle, live, with an outcome.
 *
 * This sits above the coverage bars because it answers the questions asked
 * first and because the coverage card cannot answer any of them. Coverage is
 * accumulated across every run this router has ever made; this is one cycle.
 *
 * ## Marks, not sentences
 *
 * The half of this card that describes the live state used to be prose: a
 * paragraph of clauses per stream, a second for the accounting, a third naming
 * the held relays, and a fourth per processor. Measured on a two-stream
 * deployment it came to 520 words, and it had the failure modes prose always
 * has against a table of numbers — it is read serially, two streams cannot be
 * compared without holding both paragraphs in your head, and a number inside a
 * clause cannot be scanned down a column. The same facts as chips, bars and
 * one table come to 66.
 *
 * So: every quantity is a mark, and the MEANING lives on the mark's `title`,
 * taken from the glossary the document already ships (see [term]). The card
 * spends words on exactly one thing — damage — through `.alarm`.
 *
 * ## Three readings the arrangement is meant to make impossible
 *
 *  - **"16,747/16,752" as progress.** That number counts legs that RETURNED,
 *    including every one that came back unreachable or capped. The stacked bar
 *    is what actually became of them, and it is drawn from members that sum to
 *    the total by construction — a stack cannot be drawn from counts that do
 *    not.
 *  - **"discovered" as "dialled".** Most of the gap between a fan-out's two big
 *    numbers is duplicate urls rather than lost relays, so the url partition is
 *    its own bar above the disposition rather than a clause beside it.
 *  - **A stopped router as a quiet one.** `staleForSec` is a heartbeat, and the
 *    `live` chip is the first mark on the card — a phase frozen mid-`fetching`
 *    is exactly what a dead process leaves behind.
 */

/**
 * WHAT THE ROUTER IS DOING RIGHT NOW — one cycle, live, with an outcome.
 *
 * This sits above the coverage bars because it answers the questions asked
 * first and because the coverage card cannot answer any of them. Coverage is
 * accumulated across every run this router has ever made; this is one cycle.
 *
 * ## Marks, not sentences
 *
 * The half of this card that describes the live state used to be prose: a
 * paragraph of clauses per stream, a second for the accounting, a third naming
 * the held relays, and a fourth per processor. Measured on a two-stream
 * deployment it came to 520 words, and it had the failure modes prose always
 * has against a table of numbers — it is read serially, two streams cannot be
 * compared without holding both paragraphs in your head, and a number inside a
 * clause cannot be scanned down a column. The same facts as chips, bars and one
 * table come to 66.
 *
 * So: every quantity is a mark, and the MEANING lives on the mark's `title`,
 * taken from the glossary the document already ships (see [term]). The card
 * spends words on exactly one thing — damage — through `.alarm`.
 *
 * ## Where the decisions live
 *
 * Not here. Which legs are worth naming, what a bar is a proportion OF, whether
 * a partition divides, whether a health object is drawable — all of that is
 * `/web/shared/sync.js`, because it is the half that can be wrong silently and
 * the half nothing could reach while it was inline. What is left below is DOM
 * and the document's own words. See that module's head for the five bugs that
 * shipped behind a string grep.
 *
 * ## Three readings the arrangement is meant to make impossible
 *
 *  - **"16,747/16,752" as progress.** That number counts legs that RETURNED,
 *    including every one that came back unreachable or capped. The stacked bar
 *    is what actually became of them, and it is drawn from members that sum to
 *    the total by construction — a stack cannot be drawn from counts that do
 *    not.
 *  - **"discovered" as "dialled".** Most of the gap between a fan-out's two big
 *    numbers is duplicate urls rather than lost relays, so the url partition is
 *    its own bar above the disposition rather than a clause beside it.
 *  - **A stopped router as a quiet one.** `staleForSec` is a heartbeat, and the
 *    `live` chip is the first mark on the card — a phase frozen mid-`fetching`
 *    is exactly what a dead process leaves behind.
 */

/**
 * The glossary the document ships, for the current card's `title` attributes.
 *
 * Set by [syncCard] before anything below draws. The words are the ROUTER's —
 * `SyncVocabulary` publishes them and `SyncVocabularyTest` pins the two
 * directions, no published count without a term and no term without a count —
 * so a mark that explains itself here cannot drift from the member it explains.
 */
let TERMS = {};

/** What the document says a member means, or nothing at all. */
function term(key) {
  return TERMS[key] || "";
}

/** One labelled pill. `tone` is `live`, `busy`, `warn`, or nothing. */
function chip(text, tone, title) {
  const c = el("span", tone ? `chip ${tone}` : "chip", text);
  if (title) c.title = title;
  return c;
}

/** A frame timestamp as a plain day, which is the only precision this card reads at. */
const dayOf = (t) => new Date(t * 1000).toISOString().slice(0, 10);

/**
 * A LIVE cursor, which is the one place a day is not enough precision.
 *
 * `pagingUntil` now moves with every event a leg receives, and a walk that
 * opened at `now` spends its first stretch inside TODAY — where a day-granular
 * label cannot move however fast the walk does, which is the exact reading the
 * per-event cursor exists to give. So the minute is drawn while the cursor is
 * still within [FINE_CURSOR_SEC] of now, and the plain day after that, where the
 * minute would be false precision on a walk measured in years.
 */
const FINE_CURSOR_SEC = 2 * 24 * 60 * 60;
const cursorOf = (t, nowSec) =>
  nowSec != null && nowSec - t < FINE_CURSOR_SEC
    ? new Date(t * 1000).toISOString().slice(0, 16).replace("T", " ")
    : dayOf(t);

/**
 * IS IT WORKING — one line, and the first thing on the card.
 *
 * Alive-or-not, how long since it said so, the throughput, and the constraint
 * verdict when there is one. The verdict is the only part that names a fault,
 * which is why it is the only part drawn as a chip.
 */
function statusRow(progress) {
  const live = isLive(progress);
  const row = el("div", "sy-status");
  row.appendChild(el("i", live ? "sy-dot" : "sy-dot bad"));
  row.append(live ? "running" : "not running");
  // Spelled with their own spaces: consecutive text nodes collapse into ONE
  // anonymous flex item, so the row's `gap` never lands between them.
  if (progress.staleForSec != null) {
    row.append(live ? ` · heard ${fmtDur(progress.staleForSec)} ago` : ` · silent ${fmtDur(progress.staleForSec)}`);
  }
  const health = progress.health || {};
  if (health.eventsPerSec != null) row.append(` · ${fmt(health.eventsPerSec)} events/s into the store`);
  // The four verdicts are different faults with different fixes, and only the
  // ingest one is a fault at all — see BOTTLENECK.
  const constraint = constraintOf(health, live);
  if (constraint) row.appendChild(chip(constraint.text, constraint.tone, constraint.why));
  // A count, not a list: the document publishes how many, and one is already
  // the whole message.
  if (progress.fatals) row.appendChild(chip(`${fmt(progress.fatals)} fatal error(s)`, "warn", term("fatals")));
  return row;
}

/**
 * EVERY RELAY THIS STREAM IS HOLDING RIGHT NOW, and WHAT EACH ONE IS DOING.
 *
 * The list was five rows behind a `+507 more`, which is the shape that cannot
 * answer the question it exists for: the leg worth finding is by construction
 * not in the healthy head of the list. It is the whole set now — the router
 * caps its own rows at the widest admission gate and still discloses anything
 * past it.
 *
 * `doing` is the column the clocks could never supply. `held 2h 15m, 3 events`
 * is four different faults depending on the stage, and two of them — quiet
 * because negentropy is computing a difference, quiet because a paged walk has
 * stopped delivering — were indistinguishable from every number this row
 * carries. See the `doing` entry in the document's own glossary.
 */
function legsPanel(s) {
  const { rows, more } = legsOf(s.inFlight);
  if (!rows.length) return null;
  const box = el("div");
  // WHERE THE LEGS ARE, before the list itself. On a wide fan-out the shape is
  // the finding — "412 in the guards, 100 paging" is a healthy rotation, and
  // the same 512 all waiting for a slot is a saturated pool.
  const stages = new Map();
  for (const r of rows) stages.set(r.doing || "stage not published", (stages.get(r.doing || "stage not published") || 0) + 1);
  const summary =
    [...stages.entries()].sort((a, b) => b[1] - a[1]).map(([what, n]) => `${fmt(n)} ${what}`).join(" · ");
  box.appendChild(el("div", "sy-sub",
    `${fmt(rows.length)} leg(s) in flight — ${summary}${more ? ` · ${fmt(more)} more the router did not name` : ""}`));

  const scroll = el("div", "sy-legs-box");
  const table = el("table", "sy-legs");
  const head = el("tr");
  for (const [label, key, right] of [["relay", null, false], ["doing", "doing", false],
                                     ["held", "heldForSec", true], ["events", "events", true],
                                     ["quiet", "quietForSec", true]]) {
    const th = el("th", null, label);
    if (key) th.title = term(key);
    if (right) th.style.textAlign = "right";
    head.appendChild(th);
  }
  table.appendChild(head);
  for (const r of rows) {
    // Quiet past the threshold is the one row shape worth colouring — see
    // STUCK_LEG_SEC for why the floor is ten minutes and not less.
    const tr = el("tr", r.quietForSec >= STUCK_LEG_SEC ? "hot" : null);
    const url = el("td", "u");
    // The url in its own LTR isolate inside the rtl cell: the cell being rtl is
    // what puts the ellipsis on the LEFT, where a path-suffixed alias differs,
    // and the isolate is what stops that direction rewriting the address.
    const inner = el("span", null, r.short);
    inner.dir = "ltr";
    url.appendChild(inner);
    url.title = r.relay;
    tr.appendChild(url);
    // A leg with no slot says so here rather than leaving the column blank: the
    // stage IS the answer for most of a fan-out's workers. A walking leg adds
    // its cursor in the same cell — a sixth column would be empty on every row
    // that is not paging.
    const stage = el("td", null, r.doing || (r.slotless ? "not on a transfer slot" : "—"));
    if (r.pagingUntil != null) {
      // The reader's own clock, and it only decides the LABEL's precision — a
      // skewed one draws a coarser or finer cursor, never a wrong one.
      const at = el("span", "sy-at", ` back to ${cursorOf(r.pagingUntil, Date.now() / 1000)}`);
      at.title = term("pagingUntil");
      stage.appendChild(at);
    }
    tr.appendChild(stage);
    tr.appendChild(el("td", "n", fmtDur(r.heldForSec)));
    tr.appendChild(el("td", "n", fmt(r.events)));
    tr.appendChild(el("td", "n", fmtDur(r.quietForSec)));
    table.appendChild(tr);
  }
  scroll.appendChild(table);
  box.appendChild(scroll);
  return box;
}

/**
 * HOW FAR ONE STREAM HAS GOT, in four marks: what it is doing, how much of the
 * pass is behind it, when it expects to finish, and how far back it has reached.
 *
 * `reached` earns its place because `fraction` cannot show a deep walk moving —
 * days of progress on an unbounded walk round to zero — while the date moves
 * every page. It is the only live evidence a slow stream is a working one.
 */
function streamBlock(s) {
  const box = el("div", "sy-stream");
  const top = el("div", "sy-top");
  top.appendChild(el("span", "sy-name", s.name));
  const meta = el("span", "sy-meta",
    `${s.phase || "idle"}${s.phaseForSec != null ? ` for ${fmtDur(s.phaseForSec)}` : ""}`);
  // THE PHASE WORD'S OWN DEFINITION, where the document has one. `rotating` and
  // `holding` are the two that read as a stall and are not, and both had a
  // glossary entry with nowhere to hang: the word was drawn as bare text, so
  // "rotating for 58m" was a sentence a reader could only guess at.
  const phaseWhy = term(s.phase);
  if (phaseWhy) meta.title = phaseWhy;
  top.appendChild(meta);
  box.appendChild(top);
  // A ROTATING STREAM'S WHOLE STATE. It has no pass, no fraction and no cycle,
  // so every mark below is absent for it and the row was the phase word alone.
  const rot = rotationOf(s);
  if (rot) {
    const line = el("div", "sy-sub");
    if (rot.waiting) {
      // Drawn LOUD, because it is the one rotating state that is not the
      // stream working: nothing is certified for it yet, and the fitness row
      // in the section below is where the wait is.
      const none = el("s", null, "no certified relay yet — waiting on the fitness pass to sign the first `syncable`");
      none.title = term("roster");
      line.appendChild(none);
    } else {
      const riding = el("span", null, `riding ${fmt(rot.roster)} certified relay(s)`);
      riding.title = term("roster");
      line.appendChild(riding);
      if (rot.tails != null) {
        const tails = el("span", null, ` · ${fmt(rot.tails)} holding a live tail`);
        tails.title = term("tails");
        line.appendChild(tails);
      }
    }
    box.appendChild(line);
  }
  if (s.fraction != null) {
    const track = el("div", "sy-track");
    const fill = el("i");
    fill.style.width = Math.max(0, Math.min(100, s.fraction * 100)) + "%";
    track.appendChild(fill);
    box.appendChild(track);
  }
  const now = [];
  if (s.fraction != null) now.push(`${Math.round(s.fraction * 100)}% of this pass handed out`);
  if (s.etaSec != null) now.push(`~${fmtDur(s.etaSec)} left`);
  if (s.reached != null) now.push(`walked back to ${dayOf(s.reached)}`);
  if (now.length) box.appendChild(el("div", "sy-sub", now.join(" · ")));
  // WHAT THE PASS ACTUALLY GOT. Grouped into the three outcomes a reader acts
  // on — it gave us something, it had nothing to give, it could not be reached
  // — rather than the eight the tally distinguishes. The rest is forensics and
  // lives in the document.
  const cycle = s.cycle || {};
  const urls = cycle.urls || {}, taken = cycle.taken || {};
  const got = [];
  // Zero is not a finding here. "0 already in sync" beside a stream that has
  // dialled five relays is the same filler the old card was full of.
  if (urls.taken != null) got.push(`${fmt(urls.taken)} relay(s)`);
  if (taken.delivered) got.push(`${fmt(taken.delivered)} sent events`);
  if (taken.nothingNew) got.push(`${fmt(taken.nothingNew)} already in sync`);
  const dead = (taken.knownDead || 0) + (taken.noRoute || 0) + (taken.unreachable || 0);
  if (dead) got.push(`${fmt(dead)} unreachable`);
  if (taken.busy) got.push(`${fmt(taken.busy)} still running from the last pass`);
  if (taken.pending) got.push(`${fmt(taken.pending)} not reached yet`);
  if (got.length) box.appendChild(el("div", "sy-sub", got.join(" · ")));
  // THE FAULTS, each named rather than summed into the unreachable count,
  // because they have different fixes and only one of them is about the relay.
  // `transferFailed` is a handshake that succeeded and a transfer that broke —
  // it says nothing about availability; `hostStruckOut` is our own back-off;
  // `torUnavailable` is our own transport being down. Drawn only when non-zero.
  const faults = [];
  if (taken.transferFailed) faults.push(`${fmt(taken.transferFailed)} answered then broke mid-transfer`);
  if (taken.hostStruckOut) faults.push(`${fmt(taken.hostStruckOut)} skipped — host already struck out`);
  if (taken.torUnavailable) faults.push(`${fmt(taken.torUnavailable)} skipped — our tor proxy is down`);
  if (faults.length) box.appendChild(el("div", "sy-sub", faults.join(" · ")));
  // UNDER the pass counters, because "what is it doing right now" is read after
  // "is it getting anywhere" and before anything else on this card.
  const legs = legsPanel(s);
  if (legs) box.appendChild(legs);
  return box;
}

/**
 * THE PASSES THAT ARE NOT STREAMS — the fold, the stability gate, ingest,
 * reachability, the healer.
 *
 * One line each, and exactly one number: the one that says whether it is
 * getting anywhere. They are here rather than dropped because a stalled fold is
 * not a side quest — an unfolded list downloads the same relay once per url,
 * which is a sync fault that shows up nowhere else on this card.
 *
 * The probe passes' number is `probeProgress`, in `/web/shared/sync.js` — it
 * sums across streams, draws the RISING half of the pair, and withholds the
 * clock while a pass is dialling. All three are decisions that can be wrong
 * silently, which is why none of them is made here.
 */
const BACKGROUND = [
  ["aliasFold", "alias fold", "Finds the urls that are one relay wearing several addresses, so the fan-out stops dialling forty urls of one server. Runs on the alias monitor's own clock, not a stream's."],
  ["consistency", "stability gate", "Refuses a url that answers one filter two different ways. Such a relay cannot hold a cursor still, so every cycle re-serves what the last one already took."],
  ["fitness", "fitness", "The monitor's verdict funnel: one measured certificate per relay, signed onto its NIP-66 record. `syncable` is the only admitting value, and it is the whole relay list of every stream that selects on it."],
  ["visits", "rotating pool", "The visit-mode streams' engine: socket-owning workers over every certified relay — catch-up pages, the history audit where due, then a live tail on the open socket. A slot here IS a socket."],
  ["ingest", "ingest", "The queue every downloaded event passes through on its way to the store. Full means downloads are backpressured behind it."],
  ["reachability", "reachability", "The NIP-66 monitor: which urls have been observed at all, and which carry a current unreachability record that holds them out of every fan-out."],
  ["heal", "healer", "Events this mirror holds that a relay which should have them does not, pushed back to it."],
  ["upstreamPush", "upstream push", "Events published to this relay and forwarded on to the upstreams configured to receive them."],
];

function backgroundPanel(progress) {
  const rows = (progress && progress.processors) || [];
  if (!rows.length) return null;
  const box = el("div", "sy-bg");
  // THE CORPUS FIRST, above every pass's line.
  //
  // It was drawn under the row that publishes it, which put the widest thing on
  // the card — what became of every url this router knows of — below two lines
  // of clock. Every pass under it works on that same corpus, so it is context
  // for all of them rather than a detail of the one that happens to measure it,
  // and a reader arriving at this card is asking "what is out there" before
  // "when does the next pass run".
  //
  // It is still ONE pass's numbers, which is why it is captioned with that
  // pass's name: `folded onto another url` is the STABILITY GATE's reading of
  // the fold's verdicts, taken when the gate last ran, and unlabelled at the top
  // of a section it would read as the card's own arithmetic.
  for (const p of rows) {
    const funnel = funnelPanel(p);
    if (!funnel) continue;
    const known = BACKGROUND.find((row) => row[0] === p.name);
    const cap = el("div", "sy-tr-cap", `every relay url this router knows of, as the ${known ? known[1] : p.name} last measured it`);
    if (known) cap.title = known[2];
    box.appendChild(cap);
    box.appendChild(funnel);
    break;
  }
  for (const p of rows) {
    const known = BACKGROUND.find((row) => row[0] === p.name);
    const name = el("b", null, known ? known[1] : p.name);
    if (known) name.title = known[2];
    box.appendChild(name);
    box.appendChild(phaseCell(p));
    box.appendChild(processorFact(p));
  }
  return box;
}

/**
 * THE CLOCK CELL: what the processor is doing, and either where the pass in
 * flight has got to or when the next one is due.
 *
 * The two are never both there — the monitor unsets its countdown while a pass
 * runs — and that is exactly why this cell used to go blank on the passes worth
 * watching: a stability pass runs for hours, and for all of them the line read
 * `measuring` with the one number on it gone. `measuringOf` is the decision, in
 * `/web/shared/sync.js`; both branches are appended the same way so a router
 * publishing neither still gets its phase word.
 */
function phaseCell(p) {
  const cell = el("em", null, p.phase || "unknown");
  const run = measuringOf(p);
  if (run) {
    // The position, then the estimate — and the estimate only when the router
    // sent one. It is withheld until a unit has landed and once the last one
    // has, and inventing "~0s left" from its absence is the exact reading the
    // paging ETA was fixed for.
    const done = el("span", null,
      ` · ${fmt(run.attempted)} of ${fmt(run.toProbe)} ${run.unit}(s) this pass` +
      (run.etaSec != null ? `, ~${fmtDur(run.etaSec)} left` : ""));
    done.title = term("measuring");
    cell.appendChild(done);
  } else if (p.nextInSec) {
    const next = el("span", null, ` · next in ${fmtDur(p.nextInSec)}`);
    next.title = term("nextInSec");
    cell.appendChild(next);
  }
  return cell;
}

/**
 * THE CANDIDATE SET, DIVIDED — every url the streams named, once, into what
 * became of it and then into why.
 *
 * Drawn under the stability gate's line because that line is a ratio and a
 * ratio is exactly what cannot be acted on: `595 of 8,172 checked` is the same
 * number whether the other 7,577 are unreachable, auth-walled, thin or waiting
 * on a pass that never ran, and those want four different responses. Every
 * decision behind it — what the width is, where a slice sits, what to do when
 * the arithmetic does not close — is `funnelOf` in `/web/shared/sync.js`, for
 * the reason that module's head gives.
 *
 * The KEYS carry the numbers, and that is not redundancy with the bars: the
 * slice that matters most here is `inconsistent`, which on a live corpus is
 * twelve urls out of seventeen thousand and cannot be drawn at a width anyone
 * can see. The bar shows the shape, the keys show the values, and neither is
 * asked to do the other's job.
 */
function funnelPanel(p) {
  const f = funnelOf(p);
  if (!f) return null;
  const box = el("div", "sy-funnel");
  for (const r of f.rows) {
    const row = el("div", "sy-tr");

    // The guides and the label in one cell, so indentation is the label's own
    // left edge rather than a column that the longest name at any depth would
    // have to be measured against.
    const name = el("div", "sy-tr-name");
    if (r.prefix) name.appendChild(el("i", "sy-tr-guide", r.prefix));
    name.appendChild(el("b", r.tone ? `sy-tr-dot ${r.tone}` : "sy-tr-dot"));
    name.appendChild(el("span", null, r.label));
    // The document's own words where the row is one of ours; a router's
    // free-text reason and a hostname are their own explanation.
    const why = term(r.key);
    if (why) name.title = why;
    // What a reason's urls resolve to as SERVERS, and how much of it the widest
    // one is. Beside the label rather than as child rows: they are a different
    // unit, a unit change inside a tree of url counts reads as a subtotal, and
    // one row per host would be one row per server on a corpus of thousands.
    // These two numbers are what that list was for — spread thin, or a handful
    // of servers — and the names are on the row's title.
    if (r.hosts) {
      // ` — 501 host(s)`, not ` on 501 host(s)`: the label is the ROUTER's own
      // sentence and two of the gate's seven end in a preposition, so the card
      // was rendering `too few events to judge on on 501 host(s)`. A dash joins
      // any of them, and the reasons are free text off the wire — a separator
      // that only works for the words we happen to ship today is not one.
      const spread = r.largest ? ` — ${fmt(r.hosts)} host(s), largest ${fmt(r.largest)}` : ` — ${fmt(r.hosts)} host(s)`;
      name.appendChild(el("em", "sy-tr-hosts", spread));
    }
    row.appendChild(name);

    row.appendChild(el("span", "sy-tr-n", fmt(r.value)));

    // EVERY BAR AGAINST THE ROOT, never against the parent. Against its parent
    // a host with four urls under a reason with five would draw at 80% of the
    // width the whole corpus gets, which is the reading the tree's indentation
    // already carries and the one proportion must not contradict.
    const track = el("span", "sy-tr-track");
    const fill = el("i", r.tone || null);
    fill.style.width = `${Math.min(100, r.share * 100)}%`;
    track.appendChild(fill);
    row.appendChild(track);
    row.title = `${fmt(r.value)} url(s) — ${(r.share * 100).toFixed(r.share < 0.01 ? 2 : 1)}% of ${fmt(f.total)}` +
      (r.examples && r.examples.length ? ` (e.g. ${r.examples.join(", ")})` : "");
    box.appendChild(row);
  }
  if (f.omitted) {
    box.appendChild(el("div", "sy-tr-note", `${fmt(f.omitted)} more reason(s) not drawn — see the JSON`));
  }
  // The relay's own check on the two identities, drawn LOUD and only when it
  // fails. The tree's `not accounted for` row covers a parent whose children
  // fall short; this covers the other direction, where nothing looks wrong.
  if (f.accountedFor === false) {
    const bad = el("div", "sy-tr-note warn", "these numbers do not add up — see `accountedFor` in the JSON");
    bad.title = term("accountedFor");
    box.appendChild(bad);
  }
  return box;
}

/**
 * What each probe pass is checking FOR. Both publish the same `streams` shape,
 * so one generic sentence made the stability gate report the fold's question.
 *
 * `__proto__: null`, because the key is a name off the wire: a router
 * publishing `constructor` would otherwise draw a function into the cell.
 */
const PROBE_FOR = {
  __proto__: null,
  aliasFold: "checked for aliases",
  consistency: "checked for consistency",
};

/**
 * WHAT ONE BACKGROUND PASS HAS TO SHOW FOR ITSELF.
 *
 * One line, and only counters that mean something on their own. A loss counter
 * is drawn LOUD and only when non-zero: at zero it belongs in the JSON, above
 * zero it belongs in front of an operator.
 */
function processorFact(p) {
  const cell = el("span");
  /** Append a fact, hanging the document's own words on it where it has some. */
  const add = (text, key, loud) => {
    const part = el(loud ? "s" : "span", null, cell.children.length ? ` · ${text}` : text);
    // Guarded: `term` answers "" for a key this document does not carry, and an
    // EMPTY title still sets the attribute — which paints the help cursor over
    // a tooltip the browser then declines to show.
    const why = key && term(key);
    if (why) part.title = why;
    cell.appendChild(part);
  };
  if (p.capacity) {
    const full = (p.queued || 0) >= p.capacity;
    add(`queue ${fmt(p.queued || 0)} of ${fmt(p.capacity)}${full ? " — FULL, downloads are backpressured behind it" : ""}`,
        "queued", full);
    if (p.accepted != null) add(`${short(p.accepted)} stored`, "accepted");
    // Mostly the same event offered once per relay holding it, which is why it
    // is drawn beside `accepted` and never as a failure on its own.
    if (p.rejected != null) add(`${short(p.rejected)} refused, mostly duplicates`, "rejected");
    if (p.lostToStore) add(`${fmt(p.lostToStore)} LOST TO THE STORE`, "lostToStore", true);
    return cell;
  }
  if (p.syncable != null) {
    // The verdict funnel, one line: the certificate count first — it is the
    // number every visit-mode stream's whole relay list equals — then the
    // refusals that are ALIVE, which is the argument for the word `syncable`
    // over `live`, then the dead. The glossary hangs per member.
    add(`${fmt(p.syncable)} certified syncable`, "syncable");
    const alive = (p.silent || 0) + (p.alias || 0) + (p.inconsistent || 0) +
                  (p.unpageable || 0) + (p["auth-refused"] || 0) + (p.restricted || 0);
    if (alive) add(`${fmt(alive)} refused while alive`, "silent");
    if (p.dead) add(`${fmt(p.dead)} dead`, "dead");
    return cell;
  }
  if (p.roster != null) {
    // The pool's one line, and the arithmetic it exists to make visible:
    // visiting + tails IS the socket count, because a slot here is a socket.
    add(`${fmt(p.roster)} on the roster`, "roster");
    if (p.awaitingVisit) add(`${fmt(p.awaitingVisit)} awaiting a visit`, "awaitingVisit");
    add(`${fmt(p.visiting || 0)} visiting`, "visiting");
    add(`${fmt(p.tails || 0)} live tail(s)`, "tails");
    if (p.visitsRun) add(`${fmt(p.visitsRun)} visit(s) run`, "visitsRun");
    if (p.auditing) add(`${fmt(p.auditing)} auditing now`, "auditing");
    if (p.auditsRun) add(`${fmt(p.auditsRun)} history audit(s)`, "auditsRun");
    if (p.retracted) add(`${fmt(p.retracted)} RETRACTED upstream`, "retracted", true);
    if (p.abortedVisits) add(`${fmt(p.abortedVisits)} aborted`, "abortedVisits");
    if (p.evictedTails) add(`${fmt(p.evictedTails)} tail(s) rotated out`, "evictedTails");
    if (p.poolReceived) add(`${short(p.poolReceived)} events in`, "poolReceived");
    return cell;
  }
  const probe = probeProgress(p);
  if (probe) {
    // The tooltip hangs on `unmeasured`: the member this is derived from, and
    // the one the glossary can be checked against.
    // ONE FACT: how far it got, and how long that took. The verdicts behind it
    // — how many relays are consistent, and the count this router refuses —
    // were briefly on this line too, because nothing anywhere published them;
    // they are now the tree at the head of the section, with the rest of the
    // partition around them. A line that repeats what a chart six rows above it
    // already says is a line a reader has to reconcile.
    add(`${fmt(probe.checked)} of ${fmt(probe.candidates)} relay(s) ${PROBE_FOR[p.name] || "checked"}` +
        `${probe.tookSec != null ? ` in ${fmtDur(probe.tookSec)}` : ""}`, "unmeasured");
    return cell;
  }
  if (p.knownDead != null) {
    if (p.observed != null) add(`${fmt(p.observed)} url(s) observed`, "observed");
    add(`${fmt(p.knownDead)} held out of every fan-out as unreachable`, "knownDead");
    return cell;
  }
  if (p.pushed != null) {
    add(`${fmt(p.pushed)} event(s) pushed back to relays missing them`, "pushed");
    // The sweep declining to backpressure itself, which is a choice and not a
    // fault — so it is drawn plainly however large it gets.
    if (p.dropped) add(`${short(p.dropped)} dropped rather than backpressure the sweep`, "dropped");
    return cell;
  }
  return cell;
}

/**
 * HOW DEEP THE COVERAGE IS — every walked band at once, as how many relays
 * reach each point in the frame.
 *
 * This replaces the per-relay table. That table was 10,462 rows behind a filter
 * box, and answering "is the mirror deep or only recent" from it meant reading
 * every row. The distribution answers it in one glance and the per-relay spans
 * are still in the document for anything that needs them.
 */
const DEPTH_BUCKETS = 72;

function coveragePanel(d) {
  const streams = d.streams || [];
  if (!streams.length || d.from == null || d.to == null) return null;
  const box = el("div");
  const settled = streams.reduce((a, s) => a + (s.reconciled || 0), 0);
  const open = streams.reduce((a, s) => a + (s.paged || 0), 0);
  const facts = [];
  if (d.relays != null) facts.push(`${fmt(d.relays)} relay(s) on ${fmt(d.hosts || 0)} host(s) have coverage recorded`);
  // A DIFFERENT DENOMINATOR, said out loud. `reconciled` and `paged` are per
  // stream-and-relay, so one relay two streams both walked counts twice and
  // these do NOT add up to the relay count above them. Naming them "walk(s)"
  // is what stops the two numbers reading as parts of one whole.
  if (settled || open) {
    facts.push(`${fmt(settled + open)} walk(s) — ${fmt(settled)} settled, ${fmt(open)} not proven exhaustive`);
  }
  box.appendChild(el("div", "sy-sub", facts.join(" · ")));

  const span = Math.max(1, d.to - d.from);
  const depth = new Array(DEPTH_BUCKETS).fill(0);
  let rows = 0;
  for (const s of streams) {
    for (const r of s.rows || []) {
      if (r.min == null || r.max == null) continue;
      rows++;
      const a = Math.max(0, Math.min(DEPTH_BUCKETS - 1, Math.floor(((r.min - d.from) / span) * DEPTH_BUCKETS)));
      const b = Math.max(0, Math.min(DEPTH_BUCKETS - 1, Math.floor(((r.max - d.from) / span) * DEPTH_BUCKETS)));
      for (let i = a; i <= b; i++) depth[i]++;
    }
  }
  if (!rows) return box;
  const peak = Math.max(...depth, 1);
  const strip = el("div", "sy-depth");
  depth.forEach((n, i) => {
    const bar = el("i");
    // A bucket nothing reaches keeps its 1px floor from the stylesheet, so the
    // gap reads as a gap rather than as the strip ending early.
    bar.style.height = Math.round((n / peak) * 100) + "%";
    const at = d.from + (i / DEPTH_BUCKETS) * span;
    bar.title = `${dayOf(at)} — ${fmt(n)} of ${fmt(rows)} walked band(s) reach here`;
    strip.appendChild(bar);
  });
  box.appendChild(strip);
  const axis = el("div", "sy-axis");
  axis.appendChild(el("span", null, dayOf(d.from)));
  axis.appendChild(el("span", null, `peak ${fmt(peak)} of ${fmt(rows)} band(s)`));
  axis.appendChild(el("span", null, "now"));
  box.appendChild(axis);
  return box;
}


/** `4m` / `2h 10m` — a duration in seconds, for the phase clock. */
function fmtDur(sec) {
  if (sec < 90) return `${sec}s`;
  if (sec < 5400) return `${Math.round(sec / 60)}m`;
  const h = Math.floor(sec / 3600);
  return `${h}h ${Math.round((sec - h * 3600) / 60)}m`;
}

/**
 * IS THE SYNC WORKING, AND HOW FAR HAS IT GOT — and nothing else.
 *
 * ## What this card stopped saying, and why
 *
 * It used to carry the worker/transfer pair, a per-leg table, an eight-way
 * outcome partition, a legend, a filter box and one row per relay — 10,462 of
 * them on this deployment. Measured against the two questions above, almost
 * none of it answered either.
 *
 * The test that removed them: A MARK THAT READS THE SAME ON A HEALTHY SYSTEM
 * EVERY TIME IS NOT A MARK. `100 of 512 workers downloading` was the clearest
 * case — both numbers are config ceilings (`concurrency` and `admissionWidth`),
 * so every busy stream on every deployment renders exactly that, forever. It
 * was the implementer's argument for splitting the two gates, printed where an
 * operator has to scroll past it. That argument belongs in the KDoc, where it
 * already is.
 *
 * The per-relay table went for the opposite reason: it varied so much that
 * reading it was the work. "Is coverage deep or only recent" needed all 10,462
 * rows; it is now one distribution.
 *
 * ## What is left
 *
 * One status line (working?), one block per stream (progress), one line per
 * background pass (the faults that show up nowhere else — a stalled fold makes
 * the fan-out download one relay once per url), and one depth strip (how far
 * back the coverage actually goes).
 *
 * Nothing was removed from `/stats.json`. Every number this card stopped
 * drawing is still published; what changed is which of them a person is made
 * to read.
 */
function syncCard(section) {
  const d = (section && section.data) || {};
  const streams = d.streams || [];
  const progress = d.progress;
  const card = el("div", "card");
  cardHead(card, "Sync coverage", streams.length || progress ? null : "No sync state in this document.", section);
  // The glossary this card's marks explain themselves with, before anything
  // below draws. It is the document's own, so a chip cannot describe a member
  // in words the router would not use — see `term` and `SyncVocabularyTest`.
  TERMS = d.terms || {};
  if (progress) card.appendChild(statusRow(progress));

  const lanes = (progress && progress.streams) || [];
  if (lanes.length) {
    card.appendChild(el("p", "sy-h", "streams"));
    for (const s of lanes) card.appendChild(streamBlock(s));
  }

  const background = backgroundPanel(progress);
  if (background) {
    card.appendChild(el("p", "sy-h", "background passes"));
    card.appendChild(background);
  }

  const coverage = coveragePanel(d);
  if (coverage) {
    card.appendChild(el("p", "sy-h", "coverage so far"));
    card.appendChild(coverage);
    // THE FRAME IS NOT A TARGET, and this is the one caveat worth the words:
    // these filters carry no lower bound, so "full" is not a defined state and
    // a deep strip means "as far back as anything here reaches", not "done".
    card.appendChild(el("p", "card-sub",
      `Frame starts ${dayOf(d.from)} — the oldest span anything here reaches. Not a target: these filters carry ` +
      `no lower bound, so depth means "as deep as anything reaches", not "finished".`));
  }
  return card;
}


/**
 * WHAT THE MONITOR HAS DECIDED ABOUT EACH RELAY URL, asked over the wire.
 *
 * Every other panel here reads `/stats.json`, which is a rollup: the fold's
 * summary says 373 urls collapsed onto 909 relays and stops there. That number
 * cannot answer the question an operator actually has when a duplicate is still
 * being dialled — *what does this store say about THIS url, and when was it
 * measured?* The verdict is a signed kind-30166 record and nothing on this page
 * read one.
 *
 * A plain NIP-01 REQ over this relay's own websocket, so the panel is a
 * protocol check as much as a view: a verdict that cannot be read here cannot
 * be read by any client either. The note at the top of this file records that
 * the kind histogram lost exactly this property when it stopped asking NIP-45
 * COUNTs, and judged the check better as a test than a page. That was right
 * about counts, which have a rollup to fall back on. It is wrong about
 * verdicts, which have no other reader at all.
 *
 * NOT DRAWN UNTIL ASKED, and that is why it takes a button. This page polls
 * itself every minute; opening a websocket and paging thousands of records on
 * that cadence would make a debugging aid into a load source. `reads: []` in
 * PANELS keeps the poller from rebuilding it, so what the reader loaded and
 * typed survives every refresh underneath it.
 */
function verdictsCard() {
  const card = el("div", "card");
  cardHead(card, "Monitor verdicts (NIP-66)", null, null);
  card.appendChild(el("p", "card-sub",
    `Reads kind ${MONITOR_KIND} out of this relay over its own websocket — the same ask any client makes. ` +
    "Grouped by host, because a duplicate is never a property of one url: it is a property of a url next to another one."));

  // ONE toolbar, not `.grp-head` — which this borrowed and should not have.
  // That class is a STICKY heading for the inside of a scroll box: it carries
  // `position: sticky`, a z-index and its own background, none of which mean
  // anything at the top of a card, and the background made the control row read
  // as a header band.
  const bar = el("div", "vd-bar");
  const load = el("button", "btn", "Read verdicts from this relay");
  const filter = el("input");
  filter.type = "search";
  // Named like the others so render()'s restore loop cannot carry one search
  // box's text into another — there are three on this page now.
  filter.name = "verdicts";
  filter.placeholder = "filter by host or url";
  filter.setAttribute("aria-label", "filter verdicts by host or url");
  filter.hidden = true;
  const status = el("span", "status", "");
  bar.append(load, filter, status);
  card.appendChild(bar);

  const sumBox = el("div");
  card.appendChild(sumBox);

  const scroll = el("div", "wrap tall");
  scroll.hidden = true;
  card.appendChild(scroll);
  const none = el("p", "cov-none");
  none.hidden = true;
  card.appendChild(none);

  let groups = [];

  const applyFilter = () => {
    const q = filter.value.trim().toLowerCase();
    let live = 0;
    for (const g of groups) {
      // A hit on the HOST keeps the whole group — that is what someone typing a
      // hostname means, and hiding the non-matching urls of the very host they
      // asked for would take away the comparison the panel exists to give.
      const wholeHost = !q || g.host.includes(q);
      let kept = 0;
      for (const r of g.rows) {
        const hit = wholeHost || r.needle.includes(q);
        r.node.hidden = !hit;
        if (hit) kept++;
      }
      // Heads and rows go together. Hiding only rows left a heading on screen
      // for every host in the store, each with nothing beneath it.
      g.box.hidden = !kept;
      if (kept) live++;
    }
    const empty = !!q && !live;
    none.hidden = !empty;
    if (empty) none.textContent = `No url in this store's verdicts contains “${filter.value.trim()}”.`;
  };
  filter.addEventListener("input", applyFilter);

  load.addEventListener("click", async () => {
    load.disabled = true;
    status.textContent = "asking…";
    try {
      const { events, complete, self, others } = await readVerdicts((n) => { status.textContent = `${fmt(n)} record(s)…`; });
      const nowSec = Math.floor(Date.now() / 1000);
      const byHost = groupByHost(events, nowSec);
      const sum = summarise(byHost, nowSec);
      groups = drawVerdicts(scroll, byHost, nowSec);
      // The numbers as NUMBERS, over the list rather than as a run-on sentence
      // beside the button. `not folded` is the one that separates two very
      // different diagnoses: a record with no verdict tag is quartz's passive
      // monitor writing reachability, so a store full of those beside zero
      // folds says the monitor is running and the FOLD is not — where no
      // records at all says neither is.
      // `replaceChildren`, not `fill`: that helper exists to carry a reader's
      // filter text and scroll position across a rebuild, and this box holds
      // neither. Using it here would imply a preservation that is not happening.
      sumBox.replaceChildren(tally([
        ["urls", sum.urls],
        ["hosts", sum.hosts],
        ["folded away", sum.folded],
        ["measured, kept", sum.cleared],
        ["not folded", sum.silent],
        ...(sum.expired ? [["verdict expired", sum.expired]] : []),
        ...(sum.unstable ? [["refused as inconsistent", sum.unstable]] : []),
      ]));
      // What the read did NOT cover comes first: every number above is over the
      // records we actually got, and one taken from a partial read means
      // something different from one taken from a whole store.
      // WHOSE RECORDS THESE ARE comes before what they say. Every number below
      // is over one monitor's observations, and a reader who assumes otherwise
      // reads the panel as a census of the store.
      const whose = self
        ? (others === null
            ? `this relay's own monitor (${self.slice(0, 8)}…)`
            : others > 0
              ? `this relay's own monitor (${self.slice(0, 8)}…) — ${fmt(others)} more 30166 record(s) here belong to other monitors and are not counted`
              : `this relay's own monitor (${self.slice(0, 8)}…), the only one with records here`)
        : "EVERY monitor in this store — this relay advertises no key of its own, so these are not necessarily its verdicts";
      status.textContent =
        (complete ? "" : `partial read — stopped at ${fmt(events.length)} record(s); the store holds more. `) +
        whose +
        (sum.inferred ? `. ${fmt(sum.inferred)} survivor(s) inferred from the folds that point at them` : "");
      status.className = complete && self ? "status" : "status vd-stale";
      filter.hidden = false;
      scroll.hidden = false;
      applyFilter();
    } catch (e) {
      // The relay's own message. A panel that speaks the protocol has to report
      // a protocol failure as one — "0 records" and "the socket closed" are not
      // the same finding, and this is the panel whose whole job is telling
      // states apart.
      status.textContent = "";
      none.hidden = false;
      none.textContent = `Could not read verdicts: ${(e && e.message) || e}`;
    } finally {
      load.disabled = false;
    }
  });
  return card;
}

/** A row of labelled numbers — the panel's own small tiles. */
function tally(pairs) {
  const box = el("div", "vd-sum");
  for (const [label, n] of pairs) {
    const cell = el("div");
    cell.appendChild(el("b", null, fmt(n)));
    cell.append(label);
    box.appendChild(cell);
  }
  return box;
}

/**
 * Page every kind-30166 record out of this relay, newest first.
 *
 * Paged on `until`, because a fan-out of five figures carries five figures of
 * records and one REQ is bounded by whatever this relay's own limit happens to
 * be — the same reason `AliasProbe` walks rather than asking once. The cursor
 * steps strictly below the oldest `created_at` seen when a page adds nothing
 * new, or a page that is entirely one timestamp cannot move it at all.
 *
 * No `authors` filter. The question is what this STORE holds, which includes
 * records signed by another monitor or by a router sharing the key — and a
 * verdict we cannot see because we guessed the wrong author reads exactly like
 * a verdict that was never written, which is the confusion this panel exists to
 * end. The author is drawn per row instead.
 */
async function readVerdicts(onProgress) {
  const relay = new Relay(location.origin.replace(/^http/, "ws"));
  // What this relay says it will serve in one ask, and WHO IT IS. Same origin,
  // so this is the relay describing itself rather than us guessing at it.
  const { maxPage, self } = await relayIdentity();
  try {
    // SCOPED TO THIS RELAY'S OWN MONITOR, and that scoping is load-bearing on a
    // real store rather than tidiness.
    //
    // A router discovers relays from other monitors' reports — the documented
    // outbox source reads `kinds: [10002, 10050, 30002, 30166]` — so a mirror
    // holds strangers' 30166s by design, and public monitors publish them by
    // the tens of thousands. Unscoped, every count on this panel would be our
    // verdicts plus an unknown quantity of somebody else's observations, which
    // is worse than no number: "1,621 folded away" would silently include
    // relays this router never probed.
    //
    // `self` is the relay's OWN key, which `RELAY_NSEC` also gives the sync
    // process precisely so its monitor records speak as the relay it feeds.
    // Absent — an anonymous relay, or one whose sync was given a different key
    // — there is nothing to scope to, and the panel says so rather than
    // guessing an author and hiding every verdict signed under another.
    const scope = self ? { authors: [self] } : {};
    const walk = await walkRecords({
      // Longer than the class's 10s default: a page of signed records off a
      // loaded relay is a bigger answer than the search box ever asks for, and
      // a timeout here is indistinguishable from an empty store to the reader.
      ask: (limit, until) =>
        relay.req({ kinds: [MONITOR_KIND], limit, ...scope, ...(until == null ? {} : { until }) }, 25000),
      pageSize: Math.min(500, maxPage),
      maxPage,
      onProgress,
    });
    // …and then count what we DIDN'T read, so the scoping never hides anything.
    // A COUNT is one round trip against an index; walking every monitor's
    // records to arrive at the same number is not worth a debugging panel's
    // bandwidth. A relay that will not answer it leaves this null, which the
    // caller renders as "unknown" rather than as zero.
    const total = self ? await relay.count({ kinds: [MONITOR_KIND] }) : walk.events.length;
    return { ...walk, self, others: typeof total === "number" ? Math.max(0, total - walk.events.length) : null };
  } finally {
    // Always, and through the socket rather than a method: [Relay] has no
    // close() — the pages that use it keep one connection for their lifetime.
    // This panel opens one per click, so a leak here is one socket per press
    // that the reader cannot see and cannot close.
    try { relay.ws && relay.ws.close(); } catch (e) {}
  }
}

/**
 * What this relay says about itself, out of its own NIP-11 document: the
 * biggest single ask it will answer, and its own key.
 *
 * `maxPage` defaults to 500, which is the conservative reading rather than a
 * guess at generosity: with no stated ceiling the walk cannot grow its page,
 * and a run of records longer than that is reported as an incomplete read
 * instead of stepped over.
 *
 * `self` is the relay's OWN key and NOT `pubkey`, which is the admin contact —
 * two different fields that a reader coming from NIP-11 will expect to be one.
 * Scoping the panel to the contact key would return nothing at all.
 */
async function relayIdentity() {
  try {
    const doc = await fetch("/", { headers: { Accept: "application/nostr+json" } }).then((r) => r.json());
    const stated = doc && doc.limitation && Number(doc.limitation.max_limit);
    return {
      maxPage: stated > 0 ? Math.min(stated, 5000) : 500,
      self: (doc && typeof doc.self === "string" && /^[0-9a-f]{64}$/i.test(doc.self) && doc.self) || null,
    };
  } catch (e) {
    return { maxPage: 500, self: null };
  }
}

/**
 * Draw the host groups into [box]; returns the filterable groups.
 *
 * A url is drawn as its PATH, not its whole url. The host is already the box's
 * heading, so repeating `wss://articles.layer3.news/` on all 23 rows spent the
 * width that tells them apart on the part they share — and these lists are
 * nothing but minted paths on one host, so the path is the entire signal.
 */
function drawVerdicts(box, groups, nowSec) {
  box.replaceChildren();
  const out = [];
  for (const group of groups) {
    const wrap = el("div", "vd-group");
    const head = el("div", "vd-ghead");
    const folded = group.folded;
    const meter = el("div", "vd-meter");
    const fill = el("i");
    fill.style.width = `${group.urls.length ? Math.round((folded / group.urls.length) * 100) : 0}%`;
    meter.appendChild(fill);
    meter.title = `${fmt(folded)} of ${fmt(group.urls.length)} url(s) fold away`;
    head.append(
      el("div", "vd-name", group.host),
      el("span", "vd-count",
        `${fmt(group.urls.length)} url(s) → ${fmt(group.survivors)} dialled` +
        (group.expired ? ` · ${fmt(group.expired)} expired` : "")),
      meter,
    );
    wrap.appendChild(head);
    const rows = [];
    for (const u of group.urls) {
      const row = el("div", "vd-row");
      const left = el("div", "vd-path");
      const right = el("div", "vd-when");
      // The path alone, with the bare url named rather than drawn as an empty
      // cell — "/" is a row that looks like a rendering failure.
      const path = u.url.replace(/^wss?:\/\/[^/]+/i, "") || "/";
      left.append(el("span", null, path === "/" ? "(no path)" : path));
      // The VERDICT's age, not the record's. Kind 30166 is addressable and
      // shared — quartz's monitor rewrites it on every connection — so
      // `created_at` tracks the last time we TALKED to the relay, not the last
      // time we MEASURED it. Reading the record's clock is the bug that made
      // half these verdicts look immortal on the Kotlin side.
      // THE TWO VERDICTS ARE DRAWN SEPARATELY, and collapsing them misread the
      // live store. A url the stability pass has measured but the fold has not
      // was drawn as "no verdict" with the STABILITY sentence under it, so a
      // host mid-measurement read as a host nothing had ever looked at — beside
      // evidence that plainly contradicted the word above it. The fold column
      // now says only what the fold decided.
      let tag;
      if (u.fold) {
        tag = el("span", u.foldCurrent ? "vd-pill fold" : "vd-pill expired", u.foldCurrent ? "fold" : "expired");
        // The survivor is at the top of this same box, so the arrow names the
        // path it points at rather than repeating the whole url.
        left.append(el("span", "vd-into", ` → ${u.fold.replace(/^wss?:\/\/[^/]+/i, "") || "/"}`));
      } else if (u.cleared) {
        // THE SAME TEST THE FOLD ROW MAKES, and it was missing here. A cleared
        // verdict the router has retired — aged out, or measured under rules it
        // no longer applies — was still drawn as "keep", i.e. measured and
        // settled, while the url was in fact back in the queue to be
        // re-measured. Half the verdicts in a store are this form, so after a
        // rules bump that is most of the page saying the opposite of the truth.
        tag = el("span", u.foldCurrent ? "vd-pill keep" : "vd-pill expired", u.foldCurrent ? "keep" : "expired");
        if (u.foldCurrent) row.classList.add("vd-keep");
      } else if (u.synthetic) {
        // Inferred from what the folds point at, not stated by the monitor —
        // and said so, because the two are different claims.
        tag = el("span", "vd-pill keep", "survivor");
        row.classList.add("vd-keep");
        left.append(el("span", "vd-into", " · no record of its own"));
      } else {
        tag = el("span", "vd-pill none", "not folded");
      }
      right.append(tag);
      if (u.fold || u.cleared) {
        // `ago` takes the INSTANT, not the elapsed time — it does the
        // subtraction itself. Handing it a duration drew every verdict as
        // "20679d ago", which is `now` minus five minutes read as an epoch.
        //
        // Drawn even when the record does not say when it was measured — `ago`
        // renders that as an em dash. Skipping the whole span instead left a
        // pre-stamp verdict with no date at all beside its pill, which reads as
        // "just measured" rather than as the undatable record it is.
        const at = u.foldMeasuredAt;
        const when = el("span", null, ` ${ago(at)}`);
        when.title = isoOf(at);
        // The verdict's own answer, computed once per row when the host was
        // grouped. Asking `isCurrent` again here would ask it a narrower
        // question — a verdict measured yesterday under SUPERSEDED RULES is
        // inside the TTL and still not acted on — and the date would then read
        // fresh beside a pill saying expired.
        if (!u.foldCurrent) when.className = "vd-stale";
        right.append(when);
      }
      if (u.stable === false) left.append(" ", el("span", "badge bad", "inconsistent"));
      row.append(left, right);
      // ONE evidence line, and NAMED — the two verdicts answer different
      // questions about the same url, and an unlabelled sentence is read as
      // belonging to whatever word is nearest. The fold's is the one that
      // explains the row, so it wins when both exist; the stability sentence is
      // still on the title of its own line.
      if (u.foldEvidence) {
        const why = el("div", "vd-why", `fold: ${u.foldEvidence}`);
        why.title = u.foldEvidence;
        row.appendChild(why);
      } else if (u.stableEvidence) {
        const s = u.stable === false ? "inconsistent" : u.stable === true ? "consistent" : "measured";
        const text = `stability (${s}, ${ago(u.stableMeasuredAt)}): ${u.stableEvidence}`;
        const why = el("div", "vd-why", text);
        why.title = text;
        row.appendChild(why);
      }
      // THE REST OF THE RECORD. Everything above is what this router decided;
      // this is what the other writers on the same address said, and on a
      // replaceable event with several writers its presence is itself the
      // finding — a row showing `same-as` and nothing else is what a clobbered
      // record looks like.
      const meta = [];
      // THE RECORD'S OWN CLOCK, which is not the verdict's and is labelled so.
      //
      // It is written every time this router CONNECTS to the relay — quartz's
      // passive monitor rewrites the same address on a 5-minute flush — so it
      // answers a different question from the age beside the pill: that one is
      // when we last MEASURED, this one is when we last TALKED. Reading the
      // second as the first is the bug that made half these verdicts immortal,
      // which is exactly why both belong on screen with their own names rather
      // than one standing in for the other.
      //
      // It also puts a date back on the rows that lost one: a verdict written
      // before the measured-at element existed shows `—` above, and this line
      // is the only remaining evidence of when the record was last touched.
      if (u.recordAt) meta.push(["record", ago(u.recordAt), isoOf(u.recordAt)]);
      if (u.network) meta.push(["", u.network]);
      for (const r of u.requirements) meta.push(["req", r]);
      if (u.rttOpen) meta.push(["open", `${u.rttOpen}ms`]);
      if (u.rttRead) meta.push(["read", `${u.rttRead}ms`]);
      if (u.rttWrite) meta.push(["write", `${u.rttWrite}ms`]);
      if (u.software) meta.push(["", u.software.replace(/^git\+https?:\/\//, "")]);
      if (u.version) meta.push(["", u.version]);
      if (u.relayType) meta.push(["type", u.relayType]);
      if (u.geohash) meta.push(["geo", u.geohash]);
      if (u.hasDoc) meta.push(["", "nip-11 doc"]);
      // Counted, never dropped: a record carrying a tag this page has not heard
      // of should look different from one carrying nothing.
      if (u.extra) meta.push(["", `+${u.extra} other tag(s)`]);
      if (meta.length) {
        const line = el("div", "vd-meta");
        for (const [k, v, title] of meta) {
          const cell = el("span", k === "req" ? "vd-req" : null);
          // An exact timestamp behind the relative one, the same way the
          // verdict's own age carries its instant on the title.
          if (title) cell.title = title;
          if (k && k !== "req") cell.append(el("span", "k", k + " "));
          cell.append(v);
          line.appendChild(cell);
        }
        row.appendChild(line);
      }
      wrap.appendChild(row);
      rows.push({ node: row, needle: (u.url + " " + (u.fold || "")).toLowerCase() });
    }
    box.appendChild(wrap);
    // The GROUP is what the filter hides, and the rows within it. Hiding only
    // rows left every host's heading on screen — a search for one host drew a
    // column of a thousand headings with nothing under them, which read as a
    // thousand matches.
    out.push({ box: wrap, host: group.host.toLowerCase(), rows });
  }
  return out;
}

function relaysCard(section) {
  const d = (section && section.data) || {};
  const top = d.top || [];
  const card = el("div", "card");
  cardHead(
    card,
    "Relay distribution",
    // The one sub that survives as more than an empty state: a capped list and
    // a complete one are different facts, and only this line tells them apart.
    top.length
      ? `${shownOf(d.shown, d.total, "relays", "most-named")}.`
      : "No relay distribution in this document.",
    section,
  );
  if (!top.length) return card;

  const max = Math.max(...top.map((r) => r.lists));
  // Bounded and scrolling, like the Kinds table: this list is capped at the
  // most-named but the cap is generous, and a card that runs for a screen and
  // a half pushes everything under it out of reach.
  const wrap = el("div", "wrap tall");
  const table = el("table");
  const thead = el("thead");
  const hr = el("tr");
  for (const [label, cls] of [["Relay", ""], ["Lists", "n"], ["", ""]]) hr.appendChild(el("th", cls, label));
  thead.appendChild(hr);
  table.appendChild(thead);
  const tbody = el("tbody");
  for (const r of top) {
    const tr = el("tr");
    tr.appendChild(el("td", "relay", r.relay));
    tr.appendChild(el("td", "n", fmt(r.lists)));
    const share = el("td", "share");
    const bar = el("i");
    bar.style.width = Math.max(2, (r.lists / max) * 100) + "%";
    share.appendChild(bar);
    tr.appendChild(share);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);
  return card;
}

function zapsCard(section) {
  const d = (section && section.data) || {};
  const card = el("div", "card");
  cardHead(card, "Zaps", null, section);

  const row = el("div", "tiles inline");
  // "Zap services", not "wallets" and emphatically not "senders". Under NIP-57
  // the receipt is signed by the LNURL service that settled the invoice, so
  // this counts the handful of services our receipts came through — never the
  // people who zapped, whose keys are in the `description` tag the rollup does
  // not walk. "Wallets" was the JSON field's name and it read as the zappers'
  // wallets, which is off by a whole party to the transaction.
  for (const [key, label] of [["receipts", "Receipts"], ["wallets", "Zap services"]]) {
    const t = el("div", "tile");
    t.appendChild(el("div", "v", d[key] == null ? "—" : fmt(d[key])));
    t.appendChild(el("div", "k", label));
    wrapTitle(t, key === "wallets" ? "Distinct authors of zap receipts — the LNURL services that settled them, not the people who zapped" : "");
    row.appendChild(t);
  }
  card.appendChild(fitTiles(row));

  const days = d.days || [];
  if (!days.length) {
    card.appendChild(el("p", "why", "No daily series in this document."));
  } else if (days.every((x) => !x.receipts)) {
    card.appendChild(el("p", "err", "No zap receipts in this window."));
  } else {
    card.appendChild(barChart(
      days.map((x) => ({ label: x.day, tick: dayTick(x.day), value: x.receipts })),
      { label: "Zap receipts per day" },
    ));
  }
  return card;
}

function wrapTitle(node, title) {
  if (title) node.title = title;
}

/**
 * Every kind in the store, largest first.
 *
 * This card replaced kind_stats.html, and completeness is why it could. That
 * page asked one NIP-45 COUNT per kind it already knew to name — the search
 * UI's card registry, plus whatever an operator typed into a box — so a kind
 * nobody had registered was invisible on the one page that would have revealed
 * it. The rollup's histogram ENUMERATES what is there instead, which is a
 * strictly better answer to "what does this relay hold" and is the reason this
 * table is not a top-N.
 *
 * What was genuinely lost with that page: it exercised NIP-45 over the relay's
 * own websocket, so a kind that came back "no COUNT" was a finding about the
 * protocol implementation rather than a blank cell. This table cannot say that
 * — it reads the engine directly, and never speaks the protocol at all.
 */
function kindsCard(kinds) {
  const card = el("div", "card");
  const d = (kinds && kinds.data) || {};
  const all = d.all || [];
  // No count in the sub: the filter row below prints "N kinds" and keeps
  // printing "n of N" once the reader types, so the total is on screen either
  // way and a header saying it too was the same fact twice.
  cardHead(card, "Kinds", all.length ? null : "No kind histogram in this document.", kinds);
  if (!all.length) return card;

  // A corpus carries thousands of distinct kinds, most of them a handful of
  // events in the tail. Filtering by number or name beats scrolling for the
  // one you came to look up, which is what the page it replaced was for.
  const controls = el("div", "bar-row");
  const filter = el("input");
  filter.type = "search";
  // Named, so render() restores what was typed into THIS box and not into the
  // one on Sync coverage — see the restore loop there.
  filter.name = "kinds";
  filter.placeholder = "filter by kind number or name";
  filter.setAttribute("aria-label", "filter kinds");
  const count = el("span", "status");
  controls.appendChild(filter);
  controls.appendChild(count);
  card.appendChild(controls);

  const top = all;
  // reduce, not Math.max(...spread): the array is every kind in the store now,
  // and a spread is an argument list — past the engine's limit it throws
  // RangeError, which load()'s catch would turn into a blank page rather than
  // one missing table.
  const max = top.reduce((m, k) => (k.events > m ? k.events : m), 1);
  const wrap = el("div", "wrap tall");
  const table = el("table");
  const thead = el("thead");
  const hr = el("tr");
  // No Pubkeys column: distinct authors per kind cost a grouping over the
  // whole corpus (every event has exactly one kind, so the inner pubkey sets
  // union to the entire store) and took the engine down. Dropped in the
  // rollup, so `k.pubkeys` is now always absent — see StatsRollup.kindsSection.
  for (const [label, cls] of [["Kind", ""], ["Name", ""], ["Events", "n"], ["", ""], ["Last event", "n"]]) {
    const th = el("th", cls, label);
    hr.appendChild(th);
  }
  thead.appendChild(hr);
  table.appendChild(thead);
  const tbody = el("tbody");
  for (const k of top) {
    const tr = el("tr");
    tr.appendChild(el("td", "kind", String(k.kind)));
    tr.appendChild(el("td", "name", kindName(k.kind, k.name)));
    tr.appendChild(el("td", "n", fmt(k.events)));
    const share = el("td", "share");
    const bar = el("i");
    bar.style.width = Math.max(2, (k.events / max) * 100) + "%";
    share.appendChild(bar);
    tr.appendChild(share);
    // An AGE, not a date. Per kind this is the useful form: "kind 1 four
    // minutes ago, kind 30023 six days ago" localises which stream stalled,
    // where a column of dates makes the reader subtract thirty times. The
    // rollup bounds lastSeen to the present, so this can never read "in".
    const newest = el("td", "n", ago(k.lastSeen));
    if (k.lastSeen != null) newest.title = isoOf(k.lastSeen);
    tr.appendChild(newest);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);

  const rows = [...tbody.children];
  const applyFilter = () => {
    const q = filter.value.trim().toLowerCase();
    let shown = 0;
    rows.forEach((tr, i) => {
      const k = top[i];
      // Filtered on the name that is ON SCREEN. Searching kindLabel() while
      // rendering the document's name means typing what you can see hides the
      // row you are looking at, on the 180 kinds where the two disagree.
