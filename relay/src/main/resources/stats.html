<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="What this relay's store holds: events, publishing pubkeys, kinds, and activity over time." />
<title>Relay stats</title>
<!--
  The corpus this relay holds, charted from GET /stats.json.

  THE JSON IS THE ARTIFACT; this page is one reader of it. That is deliberate
  and it is the whole reason the endpoint exists separately: the reference
  dashboard this page was modelled on (stats.andotherstuff.org) was completely
  reconstructible in minutes precisely because its /api/dashboard was public and
  unauthenticated, and ours being public means anyone can chart our coverage,
  diff it against a network-wide one, or build a better page than this. A reader
  who wants the numbers should never have to scrape markup for them.

  So, unlike observer_stats.html, this page carries NO relay client. That page
  speaks the protocol itself because it must work when the app is broken, and
  because asking the way a client would means it also TESTS what it asks.
  Neither applies here: no aggregation on this page is a protocol feature, and
  thirty days of distinct-pubkey counts is not something to ask over a websocket
  — it is one grouping query per series against the engine, run on a timer
  behind the server. What this page must survive is a stale or missing rollup,
  and it says so rather than drawing zeros.

  EVERY NUMBER DESCRIBES THIS RELAY'S STORE, not the Nostr network. The two look
  identical charted, and the confusion runs one way: a reader comparing our
  event count against a network-wide dashboard's and finding it smaller reads it
  as a broken relay rather than as a mirror's coverage. Hence the scope line
  under the title, which is not decoration and should not be trimmed.

  Counted ANONYMOUSLY, like the sibling pages and for the same reason: the store
  gates an authenticated reader to authors that reader has scored, so the same
  query under an operator's own lens answers a smaller, different question under
  an identical label.

  TWO PANELS ARE COMPUTED BUT INCOMPLETE — zaps and relay distribution — and
  each carries a `note` in the document saying what it leaves out and why.
  This page does not print those notes, or any of the per-panel prose it used
  to carry: the caveats stay in /stats.json for a reader who wants them, and
  the page stays a page of numbers. Only states are still written out — an
  empty window, a missing section, an engine error — because those are facts
  about the document rather than commentary on it.

  THE KINDS TABLE IS LAST AND COMPLETE, and it is what replaced
  kind_stats.html. That page could only count kinds it already knew to name —
  the search UI's card registry plus whatever an operator typed in — so a kind
  nobody had registered was invisible on the one page that would have shown it.
  A grouping histogram enumerates what the store actually holds, which is why
  this table is every kind rather than a top-N, and why it is at the bottom: it
  is a reference list, not a chart, and it is now the longest thing here.

  What went with that page, and is not replaced: it asked its counts as NIP-45
  COUNTs over the relay's own websocket, so it also TESTED the protocol — a kind
  that came back "no COUNT" was a finding about this relay rather than a blank
  cell. Nothing here speaks the protocol. If that check is wanted back it wants
  to be a test, not a page.

  CHARTS: single-series, one hue, no legend (the title names the series), thin
  bars with a rounded data-end, hairline solid gridlines, a 2px surface gap
  doing the separating rather than a stroke.

  Two rules that took a wrong turn to find:

  * Events and publishing pubkeys are TWO charts, never two y-axes on one plot.
    Their scales differ by orders of magnitude and a shared plot would invent a
    correlation out of the arbitrary alignment of the two scales.

  * The Daily/Weekly/Monthly toggle switches between THREE SERIES the rollup
    computed separately — it never re-aggregates one into another. Events sum
    across buckets; distinct authors do not. Someone posting every day is one
    author in the week and seven in the sum of that week's days, so a weekly
    pubkey count has to be asked of the engine at weekly granularity.
-->
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --text: #14171a; --muted: #6b7580;
    --line: #e3e6ea; --accent: #4a5fd9; --warn: #a8611a; --bar: #d9def7;
    --grid: #eceef1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --surface: #1c1f24; --text: #e8eaed; --muted: #9aa3ad;
      --line: #2b3038; --accent: #8b9cf0; --warn: #d99b56; --bar: #2c3350;
      --grid: #242830;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
  h2 { font-size: 1rem; margin: 0 0 .15rem; }
  /* A heading and its own `.card-sub` are ONE unit and stay at the .15rem
     above; a heading standing directly over a chart, a table or a row of tiles
     is a LABEL and needs the gap. Every card here was the second case, so a
     1rem bold heading sat 2.4px off the mark below it and read as part of that
     mark rather than as the thing naming it. Collapses with the .15rem rather
     than adding to it, so this is 8px in both cases and not 8+2.4. */
  h2 + :not(.card-sub) { margin-top: .5rem; }
  .sub { color: var(--muted); margin: 0 0 1.25rem; font-size: .9rem; }
  .card-sub { color: var(--muted); font-size: .85rem; margin: 0 0 .9rem; }
  /* A note UNDER a bounded scroll box wants its gap on the other side.
     `.card-sub` carries all of its margin on the bottom — correct for the
     subtitle under a heading, which is every other use — so the sync card's
     frame note began 0px below a coverage row the box had clipped in half, and
     a sentence starting flush against a half-cut relay name reads as that
     row's own text. The trailing margin goes with it: as a card's last child it
     was doubling the card's own 1rem of bottom padding. */
  .wrap + .card-sub { margin: .7rem 0 0; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: .6rem;
    /* Symmetric. It was `1rem 1.1rem`, so the horizontal inset sat 1.6px wider
       than the vertical for no reason anyone could name, and every child
       inherited the discrepancy as its left margin. */
    padding: 1rem; margin-bottom: 1rem;
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 1rem; margin-bottom: 1rem; }
  /* A titled row of tiles standing on the page background instead of inside a
     card — see trustCard. A .card here would put the tiles' own border inside
     the card's, on the same surface colour, and the four numbers would read as
     boxes in a box rather than as the same kind of headline the corpus totals
     directly above them are. It needs no heading rule of its own: the general
     `h2 + :not(.card-sub)` gives this heading the same 8px it gives every
     card's, and the tiles carry their own bottom margin. */
  /* Prose the panel ENDS on — the "no pubkey carries trust state" warning —
     needs the gap a card would have given it. Without this it inherits `.err`'s
     zero bottom margin and sits closer to the next card than to the tiles it is
     about, which on a page of stacked cards reads as that card's subtitle. */
  .panel > p:last-child { margin-bottom: 1rem; }
  /* A container, so the number inside can size itself to THIS TILE. The tiles
     are an auto-fit grid: the track width is what the number has to fit in and
     the viewport says nothing about it, so `vw` would be measuring the wrong
     box. */
  .tile {
    background: var(--surface); border: 1px solid var(--line); border-radius: .6rem;
    padding: .9rem 1.1rem; container-type: inline-size;
  }
  /* Sized from the tile's width AND from the number's own length, because a
     fixed 1.9rem overflowed its own border on an ordinary deployment: ten
     tabular digits are ~6.3em, the 11rem track affords 190px, and 1.9rem wants
     192 — so "68,412,907" crossed the tile's right edge at a 1100px window, and
     the Zaps row's narrower 8rem track cut "1,882,401" off mid-digit against
     the tile beside it. Both are the page's headline numbers and neither was
     recoverable by scrolling.
     [--len] is a character count, inherited from the row — `fitTiles` sets it
     there, from the LONGEST value in the row, so the row reads at one size. No
     CSS unit expresses "the width of my own text", since `ch` is defined in
     terms of the font size the declaration is trying to compute. .64 is a
     conservative per-character
     em for tabular digits (commas are narrower, so this over-reserves, which is
     the safe direction). Capped at the original 1.9rem so nothing moves where
     it already fit, floored so a phone still reads as a headline. */
  .tile .v {
    /* Declared TWICE on purpose. A browser too old for container queries drops
       the `cqw` declaration whole — and an unparsed `font-size` does not fall
       back to 1.9rem, it inherits the body's 15px and the headline stops being
       one. The first line is what that browser keeps: the size this was before,
       overflow and all, which is the right failure. */
    font-size: 1.9rem;
    font-size: clamp(1rem, calc(100cqw / (var(--len, 10) * .64)), 1.9rem);
    font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  /* A phone spends its width on the tile's own gutters: at 360px the Zaps row's
     two tracks are 129px each, of which the 1.1rem sides took 35 — so the
     narrowest screen gave the longest number the least room to be a number in,
     and the clamp floor above (a legibility floor, not a fitting one) could not
     absorb it. Buying the digits 16px back here is what keeps that floor from
     having to be chosen around today's largest count. A container query cannot
     do this: `@container` styles a container's descendants, never the container
     itself, and the box that needs the narrower padding IS the tile. */
  @media (max-width: 30rem) {
    .tile { padding: .9rem .75rem; }
  }
  .tile .k { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  .tile .v.stale { color: var(--warn); }
  .chart { width: 100%; display: block; overflow: visible; }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .tick { fill: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .chart .mark { fill: var(--accent); }
  .chart .hit { fill: transparent; }
  .chart .mark.on { fill: var(--text); }
  .wrap { overflow-x: auto; }
  /* The long tables — every kind in the store is thousands of rows, and the
     relay list runs to the cap. Bounded height with a sticky header, so a
     table is scannable without owning the whole page, and so the column
     labels are still there when you are 400 rows down. */
  .wrap.tall { max-height: 32rem; overflow-y: auto; }
  .wrap.tall thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }

  /* ---- sync coverage -----------------------------------------------------
     A row is a FRAME plus what is covered, drawn as percentages rather than
     SVG so the whole thing reflows with the card and never re-measures.

     The frame is full width on purpose. A bar sized to its own extent makes
     every relay look finished; against a common frame the uncovered time is
     the loud part, which is the question this card is here to answer. */
  /* The label column, and the one number on this card that has to give way.
     It was a flat 11rem: at 380px that left the url 176px and the TRACK 109px —
     62% of every row spent on an address the box then ellipsises anyway, and
     38% on the bars, which are the content. `clamp` keeps the desktop width and
     lets the column shrink to a still-readable 6.5rem as the card narrows, so
     the data always holds the majority of the row. `22vw` rather than a
     breakpoint because the loss is continuous — there is no width at which the
     url suddenly stops mattering.

     The 8rem FLOOR is not a round number: below it the tail of a
     `*.nostr.land` family clips to `…s.nostr.land` / `…n.nostr.land`, three
     rows that no longer identify three different relays. 8rem keeps the label
     distinguishable and still leaves the track the majority of the row at
     380px (128px of label against ~162px of track, against 176/109 before). */
  .cov { --lab: clamp(8rem, 22vw, 11rem); }
  .cov-row { display: grid; grid-template-columns: var(--lab) 1fr; gap: .6rem; align-items: center; margin-bottom: 3px; }
  /* The url filter hides rows with `[hidden]`, and `[hidden] { display: none }`
     is a UA rule — which ANY author `display` outranks, whatever the
     specificity, because author sheets beat the UA sheet before specificity is
     even consulted. So `display: grid` one line up would keep every
     filtered-out row on screen without this. The Kinds table needs no such rule
     only because nothing here gives `tr` a display of its own. */
  .cov-row[hidden] { display: none; }
  /* Off-screen rows cost nothing to lay out. A fan-out puts thousands of rows
     in a 32rem box that shows about forty, and the url filter turns "lay them
     all out" from a once-per-load cost into a per-keystroke one. Measured on a
     6,025-row document, median of six cycles, three interleaved runs: CLEARING
     the box — every row back on screen — cost 240–337ms of layout, and 57–61ms
     with this; narrowing to two rows, 39–46ms against 18–19ms. Nothing else
     here needs it — no other list on the page runs to thousands of rows inside
     a scroll box.

     `contain-intrinsic-size` is what keeps the scrollbar honest while those
     rows are skipped, and the size is not a guess: a row is `max(12px, .78rem)`
     tall by construction — the track's height against the label's font-size at
     `line-height: 1` — which is why it is written that way rather than as the
     12.48px it computes to at a 16px root. Measured against the same document,
     that lands the scroll height within 0.1% of laying every row out. `auto`
     then replaces the estimate with the real size once a row has been on
     screen, so even that error anneals as the reader scrolls. */
  .cov-row { content-visibility: auto; contain-intrinsic-size: auto max(12px, .78rem); }
  /* The "your filter matched nothing" line, which stands where the whole list
     was. `.why` is margin-free because it normally ends a card; this one is
     followed by the frame note in the same muted register, and flush against it
     the two read as one paragraph. Tag-qualified on purpose: `.why` is declared
     further down this sheet, so at equal specificity it would win on order. */
  p.cov-none { margin-bottom: .5rem; }
  /* line-height 1, not the body's 1.5: a .78rem label in a 1.5 line box is
     taller than the 12px track beside it, and the overflow slid under the
     sticky header above — every group's first row lost its top third. */
  /* `direction: rtl` is here to put the ELLIPSIS ON THE LEFT — the inline
     direction decides which end overflows, and for a relay url the tail is the
     end worth keeping. It must not reach the text itself, though: the url is an
     LTR construct full of bidi-NEUTRAL characters (`/ : . [ ] @ ? &`), and in an
     rtl paragraph a trailing neutral takes the paragraph's direction and moves
     to the other side. That is not a truncation artefact, it mis-renders urls
     that FIT — `nos.lol/` drew as `/nos.lol`, and an IPv6 authority
     `[2001:db8:85a3::8a2e:370:7334]:7777/` reordered into a plausible but
     DIFFERENT address, which is worse than clipping because a reader cannot see
     that anything was lost. So the url goes inside an LTR isolate (see `row`)
     and only the box stays rtl. */
  .cov-lab {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .78rem; line-height: 1;
    color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl; text-align: left;
  }
  /* Belt and braces with `row`'s `dir` attribute: the UA stylesheet gives
     `[dir]` an isolate, but saying it here means the rule cannot be lost to a
     future refactor that drops the attribute. */
  .cov-lab > span { direction: ltr; unicode-bidi: isolate; }
  /* `overflow: hidden` is load-bearing, not tidiness. Every mark carries a
     minimum width so a one-day band is still visible, and a band that starts
     at the frame's right edge — a future-dated `created_at`, which quartz
     accepts up to about a day out — then puts that minimum sliver OUTSIDE the
     track. Clipping here makes the whole class of overshoot impossible rather
     than relying on the arithmetic above staying exact. */
  .track { position: relative; height: 12px; background: var(--grid); border-radius: 2px; overflow: hidden; }
  .track > i { position: absolute; top: 0; bottom: 0; border-radius: 2px; display: block; }
  /* Walked by paging: we asked and stored what came back, and cannot claim
     nothing was missed. */
  .cov-seg.paged { background: var(--bar); }
  /* Reconciled — a finished negentropy pass. The strong tone is the point:
     this is the only bar that means "provably identical". */
  .cov-seg.done { background: var(--accent); }
  /* Still sweeping. Warm, because it is the only mark here that will look
     different in a minute. */
  .cov-seg.live { background: var(--warn); opacity: .55; }
  .cov-seg.edge { width: 2px; border-radius: 0; background: var(--warn); }
  /* The window no kind in the filter is missing from — drawn only when the
     per-kind spans disagree, which is the band bug made visible. */
  .cov-seg.every { top: 4px; bottom: 4px; background: var(--text); opacity: .35; border-radius: 1px; }

  /* ---- the cycle's disposition -------------------------------------------
     One stacked bar per stream, over the urls it took on. A bar rather than a
     table because the reader's question is proportional — "what became of the
     fan-out" — and because a stack CANNOT be drawn unless the parts sum to the
     whole, which is exactly the property the numbers behind it now have. */
  /* 12px, the SAME height as a coverage `.track`. Two bar systems on one card
     drawn 2px apart read as two different kinds of measurement; they are both
     "a proportion of a whole" and should look it. */
  .disp { display: flex; height: 12px; border-radius: 2px; overflow: hidden; background: var(--grid); margin: .4rem 0 .35rem; }
  .disp > i { display: block; height: 100%; }
  /* Reached and gave us something / reached and had nothing to give. Both are
     the relay working, which is why they share the accent and differ in weight
     rather than in hue. */
  /* One rule per outcome, covering BOTH the bar segment and the key's swatch,
     so the key cannot drift from the thing it is a key to. That was the point of
     the `getComputedStyle` probe this replaces — which read a card still
     DETACHED from the document, so no rule and no `var()` resolved and every
     swatch rendered fully transparent (measured: `rgba(0, 0, 0, 0)`). It also
     forced a style recalc per bucket per render, on a page that re-renders every
     poll. */
  .disp > i.delivered, .disp-key b.delivered { background: var(--accent); }
  .disp > i.nothingNew, .disp-key b.nothingNew { background: var(--accent); opacity: .45; }
  /* Not reached. Warm, not red: a dead url in an old relay list is the ordinary
     case on a fan-out this wide, not an incident. */
  .disp > i.unreachable, .disp > i.noRoute, .disp > i.hostStruckOut,
  .disp-key b.unreachable, .disp-key b.noRoute, .disp-key b.hostStruckOut { background: var(--warn); opacity: .6; }
  /* Skipped on a DURABLE verdict rather than on anything measured this cycle —
     the one segment whose relays were never dialled at all, and the one whose
     retry is a TTL rather than the next cycle. */
  .disp > i.knownDead, .disp-key b.knownDead { background: var(--warn); opacity: .35; }
  /* Our own fault, or at least our own side: the transfer broke after a
     handshake, or our proxy was down. */
  .disp > i.transferFailed, .disp > i.torUnavailable,
  .disp-key b.transferFailed, .disp-key b.torUnavailable { background: var(--warn); }
  .disp > i.pending, .disp-key b.pending { background: var(--bar); }
  /* OUR pool, not their relay — the same family as `pending` and deliberately
     not the warm "not reached" one, because a busy url is a url this rotation
     declined to redial while a worker still had it. Lighter, so the two read as
     a pair without the bar claiming two segments of the same thing. */
  .disp > i.busy, .disp-key b.busy { background: var(--bar); opacity: .5; }
  /* `row-gap` under `column-gap`: the key runs to nine buckets and wraps to two
     or three rows at any real width, and an equal gap on both axes made the
     wrapped rows read as separate paragraphs rather than as more of the key. */
  .disp-key { display: flex; gap: .35rem .8rem; flex-wrap: wrap; font-size: .72rem; color: var(--muted); }
  .disp-key b { display: inline-block; width: .55rem; height: .55rem; border-radius: 2px; vertical-align: -.02em; margin-right: .25rem; }
  /* The prose under a cycle's bar — the accounting line.
     NOT `.why`, which is deliberately margin-free because it ENDS a card; used
     three times mid-block it collapsed a legend, a list and a sentence into one
     undifferentiated slab with 0px between them. Same muted register, its own
     spacing. */
  .cyc-line { color: var(--muted); font-size: .85rem; margin: .45rem 0 0; }
  .cyc { margin: 0 0 .9rem; }
  .cyc-head { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; font-size: .8rem; }
  .cyc-head .nm { font-weight: 600; }
  .cyc-head .ph { color: var(--muted); font-variant-numeric: tabular-nums; }
  /* A failed cycle is the one thing on this line worth looking at, and `.err`
     alone loses to `.cyc-head .ph` on specificity — which drew it in the same
     muted grey as a stream that finished cleanly. */
  .cyc-head .ph.err { color: var(--warn); margin: 0; font-size: inherit; }

  .axis-track { position: relative; height: 1.15rem; margin-left: calc(var(--lab) + .6rem); }
  .axis-track span {
    position: absolute; transform: translateX(-50%); font-size: 10px; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .axis-track span.first { transform: none; }
  .axis-track span.last { transform: translateX(-100%); }
  /* Two elements, not one. The opaque strip must span the FULL width or relay
     labels scroll up through the gap beside the ticks; the ticks themselves
     are percentages of the TRACK, which starts after the label column. And it
     lives INSIDE the scroll box, like `thead th` does — an axis above would
     keep the scrollbar's width while the tracks below lost it, putting every
     bar a few pixels off the date that labels it. */
  .axis.pin {
    position: sticky; top: 0; z-index: 3; background: var(--surface);
    padding: .15rem 0 .3rem; border-bottom: 1px solid var(--line);
  }
  .grp { margin-bottom: 1.1rem; }
  .grp:last-child { margin-bottom: 0; }
  /* Pinned under the axis: 900 rows into a fan-out, "which stream is this" is
     the other question the numbers stop answering. */
  /* `nowrap`, so the head is one line whatever the filter holds. It used to
     wrap, which meant a stream naming twenty kinds pushed its own counts onto a
     second line — and this head is sticky, so those lines are taken off the top
     of the rows scrolling under it. The filter chip is the item that gives:
     it ellipsises (below), the counts do not. */
  .grp-head {
    display: flex; justify-content: space-between; gap: .75rem; align-items: baseline; flex-wrap: nowrap;
    position: sticky; top: var(--pin-h, 1.7rem); z-index: 2; background: var(--surface);
    /* `.6rem` below, against `.35rem` above. The head is 51px of name, filter
       chip and counts (100px on a phone, where it stacks) and it sat 4.8px off
       its own data while 17.6px separated one group from the next — the
       heaviest element on the card had the least room around it. Asymmetric on
       purpose: this is a heading, and a heading belongs to what follows it. */
    padding: .35rem 0 .6rem;
  }
  /* The first group's head sat flush on the axis (measured: 0px), so the pinned
     ruler and the first stream name touched. */
  .axis.pin + .grp > .grp-head { padding-top: .55rem; }
  /* ONE line, ellipsised. A stream filtering a dozen kinds prints a chip that
     wrapped to three lines, and this head is STICKY — every wrapped line is
     taken off the top of the coverage rows scrolling under it, on every group,
     for a list of numbers whose tail is the least informative part of it. The
     full list is on the title, same bargain as .spark-kind. `min-width: 0`
     is what lets it shrink at all: a flex item floors at its content width
     without it, and the chip would push the stat off the card instead. */
  .grp-name { font-weight: 650; font-size: .85rem; flex: 1 1 auto; min-width: 0; }
  /* `inline-block` with a cap, not `block`: a block chip stretches to the whole
     flex item and paints a full-width bar behind "every kind". This shrinks to
     its text and ellipsises only once the text outgrows the row. */
  .grp-name code {
    background: var(--bar); padding: .05rem .3rem; border-radius: .25rem; font-size: .75rem;
    display: inline-block; max-width: 100%; vertical-align: bottom;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* The stream's name, ahead of its filter chip: the name is what a reader
     matches against `router.conf`, so it leads and the chip explains it. Not
     ellipsised — a name is short, and clipping the one identifier the config
     shares with this page would defeat the point. */
  .grp-stream { margin-right: .4rem; }
  .grp-stat { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; white-space: nowrap; flex: 0 0 auto; }
  /* On a phone the counts alone are wider than the card, and `nowrap` had them
     running off its right edge with the chip crushed to an ellipsis beside
     them. Below this width they take their own row — which still leaves the
     filter on ONE line, now a full-width one. */
  @media (max-width: 45rem) {
    .grp-head { flex-wrap: wrap; }
    /* `nowrap` is dropped along with the row, not kept with it. It earns its
       place at desktop widths, where the counts fit on the line it saves; here
       they do not — on a 390px phone the string ran 50px past the card and
       "relays walked" was clipped away entirely, which loses a number rather
       than a line. A head that has already taken a second row can afford a
       third. */
    .grp-stat { flex-basis: 100%; white-space: normal; }
  }
  /* How many of a group's relays cover each bucket — the mark that answers
     "how much of the list is in sync" for a fan-out, where a row each is
     reachable but not readable. Indented to the track: it is a chart on the
     SAME axis, and flush left its 2023 bucket sat over the rows' 2022.

     The TOP margin keeps the tallest bucket off the sticky head above it: the
     strip is bottom-aligned and a full-depth bucket reaches the whole 24px, so
     at 0 the bars touched the filter chip's own box and the chart read as
     hanging off the heading rather than as the first mark under it. */
  .depth {
    position: relative; height: 24px; margin: .3rem 0 .3rem calc(var(--lab) + .6rem);
    display: flex; align-items: flex-end;
  }
  .depth i { display: block; flex: 1 1 0; min-width: 0; background: var(--accent); }
  .depth i.thin { background: var(--bar); }
  /* The two halves of this card answer different questions — what the router is
     doing NOW, and how far it has walked — and every gap in it was 12-14px, so
     they never separated. The rule is the boundary; the space above it is
     larger than the gap between two cycle blocks, which is what makes the
     blocks read as members of the panel rather than as peers of it. */
  .cyc-end { margin: 1.4rem 0 1.1rem; border: 0; border-top: 1px solid var(--line); }
  /* Sits directly above the scroll box it describes. It used to sit under the
     cycle bars — 14px from what it does not explain, 60px from what it does. */
  .legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .78rem; color: var(--muted); margin: 0 0 .55rem; }
  .legend b { display: inline-block; width: .8rem; height: .8rem; border-radius: 2px; vertical-align: -.05em; margin-right: .3rem; }
  .bar-row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: .75rem; }
  .bar-row input {
    font: inherit; font-size: .9rem; padding: .35rem .6rem; border-radius: .4rem;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); width: 18rem; max-width: 100%;
  }
  .status { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; width: 100%; min-width: 30rem; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  /* A numeric header sits over its own column. Without this the values are
     right-aligned under a left-aligned label, which reads as two columns. */
  th.n { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.kind { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  td.name { color: var(--muted); }
  /* The share-of-corpus bar rides behind the row rather than in a column of
     its own — the number is the data, this is only its shape. */
  td.share { position: relative; min-width: 6rem; }
  td.share i { display: block; height: .5rem; border-radius: 0 2px 2px 0; background: var(--bar); }
  /* The "nothing here to draw" states, in the same muted register as
     `.card-sub` — "Not in this document." is the same KIND of line. This rule
     was scoped to `.pending`, so the identical sentence in a chart card had NO
     styling at all: it fell through to the UA's `margin: 1em 0` and the body's
     full size and colour, which printed an absence louder than the numbers
     around it and left those cards 15px of extra floor. Unscoping it also lets
     `h2 + :not(.card-sub)` reach these paragraphs, which `.pending .why` was
     outspecifying — that is why the pending card kept the 2.4px gap the rest of
     the page had already lost. */
  .why { color: var(--muted); font-size: .85rem; margin: 0; }
  .pending { border-style: dashed; }
  .pending h2 { color: var(--muted); }
  .badge {
    display: inline-block; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em;
    padding: .1rem .4rem; border-radius: .25rem; background: var(--bar); color: var(--muted);
    vertical-align: .15em; margin-left: .4rem; font-weight: 700;
  }
  .badge.bad { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
  .err { color: var(--warn); font-size: .85rem; margin: .4rem 0 0; }
  /* The granularity toggle: one row above the series it drives. */
  .seg { display: inline-flex; gap: 0; margin-bottom: 1rem; border: 1px solid var(--line); border-radius: .4rem; overflow: hidden; background: var(--surface); }
  .seg button {
    font: inherit; font-size: .85rem; padding: .35rem .8rem; border: 0; cursor: pointer;
    background: transparent; color: var(--muted); border-right: 1px solid var(--line);
  }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--bar); color: var(--text); font-weight: 600; }
  .sparks { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .9rem 1.2rem; }
  .spark-cell { min-width: 0; }
  .spark-head { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; font-size: .8rem; margin-bottom: .2rem; }
  .spark-kind { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spark-peak { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chart.spark { height: 2.5rem; }
  .tiles.inline { grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); margin-bottom: 1rem; }
  td.relay { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; word-break: break-all; }
  .err code { word-break: break-all; }
  footer { margin-top: 1.25rem; color: var(--muted); font-size: .85rem; }
  code { background: var(--bar); padding: .1rem .3rem; border-radius: .25rem; }
  a { color: var(--accent); }
  .tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .08s;
    background: var(--surface); border: 1px solid var(--line); border-radius: .35rem;
    padding: .3rem .5rem; font-size: .8rem; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    font-variant-numeric: tabular-nums; white-space: nowrap; z-index: 10;
  }
</style>
</head>
<body>
<main>
  <h1>Relay stats</h1>
  <p class="sub" id="scope">Loading…</p>

  <div id="body"></div>

  <footer id="foot"></footer>
</main>
<div class="tip" id="tip"></div>

<script type="module">
import { kindLabel } from "/web/shared/kinds.js";

const fmt = (n) => Number(n).toLocaleString();

/**
 * The same number, short enough to label a chart with.
 *
 * "1.2M" where `fmt` says "1,234,567". Grouped digits are the right answer
 * everywhere a reader might compare or quote the number — a tile, a table cell,
 * a tooltip — and the wrong one on an AXIS, where the label is a ruler mark: a
 * y-axis reading 1,234,567 / 617,284 / 0 spends a third of the plot width
 * spelling precision nobody reads off a gridline, and the per-kind sparklines
 * put their peak in a head that already truncates.
 *
 * Exact values are never only here. Every mark carries its full count on the
 * hover tooltip, which is what this page treats as the number of record.
 *
 * The formatter is HOISTED, unlike `fmt`'s. `toLocaleString(undefined, opts)`
 * constructs a fresh `Intl.NumberFormat` per call, and options are what defeat
 * the engine's cache for the argument-less form: measured over 20,000 calls in
 * this page's own Chromium, 429ms inline against 12ms through one kept
 * instance, where `fmt`'s bare `toLocaleString()` is 12ms either way. Today's
 * axes make two dozen calls and would never notice; a label moved onto a
 * per-bar or per-row path would, and this costs one line to make impossible.
 */
const COMPACT = new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 });
const short = (n) => COMPACT.format(Number(n));

/**
 * What to call a kind, best source first.
 *
 * The document's own `name` leads, and it comes from Quartz's `KindNames` —
 * the protocol-wide registry, 287 kinds deep, which is the only one big enough
 * for a table that enumerates the whole store. `kinds.js` is the fallback and
 * not the primary: it is the search UI's BADGE registry, sized to the kinds
 * this relay can render a card for, so on its own it left 180 kinds reading
 * "kind N" — including the long tail this table exists to reveal.
 *
 * Kept as a fallback rather than dropped, because the two sets are not nested:
 * `kinds.js` names ten kinds Quartz has not registered yet (the `1630`-`1633`
 * git statuses, `30024` drafts, `30040`/`30041` publications), and a document
 * rolled up before this field existed carries no names at all.
 */
const kindName = (kind, given) => given || kindLabel(kind);

/**
 * A duration as an age — "4m ago", "6d ago".
 *
 * Every timestamp on this page is read as "is this relay keeping up", and a
 * date answers that only after the reader does the subtraction. The exact
 * instant stays available on hover, because the age is the signal and the date
 * is the evidence.
 */
const ago = (seconds) => {
  if (seconds == null) return "—";
  const d = Math.max(0, Math.floor(Date.now() / 1000) - seconds);
  if (d < 90) return `${d}s ago`;
  if (d < 5400) return `${Math.round(d / 60)}m ago`;
  if (d < 172800) return `${Math.round(d / 3600)}h ago`;
  return `${Math.round(d / 86400)}d ago`;
};
const isoOf = (seconds) => (seconds == null ? "" : new Date(seconds * 1000).toISOString().replace("T", " ").slice(0, 19) + "Z");

/**
 * Past this, an age is worth colouring. NOT an assertion that the relay is
 * broken: a serve-only deployment with no router has every right to a corpus
 * whose newest event is old, and this page cannot see whether a mirror is even
 * configured. It marks "look at this", and the tooltip names both readings.
 */
const STALE_CORPUS_SECONDS = 24 * 3600;
/**
 * "All 11" vs "the 50 most-named of 1,204".
 *
 * A capped list and a complete one are different facts, and stating a
 * truncation that did not happen invites the reader to wonder what was left
 * out. The kinds table is no longer capped at all; relay distribution still is.
 */
const shownOf = (shown, total, noun, superlative) =>
  shown >= total ? `All ${fmt(total)} ${noun}` : `The ${fmt(shown)} ${superlative} of ${fmt(total)} ${noun}`;
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
/**
 * Size a row of tiles to its LONGEST number, and hand the row back.
 *
 * `.tile .v` sizes itself from the track it landed in and from this length, so
 * a number can never cross its own tile's border — see the CSS for why a fixed
 * size could not hold, and why the length cannot come from CSS (`ch` is defined
 * in terms of the font size the declaration is trying to compute).
 *
 * Written once on the ROW rather than per tile, and not only because it is one
 * line instead of four: sizing each tile to its own text left "1,882,401" a
 * third smaller than the "27" beside it, which reads as the small number being
 * the important one. One size per row, set by the value with the least room,
 * keeps a row of headline numbers reading as one row. Custom properties
 * inherit, and the grid's tracks are all `1fr`, so every tile resolves the same
 * `cqw` against the same length and they land on the same size.
 */
const fitTiles = (row) => {
  const len = [...row.querySelectorAll(".v")].reduce((m, v) => Math.max(m, v.textContent.length), 1);
  row.style.setProperty("--len", String(len));
  return row;
};
const SVG = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs) => {
  const n = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  return n;
};

const bodyEl = document.getElementById("body");
const scopeEl = document.getElementById("scope");
const footEl = document.getElementById("foot");
const tipEl = document.getElementById("tip");

/**
 * How old a document may be before the page says so out loud.
 *
 * Not a guess at the rollup interval — that is an operator setting this page
 * cannot see (STATS_INTERVAL_SECONDS), and hardcoding it here would mean
 * telling anyone who changed it that fresh numbers are stale. This is the point
 * past which a document is old enough that "the rollup has stopped" is the more
 * likely explanation than "it is between runs", for any sane interval.
 */
const STALE_AFTER_MS = 6 * 3600 * 1000;

/**
 * The document schema this page was written against — see SCHEMA_VERSION in
 * StatsRollup, which bumps when a RELEASED field changes meaning or leaves.
 *
 * One constant because it was two: the comparison and the sentence it prints
 * both carried a literal, and raising the rollup's number left the page
 * comparing against one and offering to explain itself in terms of another. A
 * version check that can disagree with itself is worse than no check.
 */
const SCHEMA = 1;

const MONTH = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

/**
 * Axis labels for the bucket keys the rollup emits.
 *
 * SLICED OFF THE STRING, never parsed through Date. A bare `yyyy-mm-dd` is
 * parsed as UTC midnight and then printed in the READER's zone, so every label
 * west of Greenwich slides one day into the past — on a page whose every
 * number is documented as UTC, and against a tooltip that would still be
 * printing the raw key. The rollup already bucketed by UTC; the axis only has
 * to spell what it bucketed.
 */
const dayTick = (iso) => `${MONTH[+iso.slice(5, 7) - 1]} ${+iso.slice(8, 10)}`;
/** "2025-07" → "Jul ’25". The year is on every month label because the window spans several. */
const monthTick = (iso) => `${MONTH[+iso.slice(5, 7) - 1]} ’${iso.slice(2, 4)}`;

/**
 * How many bars apart the x labels stand.
 *
 * Measured from the width the labels ACTUALLY need — the longest one present,
 * at the 10px tick size — rather than a per-chart constant, so 24 hours, 30
 * days and 12 months each get as many labels as they can carry without a
 * collision, and none of them needs to know about the others.
 */
function tickStride(points, plotW) {
  const widest = points.reduce((m, p) => Math.max(m, (p.tick || "").length), 0);
  if (!widest) return points.length;
  // ~6.2px per character at font-size 10, plus a gutter that keeps neighbours
  // from touching. Two labels is the floor: first and last still beats none.
  const room = Math.max(2, Math.floor(plotW / (widest * 6.2 + 18)));
  return Math.max(1, Math.ceil(points.length / room));
}

/**
 * Hide the axis ticks that would overlap — the sync frame's answer to [tickStride].
 *
 * That frame spans years and its axis prints every boundary, which is a legible
 * ruler at a card's full width and a smear below it: at 390px each of "2022"
 * through "2026" overlapped its neighbour by 2px and the frame's start date
 * overlapped the first year by 59, drawing "20222023202420252026now" as one
 * token. Even at 1100px the start date and the first year stood 1.9px apart and
 * read as a single label. Same problem the charts solve with [tickStride] and
 * the same answer — what the labels ACTUALLY measure decides how many fit —
 * except these are positioned in percentages of a fluid track rather than in a
 * fixed viewBox, so the measuring has to wait for layout.
 *
 * THE TWO ENDS WIN and the years give way to them, not the other way round.
 * "now" is what every question on this card is asked against, and the frame's
 * start is the one label no bare year can stand in for — it is the date the
 * card's own "not a target" note is about. The start yields only when even the
 * two ends cannot both fit.
 */
function thinTicks(track) {
  if (!track) return;
  const spans = [...track.children];
  // Unhidden before measuring, because this re-runs on every resize and a tick
  // hidden at the previous width has no box to measure at this one.
  for (const s of spans) s.hidden = false;
  if (spans.length < 2) return;
  // Enough that neighbours read as two labels rather than one hyphenless word.
  const GAP = 6;
  const r = spans.map((s) => s.getBoundingClientRect());
  const end = spans.length - 1;
  const startFits = r[0].right + GAP <= r[end].left;
  spans[0].hidden = !startFits;
  let edge = startFits ? r[0].right : -Infinity;
  for (let i = 1; i < end; i++) {
    if (r[i].left - GAP >= edge && r[i].right + GAP <= r[end].left) edge = r[i].right;
    else spans[i].hidden = true;
  }
}

/** A bar chart of one series. See the header for why single-series and why never two y-axes. */
function barChart(points, { label, height = 130 }) {
  // Geometry in a fixed viewBox, scaled by CSS — so the chart is responsive
  // without re-measuring on resize, and the bar caps stay round at any width.
  // PAD_L is the y-label gutter, and it is sized for the widest label `short`
  // can produce ("1.2M", ~25px at the 10px tick size) plus the 6px the label is
  // inset from the plot. It was 46 when those labels were spelled out in full.
  const W = 720, H = height, PAD_L = 34, PAD_B = 20, PAD_T = 8;
  const plotW = W - PAD_L, plotH = H - PAD_B - PAD_T;
  const svg = svgEl("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": label });

  const max = Math.max(1, ...points.map((p) => p.value));
  // Clean tick values rather than max/2 — the axis carries every value not
  // directly labelled, so it should read in round numbers.
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const tick = [1, 2, 5, 10].map((m) => m * step).find((t) => t >= max) || max;
  const y = (v) => PAD_T + plotH - (v / tick) * plotH;

  // Deduped by the label they actually render, not by their value: a series
  // whose maximum is 1 puts the midpoint at 0.5, which rounds to the same "1"
  // as the top and drew an axis reading "1 / 1 / 0".
  const drawn = new Set();
  for (const v of [0, tick / 2, tick]) {
    const label = short(Math.round(v));
    if (drawn.has(label)) continue;
    drawn.add(label);
    svg.appendChild(svgEl("line", { class: "grid", x1: PAD_L, x2: W, y1: y(v), y2: y(v) }));
    const t = svgEl("text", { class: "tick", x: PAD_L - 6, y: y(v) + 3, "text-anchor": "end" });
    t.textContent = label;
    svg.appendChild(t);
  }

  const band = plotW / points.length;
  // A gap in the surface colour is what separates neighbouring bars — never a
  // stroke around them. Capped at 24px AND at a fraction of the band: the 2px
  // minimum alone let 30 bars across this width come out 20px wide in a 22px
  // slot, which reads as a wall of saturated blocks rather than as data.
  const w = Math.max(1, Math.min(24, band - 2, band * 0.72));
  points.forEach((p, i) => {
    const x = PAD_L + i * band + (band - w) / 2;
    const top = y(p.value), h = Math.max(p.value > 0 ? 1 : 0, PAD_T + plotH - top);
    // Rounded at the data end, square at the baseline: one rect with a radius
    // plus one square rect covering the baseline half.
    const r = Math.min(4, w / 2, h);
    const marks = [];
    if (h > 0) {
      marks.push(svgEl("rect", { class: "mark", x, y: top, width: w, height: h, rx: r, ry: r }));
      if (h > r) marks.push(svgEl("rect", { class: "mark", x, y: top + r, width: w, height: h - r }));
      marks.forEach((m) => svg.appendChild(m));
    }
    // The hit target is the whole band, not the bar — a 3px-tall bar is
    // unhoverable, and a quiet day is exactly the one worth reading.
    //
    // The highlight is applied to THIS bar's own marks rather than left to a
    // CSS sibling selector. It was `.hit:hover + .mark`, which reads "the
    // element right after the hovered hit" — and since each bar appends its
    // marks BEFORE its hit, that is the next bar's mark. Hovering bar 4 lit up
    // bar 5, and the last bar lit nothing at all, while the tooltip (bound to
    // the hit itself) stayed correct. A wrong bar highlighted beside a right
    // number reads as a rendering glitch rather than an off-by-one.
    const hit = svgEl("rect", { class: "hit", x: PAD_L + i * band, y: PAD_T, width: band, height: plotH });
    hit.addEventListener("pointerenter", (e) => {
      marks.forEach((m) => m.classList.add("on"));
      showTip(e, `${p.label} · ${fmt(p.value)}`);
    });
    hit.addEventListener("pointermove", moveTip);
    hit.addEventListener("pointerleave", () => {
      marks.forEach((m) => m.classList.remove("on"));
      hideTip();
    });
    svg.appendChild(hit);
  });

  // Labelled from the END backwards, at a stride the width can hold.
  //
  // Two things this fixes. It was first/middle/last, so reading "the fourth
  // Tuesday" off a 30-bar chart meant counting bars from a label 15 bars away.
  // And walking forwards from index 0 leaves the LAST bucket unlabelled
  // whenever the length is not a multiple of the stride — the most recent day
  // is the one every reader looks at first, so the walk starts there and the
  // stride runs backwards into the past.
  // Hoisted: the stride is a property of the series and the width, and calling
  // it in the update clause re-measured every label on every step.
  const stride = tickStride(points, plotW);
  for (let i = points.length - 1; i >= 0; i -= stride) {
    const p = points[i];
    if (!p.tick) continue;
    // Anchored to keep the two end labels inside the plot: centred text under
    // the last band hangs off the right edge, and under the first it runs back
    // over the y-axis numbers.
    const anchor = i === points.length - 1 ? "end" : i === 0 ? "start" : "middle";
    const t = svgEl("text", { class: "tick", x: PAD_L + i * band + band / 2, y: H - 6, "text-anchor": anchor });
    t.textContent = p.tick;
    svg.appendChild(t);
  }
  return svg;
}

function showTip(e, text) {
  tipEl.textContent = text;
  tipEl.style.opacity = "1";
  moveTip(e);
}
function moveTip(e) {
  tipEl.style.left = Math.min(e.clientX + 12, innerWidth - tipEl.offsetWidth - 8) + "px";
  tipEl.style.top = (e.clientY - tipEl.offsetHeight - 10) + "px";
}
function hideTip() { tipEl.style.opacity = "0"; }

/** A section's header, carrying its status when that status is worth reading. */
function cardHead(parent, title, sub, section) {
  const h = el("h2", null, title);
  const status = section && section.status;
  // `failed` is worse than `partial` and used to get the QUIETER badge — the
  // ternary read "partial ? loud : quiet", which is backwards for every status
  // that is not partial.
  if (status && status !== "ok") h.appendChild(el("span", status === "ok" ? "badge" : "badge bad", status));
  parent.appendChild(h);
  // [sub] is a STATE, not a description: "no kind histogram in this document",
  // or how much of a truncated list is on screen. The panels no longer explain
  // themselves — the document's own `note` is where a caveat lives now.
  if (sub) parent.appendChild(el("p", "card-sub", sub));
  // The engine's own message, and the query that produced it — enough to
  // correct a rejected pipeline without attaching a debugger to the relay.
  if (section && section.errors) {
    for (const [k, v] of Object.entries(section.errors)) {
      const p = el("p", "err");
      p.append(`${k}: `);
      p.appendChild(el("code", null, v));
      parent.appendChild(p);
    }
  }
}

function tiles(corpus) {
  const out = [];
  const wrap = el("div", "tiles");
  const d = (corpus && corpus.data) || {};
  for (const [key, label] of [["events", "Events"], ["pubkeys", "Pubkeys"], ["kinds", "Kinds"]]) {
    const t = el("div", "tile");
    // A hero number, not a one-bar chart. An absent value is an em dash: this
    // page never prints a zero it did not measure.
    t.appendChild(el("div", "v", d[key] == null ? "—" : fmt(d[key])));
    t.appendChild(el("div", "k", label));
    wrap.appendChild(t);
  }

  // Freshness as the headline it is. "Is the store still filling" is the first
  // question an operator has and the corpus totals cannot answer it — a relay
  // whose mirror died last week has the same impressive event count it had
  // while working.
  if (d.newestEvent != null) {
    const t = el("div", "tile");
    const age = Math.max(0, Math.floor(Date.now() / 1000) - d.newestEvent);
    const v = el("div", "v", ago(d.newestEvent));
    if (age > STALE_CORPUS_SECONDS) {
      v.classList.add("stale");
      t.title =
        "The newest event this relay holds is over a day old. Either the mirror has stopped, or this " +
        "deployment serves without one — this page cannot tell which.";
    } else {
      t.title = isoOf(d.newestEvent);
    }
    t.appendChild(v);
    t.appendChild(el("div", "k", "Newest event"));
    wrap.appendChild(t);
  }
  out.push(fitTiles(wrap));

  // `corpus.futureDated` is deliberately NOT drawn. It is still counted, and it
  // is still in /stats.json for anyone watching it grow, but a card that only
  // ever says "some authors signed a bad clock" is a caveat about the Nostr
  // protocol rather than a fact about this relay, and it was sitting between
  // the totals and everything worth reading.

  // The totals have no card header for cardHead to hang an error on, and
  // without this an em dash where a number belongs is the ONLY sign anything
  // went wrong — with the engine's message, which names the failing pipeline,
  // dropped on the floor. Carried in its own strip instead.
  if (corpus && corpus.errors) {
    const strip = el("div", "card");
    for (const [k, v] of Object.entries(corpus.errors)) {
      const p = el("p", "err");
      p.append(`${k}: `);
      p.appendChild(el("code", null, v));
      strip.appendChild(p);
    }
    out.push(strip);
  }
  return out;
}

/**
 * One chart card, or a stated empty window.
 *
 * A series that is present but all-zero must NOT be dropped — an omitted chart
 * is indistinguishable from a panel this page does not know about, and "no
 * events in the last 30 days" is a real and alarming fact about a relay that is
 * supposed to be mirroring. This drew nothing at all until a corpus whose
 * newest event predated the window rendered a page with the daily charts simply
 * missing and no indication anything was wrong.
 */
function chartCard(title, sub, points, section, noun = "events") {
  const card = el("div", "card");
  cardHead(card, title, sub, section);
  if (!points.length) {
    card.appendChild(el("p", "why", "Not in this document."));
  } else if (points.every((p) => !p.value)) {
    // [noun] names what the series counts, because this sentence is the whole
    // finding when a window is empty and it was hardcoded to "events" — so the
    // pubkeys chart reported "No events in this window." over a chart that is
    // not counting events, next to an events chart that might be full of them.
    card.appendChild(el("p", "err", `No ${noun} in this window.`));
  } else {
    card.appendChild(barChart(points, { label: title }));
  }
  return card;
}

/**
 * The three granularities, and why they are three separate answers rather than
 * one re-aggregated.
 *
 * Events sum across buckets; DISTINCT AUTHORS DO NOT. Someone posting every day
 * is one author in the week and seven in the sum of that week's days, so a
 * weekly "publishing pubkeys" has to be asked of the engine at weekly
 * granularity. The rollup does exactly that, and this toggle picks between the
 * three series it returns — it never adds days together to make a week.
 */
const GRAINS = [
  // [tick] is the axis label, [tip] the hover. They differ on purpose: the axis
  // gets the shortest form that still reads ("Jul 9"), the tooltip gets the
  // unambiguous one — and for weeks it has to say WHICH day that key is, since
  // a week bucket is keyed by the Monday it starts on and "Jul 9" alone would
  // read as a single day's bar.
  // [span] returns NULL rather than a string built around a missing field. When
  // the whole activity section fails the engine, `data` is absent and every one
  // of these read `undefined` straight into the card title — "Events per day ·
  // last undefined days", printed in bold above the badge that already said
  // `failed`. A window this page cannot state is one it should not mention.
  //
  // It is the WHOLE phrase, "last" included, and it was a bare length the
  // caller prefixed with that word. The monthly series is anchored to a date
  // and grows rather than trailing the present, so "last 44 months" described a
  // rolling window this chart deliberately is not.
  { key: "days", label: "Daily", unit: "day", span: (d) => (d.windowDays == null ? null : `last ${d.windowDays} days`), tick: dayTick, tip: (p) => p },
  { key: "weeks", label: "Weekly", unit: "week", span: (d) => (d.windowWeeks == null ? null : `last ${d.windowWeeks} weeks`), tick: dayTick, tip: (p) => `week of ${p}` },
  { key: "months", label: "Monthly", unit: "month", span: monthSpan, tick: monthTick, tip: (p) => p },
];

/**
 * "since Jan ’23" — the monthly window stated as where it starts.
 *
 * Falls back to the count for a document written before `monthsSince` existed,
 * rather than dropping the window from the title entirely: an older rollup's
 * monthly chart really was a rolling N months, and that is what its own field
 * says.
 */
function monthSpan(d) {
  if (d.monthsSince) return `since ${monthTick(d.monthsSince)}`;
  return d.windowMonths == null ? null : `last ${d.windowMonths} months`;
}

/** "· last 30 days" when the document states a window, and nothing at all when it does not. */
const spanNote = (span) => (span ? ` · ${span}` : "");
let grain = null;

/** The granularities this document actually carries, finest first. */
const grainsIn = (activity) => {
  const d = (activity && activity.data) || {};
  return GRAINS.filter((g) => (d[g.key] || []).length);
};

/**
 * Settle [grain] on something the document can actually draw.
 *
 * The default used to be a hardcoded "days", which is wrong whenever the daily
 * series is the empty one — a store whose newest event predates the 30-day
 * window opens on "Not in this document." with weekly and monthly data sitting
 * right there. Worse, the toggle hides itself below two granularities, so a
 * document carrying ONLY months could never be switched to and its data was
 * unreachable. Reconciling here means the page opens on the finest granularity
 * that has something to show, and a reader's explicit choice is kept as long as
 * it stays valid.
 */
function settleGrain(activity) {
  const available = grainsIn(activity);
  if (!available.length) return;
  if (!available.some((g) => g.key === grain)) grain = available[0].key;
}

function grainToggle(activity, onChange) {
  const row = el("div", "seg");
  // Only the granularities the document actually carries — a control that
  // switches to an empty chart is worse than one that is not offered.
  const available = grainsIn(activity);
  if (available.length < 2) return null;
  for (const g of available) {
    const b = el("button", g.key === grain ? "on" : null, g.label);
    b.addEventListener("click", () => {
      grain = g.key;
      onChange();
    });
    row.appendChild(b);
  }
  return row;
}

function activityCards(activity) {
  const d = (activity && activity.data) || {};
  const g = GRAINS.find((x) => x.key === grain) || grainsIn(activity)[0] || GRAINS[0];
  const series = d[g.key] || [];
  const hours = d.hours || [];
  const span = g.span(d);
  const out = [];

  // The window is in the title because it is the one thing a bare "Events per
  // day" cannot be read without: 30 days and 30 months are the same 30 bars.
  out.push(chartCard(
    `Events per ${g.unit}${spanNote(span)}`,
    null,
    series.map((x) => ({ label: g.tip(x.period), tick: g.tick(x.period), value: x.events })),
    activity,
  ));

  // A SECOND chart, never a second y-axis on the first: events and pubkeys
  // differ by orders of magnitude, and aligning two scales on one plot invents
  // a correlation that is not in the data.
  if (series.some((x) => x.pubkeys != null)) {
    out.push(chartCard(
      `Publishing pubkeys per ${g.unit}${spanNote(span)}`,
      null,
      series.map((x) => ({ label: g.tip(x.period), tick: g.tick(x.period), value: x.pubkeys || 0 })),
      null,
      "publishing pubkeys",
    ));
  }

  // "14:00", not "14": a bare number under a bar reads as a count on a page
  // whose every other axis label is one. The tooltip names the whole hour and
  // the zone, because "14:00" alone invites the reader to apply their own.
  out.push(chartCard(
    `Events by hour of day${spanNote(d.hourWindowDays == null ? null : `last ${d.hourWindowDays} days`)}`,
    null,
    hours.map((x) => {
      const hh = String(x.hour).padStart(2, "0");
      return { label: `${hh}:00–${hh}:59 UTC`, tick: `${hh}:00`, value: x.events };
    }),
    null,
  ));
  return out;
}

/**
 * A compact bar chart with no axis — the small-multiple mark.
 *
 * Each kind gets its OWN vertical scale, and the peak is printed beside the
 * title because of it. A shared scale is the obvious default and it is wrong
 * here: kind 1 outnumbers the rest by an order of magnitude, so a common axis
 * would flatten every other kind to a line of pixels and the panel would show
 * one series and seven blanks. Shape is what this panel is for — the levels are
 * in the Kinds table above it — but a reader will assume a shared scale unless
 * told, so the peak is on every card.
 */
function sparkline(points) {
  const W = 240, H = 40;
  const svg = svgEl("svg", { class: "chart spark", viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  const max = Math.max(1, ...points.map((p) => p.value));
  const band = W / Math.max(1, points.length);
  const w = Math.max(1, Math.min(10, band - 1));
  points.forEach((p, i) => {
    if (!p.value) return;
    const h = Math.max(1, (p.value / max) * H);
    svg.appendChild(svgEl("rect", { class: "mark", x: i * band + (band - w) / 2, y: H - h, width: w, height: h, rx: 1 }));
  });
  return svg;
}

function kindActivityCard(section) {
  const d = (section && section.data) || {};
  const kinds = d.kinds || [];
  const card = el("div", "card");
  // "peak N/day" on every cell is what stands in for the removed sentence about
  // per-kind scales. Do not drop it as prose: without a stated peak a reader
  // assumes one shared axis and compares heights across cells, which is the one
  // thing this panel does not mean.
  cardHead(
    card,
    kinds.length
      ? `Event types over time · ${kinds.length} largest kinds, last ${d.windowDays} days`
      : "Event types over time",
    kinds.length ? null : "No per-kind series in this document.",
    section,
  );
  if (!kinds.length) return card;

  const grid = el("div", "sparks");
  for (const k of kinds) {
    const cell = el("div", "spark-cell");
    const head = el("div", "spark-head");
    // Number FIRST, name second — same order as the Kinds table, and it is the
    // order that survives the ellipsis. These heads truncate (a narrow column
    // beside a "peak N/day"), and with the name leading, Quartz's longer
    // registry names pushed the kind NUMBER off the end: "Outbox Relays ·…"
    // drops the one part of the label that is unambiguous. The full text is on
    // the title, since this is the string most likely to be cut.
    const name = kindName(k.kind, k.name);
    const label = el("span", "spark-kind", `${k.kind} · ${name}`);
    label.title = `${name} — kind ${k.kind}`;
    head.appendChild(label);
    const peak = Math.max(0, ...k.days.map((x) => x.events));
    head.appendChild(el("span", "spark-peak", `peak ${short(peak)}/day`));
    cell.appendChild(head);
    cell.appendChild(sparkline(k.days.map((x) => ({ label: x.day, value: x.events }))));
    grid.appendChild(cell);
  }
  card.appendChild(grid);
  return card;
}

/**
 * Whether ranked search can rank at all.
 *
 * The four numbers are a CHAIN — observers name providers, providers publish
 * scores, scores project onto pubkeys — and reading them together localises a
 * break that every other panel on this page is blind to. `TrustReconcile` warns
 * about exactly this failure: "a corpus mirrored before its provider lists
 * arrived stays silently unprojected, and every ranked search comes back
 * empty." A relay in that state looks perfectly healthy on the charts above.
 *
 * Drawn as a bare `.panel`, not a `.card`: four headline counts are the same
 * kind of mark as the corpus totals immediately above, so they get the same
 * bare tiles on the page background. In a card they were tiles-in-a-box —
 * their border inside the card's, both on `--surface` — which made the one
 * panel that can report the relay broken read as the busiest thing on screen.
 */
function trustCard(section) {
  const d = (section && section.data) || {};
  const card = el("div", "panel");
  cardHead(card, "Trust", null, section);

  // Plain `.tiles`, matching the corpus row's 11rem track rather than the 8rem
  // one the in-card rows use: standing on the same background at the same
  // width, the two rows have to size their tiles identically or the seam shows.
  const row = el("div", "tiles");
  for (const [key, label, help] of [
    ["observers", "Observers", "Distinct authors of a kind-10040 list naming a score provider"],
    // "Service Keys", not "Providers". The count is of KEYS that signed
    // kind-30382 scores, and one provider may sign under several of them — the
    // pubkey is what a kind-10040 list names and what this number can actually
    // vouch for, so it is what the label says.
    ["providers", "Service Keys", "Distinct authors of kind-30382 scores"],
    ["scores", "Scores", "Stored kind-30382 events"],
    ["scoredPubkeys", "Scored pubkeys", "Pubkeys carrying projected trust state — what a ranked search can order by"],
  ]) {
    const t = el("div", "tile");
    t.appendChild(el("div", "v", d[key] == null ? "—" : fmt(d[key])));
    t.appendChild(el("div", "k", label));
    t.title = help;
    row.appendChild(t);
  }
  card.appendChild(fitTiles(row));

  // The one state worth shouting about, and the reason this panel exists.
  if (d.scoredPubkeys === 0) {
    card.appendChild(el("p", "err",
      "No pubkey carries trust state, so every ranked search is falling back to unranked — " +
      (d.scores ? "scores are stored but not projected; a trust reconcile is what fixes that."
                : "no kind-30382 scores are stored yet; the mirror has not fetched them.")));
  }
  return card;
}

/**
 * The one line on this page about what the mirror is FOR, rather than how far
 * it has got: the kinds the router asks for, from its manifest.
 *
 * It is here because the number it corrects is one every reader of this relay
 * eventually computes. "Events we hold for an author" over "events their own
 * relay holds for them" is a filtered mirror over an unfiltered total, and it
 * cannot reach 100%: measured at 31,118 of 89,485 — *35%* — on a mirror that was
 * missing nothing, the whole gap being kinds nobody here ever asks for. The set
 * is what makes that comparison mean something, and `router.conf` is the only
 * place it exists.
 *
 * The kinds are NOT listed. There are ~130 of them, they are a machine's input
 * rather than a reader's, and `sync.mirrors.kinds` in the document carries them
 * for anything that actually needs the list. The count and the age are what a
 * person reads: a manifest is written once at the router's boot, so it outlives
 * the process that wrote it and a stale one still parses.
 */
function mirrorLine(mirrors) {
  if (!mirrors) return null;
  // Absent `dir` reads as down, the same way MirrorReport reads it.
  const down = (mirrors.streams || []).filter((s) => s.dir !== "up");
  const p = el("p", "card-sub");
  p.append(
    mirrors.allKinds
      ? `Mirrors every kind, across ${fmt(down.length)} stream(s) — at least one asks with no kind filter. `
      : `Mirrors ${fmt((mirrors.kinds || []).length)} kind(s), across ${fmt(down.length)} stream(s). `,
  );
  p.append("A count against this relay is comparable only when it carries the same kinds — they are in this document, under sync.mirrors. ");
  if (mirrors.writtenAt != null) {
    const when = el("span", null, `Declared ${ago(mirrors.writtenAt)}`);
    when.title = new Date(mirrors.writtenAt * 1000).toISOString();
    p.appendChild(when);
    // The router writes this once, at boot. So the age is the age of the
    // ROUTER, and an old one means the config on disk may have moved on
    // without it — not that the mirror has stalled.
    p.append(", when the router last started.");
  }
  return p;
}

/**
 * WHAT THE ROUTER IS DOING, and what became of everything the current cycle
 * took on.
 *
 * This sits above the coverage bars because it answers the questions asked
 * first and because the coverage card cannot answer any of them. Coverage is
 * accumulated across every run this router has ever made; this is one cycle,
 * live, with an outcome.
 *
 * Three readings the card is arranged to make impossible:
 *
 *  - **"16,747/16,752" as progress.** That number is legs that RETURNED, and it
 *    counts every leg that came back unreachable or capped. The stacked bar is
 *    what actually became of them, and it is drawn from members that sum to the
 *    total by construction — a stack cannot be drawn from counts that do not.
 *  - **"discovered" as "dialled".** `foldedOntoAnother` is stated on its own
 *    line, beside the host count, because most of the gap between a fan-out's
 *    two big numbers is duplicate urls rather than lost relays.
 *  - **A stopped router as a quiet one.** `staleForSec` is a heartbeat and is
 *    rendered loudly past a couple of minutes, whatever the streams claim to be
 *    doing — a phase line frozen mid-`fetching` is exactly what a dead process
 *    leaves behind.
 */
const DISPOSITION = [
  ["delivered", "delivered — reached, and it had events we did not"],
  ["nothingNew", "in sync — reached, nothing new to give"],
  // The one label that depends on the cycle's outcome — see `pendingLabel`.
  ["pending", "still in flight"],
  // Beside `pending` because both are facts about OUR pool rather than verdicts
  // about a relay. It was missing entirely: the router publishes it, the relay
  // sums it into `accountedFor`, and the bar drew nothing — so a stream with a
  // large `busy` (which is every stream with `recycleSeconds` set) rendered a
  // stack that silently failed to fill its own total.
  ["busy", "still syncing from an earlier pass — the rotation passed over it, not a verdict about the relay"],
  ["noRoute", "no route — TCP refused or the name does not resolve"],
  ["unreachable", "unreachable — never answered"],
  ["hostStruckOut", "host struck out by a sibling url this cycle — dialled again next cycle"],
  ["knownDead", "known dead — an earlier run's unreachability record is still current; retried when it ages out"],
  ["transferFailed", "answered, then the transfer broke"],
  ["torUnavailable", "our Tor proxy was down — nothing is claimed about these"],
];

/** Past this, a router that has not written its heartbeat is not running. */
const HEARTBEAT_STALE_SEC = 150;

/**
 * Past this, a leg is not slow, it is stuck — and the card says so in the loud
 * style rather than the quiet one.
 *
 * Ten minutes, the same floor the router's own log line uses, and for the same
 * reason: the slowest HEALTHY leg measured on this deployment is the full
 * purplepag.es `indexers` walk at ~10.8 minutes for 1.49M events. Anything
 * lower marks legs doing exactly what they should.
 */
const STUCK_LEG_SEC = 600;

/** How many held relays the card names before deferring to the JSON. */
const IN_FLIGHT_SHOWN = 3;

/**
 * WHICH relays are running right now, which is the half the disposition bar
 * cannot draw.
 *
 * A stacked segment says `pending: 2`; it cannot say *which two*, and that is
 * the question an operator has when a stream has received two events in eleven
 * hours. Nothing else on this page can answer it either — the coverage card
 * only draws relays that have EARNED a band, and a relay stuck mid-leg never
 * does — so a wedged url was reachable only from container logs that rotate
 * inside the hour.
 *
 * Three facts per row, because the duration alone is ambiguous: a relay with a
 * genuine backlog and one whose walk cannot terminate are both "held for
 * hours". Whether events are still ARRIVING is what separates them.
 */
function inFlightLine(inFlight) {
  const rows = (inFlight && inFlight.relays) || [];
  if (!rows.length) return null;
  const line = el("p", "cyc-line");
  line.append("Running now: ");
  rows.slice(0, IN_FLIGHT_SHOWN).forEach((r, i) => {
    if (i) line.append("; ");
    const held = r.heldForSec || 0;
    // The url first and unabbreviated: it is the thing being looked up, and a
    // truncated relay url is not a relay url.
    const span = el("span", held >= STUCK_LEG_SEC ? "err" : "");
    span.append(`${r.relay} — held ${fmtDur(held)}, ${fmt(r.events || 0)} event(s)`);
    // Absent means "not on a socket", which is a different fault from a slow
    // download and must not render as one.
    span.append(r.transferringForSec == null
      ? ", waiting for a transfer slot"
      : `, quiet ${fmtDur(r.quietForSec || 0)}`);
    span.title = r.transferringForSec == null
      ? "not admitted to the transfer pool yet — in the guards (an earlier strike, our Tor proxy, the TCP pre-probe)" +
        " or queued behind other legs. With a long hold this says our own pool is saturated, not that the relay is slow."
      : `holding a transfer slot for ${fmtDur(r.transferringForSec)}; last event ${fmtDur(r.quietForSec || 0)} ago` +
        ` (or never — the quiet clock runs from the claim when nothing has arrived).` +
        ` The connect happens inside the slot, so this covers a handshake that never completes.`;
    line.appendChild(span);
  });
  // Never silent about the tail: most of a fan-out's workers are connect
  // timeouts to dead hosts, and a list that hides them reads as the whole set.
  const more = (inFlight.omitted || 0) + Math.max(0, rows.length - IN_FLIGHT_SHOWN);
  if (more) line.append(`. ${fmt(more)} more relay(s) held and not shown`);
  line.append(".");
  return line;
}

/**
 * What `pending` means for THIS cycle.
 *
 * It is `taken` minus the eight terminal outcomes, so it always closes the
 * partition — but the same number means different things depending on whether
 * anything is still RUNNING, and the cycle's outcome alone cannot say.
 *
 * This used to key off `outcome` and nothing else, and a live run showed it
 * lying: a `completed` pass drew "285 never got a verdict" directly above a line
 * naming three of those 285 downloading at 20,000 events each. A pass ends when
 * its last url is HANDED OUT, not when its last worker returns, so a completed
 * pass routinely leaves real legs in flight — that is the rotation working. The
 * old reading is still right for the other case, a cycle that was killed with
 * nothing left running, and `inFlight` is what separates them.
 */
function pendingLabel(outcome, held) {
  if (outcome === "running" || outcome == null) return "still in flight";
  return held > 0
    ? "still in flight — the pass finished handing out, these legs are still running"
    : "never got a verdict — the cycle ended first; dialled again next cycle";
}

/** How many relays a stream is holding, named or not. */
function heldCount(inFlight) {
  if (!inFlight) return 0;
  return ((inFlight.relays || []).length) + (inFlight.omitted || 0);
}

function progressPanel(progress) {
  if (!progress) return null;
  const wrap = el("div");
  const beat = el("p", "card-sub");
  // Phrased against the ROLLUP's clock, not the reader's, because that is the
  // only clock that saw the file. `ago(writtenAt)` would fold in however long
  // this document has been cached and report a working router as dead every
  // time a rollup ran late — and the footer already says how old the document
  // is, which is the reader-side half of the same question.
  if (progress.staleForSec == null) {
    beat.append("The router published no heartbeat, so nothing here can be dated.");
  } else if (progress.staleForSec > HEARTBEAT_STALE_SEC) {
    // The loud case, and deliberately louder than the phase lines under it: a
    // stream frozen mid-`fetching` looks busy, and looks exactly the same
    // whether the process is working or gone.
    beat.appendChild(el("span", "err",
      `The router had said nothing for ${fmtDur(progress.staleForSec)} when this was computed — ` +
      `the sync process is probably not running. Everything below is what it was doing then.`));
  } else {
    beat.append(`Router heartbeat ${fmtDur(progress.staleForSec)} before this rollup.`);
  }
  beat.title = `router last wrote at ${isoOf(progress.writtenAt)}`;
  wrap.appendChild(beat);

  for (const s of progress.streams || []) {
    const box = el("div", "cyc");
    const head = el("div", "cyc-head");
    head.appendChild(el("span", "nm", s.name));
    const c = s.cycle;
    // The phase, its age, and the cycle's verdict — the three together are what
    // separate "working", "finished" and "died here".
    const outcome = c && c.outcome;
    const phase = el("span", "ph",
      `${s.phase || "unknown"}${s.phaseForSec != null ? ` for ${fmtDur(s.phaseForSec)}` : ""}` +
      (outcome && outcome !== "running" ? ` · last cycle ${outcome}` : ""));
    if (outcome === "failed") phase.className = "ph err";
    head.appendChild(phase);
    box.appendChild(head);
    // Drawn even when no cycle has run — the workers of the LAST one outlive it
    // and are exactly what a stream stuck between passes is holding, so this is
    // the case where naming them matters most.
    const running = inFlightLine(s.inFlight);
    if (!c) {
      box.appendChild(el("p", "cyc-line", "No cycle has run yet on this stream."));
      if (running) box.appendChild(running);
      wrap.appendChild(box);
      continue;
    }

    const u = c.urls || {};
    const taken = c.taken || {};
    const total = u.taken || 0;
    // What `pending` is read against — see `pendingLabel`.
    const held = heldCount(s.inFlight);
    if (total > 0) {
      const bar = el("div", "disp");
      for (const [key] of DISPOSITION) {
        const n = taken[key] || 0;
        if (!n) continue;
        const seg = el("i", key);
        seg.style.width = (n / total) * 100 + "%";
        const meaning = key === "pending" ? pendingLabel(outcome, held) : DISPOSITION.find((d) => d[0] === key)[1];
        seg.title = `${fmt(n)} of ${fmt(total)} — ${meaning}`;
        bar.appendChild(seg);
      }
      box.appendChild(bar);
      const key = el("div", "disp-key");
      for (const [k, label] of DISPOSITION) {
        const n = taken[k] || 0;
        if (!n) continue;
        const item = el("span");
        // The SAME class the bar segment carries, so one CSS rule paints both
        // and the key cannot drift from the bar. Never read back a computed
        // style here: this card is still detached from the document, so
        // `getComputedStyle` resolves nothing.
        const b = el("b", k);
        const meaning = k === "pending" ? pendingLabel(outcome, held) : label;
        item.appendChild(b);
        item.append(`${fmt(n)} ${meaning.split(" — ")[0]}`);
        item.title = meaning;
        key.appendChild(item);
      }
      box.appendChild(key);
    }

    // The line that accounts for the OTHER gap — the one between what discovery
    // found and what was dialled. On a real fan-out this is most of it, and it
    // is duplicate urls rather than relays that went missing.
    const acct = el("p", "cyc-line");
    acct.append(
      `${fmt(u.discovered || 0)} url(s) discovered · ` +
      `${fmt(u.foldedOntoAnother || 0)} folded onto another url · ` +
      // Drawn only when non-zero, like `excluded`: a mirror refusing nothing
      // should not carry a line about refusals. Worded as the measurement
      // rather than the verdict — the relay answered, it just answered twice
      // differently, and "dropped" alone would read as unreachable.
      (u.refusedUnstable ? `${fmt(u.refusedUnstable)} refused (answered inconsistently) · ` : "") +
      (u.excluded ? `${fmt(u.excluded)} excluded by config · ` : "") +
      `${fmt(total)} taken on` +
      (c.hosts != null ? ` across ${fmt(c.hosts)} host(s)` : "") +
      `. ${fmt(c.received || 0)} event(s) received at the socket` +
