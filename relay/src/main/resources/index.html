<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="Nostr search, ranked by your web of trust." />
<title>SearchOverTrust</title>
<!--
  The SearchOverTrust UI: one file, no build step, and NO http API — this page is
  a tiny Nostr client. It opens a WebSocket to the very server that serves it,
  searches with NIP-50 REQs (so the filter chips are literal `kinds` filters
  and the sort menu appends NIP-50 `sort:`/`include:spam` extensions), signs in
  automatically with NIP-07 against the relay's NIP-42 challenge — which ranks
  every search by YOUR web of trust and enrols you as a sync observer. Without
  an extension it stays anonymous and shows the whole corpus, unranked; there is
  no house lens standing in for you.

  ONE control decides whose trust ranks the page: "ranking as", defaulting to
  you and offering the pubkeys that published a kind 10040 (the only ones whose
  scores the store projects — 271 here against 12.28M profiles), applied with
  NIP-50 `observer:`. It replaced a login toggle sitting beside a lens picker,
  a pair whose off-plus-somebody combination was legal and did nothing at all.
  And
  renders every kind the index holds as a card: profiles, notes, articles,
  media, code, listings, and a generic card for the rest.

  To develop against a remote server, set RELAY_URL below to its ws:// url.
-->
<style>
  /* ---- tokens ------------------------------------------------------------ */
  :root {
    --bg: #f6f7f9;
    --surface: #fff;
    --surface-2: #f1f3f6;
    --fg: #14161a;
    --muted: #5f6675;
    --faint: #8a90a0;
    --border: #e3e6ec;
    --border-strong: #cdd2dc;
    --accent: #2563eb;
    --accent-fg: #fff;
    --accent-soft: #eaf0ff;
    --danger: #c0332b;
    --ring: rgba(37, 99, 235, .35);
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-md: 0 4px 16px rgba(16, 24, 40, .08);
    --shadow-lg: 0 18px 44px rgba(16, 24, 40, .14);
    --radius: 12px;
    --skel: linear-gradient(90deg, var(--surface-2) 25%, #e7eaf0 37%, var(--surface-2) 63%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f12;
      --surface: #15181d;
      --surface-2: #1c2028;
      --fg: #e6e8ec;
      --muted: #99a1b0;
      --faint: #6f7787;
      --border: #242932;
      --border-strong: #333a45;
      --accent: #7aa2ff;
      --accent-fg: #0d0f12;
      --accent-soft: #1a2233;
      --danger: #ff8a80;
      --ring: rgba(122, 162, 255, .4);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, .45);
      --shadow-lg: 0 18px 44px rgba(0, 0, 0, .6);
      --skel: linear-gradient(90deg, var(--surface-2) 25%, #262c36 37%, var(--surface-2) 63%);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .page { max-width: 780px; margin: 0 auto; padding: 0 16px; }

  /* ---- hero: centered while idle, a sticky bar once results are up ------- */
  .hero { padding-top: 12vh; transition: padding-top .2s ease; }
  .hero-inner { display: flex; flex-direction: column; align-items: center; }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 25px;
    font-weight: 680;
    letter-spacing: -.022em;
    color: inherit;
    text-decoration: none;
    margin-bottom: 4px;
  }
  .brand .mark { width: 1.05em; height: 1.05em; color: var(--accent); flex-shrink: 0; }
  .brand em { font-style: normal; color: var(--accent); }
  .tagline { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }

  .search-wrap { position: relative; width: 100%; }
  .search-icon {
    position: absolute; left: 17px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; color: var(--faint); pointer-events: none;
  }
  #q {
    width: 100%;
    padding: 13px 50px 13px 44px;
    font: inherit;
    font-size: 16px;
    color: var(--fg);
    border: 1px solid var(--border-strong);
    border-radius: 26px;
    outline: none;
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    transition: border-color .15s, box-shadow .15s;
  }
  #q::placeholder { color: var(--faint); }
  #q:hover { border-color: var(--muted); }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  #clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    display: none; align-items: center; justify-content: center;
    width: 26px; height: 26px; padding: 0;
    border: 0; border-radius: 50%; background: none;
    color: var(--faint); font-size: 17px; line-height: 1; cursor: pointer;
  }
  #clear:hover { background: var(--surface-2); color: var(--fg); }
  body.has-query #clear { display: flex; right: 46px; }

  /* Who you are, in the field. Signed in shows your picture; signed out shows a
     neutral mark. Clicking toggles — and signing OUT means a new connection,
     because NIP-42 auth belongs to the socket, not to the page. */
  .me {
    /* Pinned to the field's own box rather than sized in pixels: top, bottom and
       right are the same gap by construction, and stay equal if the font or the
       field padding ever changes. */
    position: absolute; right: 6px; top: 6px; bottom: 6px;
    width: auto; aspect-ratio: 1 / 1; padding: 0; border: 1px solid var(--border);
    border-radius: 50%; background: var(--surface-2); cursor: pointer;
    display: grid; place-items: center; overflow: hidden;
    color: var(--faint); font-size: 12px; font-weight: 700; line-height: 1;
    transition: border-color .15s, box-shadow .15s;
  }
  .me:hover { border-color: var(--accent); }
  .me img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .me.in { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .me.busy { opacity: .55; pointer-events: none; }

  /* ---- the control bar --------------------------------------------------- */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 8px 14px;
    width: 100%;
    margin-top: 12px;
  }
  .chips { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 12px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--fg); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .bar-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; flex-shrink: 0; }

  .select {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface) no-repeat right 8px center/9px 6px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 13px center, right 8px center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    border-radius: 8px;
    font: inherit;
    font-size: 12.5px;
    padding: 5px 24px 5px 10px;
    color: var(--muted);
    cursor: pointer;
  }
  .select:hover { border-color: var(--border-strong); color: var(--fg); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  /* "as" — whose web of trust ranks the results */
  .obsbox { position: relative; display: inline-flex; align-items: center; gap: 6px; }
  .obslabel { color: var(--muted); font-size: 13px; }
  .obscurrent { font-size: 13px; font-weight: 600; max-width: 12rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .obsbox.active .obscurrent { color: var(--accent); }
  .obsbox.anon .obsfilter { opacity: .5; pointer-events: none; }
  .obsfilter { width: 8rem; font: inherit; font-size: 13px; padding: 3px 7px; border-radius: 8px;
               border: 1px solid var(--border); background: var(--surface); color: var(--fg); }
  .obsfilter:focus { outline: 2px solid var(--ring); outline-offset: 1px; }
  .obsreset { display: none; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
  .obsbox.active .obsreset { display: inline; }
  .obslist { position: absolute; top: calc(100% + 4px); left: 0; z-index: 40; margin: 0; padding: 4px;
             list-style: none; min-width: 16rem; max-height: 15rem; overflow-y: auto;
             background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
             box-shadow: var(--shadow-md); }
  .obslist:empty { display: none; }
  .obslist li { padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .obslist li:hover { background: var(--surface-2); }
  .obslist li.muted { color: var(--faint); cursor: default; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle-track { position: relative; width: 32px; height: 19px; border-radius: 10px; background: var(--border-strong); flex-shrink: 0; transition: background .15s; }
  .toggle-thumb { position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .toggle input:checked + .toggle-track { background: var(--accent); }
  .toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(13px); }
  .toggle input:focus-visible + .toggle-track { box-shadow: 0 0 0 3px var(--ring); }
  .toggle-text { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .toggle input:checked ~ .toggle-text { color: var(--fg); }

  .whoami { font-size: 12px; color: var(--muted); margin-top: 8px; width: 100%; }
  .whoami:empty { display: none; }
  .whoami b { color: var(--fg); font-weight: 600; }
  .whoami .err { color: var(--danger); }

  /* ---- type-ahead popup --------------------------------------------------- */
  .popup {
    position: absolute;
    top: calc(100% + 8px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    z-index: 30;
    display: none;
    max-height: 62vh;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .popup.open { display: block; }
  .popup-head {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint);
    padding: 9px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; display: flex; justify-content: space-between; z-index: 1;
  }
  .popup-head .timing { font-variant-numeric: tabular-nums; }
  .popup-item {
    display: flex; gap: 11px; align-items: center;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  .popup-item:last-child { border-bottom: 0; }
  .popup-item:hover { background: var(--surface-2); }
  .popup-item.active { background: var(--surface-2); border-left-color: var(--accent); }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-weight: 550; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-about { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* A result you arrived at by clicking it in the quick popup. Fades on its own
     so the mark keeps meaning "this one" rather than becoming decoration. */
  .result.revealed {
    animation: reveal-fade 5s ease-out forwards;
  }
  @keyframes reveal-fade {
    0%   { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); }
    70%  { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); }
    100% { background: transparent; box-shadow: 0 0 0 2px transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    .result.revealed { animation: none; box-shadow: 0 0 0 2px var(--accent); }
  }

  .list-right { display: inline-flex; align-items: baseline; gap: 12px; }
  .export {
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    border-radius: 7px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .export:hover { border-color: var(--accent); color: var(--accent); }

  /* The raw event, for whoever needs it, invisible to whoever does not. */
  .raw { margin-top: 10px; }
  .raw-toggle {
    border: 0; background: none; padding: 0; cursor: pointer;
    color: var(--faint); font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
  }
  .raw-toggle:hover { color: var(--muted); text-decoration: underline; }
  .raw-body {
    margin: 8px 0 0; padding: 10px; max-height: 320px; overflow: auto;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg);
    white-space: pre-wrap; word-break: break-word;
  }

  /* A nip05 is a claim until the domain agrees; the chip is the answer. */
  .nip05 { display: inline-flex; align-items: center; gap: 5px; }
  .n5chip {
    display: inline-grid; place-items: center; min-width: 15px; height: 15px; padding: 0 4px;
    border-radius: 8px; font-size: 10px; font-weight: 800; line-height: 1;
    background: var(--surface-2); color: var(--faint);
  }
  .n5chip.ok { background: #128a4b; color: #fff; }
  .n5chip.bad { background: var(--danger); color: #fff; }
  .n5chip.unknown { background: var(--surface-2); color: var(--muted); }

  /* ---- avatars ------------------------------------------------------------ */
  .av-wrap { position: relative; display: inline-flex; flex: 0 0 auto; }
  .score-chip {
    position: absolute; right: -3px; bottom: -3px; display: none;
    min-width: 15px; height: 15px; padding: 0 3px;
    border-radius: 8px; background: var(--accent); color: var(--accent-fg);
    font-size: 9px; font-weight: 800; line-height: 15px; text-align: center;
    box-shadow: 0 0 0 2px var(--surface);
  }
  .score-chip.on { display: block; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--surface-2);
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .avatar.gen { background-image: linear-gradient(140deg, hsl(var(--h) 62% 72%), hsl(calc(var(--h) + 45) 58% 60%)); }

  /* ---- the kind badge, tinted by family so a mixed list stays scannable --- */
  .kind-badge {
    --h: 225; --s: 9%;
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .055em;
    color: hsl(var(--h) var(--s) 34%);
    background: hsl(var(--h) var(--s) 96%);
    border: 1px solid hsl(var(--h) var(--s) 88%);
    border-radius: 999px;
    padding: 1.5px 8px;
    white-space: nowrap;
  }
  @media (prefers-color-scheme: dark) {
    .kind-badge {
      color: hsl(var(--h) var(--s) 76%);
      background: hsl(var(--h) calc(var(--s) / 2) 17%);
      border-color: hsl(var(--h) calc(var(--s) / 2) 26%);
    }
  }
  [data-tone="people"]   { --h: 265; --s: 62%; }
  [data-tone="note"]     { --h: 220; --s: 62%; }
  [data-tone="article"]  { --h: 35;  --s: 68%; }
  [data-tone="media"]    { --h: 330; --s: 58%; }
  [data-tone="code"]     { --h: 152; --s: 48%; }
  [data-tone="live"]     { --h: 5;   --s: 65%; }
  [data-tone="market"]   { --h: 185; --s: 52%; }

  /* ---- results ------------------------------------------------------------ */
  .results { padding: 20px 0 64px; }
  .list-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0 2px 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .list-title { font-weight: 620; font-size: 14px; letter-spacing: -.01em; }
  .list-stats { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .result {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    transition: border-color .12s, box-shadow .12s, transform .12s;
  }
  .result:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); transform: translateY(-1px); }

  .result-header { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .result-header .avatar { width: 46px; height: 46px; }
  .result-header .who { flex: 1; min-width: 0; }
  .result-name { font-size: 16.5px; font-weight: 650; letter-spacing: -.012em; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result-name a { color: inherit; text-decoration: none; }
  .result-name a:hover { color: var(--accent); }
  .result-display { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .byline { display: flex; gap: 7px; align-items: center; margin-bottom: 8px; }
  .byline .dot { margin: 0 -2px; }
  .byline .avatar { width: 22px; height: 22px; }
  .byline .by-name { font-size: 12.5px; font-weight: 550; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .byline .by-date { font-size: 12px; color: var(--faint); flex-shrink: 0; }
  .byline .dot { color: var(--border-strong); }
  .byline .spacer { flex: 1; }

  /* centered so a title-only card doesn't leave a hole beside its thumbnail */
  .result-main { display: flex; gap: 14px; align-items: center; }
  .result-main .text { flex: 1; min-width: 0; }
  .result-title { font-size: 16px; font-weight: 620; letter-spacing: -.012em; line-height: 1.35; margin: 0 0 4px; }
  .result-title a { color: inherit; text-decoration: none; }
  .result-title a:hover { color: var(--accent); }
  .result-body { font-size: 13.5px; margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .result-body.muted { color: var(--muted); }
  .result-body.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
  .thumb {
    width: 92px; height: 92px; flex-shrink: 0;
    object-fit: cover; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--border);
  }

  .props { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 12.5px; margin: 10px 0 0; }
  .props dt { color: var(--faint); }
  .props dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .props .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .props a { color: var(--accent); text-decoration: none; }
  .props a:hover { text-decoration: underline; }

  .empty, .error { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }
  .error { color: var(--danger); }
  .empty b { display: block; color: var(--fg); font-size: 15px; font-weight: 600; margin-bottom: 4px; }

  /* ---- loading skeletons -------------------------------------------------- */
  .skel-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; margin-bottom: 10px; }
  .skel-row { display: flex; gap: 11px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .skel-line, .skel-dot {
    background: var(--skel); background-size: 400% 100%;
    animation: shimmer 1.3s linear infinite;
    border-radius: 5px; height: 10px;
  }
  .skel-card .skel-line + .skel-line { margin-top: 9px; }
  .skel-dot { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ---- searching: the hero collapses into a sticky toolbar ---------------- */
  body.searching .hero {
    position: sticky; top: 0; z-index: 20;
    padding: 10px 0 9px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  @supports (backdrop-filter: blur(8px)) {
    body.searching .hero { background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); }
  }
  body.searching .hero-inner {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    column-gap: 16px;
    row-gap: 9px;
  }
  body.searching .brand { font-size: 15.5px; gap: 7px; margin: 0; }
  body.searching .brand .full { display: none; }
  body.searching .tagline { display: none; }
  body.searching #q { padding-top: 9px; padding-bottom: 9px; font-size: 14.5px; }
  body.searching .search-icon { left: 15px; width: 15px; height: 15px; }
  body.searching .bar { grid-column: 1 / -1; margin-top: 0; }
  body.searching .whoami { grid-column: 1 / -1; margin-top: 0; }

  @media (max-width: 620px) {
    .hero { padding-top: 7vh; }
    .bar-right { width: 100%; gap: 10px 12px; }
    .select { padding-left: 8px; }
    /* the chip row scrolls sideways; fade its right edge so that reads as more */
    .chips {
      flex: 1 1 100%; margin: 0 -16px; padding: 0 16px 1px;
      mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
    }
    body.searching .hero-inner { grid-template-columns: minmax(0, 1fr); }
    body.searching .brand { display: none; }
    .result-header .avatar { width: 40px; height: 40px; }
    .thumb { width: 72px; height: 72px; }
    .props { grid-template-columns: minmax(0, 1fr); gap: 0 0; }
    .props dt { margin-top: 6px; font-size: 11px; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="page hero-inner">
    <a class="brand" href="/" aria-label="SearchOverTrust — home">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none" />
        <circle cx="4.2" cy="6.4" r="2.1" />
        <circle cx="4.2" cy="17.6" r="2.1" />
        <circle cx="19.8" cy="12" r="2.1" />
        <path d="M6.1 7.5 9.4 10.2M6.1 16.5 9.4 13.8M14.9 12h2.8" stroke-linecap="round" />
      </svg>
      <span>Search<em>Over</em>Trust</span>
    </a>
    <p class="tagline">Nostr search, ranked by your web of trust</p>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 21 21" stroke-linecap="round" />
      </svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search Nostr&hellip;" autofocus
             role="combobox" aria-expanded="false" aria-controls="popup" aria-autocomplete="list" aria-label="Search" />
      <button id="clear" type="button" aria-label="Clear search" title="Clear">&times;</button>
      <button id="me" type="button" class="me" aria-label="Sign in"></button>
      <div id="popup" class="popup" role="listbox" aria-label="Quick results"></div>
    </div>

    <div class="bar">
      <div id="chips" class="chips" role="tablist" aria-label="Filter by kind"></div>
      <div class="bar-right">
        <select id="sort" class="select" title="NIP-50 sort: extension" aria-label="Sort">
          <option value="">Best match</option>
          <option value="rank">Most trusted</option>
          <option value="rank:asc">Least trusted</option>
          <option value="followers">Followers</option>
          <option value="text">Text only</option>
        </select>
        <span id="obsbox" class="obsbox" title="Whose web of trust ranks these results. You are signed in automatically; pick somebody else to read the index through their eyes. Only pubkeys with a kind 10040 can rank anything.">
          <span class="obslabel">ranking as</span>
          <span id="obscurrent" class="obscurrent">me</span>
          <input id="obsfilter" class="obsfilter" placeholder="view as…" autocomplete="off" />
          <button id="obsreset" class="obsreset" type="button" title="Back to your own web of trust">×</button>
          <ul id="obslist" class="obslist"></ul>
        </span>
        <label class="toggle" title="NIP-50 include:spam — also show results your web of trust doesn't rank">
          <input id="spam" type="checkbox" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">include spam</span>
        </label>

      </div>
    </div>

    <div id="whoami" class="whoami" aria-live="polite"></div>
  </div>
</header>

<main class="page">
  <div id="results" class="results" hidden aria-live="polite"></div>
</main>

<script>
(() => {
  // Same-origin by default: the page is served by the relay it talks to.
  const RELAY_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/";

  const POPUP_LIMIT = 8;
  const FULL_LIMIT = 40;
  const DEBOUNCE_MS = 150;
  const REQ_TIMEOUT_MS = 10000;

  // ---- the filter chips are literal NIP-01 `kinds` filters ----------------
  const KIND_TABS = [
    { label: "Everything", kinds: null },
    { label: "People", kinds: [0] },
    { label: "Notes", kinds: [1, 11] },
    { label: "Articles", kinds: [30023, 30024, 30818] },
    { label: "Media", kinds: [20, 21, 22, 1063, 31922, 34235, 34236] },
    { label: "Code & git", kinds: [1337, 1617, 1621, 30617] },
    { label: "Live", kinds: [30311] },
  ];

  // Badge names for the kinds the index carries; anything else says "kind N".
  const KIND_LABELS = {
    0: "profile", 1: "note", 3: "follows", 11: "thread", 20: "picture", 21: "video",
    22: "short video", 40: "channel", 41: "channel", 1063: "file", 1337: "code",
    1617: "patch", 1621: "issue", 1986: "audio", 9041: "goal", 9802: "highlight",
    30000: "follow set", 30002: "relay set", 30004: "curation", 30005: "video set",
    30009: "badge", 30017: "stall", 30018: "product", 30023: "article", 30024: "draft",
    30030: "emoji pack", 30063: "release", 30311: "live", 30402: "listing",
    30617: "repository", 30818: "wiki", 31890: "feed",
    31922: "date", 31923: "event", 31924: "calendar", 31989: "app", 31990: "app",
    32267: "app", 34235: "video", 34236: "short video",
  };
  const kindLabel = (k) => KIND_LABELS[k] || `kind ${k}`;

  // A badge tint per family, so one mixed list of every kind stays scannable.
  const KIND_TONES = {
    people: [0, 3, 30000, 30002],
    note: [1, 11, 40, 41, 9802],
    article: [30023, 30024, 30818, 30004],
    media: [20, 21, 22, 1063, 1986, 30005, 30030, 34235, 34236],
    code: [1337, 1617, 1621, 30063, 30617],
    live: [30311, 31922, 31923, 31924],
    market: [9041, 30009, 30017, 30018, 30402],
  };
  const TONE_OF = {};
  for (const [tone, kinds] of Object.entries(KIND_TONES)) for (const k of kinds) TONE_OF[k] = tone;
  const kindTone = (k) => TONE_OF[k] || "";

  // ---- a minimal Nostr relay client (REQ/EOSE/CLOSE + NIP-42 AUTH) --------
  class Relay {
    constructor(url) {
      this.url = url;
      this.ws = null;
      this.subs = new Map();       // subId -> { onEvent, finish }
      this.okWaiters = new Map();  // event id -> resolver for its OK
      this.nextId = 1;
      this.challenge = null;       // the connection's NIP-42 challenge
      this.authed = false;         // did THIS connection complete NIP-42?
      this.opening = null;
      this.onclose = null;
    }

    connect() {
      if (this.ws && this.ws.readyState === WebSocket.OPEN) return Promise.resolve();
      if (this.opening) return this.opening;
      this.opening = new Promise((resolve, reject) => {
        let settled = false;
        const ws = new WebSocket(this.url);
        this.ws = ws;
        const fail = (e) => { if (!settled) { settled = true; this.opening = null; reject(e); } };
        setTimeout(() => fail(new Error("relay connect timeout")), 8000);
        ws.onopen = () => { if (!settled) { settled = true; this.opening = null; resolve(); } };
        ws.onerror = () => fail(new Error("relay connection failed"));
        ws.onclose = () => {
          fail(new Error("relay connection closed"));
          this.ws = null;
          this.challenge = null;
          this.authed = false;
          for (const s of this.subs.values()) s.finish(new Error("connection closed"));
          this.subs.clear();
          this.onclose && this.onclose();
        };
        ws.onmessage = (m) => { try { this.handle(JSON.parse(m.data)); } catch (e) {} };
      });
      return this.opening;
    }

    handle(msg) {
      switch (msg[0]) {
        case "EVENT": { const s = this.subs.get(msg[1]); if (s) s.onEvent(msg[2]); break; }
        case "EOSE": { const s = this.subs.get(msg[1]); if (s) s.finish(null); break; }
        case "CLOSED": { const s = this.subs.get(msg[1]); if (s) s.finish(new Error(msg[2] || "subscription closed")); break; }
        case "AUTH": this.challenge = msg[1]; break;
        case "OK": { const w = this.okWaiters.get(msg[1]); if (w) { this.okWaiters.delete(msg[1]); w(msg); } break; }
      }
    }

    /** One REQ, collected until EOSE (or timeout: resolve with what arrived). */
    async req(filter, timeoutMs = REQ_TIMEOUT_MS) {
      await this.connect();
      const id = "sot" + this.nextId++;
      const events = [];
      return await new Promise((resolve, reject) => {
        const finish = (err) => {
          if (!this.subs.delete(id)) return;
          clearTimeout(timer);
          try { this.ws && this.ws.send(JSON.stringify(["CLOSE", id])); } catch (e) {}
          err ? reject(err) : resolve(events);
        };
        const timer = setTimeout(() => finish(null), timeoutMs);
        this.subs.set(id, { onEvent: (ev) => events.push(ev), finish });
        this.ws.send(JSON.stringify(["REQ", id, filter]));
      });
    }

    /** NIP-42: send the signed kind-22242 and wait for its OK. */
    async auth(signed, timeoutMs = 8000) {
      await this.connect();
      return await new Promise((resolve, reject) => {
        const timer = setTimeout(() => { this.okWaiters.delete(signed.id); reject(new Error("auth timed out")); }, timeoutMs);
        this.okWaiters.set(signed.id, (msg) => {
          clearTimeout(timer);
          if (msg[2]) { this.authed = true; resolve(); } else reject(new Error(msg[3] || "auth rejected"));
        });
        this.ws.send(JSON.stringify(["AUTH", signed]));
      });
    }
  }

// ---- signed-in preference, shared across the relay's pages ----------------
// A cookie rather than localStorage: same-origin, survives a page switch, and
// the pages are served by the relay itself so there is nothing cross-site about
// it. Default is SIGNED IN — an unset cookie means "not chosen yet", and the
// useful default is the one that makes ranking work.
const AUTH_COOKIE = "sot_signedin";
function wantsSignIn() {
  const m = document.cookie.match(/(?:^|;\s*)sot_signedin=([01])/);
  return m ? m[1] === "1" : true;
}
function rememberSignIn(yes) {
  document.cookie = `${AUTH_COOKIE}=${yes ? 1 : 0}; path=/; max-age=31536000; SameSite=Lax`;
}

  const relay = new Relay(RELAY_URL);

  // ---- NIP-07 login -> NIP-42 auth -----------------------------------------
  // Signing the challenge switches the CONNECTION's ranking observer to you
  // (and enrolls you: the relay starts syncing your trust chain).
  let me = null; // authenticated hex pubkey

  // A dropped socket loses the AUTH, not the identity. Keeping `me` means the
  // page still knows who you are and re-authenticates on the next request,
  // instead of silently dropping you to UNRANKED results with nothing on screen
  // to say the results changed meaning. That downgrade got sharper when the
  // relay stopped applying a default observer: signed out is now the whole
  // corpus with no trust applied, not someone else's ranking of it.
  relay.onclose = () => { renderWhoami(); };

  async function waitForChallenge(ms) {
    const t0 = Date.now();
    while (!relay.challenge && Date.now() - t0 < ms) await new Promise(r => setTimeout(r, 100));
    return relay.challenge;
  }

  // Sign the CURRENT challenge and send it, retrying if the connection changed
  // underneath us.
  //
  // NIP-07 signing waits on a human clicking approve in an extension popup,
  // which is seconds — and a challenge belongs to one connection. If the socket
  // is replaced in that window (an idle drop, or the relay restarting), the
  // signature we are about to send is for a challenge the server has never
  // heard of, and it answers "invalid: challenge does not match". Re-reading
  // the challenge after signing and retrying against the new one is the whole
  // fix; without it the only recovery is for the user to click again.
  async function signAndAuth(attempt = 0, waitMs = 3000) {
    const challenge = await waitForChallenge(waitMs);
    if (!challenge) throw new Error("The relay sent no NIP-42 challenge");
    const signed = await window.nostr.signEvent({
      kind: 22242,
      created_at: Math.floor(Date.now() / 1000),
      content: "",
      tags: [["relay", RELAY_URL], ["challenge", challenge]],
    });
    if (relay.challenge !== challenge) {
      // Two tries only: a socket flapping faster than a person can click is a
      // broken relay, and looping would just spam the signer.
      if (attempt >= 1) throw new Error("The connection kept resetting while signing — try again");
      await relay.connect();
      return signAndAuth(attempt + 1);
    }
    await relay.auth(signed);
    return signed.pubkey;
  }

  async function login() {
    if (!(window.nostr && window.nostr.signEvent)) throw new Error("No Nostr extension found (window.nostr / NIP-07)");
    await relay.connect();
    // A CLICK gets a longer wait than a background attempt. The socket may have
    // only just opened — the page does not connect at all until something needs
    // it — and the AUTH challenge is a message that arrives after the handshake,
    // so a 3s budget was being spent on connecting rather than waiting, and the
    // first press simply failed. That is why it took a few presses.
    me = await signAndAuth(0, 10000);
    renderWhoami();
    // Our own face, fetched fresh and AWAITED. enrichProfiles skips a pubkey it
    // has already seen — including one recorded as `null` by a lookup that ran
    // before this account was on screen — so a cached miss survived signing in
    // and the avatar kept the old face until a reload. Deleting first forces
    // the re-read; awaiting means the caller can rely on it being done.
    profiles.delete(me);
    try { await enrichProfiles([me]); } catch (e) {}
    renderWhoami();
  }

  // Signed in automatically, once, best effort.
  //
  // There used to be an "as me" toggle next to this that meant "authenticate",
  // and a separate picker that meant "rank as somebody". Off + somebody was a
  // legal combination that did NOTHING: the lens needs an authenticated reader,
  // so the picker silently had no effect. One thing you choose (whose trust) and
  // one thing that just happens (being signed in) is the same feature without
  // the inert corner.
  //
  // A relay read is still fine without an extension — it is the whole corpus,
  // unranked — so a failure here downgrades rather than blocks, and says so.
  let loginTried = false;
  async function ensureLogin() {
    if (loginTried) { if (!me) return; }
    await relay.connect();
    if (!loginTried) {
      loginTried = true;
      // A remembered "signed out" is a decision, not an absence — respect it
      // rather than prompting the extension on every page load.
      if (!wantsSignIn()) { $obsBox.classList.add("anon"); renderWhoami(); return; }
      if (!(window.nostr && window.nostr.signEvent)) {
        $obsBox.classList.add("anon");
        renderWhoami();
        return;
      }
      try { await login(); } catch (e) {
        me = null;
        $obsBox.classList.add("anon");
        $whoami.innerHTML = `<span class="err">${esc(e.message || String(e))} — showing the whole corpus, unranked</span>`;
        return;
      }
    }
    if (!me) return;
    // Keyed on the CONNECTION's auth state, not on whether we remember a
    // pubkey: a reconnect leaves `me` set but the new socket unauthenticated,
    // and searching then really would rank by nobody — there is no default
    // observer behind it any more.
    if (relay.authed) return;
    me = await signAndAuth();
    renderWhoami();
  }

  // ---- search over NIP-50 ---------------------------------------------------
  let tab = KIND_TABS[0];

  function searchString(text) {
    const sort = $sort.value;
    let s = text;
    if (sort) s += " sort:" + sort;
    if ($spam.checked) s += " include:spam";
    // Whose web of trust ranks this. Absent, the store uses the connection's
    // authenticated pubkey — you. Present, it uses theirs, which is how you
    // read the index through somebody else's eyes without holding their key.
    //
    // Only sent while signed in. search() awaits ensureLogin() first, so this
    // holds in practice; asserting it here means a future caller that skips
    // that step degrades to your own ranking rather than sending a lens the
    // store has no authenticated reader to apply it for.
    if (viewingAs && me) s += " observer:" + viewingAs;
    return s;
  }

  async function search(text, limit) {
    await ensureLogin();
    const filter = { search: searchString(text), limit };
    if (tab.kinds) filter.kinds = tab.kinds;
    const events = await relay.req(filter);
    seedProfiles(events);
    await enrichProfiles(events.filter(e => e.kind !== 0).map(e => e.pubkey));
    return events;
  }

  // ---- viewing as somebody else -------------------------------------------
  //
  // Only a pubkey that has published a kind 10040 is a usable observer: that
  // event is what names the services whose scores the store projects. Anyone
  // else ranks nothing, so offering them would be offering an empty feed.
  //
  // The whole set is small enough to hold — 271 of them on this relay against
  // 12.28M profiles — so it is fetched once and filtered by name in the page.
  // A server-side name search would have to join kind 0 against kind 10040,
  // which NIP-01 filters cannot express in one REQ.
  let viewingAs = null;         // hex pubkey, or null for "as me"
  let observers = null;         // [{pubkey, name}] once loaded

  // npub, never hex. A 64-char hash is not an identifier a person picks from a
  // list, and it is not what any other Nostr client would show them.
  const B32 = "qpzry9x8gf2tvdw0s3jn54khce6mua7l";
  function bech32(hrp, hex) {
    const bytes = hex.match(/../g).map((h) => parseInt(h, 16));
    // 8-bit -> 5-bit regrouping, then bech32's checksum over hrp + payload.
    const words = [];
    let acc = 0, bits = 0;
    for (const b of bytes) {
      acc = (acc << 8) | b; bits += 8;
      while (bits >= 5) { bits -= 5; words.push((acc >> bits) & 31); }
    }
    if (bits) words.push((acc << (5 - bits)) & 31);
    const polymod = (v) => {
      const GEN = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];
      let chk = 1;
      for (const x of v) {
        const top = chk >> 25;
        chk = ((chk & 0x1ffffff) << 5) ^ x;
        for (let i = 0; i < 5; i++) if ((top >> i) & 1) chk ^= GEN[i];
      }
      return chk;
    };
    const expand = [...hrp].map((c) => c.charCodeAt(0) >> 5).concat([0], [...hrp].map((c) => c.charCodeAt(0) & 31));
    const chk = polymod(expand.concat(words, [0, 0, 0, 0, 0, 0])) ^ 1;
    const sum = Array.from({ length: 6 }, (_, i) => (chk >> (5 * (5 - i))) & 31);
    return hrp + "1" + words.concat(sum).map((w) => B32[w]).join("");
  }
  // NIP-19 identifiers, never hex. `note` is the bare event id; nevent/naddr
  // carry TLV hints this page has nothing to put in, so the plain forms are the
  // honest ones.
  const npub = (hex) => bech32("npub", hex);
  const noteId = (hex) => bech32("note", hex);
  const shortB32 = (v) => v.slice(0, 12) + "…" + v.slice(-6);
  const shortNpub = (hex) => shortB32(npub(hex));
  const shortNote = (hex) => shortB32(noteId(hex));

  async function loadObservers() {
    if (observers) return observers;
    // Read on an ANONYMOUS connection, deliberately.
    //
    // The shared `relay` socket is authenticated, and the store gates an
    // authenticated reader to authors that reader has scored — so asking there
    // returned only the observers YOU already trust. The one list that must not
    // be personalised is the list of lenses you could switch to; a picker that
    // hides everyone you have not met is a picker that can never introduce you
    // to anyone.
    const anon = new Relay(RELAY_URL);
    await anon.connect();
    let lists, profileEvents = [];
    try {
      lists = await anon.req({ kinds: [10040], limit: 2000 });
      const ks = [...new Set(lists.map((e) => e.pubkey))];
      for (let i = 0; i < ks.length; i += 200) {
        profileEvents = profileEvents.concat(await anon.req({ kinds: [0], authors: ks.slice(i, i + 200), limit: 200 }));
      }
    } finally {
      if (anon.ws) anon.ws.close();
    }
    seedProfiles(profileEvents);
    const keys = [...new Set(lists.map((e) => e.pubkey))];
    observers = keys.map(pubkey => {
      const p = profiles.get(pubkey);
      return { pubkey, name: displayName(p), nip05: (p?.nip05 || "").trim() };
    }).sort((a, b) => (a.name || "\uffff").localeCompare(b.name || "\uffff"));
    return observers;
  }

  function renderObserverOptions(filterText) {
    const q = filterText.trim().toLowerCase();
    const hits = (observers || []).filter(o =>
      !q || o.name.toLowerCase().includes(q) || (o.nip05 || "").toLowerCase().includes(q) ||
      npub(o.pubkey).startsWith(q) || o.pubkey.startsWith(q));
    $obsList.innerHTML = "";
    for (const o of hits.slice(0, 50)) {
      const li = document.createElement("li");
      // Name, else nip05, else a short npub. Never the hex.
      li.textContent = o.name || o.nip05 || shortNpub(o.pubkey);
      li.title = npub(o.pubkey);
      li.onclick = () => { setViewingAs(o.pubkey, o.name || o.nip05 || shortNpub(o.pubkey)); };
      $obsList.appendChild(li);
    }
    if (!hits.length) {
      const li = document.createElement("li");
      li.className = "muted";
      li.textContent = observers ? "no observer matches" : "loading observers…";
      $obsList.appendChild(li);
    }
  }

  function setViewingAs(pubkey, name) {
    viewingAs = pubkey;
    $obsBox.classList.toggle("active", !!pubkey);
    $obsCurrent.textContent = pubkey ? (name || shortNpub(pubkey)) : "me";
    $obsList.innerHTML = "";
    $obsFilter.value = "";
    rerun();
  }

  // ---- author profiles (kind-0 cache + batched enrichment REQ) -------------
  const profiles = new Map(); // pubkey -> {name, display_name, picture, nip05, about, website, lud16}

  /**
   * The one name to show when there is room for one.
   *
   * `display_name` first, `name` as the fallback — and blank means blank, so a
   * profile carrying `display_name: "   "` falls through instead of rendering a
   * gap. Three call sites had this the other way round and disagreed with the
   * rest of the page about what somebody is called.
   *
   * Where BOTH are shown — the profile card — this gives the primary and the
   * other is rendered beside it.
   */
  const displayName = (p) => (p && (p.display_name || "").trim()) || (p && (p.name || "").trim()) || "";

  function parseProfile(ev) {
    let c = {};
    try { c = JSON.parse(ev.content) || {}; } catch (e) {}
    return {
      name: c.name || c.username || "",
      display_name: c.display_name || c.displayName || "",
      picture: c.picture || "",
      nip05: c.nip05 || "",
      about: c.about || "",
      website: c.website || "",
      lud16: c.lud16 || "",
      created_at: ev.created_at,
    };
  }

  function seedProfiles(events) {
    for (const ev of events) {
      if (ev.kind !== 0) continue;
      const known = profiles.get(ev.pubkey);
      if (!known || known.created_at <= ev.created_at) profiles.set(ev.pubkey, parseProfile(ev));
    }
  }

  async function enrichProfiles(pubkeys) {
    const missing = [...new Set(pubkeys)].filter(p => p && !profiles.has(p));
    if (!missing.length) return;
    let asked = false;
    try {
      // Anonymous, like every other reference lookup. A displayed author's name
      // and face are not a personalised question, and the authenticated socket
      // gates kind 0 to authors the reader has scored — so with "include spam"
      // on, results would render nameless and faceless for exactly the people
      // you have not rated.
      const conn = await refConn();
      const found = await conn.req({ kinds: [0], authors: missing, limit: missing.length }, 5000);
      seedProfiles(found);
      asked = true;
    } catch (e) { asked = false; }
    // Cache "no profile" ONLY when the relay actually answered. This used to
    // record null on failure too, so one dropped lookup meant that pubkey had
    // no face for the rest of the session — which is what made signing in
    // appear to need a page refresh: the very first attempt poisoned the entry
    // for your own key, and every later render read the poison.
    if (asked) for (const p of missing) if (!profiles.has(p)) profiles.set(p, null);
  }

  // ---- rendering ------------------------------------------------------------
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  const clip = (s, n) => { s = String(s || "").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
  // njump reads NIP-19 identifiers, so the link and the label agree.
  const njumpKey = (hex) => `https://njump.me/${esc(npub(hex))}`;
  const njumpNote = (hex) => `https://njump.me/${esc(noteId(hex))}`;

  const dateOf = (ev) => new Date(ev.created_at * 1000);
  const fullDate = (ev) => dateOf(ev).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  /** Recent events read better relative; older ones as a plain date. */
  function when(ev) {
    const secs = Math.max(0, Date.now() / 1000 - ev.created_at);
    const mins = secs / 60, hours = mins / 60, days = hours / 24;
    if (mins < 1) return "just now";
    if (mins < 60) return `${Math.floor(mins)}m ago`;
    if (hours < 24) return `${Math.floor(hours)}h ago`;
    if (days < 30) return `${Math.floor(days)}d ago`;
    return dateOf(ev).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  const firstTag = (ev, ...names) => {
    for (const name of names) for (const t of ev.tags) if (t[0] === name && t[1]) return t[1];
    return null;
  };
  const titleOf = (ev) => firstTag(ev, "title", "name", "subject") || firstTag(ev, "d");
  const summaryOf = (ev) => firstTag(ev, "summary", "description", "alt");
  const imageOf = (ev) => firstTag(ev, "image", "thumb", "picture", "icon");

  function authorOf(ev) {
    const p = profiles.get(ev.pubkey);
    const name = displayName(p) || shortNpub(ev.pubkey);
    return { name, picture: (p && p.picture) || "" };
  }

  // ---- trust scores, as the ACTIVE LENS sees them -------------------------
  //
  // The chip on a face answers "what does this ranking think of them", which is
  // the question the whole relay is organised around and was nowhere on screen.
  // The lens is whoever the page is reading as: you, or the observer picked in
  // "ranking as" — the same key that ranks the results, so the chip and the
  // order can never disagree.
  //
  // Read ANONYMOUSLY. A score is a fact about a subject, not about the reader,
  // and asking on the authenticated socket would gate the lookup to authors the
  // reader already scored — which is circular: you would only see scores for
  // people you had already scored.
  const scores = new Map();          // pubkey -> number | null (null = no score)
  let scoreLensKey = null;           // whose lens `scores` was built for
  const rankServices = new Map();    // observer pubkey -> rank service pubkey | null
  let refRelay = null;

  async function refConn() {
    if (refRelay && refRelay.ws && refRelay.ws.readyState === 1) return refRelay;
    refRelay = new Relay(RELAY_URL);
    await refRelay.connect();
    return refRelay;
  }

  /** The `30382:rank` service an observer trusts, from their kind 10040. */
  async function rankServiceOf(observer) {
    if (rankServices.has(observer)) return rankServices.get(observer);
    let svc = null;
    try {
      const conn = await refConn();
      const [ev] = await conn.req({ kinds: [10040], authors: [observer], limit: 1 });
      svc = (ev?.tags || []).find(t => t[0] === "30382:rank")?.[1] || null;
    } catch (e) { svc = null; }
    rankServices.set(observer, svc);
    return svc;
  }

  /** Fill in any score chips currently on the page. */
  async function paintScores() {
    const lens = viewingAs || me;
    if (scoreLensKey !== lens) { scores.clear(); scoreLensKey = lens; }
    const chips = [...document.querySelectorAll(".score-chip[data-pk]")];
    if (!lens || !chips.length) return;
    const svc = await rankServiceOf(lens);
    if (!svc) return;                     // this lens ranks nothing; no chips
    const need = [...new Set(chips.map(c => c.dataset.pk))].filter(pk => !scores.has(pk));
    for (let i = 0; i < need.length; i += 100) {
      const batch = need.slice(i, i + 100);
      let evs = [];
      try {
        const conn = await refConn();
        evs = await conn.req({ kinds: [30382], authors: [svc], "#d": batch, limit: batch.length });
      } catch (e) { /* leave them unknown rather than wrong */ }
      const seen = new Set();
      for (const ev of evs) {
        const d = (ev.tags || []).find(t => t[0] === "d")?.[1];
        const rank = (ev.tags || []).find(t => t[0] === "rank")?.[1];
        if (!d) continue;
        seen.add(d);
        scores.set(d, rank == null ? null : Number(rank));
      }
      for (const pk of batch) if (!seen.has(pk)) scores.set(pk, null);
    }
    for (const c of chips) {
      const v = scores.get(c.dataset.pk);
      if (v == null || Number.isNaN(v)) { c.textContent = ""; c.classList.remove("on"); continue; }
      c.textContent = v;
      c.classList.add("on");
      c.title = `trust ${v} — as ${viewingAs ? "the observer you are viewing as" : "you"} rank them`;
    }
  }

  // ---- NIP-05 verification -------------------------------------------------
  //
  // A nip05 in a profile is a CLAIM: "this name at this domain is me". It is
  // only worth anything once the domain agrees, and until now the page rendered
  // the claim as though it were the answer.
  //
  // Checked lazily, when the profile scrolls into view — one fetch per identity
  // per session, no more. Doing it at render time would fire a request per
  // result for profiles nobody looks at, against domains that did not ask to be
  // polled by a search page.
  //
  // Three outcomes, not two. A domain that cannot be reached — offline, no CORS
  // header, bad TLS — is NOT a failed claim, and marking it invalid would
  // accuse people of lying because their web server is down.
  const nip05Cache = new Map();   // "name@domain|pubkey" -> "ok" | "bad" | "unknown"

  async function checkNip05(addr, pubkey) {
    const key = `${addr}|${pubkey}`;
    if (nip05Cache.has(key)) return nip05Cache.get(key);
    const at = addr.lastIndexOf("@");
    const local = at < 0 ? "_" : addr.slice(0, at);
    const domain = at < 0 ? addr : addr.slice(at + 1);
    let verdict = "unknown";
    if (/^[a-z0-9._-]+$/i.test(local) && /^[a-z0-9.-]+\.[a-z]{2,}$/i.test(domain)) {
      try {
        const ctl = AbortSignal.timeout ? AbortSignal.timeout(6000) : undefined;
        const r = await fetch(`https://${domain}/.well-known/nostr.json?name=${encodeURIComponent(local)}`,
                              { signal: ctl, referrerPolicy: "no-referrer" });
        if (r.ok) {
          const j = await r.json();
          const claimed = j && j.names && j.names[local];
          // Absent or mismatched are both a failed claim; only a reachable
          // domain can produce one.
          verdict = claimed && claimed.toLowerCase() === pubkey.toLowerCase() ? "ok" : "bad";
        }
      } catch (e) { verdict = "unknown"; }
    }
    nip05Cache.set(key, verdict);
    return verdict;
  }

  const NIP05_MARK = { ok: ["✓", "verified by the domain"], bad: ["✗", "the domain does not claim this pubkey"], unknown: ["?", "could not reach the domain to check"] };

  // One observer for the page: elements register themselves by existing.
  const nip05Watcher = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      const el = en.target;
      nip05Watcher.unobserve(el);
      const { addr, pk } = el.dataset;
      checkNip05(addr, pk).then((v) => {
        const [mark, why] = NIP05_MARK[v];
        const chip = el.querySelector(".n5chip");
        if (!chip) return;
        chip.textContent = mark;
        chip.className = `n5chip ${v}`;
        chip.title = why;
      });
    }
  }, { rootMargin: "120px" });

  /** Hand any freshly rendered nip05 elements to the watcher. */
  function watchNip05() {
    for (const el of document.querySelectorAll(".nip05[data-addr]:not([data-watched])")) {
      el.setAttribute("data-watched", "1");
      nip05Watcher.observe(el);
    }
  }

  /** A pubkey-derived hue, so a missing picture is still a stable, distinct face. */
  const hueOf = (seed) => (parseInt(String(seed || "").slice(0, 4), 16) || 0) % 360;
  const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";

  /** A broken picture falls back to the same generated face, in place. */
  function avatarHtml(pic, seed) {
    const style = `style="--h:${hueOf(seed)}"`;
    const face = pic
      ? `<img class="avatar" ${style} src="${esc(pic)}" alt="" loading="lazy" referrerpolicy="no-referrer"
           onerror="this.classList.add('gen');this.src='${BLANK}'" />`
      : `<div class="avatar gen" ${style}></div>`;
    // The chip is painted after the fact by paintScores(): the score is a second
    // round trip, and a face should not wait on it.
    return `<span class="av-wrap">${face}<span class="score-chip" data-pk="${esc(seed || "")}"></span></span>`;
  }

  const badgeHtml = (ev) => `<span class="kind-badge" data-tone="${kindTone(ev.kind)}">${esc(kindLabel(ev.kind))}</span>`;

  /**
   * The raw event, one click away on every result.
   *
   * Deliberately quiet — a small grey word, not a button. Nobody reading search
   * results wants it, and everybody debugging one does: what the relay actually
   * returned, tags and sig included, without a console or a second client.
   * Filled on demand rather than inlined into every card, so a page of results
   * does not carry a second copy of itself in the DOM.
   */
  /**
   * The whole search, written out so somebody else can argue with it.
   *
   * The point is not a backup — it is handing a ranked list to a reader who was
   * not here and letting them judge the ORDER. That takes more than the titles:
   * what was asked, whose web of trust was applied, what each author scores
   * under that lens, and how old each result is. Rank without the inputs is
   * just a list.
   *
   * Text, not JSON: the intended reader is a person or a model reasoning about
   * whether position 7 deserves to be above position 3, and prose beats a
   * structure they have to re-derive. The raw event stays one click away.
   */
  function exportText() {
    const lens = viewingAs || me;
    const nameOf = (k) => displayName(profiles.get(k)) || "";
    const L = [];
    L.push("SEARCH-OVER-TRUST EXPORT");
    L.push(`taken           ${new Date().toISOString()}`);
    L.push(`relay           ${RELAY_URL}`);
    L.push("");
    L.push("QUERY AS CONFIGURED");
    L.push(`  terms         ${JSON.stringify($q.value.trim())}`);
    L.push(`  tab           ${tab.label}${tab.kinds ? ` (kinds ${tab.kinds.join(", ")})` : " (all kinds)"}`);
    L.push(`  sort          ${$sort.value || "(relevance — NIP-50 default)"}`);
    L.push(`  include spam  ${$spam.checked ? "yes — unranked authors included" : "no — trust floor applied"}`);
    L.push(`  signed in as  ${me ? `${nameOf(me) || "(no name)"}  ${npub(me)}` : "(anonymous — no web of trust applied)"}`);
    L.push(`  ranking as    ${lens ? `${nameOf(lens) || "(no name)"}  ${npub(lens)}` : "(nobody)"}`);
    L.push(`  search string ${JSON.stringify(searchString($q.value.trim()))}`);
    L.push(`  full filter   ${JSON.stringify({ search: searchString($q.value.trim()), limit: FULL_LIMIT, ...(tab.kinds ? { kinds: tab.kinds } : {}) })}`);
    L.push("");
    // Whose scores produced this order, listed once rather than repeated per
    // result — and kept OUT of the events themselves, which are reproduced
    // exactly as the relay sent them. Annotating an event with a number the
    // relay never put there would be inventing evidence.
    const authors = [...new Set(s.hits.map((e) => e.pubkey))];
    if (lens) {
      L.push("AUTHOR SCORES UNDER THIS LENS");
      for (const a of authors) {
        const sc = scores.get(a);
        L.push(`  ${npub(a)}  ${sc == null ? "(no score)" : sc}  ${nameOf(a) || ""}`.trimEnd());
      }
      L.push("");
    }
    L.push(`RESULTS  ${s.hits.length} event(s) in ${s.lastMs ?? "?"} ms, in the order the relay returned them.`);
    L.push("Verbatim, unmodified — this is the array the page is rendering.");
    L.push("");
    L.push(JSON.stringify(s.hits, null, 2));
    L.push("");
    L.push("QUESTION FOR THE READER");
    L.push("  Is this order defensible? The relay ranks under the lens named above,");
    L.push("  by the author scores listed above — not by recency or text relevance");
    L.push("  alone. A result placed above another whose author scores higher, or a");
    L.push("  low-scoring author near the top, is worth challenging.");
    L.push("  The events are verbatim: nothing has been trimmed or annotated.");
    return L.join("\n");
  }

  const jsonHtml = (ev) =>
    `<div class="raw"><button type="button" class="raw-toggle" data-id="${esc(ev.id)}">json</button>` +
    `<pre class="raw-body" hidden></pre></div>`;

  /** The shared author line: avatar, name, date, kind badge. */
  function bylineHtml(ev) {
    const a = authorOf(ev);
    return `
      <div class="byline">
        ${avatarHtml(a.picture, ev.pubkey)}
        <span class="by-name">${esc(a.name)}</span>
        <span class="dot">·</span>
        <span class="by-date" title="${esc(fullDate(ev))}">${esc(when(ev))}</span>
        <span class="spacer"></span>
        ${badgeHtml(ev)}
      </div>`;
  }

  /** kind 0 — the profile card (rendered purely from the event, no server-side numbers). */
  function profileCard(ev) {
    const p = parseProfile(ev);
    const name = displayName(p) || shortNpub(ev.pubkey);
    const props = [];
    if (p.nip05) {
      props.push(["nip05",
        `<span class="nip05" data-addr="${esc(p.nip05)}" data-pk="${esc(ev.pubkey)}">` +
        `${esc(p.nip05)}<span class="n5chip checking" title="checking with the domain…">…</span></span>`]);
    }
    if (p.website) props.push(["website", `<a href="${esc(p.website)}" target="_blank" rel="noopener noreferrer">${esc(p.website)}</a>`]);
    if (p.lud16) props.push(["lightning", esc(p.lud16)]);
    props.push(["pubkey", `<a class="mono" href="${njumpKey(ev.pubkey)}" target="_blank" rel="noopener noreferrer" title="${esc(npub(ev.pubkey))}">${esc(shortNpub(ev.pubkey))}</a>`]);
    return `
      <article class="result" data-id="${esc(ev.id)}">
        <div class="result-header">
          ${avatarHtml(p.picture, ev.pubkey)}
          <div class="who">
            <h2 class="result-name"><a href="${njumpKey(ev.pubkey)}" target="_blank" rel="noopener noreferrer">${esc(name)}</a></h2>
            ${(p.name || "").trim() && (p.name || "").trim() !== name ? `<div class="result-display">${esc(p.name)}</div>` : ""}
          </div>
          ${badgeHtml(ev)}
        </div>
        ${p.about ? `<div class="result-body clamp">${esc(clip(p.about, 400))}</div>` : ""}
        <dl class="props">${props.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
        ${jsonHtml(ev)}
      </article>`;
  }

  /** kinds 1/11 — the note card: author byline + the text itself. */
  function noteCard(ev) {
    return `
      <article class="result" data-id="${esc(ev.id)}">
        ${bylineHtml(ev)}
        <div class="result-body">${esc(clip(ev.content, 500))}</div>
        <dl class="props"><dt>note</dt><dd><a class="mono" href="${njumpNote(ev.id)}" target="_blank" rel="noopener noreferrer" title="${esc(noteId(ev.id))}">${esc(shortNote(ev.id))}</a></dd></dl>
        ${jsonHtml(ev)}
      </article>`;
  }

  /**
   * Everything else — the generic card that makes "all indexed kinds" render:
   * byline, the event's title-ish tag, its summary-ish tag (else the content),
   * and an image when the tags carry one. Exactly the fields the extractors
   * index, so what matched is what shows.
   */
  function genericCard(ev) {
    const title = titleOf(ev);
    const summary = summaryOf(ev);
    const body = summary || clip(ev.content, 400);
    const img = imageOf(ev);
    return `
      <article class="result" data-id="${esc(ev.id)}">
        ${bylineHtml(ev)}
        <div class="result-main">
          <div class="text">
            ${title ? `<h2 class="result-title"><a href="${njumpNote(ev.id)}" target="_blank" rel="noopener noreferrer">${esc(clip(title, 120))}</a></h2>` : ""}
            ${body ? `<div class="result-body clamp${summary ? " muted" : ""}">${esc(clip(body, 400))}</div>` : ""}
          </div>
          ${img ? `<img class="thumb" src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()" />` : ""}
        </div>
        ${!title ? `<dl class="props"><dt>id</dt><dd><a class="mono" href="${njumpNote(ev.id)}" target="_blank" rel="noopener noreferrer" title="${esc(noteId(ev.id))}">${esc(shortNote(ev.id))}</a></dd></dl>` : ""}
        ${jsonHtml(ev)}
      </article>`;
  }

  function card(ev) {
    if (ev.kind === 0) return profileCard(ev);
    if (ev.kind === 1 || ev.kind === 11) return noteCard(ev);
    return genericCard(ev);
  }

  /** The type-ahead row: works for every kind (profiles show their own face). */
  function popupRow(ev, idx) {
    let pic, name, sub;
    if (ev.kind === 0) {
      const p = parseProfile(ev);
      pic = p.picture; name = displayName(p) || shortNpub(ev.pubkey); sub = p.about;
    } else {
      const a = authorOf(ev);
      pic = a.picture; name = titleOf(ev) || clip(ev.content, 60) || a.name; sub = titleOf(ev) ? (summaryOf(ev) || clip(ev.content, 60)) : a.name;
    }
    return `
      <div class="popup-item" data-idx="${idx}" role="option">
        ${avatarHtml(pic, ev.pubkey)}
        <div class="row-main">
          <div class="row-name">${esc(clip(name, 80))}</div>
          <div class="row-about">${esc(clip(sub || "", 90))}</div>
        </div>
        ${badgeHtml(ev)}
      </div>`;
  }

  // ---- page state + wiring ---------------------------------------------------
  const $q = document.getElementById("q");
  const $clear = document.getElementById("clear");
  const $popup = document.getElementById("popup");
  const $results = document.getElementById("results");
  const $chips = document.getElementById("chips");
  const $sort = document.getElementById("sort");
  const $spam = document.getElementById("spam");
  const $whoami = document.getElementById("whoami");
  const $me = document.getElementById("me");

  /** The avatar in the field: your picture signed in, a neutral mark signed out. */
  function renderMe() {
    const p = me ? profiles.get(me) : null;
    const nm = displayName(p);
    $me.classList.toggle("in", !!me);
    if (me && p && p.picture) {
      $me.innerHTML = `<img src="${esc(p.picture)}" alt="" onerror="this.remove()"/>`;
    } else if (me) {
      $me.textContent = (nm || npub(me)).slice(0, 2).toUpperCase();
    } else {
      // A person outline, not two dots: "no account" should look like an empty
      // seat, and a dot pair looked like something still loading.
      $me.innerHTML =
        `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"` +
        ` stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
        `<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
    }
    $me.title = me
      ? `Signed in as ${nm || shortNpub(me)} — click to sign out (reconnects)`
      : loginTried
        ? "Signed out — click to sign in with your Nostr extension"
        : "Signing in…";
    $me.setAttribute("aria-label", me ? "Sign out" : "Sign in");
  }

  // NIP-42 auth belongs to the SOCKET, so signing out is a reconnect, not a
  // flag. Anything less would leave the relay still treating the connection as
  // authenticated while the page claimed otherwise.
  $me.addEventListener("click", async () => {
    $me.classList.add("busy");
    try {
      if (me) {
        rememberSignIn(false);
        me = null;
        viewingAs = null;
        setViewingAs(null, null);
        if (relay.ws) relay.ws.close();
        await relay.connect();
      } else {
        rememberSignIn(true);
        loginTried = true;
        await login();
      }
    } catch (e) {
      me = null;
      $whoami.innerHTML = `<span class="err">${esc(e.message || String(e))}</span>`;
    } finally {
      $me.classList.remove("busy");
      renderMe();
      renderWhoami();
      rerun();
    }
  });
  const $obsBox = document.getElementById("obsbox");
  const $obsCurrent = document.getElementById("obscurrent");
  const $obsFilter = document.getElementById("obsfilter");
  const $obsList = document.getElementById("obslist");
  const $obsReset = document.getElementById("obsreset");

  // Loaded lazily: the picker is a power feature, and 271 REQs' worth of
  // profiles should not be on the path of somebody who just wants to search.
  $obsFilter.addEventListener("focus", async () => {
    renderObserverOptions($obsFilter.value);
    await loadObservers();
    renderObserverOptions($obsFilter.value);
  });
  $obsFilter.addEventListener("input", () => renderObserverOptions($obsFilter.value));
  $obsReset.addEventListener("click", () => setViewingAs(null, null));
  // Dismissed like any other popup. It is absolutely positioned over the page,
  // so without this it sat open over whatever you clicked next.
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#obsbox")) $obsList.innerHTML = "";
  });
  $obsFilter.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { $obsList.innerHTML = ""; $obsFilter.blur(); }
  });

  const s = { requestId: 0, hits: [], lastMs: null, loading: false, error: null };
  let debounceTimer = null;
  let activeKey = null;

  /**
   * The avatar says who you are; the "ranking as" control says whose trust is
   * applied. A sentence repeating both was noise, so this slot now carries only
   * what neither widget can show: an error, or the fact that you are signed out
   * BY CHOICE rather than because signing in failed.
   */
  function renderWhoami() {
    renderMe();
    $whoami.textContent = loginTried && !me && !wantsSignIn() ? "signed out — the whole corpus, unranked" : "";
  }

  function renderChips() {
    $chips.innerHTML = KIND_TABS.map((t, i) =>
      `<button class="chip${t === tab ? " on" : ""}" data-tab="${i}" role="tab" aria-selected="${t === tab}">${esc(t.label)}</button>`
    ).join("");
  }

  const skelCards = (n) => Array.from({ length: n }, () =>
    `<div class="skel-card">
       <div class="skel-line" style="width:34%"></div>
       <div class="skel-line" style="width:92%"></div>
       <div class="skel-line" style="width:66%"></div>
     </div>`).join("");

  const skelRows = (n) => Array.from({ length: n }, () =>
    `<div class="skel-row">
       <div class="skel-dot"></div>
       <div style="flex:1">
         <div class="skel-line" style="width:42%"></div>
         <div class="skel-line" style="width:74%;margin-top:8px"></div>
       </div>
     </div>`).join("");

  function statusBody(placeholder) {
    if (s.error) return `<div class="error">${esc(s.error)}</div>`;
    if (s.loading && !s.hits.length) return placeholder;
    if (!s.hits.length) return `<div class="empty"><b>No results</b>Try a different term, or widen the filter above.</div>`;
    return null;
  }

  function renderPopup() {
    const busy = s.loading || s.error;
    const meta = busy ? "" : [`${s.hits.length}`, s.lastMs != null ? `${s.lastMs} ms` : ""].filter(Boolean).join(" · ");
    const head = `<div class="popup-head"><span>Results</span><span class="timing">${meta}</span></div>`;
    const body = statusBody(skelRows(3)) ?? s.hits.slice(0, POPUP_LIMIT).map(popupRow).join("");
    $popup.innerHTML = head + body;
    paintScores();
  }

  function renderResults() {
    const stats = s.error ? "" : `${s.hits.length} result${s.hits.length === 1 ? "" : "s"} · ${s.lastMs ?? "?"} ms`;
    const head = `<div class="list-head"><div class="list-title">${esc(tab.label)}</div>` +
      `<div class="list-right"><span class="list-stats">${stats}</span>` +
      `<button type="button" id="export" class="export" title="Download this search and its results as text">Export</button></div></div>`;
    const body = statusBody(skelCards(4)) ?? s.hits.map(card).join("");
    $results.innerHTML = head + body;
    paintScores();
    watchNip05();
    // Only once there is something to reveal. run() renders TWICE — a skeleton
    // the instant the search starts, then the results — and the first pass was
    // consuming the pending id against a list of placeholders, so the real
    // render had nothing left to scroll to.
    if (!s.loading && !s.error) revealPending();
  }

  async function run(text, mode, render) {
    const myId = ++s.requestId;
    s.loading = true; s.error = null;
    if (mode === "full") s.hits = [];
    render();
    const t0 = performance.now();
    try {
      const hits = await search(text, mode === "popup" ? POPUP_LIMIT : FULL_LIMIT);
      if (myId !== s.requestId) return;
      s.hits = hits;
    } catch (e) {
      if (myId !== s.requestId) return;
      s.error = e.message || String(e); s.hits = [];
    }
    s.lastMs = Math.round(performance.now() - t0); s.loading = false;
    render();
  }

  function openPopup() { $popup.classList.add("open"); $q.setAttribute("aria-expanded", "true"); }
  function closePopup() { $popup.classList.remove("open"); $q.setAttribute("aria-expanded", "false"); activeKey = null; }
  const popupItems = () => Array.from($popup.querySelectorAll(".popup-item"));
  function setActive(idx) {
    const items = popupItems();
    if (!items.length) return;
    if (idx < 0) idx = items.length - 1;
    if (idx >= items.length) idx = 0;
    items.forEach(el => el.classList.remove("active"));
    items[idx].classList.add("active");
    items[idx].scrollIntoView({ block: "nearest" });
    activeKey = idx;
  }

  function runPopup(text) { openPopup(); run(text, "popup", renderPopup); }
  // The id of a result clicked in the quick popup, waiting for the full view to
  // render so it can be scrolled to.
  let pendingReveal = null;

  function runFull(text, revealId) {
    clearTimeout(debounceTimer); // else a type-ahead still in flight re-opens the popup over the results
    closePopup();
    $results.hidden = false;
    document.body.classList.add("searching");
    // The reveal waits for the results to exist. run() renders when the search
    // resolves, so hand the id forward rather than trying to scroll now.
    pendingReveal = revealId || null;
    run(text, "full", renderResults);
  }

  /** Scroll a just-rendered result into view and flag it for a moment. */
  function revealPending() {
    if (!pendingReveal) return;
    const el = $results.querySelector(`.result[data-id="${CSS.escape(pendingReveal)}"]`);
    // Cleared either way: the results ARE rendered by now, so if the clicked
    // event is not among them (the full query can return a different set than
    // the popup's preview) there is nothing to wait for.
    pendingReveal = null;
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("revealed");
    // Removed rather than left on: a highlight that never fades stops meaning
    // "this is the one you clicked" and starts meaning nothing.
    setTimeout(() => el.classList.remove("revealed"), 5000);
  }
  function rerun() {
    const text = $q.value.trim();
    if (!text) return;
    if (!$results.hidden) runFull(text);
    else if ($popup.classList.contains("open")) runPopup(text);
  }

  /** Back to the landing hero: no query, no results, nothing sticky. */
  function reset() {
    clearTimeout(debounceTimer);
    s.requestId++; s.hits = []; s.error = null; s.loading = false; s.lastMs = null;
    $q.value = "";
    $results.hidden = true;
    $results.innerHTML = "";
    document.body.classList.remove("searching", "has-query");
    closePopup();
    $q.focus();
  }

  $q.addEventListener("input", () => {
    const text = $q.value.trim();
    document.body.classList.toggle("has-query", text.length > 0);
    clearTimeout(debounceTimer);
    if (!text) { closePopup(); return; }
    debounceTimer = setTimeout(() => runPopup(text), DEBOUNCE_MS);
  });

  $q.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const text = $q.value.trim();
      if (text) runFull(text);
    } else if (e.key === "ArrowDown") {
      if ($popup.classList.contains("open")) { e.preventDefault(); setActive((activeKey ?? -1) + 1); }
    } else if (e.key === "ArrowUp") {
      if ($popup.classList.contains("open")) { e.preventDefault(); setActive((activeKey ?? popupItems().length) - 1); }
    } else if (e.key === "Escape") {
      closePopup();
    }
  });

  $clear.addEventListener("click", reset);

  // "/" anywhere focuses the search box, the way every search page does it.
  document.addEventListener("keydown", (e) => {
    if (e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    e.preventDefault();
    $q.focus();
    $q.select();
  });

  $popup.addEventListener("mousedown", (e) => {
    const item = e.target.closest(".popup-item");
    if (!item) return;
    e.preventDefault();
    // Clicking a quick result should land you ON that result, not merely in a
    // list that happens to contain it. The popup shows the first few of what
    // the full view will render, so the id survives the switch — carry it over,
    // scroll to it, and mark it briefly so the eye finds it without hunting.
    const picked = s.hits[Number(item.dataset.idx)];
    runFull($q.value.trim(), picked && picked.id);
  });

  document.addEventListener("click", (e) => { if (!e.target.closest(".search-wrap")) closePopup(); });
  $q.addEventListener("focus", () => { if (s.hits.length && $q.value.trim() && $results.hidden) openPopup(); });

  $results.addEventListener("click", (e) => {
    if (e.target.closest("#export")) {
      const blob = new Blob([exportText()], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      const slug = ($q.value.trim().replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "") || "search").slice(0, 40);
      a.href = URL.createObjectURL(blob);
      a.download = `sot-${slug}-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "")}.txt`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      return;
    }
    const btn = e.target.closest(".raw-toggle");
    if (!btn) return;
    const box = btn.parentElement.querySelector(".raw-body");
    if (!box.hidden) { box.hidden = true; btn.textContent = "json"; return; }
    const ev = s.hits.find((h) => h.id === btn.dataset.id);
    // Serialised only when asked for, and only once.
    if (!box.textContent) box.textContent = ev ? JSON.stringify(ev, null, 2) : "(no longer in the current results)";
    box.hidden = false;
    btn.textContent = "hide json";
  });

  $chips.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    tab = KIND_TABS[Number(chip.dataset.tab)];
    renderChips();
    rerun();
  });

  $sort.addEventListener("change", rerun);
  $spam.addEventListener("change", rerun);

  renderChips();
  renderWhoami();
  // On load, not on the first keystroke: the lens picker is only meaningful once
  // there is an authenticated reader, and an idle page should not sit on
  // "signing in…" until somebody types.
  ensureLogin().then(renderWhoami).catch(() => renderWhoami());
})();
</script>
</body>
</html>
