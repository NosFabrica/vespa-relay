<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="Nostr search, ranked by your web of trust." />
<title>SearchOverTrust</title>
<!--
  The SearchOverTrust UI: no build step, no third-party code, and NO http API —
  this page is a tiny Nostr client. It opens a WebSocket to the very server that
  serves it, searches with NIP-50 REQs (so the filter chips are literal `kinds`
  filters and the sort menu appends NIP-50 `sort:`/`include:spam` extensions),
  signs in automatically with NIP-07 against the relay's NIP-42 challenge —
  which ranks every search by YOUR web of trust and enrols you as a sync
  observer. Without an extension it stays anonymous and shows the whole corpus,
  unranked; there is no house lens standing in for you.

  This file is the markup and the styles; the behavior is native ES modules
  under /web, served straight off the classpath — view-source is still the real
  source, there is still no toolchain, and the zero-dependency rule is a rule:
  the relay client, the bech32 codec, the rendering are all hand-rolled here,
  so adding an npm library is a constitutional change, not an import. This page
  WAS "one file" and says so in old commits; that ended when per-kind entity
  renderers (the /npub…, /note… views) became the plan — one file cannot hold
  a renderer per kind worth rendering, and a registry of small card modules
  can. app.js is the page's state and wiring; shared/ is the stateless client,
  codec and caches; cards/ is where renderers live and grow (a registry keyed
  by kind, with a generic floor for kinds nobody has dressed yet); entity.js
  renders any /npub1…, /nprofile1…, /note1…, /nevent1…, /naddr1… path as the
  thing it names, with the same cards at permalink depth.

  ONE control decides whose trust ranks the page: "ranking as", defaulting to
  you and offering the pubkeys that published a kind 10040 (the only ones whose
  scores the store projects — 271 here against 12.28M profiles), applied with
  NIP-50 `observer:`. It replaced a login toggle sitting beside a lens picker,
  a pair whose off-plus-somebody combination was legal and did nothing at all.

  Every kind the index holds renders as a card: profiles, notes, articles,
  media, code, live events, listings, the reactive kinds (reactions, reposts,
  zaps, comments), the whole NIP-51 list and set table, this relay's own
  NIP-66 and NIP-85 records — and a generic floor for the rest. "The whole
  table" is a checked claim, not a boast: tools/webtest/cards.test.mjs fails
  if a kind registers a renderer without a fixture, a badge label or a family
  tone, which is how a bookmark set came to render its twelve saved articles
  under a badge that still read "kind 30003".

  The search box is a FIELD, not an input. `from:npub1…` and `to:npub1…`
  narrow a search to a person — the author, or whoever they named — and both
  draw as that person's face and name rather than 63 characters of bech32,
  which no <input> can do: an input's value is characters and nothing else.
  Typing `from:` or `to:` opens a people picker (web/searchfield.js) over the
  authenticated socket, so the candidates are ranked by YOUR web of trust; the
  "ranking as" list beside it is deliberately anonymous for the opposite
  reason. The two popups are never open together — they share this box and the
  arrow keys. On submit the tokens leave the NIP-50 search entirely and become
  the NIP-01 filter fields they are, `authors` and `#p`.

  `#hashtag` leaves the search string too, and becomes a union, because Nostr
  writes a topic down three ways: `#t` for the events that TAG it, kind 1111
  with the NIP-73 external id in `i` or `I` for the NIP-22 comments written ON
  it (which carry no `t` at all), and the NIP-32 label `#l` for the events
  LABELLED with it — the author's own label, or somebody else's kind 1985
  saying so. The label filter asks the value alone: NIP-32 only RECOMMENDS the
  `L` namespace beside it, and the mark that would name the vocabulary is the
  tag's second value, which NIP-01 does not index. All of them ride in one REQ
  — NIP-01 ORs the filters of a subscription — because which convention a topic
  was written down under is not something a reader searching for `#nostr`
  should have to know.

  Two things the union has to get right, both asserted by
  RelayProtocolTest."the search page's hashtag union": tag values compare CASED
  here (the engine schema says so), so the ask carries the spellings —
  `nostr`, `Nostr`, `NOSTR` — or every note tagged in mixed case is invisible;
  and `#I` must stay uppercase all the way through Quartz's REQ parse, or the
  root-scope filter would quietly match the wrong events. `limit` is per FILTER,
  so the `t` filter keeps the view's limit and the other three ride at a quarter
  of it rather than multiplying the page by four.

  The URL is the search. `/?q=…&tab=…&sort=…&spam=1&as=npub…` restores the
  whole results view on load, every submitted search and every filter change
  pushes a history entry, and Back walks them in order down to the hero. The
  type-ahead popup deliberately never touches the URL — a keystroke is not a
  place. Before this, the page held all of that in JS only: Back left the
  site from the middle of a search, reload emptied it, and a result list
  could not be handed to anyone.

  To develop against a remote server, set RELAY_URL in web/shared/conn.js to
  its ws:// url.
-->
<style>
  /* ---- tokens ------------------------------------------------------------ */
  :root {
    --bg: #f6f7f9;
    --surface: #fff;
    --surface-2: #f1f3f6;
    --fg: #14161a;
    --muted: #5f6675;
    --faint: #8a90a0;
    --border: #e3e6ec;
    --border-strong: #cdd2dc;
    --accent: #2563eb;
    --accent-fg: #fff;
    --accent-soft: #eaf0ff;
    --danger: #c0332b;
    --warn: #a8611a;
    --ring: rgba(37, 99, 235, .35);
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-md: 0 4px 16px rgba(16, 24, 40, .08);
    --shadow-lg: 0 18px 44px rgba(16, 24, 40, .14);
    --radius: 12px;
    --skel: linear-gradient(90deg, var(--surface-2) 25%, #e7eaf0 37%, var(--surface-2) 63%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f12;
      --surface: #15181d;
      --surface-2: #1c2028;
      --fg: #e6e8ec;
      --muted: #99a1b0;
      --faint: #6f7787;
      --border: #242932;
      --border-strong: #333a45;
      --accent: #7aa2ff;
      --accent-fg: #0d0f12;
      --accent-soft: #1a2233;
      --danger: #ff8a80;
      --warn: #d99b56;
      --ring: rgba(122, 162, 255, .4);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, .45);
      --shadow-lg: 0 18px 44px rgba(0, 0, 0, .6);
      --skel: linear-gradient(90deg, var(--surface-2) 25%, #262c36 37%, var(--surface-2) 63%);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .page { max-width: 780px; margin: 0 auto; padding: 0 16px; }

  /* ---- hero: centered while idle, a sticky bar once results are up ------- */
  .hero { padding-top: 12vh; transition: padding-top .2s ease; }
  .hero-inner { display: flex; flex-direction: column; align-items: center; }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 25px;
    font-weight: 680;
    letter-spacing: -.022em;
    color: inherit;
    text-decoration: none;
    margin-bottom: 4px;
  }
  .brand .mark { width: 1.05em; height: 1.05em; color: var(--accent); flex-shrink: 0; }
  .brand em { font-style: normal; color: var(--accent); }
  .tagline { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }

  .search-wrap { position: relative; width: 100%; }
  .search-icon {
    position: absolute; left: 17px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; color: var(--faint); pointer-events: none;
  }
  #q {
    width: 100%;
    padding: 13px 50px 13px 44px;
    font: inherit;
    font-size: 16px;
    color: var(--fg);
    border: 1px solid var(--border-strong);
    border-radius: 26px;
    outline: none;
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    transition: border-color .15s, box-shadow .15s;
    /* An input's single line, restored on a div: `pre` keeps the spaces that
       separate one from:npub… from the next (a collapsed space stops being a
       token boundary), and the overflow scrolls sideways the way an input's
       does — scrollbar hidden, because a text field does not have one. */
    line-height: 1.6;
    white-space: pre;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    cursor: text;
  }
  #q::-webkit-scrollbar { display: none; }
  /* The field is EMPTY only when searchfield.js has cleared it — a
     contenteditable leaves a <br> behind otherwise, and :empty would never
     match again after the first character was typed and deleted. */
  #q:empty::before { content: attr(data-placeholder); color: var(--faint); }
  #q:hover { border-color: var(--muted); }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  #clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    display: none; align-items: center; justify-content: center;
    width: 26px; height: 26px; padding: 0;
    border: 0; border-radius: 50%; background: none;
    color: var(--faint); font-size: 17px; line-height: 1; cursor: pointer;
  }
  #clear:hover { background: var(--surface-2); color: var(--fg); }
  body.has-query #clear { display: flex; right: 46px; }

  /* Who you are, in the field. Signed in shows your picture; signed out shows a
     neutral mark. Clicking toggles — and signing OUT means a new connection,
     because NIP-42 auth belongs to the socket, not to the page. */
  .me {
    /* Pinned to the field's own box rather than sized in pixels: top, bottom and
       right are the same gap by construction, and stay equal if the font or the
       field padding ever changes. */
    position: absolute; right: 6px; top: 6px; bottom: 6px;
    width: auto; aspect-ratio: 1 / 1; padding: 0; border: 1px solid var(--border);
    border-radius: 50%; background: var(--surface-2); cursor: pointer;
    display: grid; place-items: center; overflow: hidden;
    color: var(--faint); font-size: 12px; font-weight: 700; line-height: 1;
    transition: border-color .15s, box-shadow .15s;
  }
  .me:hover { border-color: var(--accent); }
  .me img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .me.in { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .me.busy { opacity: .55; pointer-events: none; }

  /* ---- the control bar --------------------------------------------------- */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 8px 14px;
    width: 100%;
    margin-top: 12px;
  }
  .chips { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 12px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--fg); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .bar-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; flex-shrink: 0; }

  .select {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface) no-repeat right 8px center/9px 6px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 13px center, right 8px center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    border-radius: 8px;
    font: inherit;
    font-size: 12.5px;
    padding: 5px 24px 5px 10px;
    color: var(--muted);
    cursor: pointer;
  }
  .select:hover { border-color: var(--border-strong); color: var(--fg); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  /* "as" — whose web of trust ranks the results */
  .obsbox { position: relative; display: inline-flex; align-items: center; gap: 6px; }
  .obslabel { color: var(--muted); font-size: 13px; }
  .obscurrent { font-size: 13px; font-weight: 600; max-width: 12rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .obsbox.active .obscurrent { color: var(--accent); }
  .obsbox.anon .obsfilter { opacity: .5; pointer-events: none; }
  .obsfilter { width: 8rem; font: inherit; font-size: 13px; padding: 3px 7px; border-radius: 8px;
               border: 1px solid var(--border); background: var(--surface); color: var(--fg); }
  .obsfilter:focus { outline: 2px solid var(--ring); outline-offset: 1px; }
  .obsreset { display: none; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
  .obsbox.active .obsreset { display: inline; }
  .obslist { position: absolute; top: calc(100% + 4px); left: 0; z-index: 40; margin: 0; padding: 4px;
             list-style: none; min-width: 16rem; max-height: 15rem; overflow-y: auto;
             background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
             box-shadow: var(--shadow-md); }
  .obslist:empty { display: none; }
  .obslist li { padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .obslist li:hover { background: var(--surface-2); }
  .obslist li.muted { color: var(--faint); cursor: default; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle-track { position: relative; width: 32px; height: 19px; border-radius: 10px; background: var(--border-strong); flex-shrink: 0; transition: background .15s; }
  .toggle-thumb { position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .toggle input:checked + .toggle-track { background: var(--accent); }
  .toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(13px); }
  .toggle input:focus-visible + .toggle-track { box-shadow: 0 0 0 3px var(--ring); }
  .toggle-text { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .toggle input:checked ~ .toggle-text { color: var(--fg); }

  .whoami { font-size: 12px; color: var(--muted); margin-top: 8px; width: 100%; }
  .whoami:empty { display: none; }
  .whoami b { color: var(--fg); font-weight: 600; }
  .whoami .err { color: var(--danger); }

  /* ---- type-ahead popup --------------------------------------------------- */
  .popup {
    position: absolute;
    top: calc(100% + 8px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    z-index: 30;
    display: none;
    max-height: 62vh;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .popup.open { display: block; }
  .popup-head {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint);
    padding: 9px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; display: flex; justify-content: space-between; z-index: 1;
  }
  .popup-head .timing { font-variant-numeric: tabular-nums; }
  .popup-item {
    display: flex; gap: 11px; align-items: center;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  .popup-item:last-child { border-bottom: 0; }
  .popup-item:hover { background: var(--surface-2); }
  .popup-item.active { background: var(--surface-2); border-left-color: var(--accent); }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-weight: 550; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-about { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Not a result: the picker saying what it is doing, or that it found
     nobody. A row would be clickable and this is not. */
  .popup-note { padding: 13px 14px; color: var(--faint); font-size: 12.5px; }

  /* ---- a person, inside the text field ------------------------------------ */
  /* The field's VALUE here is still `from:npub1…`; this is only how it draws.
     Sized in em throughout so it follows the field into the sticky toolbar,
     where the font shrinks — a chip measured in pixels would grow relative to
     its own line and push the bar taller. */
  .mention {
    display: inline-flex; align-items: center; gap: .35em;
    vertical-align: middle;
    max-width: 15em;
    padding: .1em .6em .1em .2em;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: .86em; font-weight: 600;
    white-space: nowrap;
    user-select: none;
  }
  /* The card avatar, at field scale — same generated face, no border. */
  .mention .avatar { width: 1.5em; height: 1.5em; border: 0; }
  .mention-kind { opacity: .65; font-weight: 700; }
  .mention-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .list-right { display: inline-flex; align-items: baseline; gap: 12px; }
  .export {
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    border-radius: 7px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .export:hover { border-color: var(--accent); color: var(--accent); }

  /* The raw event, for whoever needs it, invisible to whoever does not. */
  .raw { margin-top: 10px; }
  .raw-toggle {
    border: 0; background: none; padding: 0; cursor: pointer;
    color: var(--faint); font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
  }
  .raw-toggle:hover { color: var(--muted); text-decoration: underline; }
  .raw-body {
    margin: 8px 0 0; padding: 10px; max-height: 320px; overflow: auto;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg);
    white-space: pre-wrap; word-break: break-word;
  }

  /* A nip05 is a claim until the domain agrees; the chip is the answer. */
  .nip05 { display: inline-flex; align-items: center; gap: 5px; }
  .n5chip {
    display: inline-grid; place-items: center; min-width: 15px; height: 15px; padding: 0 4px;
    border-radius: 8px; font-size: 10px; font-weight: 800; line-height: 1;
    background: var(--surface-2); color: var(--faint);
  }
  .n5chip.ok { background: #128a4b; color: #fff; }
  .n5chip.bad { background: var(--danger); color: #fff; }
  .n5chip.unknown { background: var(--surface-2); color: var(--muted); }

  /* ---- avatars ------------------------------------------------------------ */
  .av-wrap { position: relative; display: inline-flex; flex: 0 0 auto; }
  .score-chip {
    position: absolute; right: -3px; bottom: -3px; display: none;
    min-width: 15px; height: 15px; padding: 0 3px;
    border-radius: 8px; background: var(--accent); color: var(--accent-fg);
    font-size: 9px; font-weight: 800; line-height: 15px; text-align: center;
    box-shadow: 0 0 0 2px var(--surface);
  }
  .score-chip.on { display: block; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--surface-2);
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .avatar.gen { background-image: linear-gradient(140deg, hsl(var(--h) 62% 72%), hsl(calc(var(--h) + 45) 58% 60%)); }

  /* ---- the kind badge, tinted by family so a mixed list stays scannable --- */
  .kind-badge {
    --h: 225; --s: 9%;
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .055em;
    color: hsl(var(--h) var(--s) 34%);
    background: hsl(var(--h) var(--s) 96%);
    border: 1px solid hsl(var(--h) var(--s) 88%);
    border-radius: 999px;
    padding: 1.5px 8px;
    white-space: nowrap;
  }
  @media (prefers-color-scheme: dark) {
    .kind-badge {
      color: hsl(var(--h) var(--s) 76%);
      background: hsl(var(--h) calc(var(--s) / 2) 17%);
      border-color: hsl(var(--h) calc(var(--s) / 2) 26%);
    }
  }
  [data-tone="people"]   { --h: 265; --s: 62%; }
  [data-tone="note"]     { --h: 220; --s: 62%; }
  [data-tone="article"]  { --h: 35;  --s: 68%; }
  [data-tone="media"]    { --h: 330; --s: 58%; }
  [data-tone="code"]     { --h: 152; --s: 48%; }
  [data-tone="live"]     { --h: 5;   --s: 65%; }
  [data-tone="market"]   { --h: 185; --s: 52%; }
  [data-tone="social"]   { --h: 285; --s: 40%; }
  [data-tone="list"]     { --h: 95;  --s: 40%; }
  [data-tone="apps"]     { --h: 250; --s: 30%; }

  /* ---- results ------------------------------------------------------------ */
  .results { padding: 20px 0 64px; }
  .list-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0 2px 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .list-title { font-weight: 620; font-size: 14px; letter-spacing: -.01em; }
  .list-stats { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .result {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    transition: border-color .12s, box-shadow .12s, transform .12s;
  }
  .result:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); transform: translateY(-1px); }

  .result-header { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .result-header .avatar { width: 46px; height: 46px; }
  .result-header .who { flex: 1; min-width: 0; }
  .result-name { font-size: 16.5px; font-weight: 650; letter-spacing: -.012em; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result-name a { color: inherit; text-decoration: none; }
  .result-name a:hover { color: var(--accent); }
  .result-display { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .byline { display: flex; gap: 7px; align-items: center; margin-bottom: 8px; }
  .byline .dot { margin: 0 -2px; }
  .byline .avatar { width: 22px; height: 22px; }
  .byline .by-name { font-size: 12.5px; font-weight: 550; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .byline .by-date { font-size: 12px; color: var(--faint); flex-shrink: 0; }
  .byline .dot { color: var(--border-strong); }
  .byline .spacer { flex: 1; }

  /* centered so a title-only card doesn't leave a hole beside its thumbnail */
  .result-main { display: flex; gap: 14px; align-items: center; }
  .result-main .text { flex: 1; min-width: 0; }
  .result-title { font-size: 16px; font-weight: 620; letter-spacing: -.012em; line-height: 1.35; margin: 0 0 4px; }
  .result-title a { color: inherit; text-decoration: none; }
  .result-title a:hover { color: var(--accent); }
  .result-body { font-size: 13.5px; margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .result-body.muted { color: var(--muted); }
  .result-body.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
  .thumb {
    width: 92px; height: 92px; flex-shrink: 0;
    object-fit: cover; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--border);
  }

  .props { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 12.5px; margin: 10px 0 0; }
  .props dt { color: var(--faint); }
  .props dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .props .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .props a { color: var(--accent); text-decoration: none; }
  .props a:hover { text-decoration: underline; }

  .empty, .error { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }
  .error { color: var(--danger); }
  .empty b { display: block; color: var(--fg); font-size: 15px; font-weight: 600; margin-bottom: 4px; }

  /* ---- entity (permalink) pages and the richer card bodies ---------------- */
  /* Links inside a card body follow the page's link voice, not the browser's
     default blue underline — the score card's "scores <name>" was the one
     place that default leaked through. */
  .result-body a { color: var(--accent); text-decoration: none; }
  .result-body a:hover { text-decoration: underline; }
  /* A summary followed by the full body (the article permalink) needs air
     between the two, or the muted line reads as the body's first paragraph. */
  .result .result-body + .result-body { margin-top: 10px; }
  /* The permalink is a destination: its title carries the page and earns a
     size the list variant deliberately doesn't have. */
  .result.full .result-title { font-size: 20px; }
  .result.full .result-name { font-size: 20px; }
  .entity-head { display: flex; align-items: center; gap: 12px; padding: 16px 2px 10px; font-size: 13px; }
  /* Where a hint-fetched event came from, and this relay's verdict on it —
     or, in .warn, that the reader chose to step outside their lens. */
  .prov { margin: 0 2px 10px; font-size: 12.5px; color: var(--muted); }
  .prov .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .prov.warn { color: var(--warn); }
  /* The entity page narrates its wait; the pulse says "working", the text
     says on what. Reduced-motion zeroes the pulse via the global rule. */
  .entity-stage { text-align: center; color: var(--faint); font-size: 12.5px; padding: 2px 0 18px;
                  animation: stage-pulse 1.4s ease-in-out infinite alternate; }
  @keyframes stage-pulse { from { opacity: .45; } to { opacity: 1; } }
  .reveal-btn { margin-top: 14px; border: 1px solid var(--border-strong); background: var(--surface);
                color: var(--fg); border-radius: 8px; padding: 7px 16px; font: inherit; font-size: 13px; cursor: pointer; }
  .reveal-btn:hover { border-color: var(--accent); color: var(--accent); }
  .entity-head a { color: var(--muted); text-decoration: none; white-space: nowrap; }
  .entity-head a:hover { color: var(--accent); }
  .entity-head .ident { flex: 1; text-align: center; color: var(--faint); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .byline a.by-name { font-size: 12.5px; font-weight: 550; color: var(--muted); text-decoration: none;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .byline a.by-name:hover { color: var(--accent); }
  .embed { margin: 4px 0 10px; }
  .embed img, .embed video { display: block; max-width: 100%; max-height: 70vh; border-radius: 10px;
                             border: 1px solid var(--border); background: var(--surface-2); }
  .embed audio { width: 100%; }
  .codeblock { margin: 6px 0 0; padding: 12px; overflow: auto; max-height: 60vh;
               background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
               font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
  .quote { margin: 0 0 6px; padding: 8px 12px; border-left: 3px solid var(--accent);
           background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .face-strip { display: flex; align-items: center; margin-top: 8px; }
  .face-strip .av-wrap + .av-wrap { margin-left: -9px; }
  .face-strip .avatar { width: 30px; height: 30px; box-shadow: 0 0 0 2px var(--surface); }
  .face-strip .face-more { margin-left: 8px; font-size: 12px; color: var(--faint); }
  .relay-list { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
  .relay-list li { padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .relay-list .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .relay-list a { color: var(--accent); text-decoration: none; }
  .muted-note { color: var(--faint); font-size: 11.5px; }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .emoji-grid img { width: 26px; height: 26px; object-fit: contain; }
  .status-pill { display: inline-block; vertical-align: middle; margin-left: 6px; padding: 1px 8px;
                 border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase;
                 letter-spacing: .04em; background: var(--surface-2); color: var(--muted); }
  .status-pill.live { background: var(--danger); color: #fff; }
  /* the NIP-52 rsvp answers, which are the whole content of a 31925 */
  .status-pill.accepted { background: var(--accent); color: var(--accent-fg); }
  .status-pill.declined { background: var(--danger); color: #fff; }
  .status-pill.tentative { background: var(--warn); color: #fff; }
  .price-line { margin: 2px 0 6px; font-size: 15px; font-weight: 650; }
  .rank-big { margin: 2px 0; font-size: 28px; font-weight: 700; color: var(--accent); }
  /* what a list POINTS AT — e tags to notes, a tags to addressable entities */
  .ref-list { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
  .ref-list li { padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ref-list a { color: var(--accent); text-decoration: none; }
  .ref-list a:hover { text-decoration: underline; }
  .ref-list .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  /* hashtags, muted words, git branches, supported NIPs — short values that
     read as a wrapped row, never as a table of one-word rows */
  /* NOT `.chip` — that is the filter tab above, and this rule sits later in
     the sheet, so sharing the name restyled the whole filter bar. */
  .chip-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag-chip { padding: 1.5px 9px; border-radius: 999px; font-size: 11.5px; max-width: 100%;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
              color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); }
  .tag-chip.more { color: var(--faint); background: none; border-color: transparent; }
  /* a list at permalink depth names each section it holds */
  .list-section + .list-section { margin-top: 12px; }
  .section-head { font-size: 11.5px; font-weight: 600; text-transform: uppercase;
                  letter-spacing: .04em; color: var(--faint); }
  .react-glyph { font-size: 18px; vertical-align: middle; }
  .react-emoji { width: 22px; height: 22px; vertical-align: middle; object-fit: contain; }

  /* ---- loading skeletons -------------------------------------------------- */
  .skel-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; margin-bottom: 10px; }
  .skel-row { display: flex; gap: 11px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .skel-line, .skel-dot {
    background: var(--skel); background-size: 400% 100%;
    animation: shimmer 1.3s linear infinite;
    border-radius: 5px; height: 10px;
  }
  .skel-card .skel-line + .skel-line { margin-top: 9px; }
  .skel-dot { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ---- searching: the hero collapses into a sticky toolbar ---------------- */
  body.searching .hero {
    position: sticky; top: 0; z-index: 20;
    padding: 10px 0 9px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  @supports (backdrop-filter: blur(8px)) {
    body.searching .hero { background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); }
  }
  body.searching .hero-inner {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    column-gap: 16px;
    row-gap: 9px;
  }
  body.searching .brand { font-size: 15.5px; gap: 7px; margin: 0; }
  body.searching .brand .full { display: none; }
  body.searching .tagline { display: none; }
  body.searching #q { padding-top: 9px; padding-bottom: 9px; font-size: 14.5px; }
  body.searching .search-icon { left: 15px; width: 15px; height: 15px; }
  body.searching .bar { grid-column: 1 / -1; margin-top: 0; }
  body.searching .whoami { grid-column: 1 / -1; margin-top: 0; }

  @media (max-width: 620px) {
    .hero { padding-top: 7vh; }
    .bar-right { width: 100%; gap: 10px 12px; }
    .select { padding-left: 8px; }
    /* the chip row scrolls sideways; fade its right edge so that reads as more */
    .chips {
      flex: 1 1 100%; margin: 0 -16px; padding: 0 16px 1px;
      mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
    }
    body.searching .hero-inner { grid-template-columns: minmax(0, 1fr); }
    body.searching .brand { display: none; }
    .result-header .avatar { width: 40px; height: 40px; }
    .thumb { width: 72px; height: 72px; }
    .props { grid-template-columns: minmax(0, 1fr); gap: 0 0; }
    .props dt { margin-top: 6px; font-size: 11px; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="page hero-inner">
    <a class="brand" href="/" aria-label="SearchOverTrust — home">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none" />
        <circle cx="4.2" cy="6.4" r="2.1" />
        <circle cx="4.2" cy="17.6" r="2.1" />
        <circle cx="19.8" cy="12" r="2.1" />
        <path d="M6.1 7.5 9.4 10.2M6.1 16.5 9.4 13.8M14.9 12h2.8" stroke-linecap="round" />
      </svg>
      <span>Search<em>Over</em>Trust</span>
    </a>
    <p class="tagline">Nostr search, ranked by your web of trust</p>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 21 21" stroke-linecap="round" />
      </svg>
      <!--
        A contenteditable, not an <input>: `from:npub1…` renders as a face and
        a name, and there is no way to put a picture inside an input's value.
        web/searchfield.js gives back everything the input gave for free —
        `value`, `select()`, the placeholder, single-line behaviour, paste as
        text — so app.js still just reads $q.value.
      -->
      <!-- autocorrect/autocapitalize off for the same reason spellcheck is:
           a phone that "fixes" a 63-character npub, or capitalises the `from:`
           that starts an empty field, is editing a token, not a sentence. -->
      <div id="q" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off"
           data-placeholder="Search Nostr&hellip;" enterkeyhint="search"
           role="combobox" aria-expanded="false" aria-controls="popup" aria-autocomplete="list"
           aria-multiline="false" aria-label="Search"></div>
      <button id="clear" type="button" aria-label="Clear search" title="Clear">&times;</button>
      <button id="me" type="button" class="me" aria-label="Sign in"></button>
      <div id="popup" class="popup" role="listbox" aria-label="Quick results"></div>
      <!-- The other popup: who `from:`/`to:` means. Never open at the same
           time as the one above — they share this box and the arrow keys. -->
      <div id="mentions" class="popup" role="listbox" aria-label="People"></div>
    </div>

    <div class="bar">
      <div id="chips" class="chips" role="tablist" aria-label="Filter by kind"></div>
      <div class="bar-right">
        <select id="sort" class="select" title="NIP-50 sort: extension" aria-label="Sort">
          <option value="">Best match</option>
          <option value="rank">Most trusted</option>
          <option value="rank:asc">Least trusted</option>
          <option value="followers">Followers</option>
          <option value="text">Text only</option>
        </select>
        <span id="obsbox" class="obsbox" title="Whose web of trust ranks these results. You are signed in automatically; pick somebody else to read the index through their eyes. Only pubkeys with a kind 10040 can rank anything.">
          <span class="obslabel">ranking as</span>
          <span id="obscurrent" class="obscurrent">me</span>
          <input id="obsfilter" class="obsfilter" placeholder="view as…" autocomplete="off" />
          <button id="obsreset" class="obsreset" type="button" title="Back to your own web of trust">×</button>
          <ul id="obslist" class="obslist"></ul>
        </span>
        <label class="toggle" title="NIP-50 include:spam — also show results your web of trust doesn't rank">
          <input id="spam" type="checkbox" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">include spam</span>
        </label>

      </div>
    </div>

    <div id="whoami" class="whoami" aria-live="polite"></div>
  </div>
</header>

<main class="page">
  <div id="results" class="results" hidden aria-live="polite"></div>
</main>

<!--
  Every module app.js reaches, preloaded.

  Without these the browser discovers the graph a level at a time: fetch
  index.html, then app.js, then the 7 it imports, then the 4 behind those —
  three dependency waves, each costing a full round trip before any code runs.
  On localhost that is 188ms and invisible; over a Cloudflare tunnel it measured
  1,513ms, almost all of it waiting rather than transferring.

  A preload hint starts every fetch in the FIRST wave, so the cost becomes one
  round trip plus the bytes. The list is checked against the real import graph
  by tools/webtest/preload.test.mjs — a renamed or new module fails there rather
  than silently falling back to the slow path.
-->
<link rel="modulepreload" href="/web/cards.js" />
<link rel="modulepreload" href="/web/cards/apps.js" />
<link rel="modulepreload" href="/web/cards/article.js" />
<link rel="modulepreload" href="/web/cards/base.js" />
<link rel="modulepreload" href="/web/cards/code.js" />
<link rel="modulepreload" href="/web/cards/generic.js" />
<link rel="modulepreload" href="/web/cards/lists.js" />
<link rel="modulepreload" href="/web/cards/live.js" />
<link rel="modulepreload" href="/web/cards/market.js" />
<link rel="modulepreload" href="/web/cards/media.js" />
<link rel="modulepreload" href="/web/cards/note.js" />
<link rel="modulepreload" href="/web/cards/people.js" />
<link rel="modulepreload" href="/web/cards/profile.js" />
<link rel="modulepreload" href="/web/cards/relays.js" />
<link rel="modulepreload" href="/web/cards/social.js" />
<link rel="modulepreload" href="/web/entity.js" />
<link rel="modulepreload" href="/web/searchfield.js" />
<link rel="modulepreload" href="/web/shared/conn.js" />
<link rel="modulepreload" href="/web/shared/format.js" />
<link rel="modulepreload" href="/web/shared/kinds.js" />
<link rel="modulepreload" href="/web/shared/nip05.js" />
<link rel="modulepreload" href="/web/shared/nip19.js" />
<link rel="modulepreload" href="/web/shared/profiles.js" />
<link rel="modulepreload" href="/web/shared/query.js" />
<link rel="modulepreload" href="/web/shared/relay.js" />
<script type="module" src="/web/app.js"></script>
</body>
</html>
