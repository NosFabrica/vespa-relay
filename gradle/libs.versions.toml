[versions]
#
# A NOTE ON THE TWO JITPACK PINS BELOW, because every comment on them mentions
# how the hash sorts and that is easy to read as more than it is.
#
# A JitPack version is a git commit hash. Hashes carry NO order. `c43339e92b`
# is not newer than `a5507f9a4d`, not ahead of it, not a superset of it — the
# two strings simply sort a particular way, decided by the first hex digit,
# which is uniformly random. A commit from last year sorts above one from today
# roughly half the time.
#
# Gradle does not know that. It sees version STRINGS, and when two parts of the
# graph ask for different ones it keeps the lexicographically higher — so for
# hashes it keeps an arbitrary one, and says nothing. That is the whole reason
# for `resolutionStrategy { force(libs.quartz) }` in every module.
#
# So when a comment below says a bump "sorts the safe way", read it as: THIS
# bump would survive a conflict if one arose. It is not a property of the pin
# and it will not hold for the next bump of the same dependency. And it is not
# evidence the pin took effect — ordering only decides who wins a conflict, not
# whether one happened. The proof of that is always the resolved graph:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath
# with no `->` on the line, checked per module.
#
# The relation that does mean something between two hashes is ancestry, and git
# is the only thing that can answer it: `git merge-base --is-ancestor A B`.
# Dates cannot — a commit authored earlier can land on main later.
#
kotlin = "2.4.0"
# The relay application's version (image tag / --version display).
app = "0.1.0"
# Quartz from JitPack (amethyst @ commit) — the Nostr protocol engine (RelayServerBase).
#
# b10be95a6e = amethyst main @ 2026-08-30 (PR #4020). MOVED BECAUSE THE STORE
# ASKED, and this is the bump the note at the top of this file was written
# about: the store below now asks for this exact string, and `force(libs.quartz)`
# means THIS line — not the store's — decides which jar every module compiles
# and runs against. Left at 029c40ebb4 while only the store pin moved, the
# deploy would have shipped the store's new placement logic against a quartz
# whose `SearchFieldExtractor` has neither branch, and half the fix would
# silently not exist. That is not hypothetical: it is what staging was serving
# when this was written.
#
# The range over 029c40ebb4 is 35 commits and 118 files, but only TWO quartz
# sources. `IEventStore`, `SQLiteEventStore`, `Filter`, `EventFactory`,
# `IndexableFields`, `SearchableEvent` and `SearchQuery` are byte-identical, so
# the protocol surface this relay serves is unmoved and the searchable set stays
# at 130 classes / 133 kind values.
#
#   SearchFieldExtractor gained `is TrustedListEvent ->` and
#     `is ContactCardEvent ->`. Both families used to take the generic
#     `is SearchableEvent ->` fallback, which puts the whole indexableContent()
#     in the TERTIARY tier. A 30392's title() now fills `primary`, and a
#     30382's petName()/summary() fill `primary`/`secondary`. A card's topics
#     move to the hashtag role the tiers() funnel already filled — the fallback
#     had been indexing them twice — and `SearchExtractors` folds hashtags into
#     the secondary column, so no word leaves the index.
#
#   ReplaceableSupersession.kt gained three CLIENT-side clock helpers
#     (`nextCreatedAtToSupersede`, `awaitCreatedAtToSupersede`,
#     `MAX_SUPERSEDE_WAIT_SECONDS`) that decide the created_at a PUBLISHER
#     stamps to win an address it just replaced. A relay never stamps one.
#     The file itself is not new and neither is its `supersedes()`.
#
# DIRECTION: 029c40ebb4 is a strict ancestor of this (`git merge-base
# --is-ancestor`, not the dates).
#
# LEXICOGRAPHIC: '029c…' < 'b10b…' ('0' < 'b'), so this sorts ABOVE the pin it
# replaces — the SAFE direction, and the store asks for this exact string
# anyway, so there is no conflict for ordering to settle. The resolved graph is
# still the proof, and on this bump every quartz line reads b10be95a6e with no
# `->` left anywhere, in all five JVM modules:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath | grep -E "quartz|eventstore"
quartz = "b10be95a6e"
# The event store this relay serves, from JitPack (vespa-eventstore @ commit).
#
# 3ecdfae6ee = store main through PR #93, one commit over b2be07e168, and it
# stands ALONE: the store's quartz ask does not move across the range (`git
# diff --name-only` names no libs.versions.toml), so the quartz line above is
# untouched by this bump.
#
# WHAT MOVED: one line of `event.sd` §13. `member_rung()` no longer multiplies
# by `wot_mult()`.
#
# WHY THAT IS THE FIX. `spliced_member` places a member at
# `max(member_rung(), pointer_floor())`, and the two sides were in different
# units. The rung carried the MEMBER's trust; `query(pointer_rel)` is the
# pointer's FINISHED relevance and so carries the SIGNER's — and a Trusted List
# is signed by a NIP-85 service key nobody follows. So the floor's side was
# multiplied by 1 and the rung's by up to 251,189 (`wot_mult` is
# `1 + (score - min_rank)^2.7`, clamped at 100), and the max() took the rung
# every time. The floor added in b2be07e168 never fired once.
#
# WHAT THIS RELAY SEES, measured through the wire protocol against a real Vespa
# holding the production corpus — the real `Verified Human` list off the
# tapestry relay, its held scored members, their real confidences and their real
# trust ranks — with the page itself spanning 610..2.39e5:
#
#                       ordered by     passes its   member scores
#                       confidence     pointer
#   b2be07e168, title   no             16/16        2.19e8 .. 1.00e9
#   b2be07e168, weak    no             16/16        2.19e8 .. 1.00e9
#   3ecdfae6ee, title   YES            0/16         1.70e5 .. 2.39e5
#   3ecdfae6ee, weak    YES            0/16         2.85e3 .. 4.00e3
#
# So the defect was worse than an inert floor. Members were placed four orders
# of magnitude above the page they belong on, ordered by the READER's trust
# rather than by what the publisher said, and identically whether the list
# matched on its title or barely at all — and the store's LIFT then dragged the
# pointer up after them, so any list naming a well-trusted person hijacked every
# page that mentioned its title. Both halves go away together, and THIS is the
# bump that closes the placement complaint the last two chased.
#
# WHAT IT GIVES UP: a member's own reputation no longer decides WHERE it sits.
# It still decides whether it is ADMITTED — the observer gate runs on the
# subject lookup like any other read — and a list only unpacks for a reader who
# enrolled its signer, so a publisher vouching for a spammer is a bad service
# rather than a ranking hole.
#
# A SCHEMA MOVES, as in the bump this replaces. DEPLOY BEFORE THIS PIN GOES OUT.
# NO REINDEX: `git diff b2be07e168 3ecdfae6ee -- engine/app/schemas/event.sd`
# touches no `field`, no `indexing`, no `attribute` — `first-phase` is the only
# behavioural line. Unlike the last bump the schema is NOT safe to roll early on
# its own: it changes placement for a relay still pinned to b2be07e168, which
# sends `pointer_rel` already. Roll them together, schema first.
#
# THE GATE IS GREEN AT THIS COMMIT, per AGENTS.md's rule:
#   git clone https://github.com/NosFabrica/vespa-eventstore && cd vespa-eventstore
#   git checkout 3ecdfae6ee
#   DOCKER_MIN_API_VERSION=1.24 dockerd &          # AGENTS.md: no daemon by default
#   TESTCONTAINERS_RYUK_DISABLED=true ./gradlew test -Pintegration --max-workers=1 --no-daemon
# Run HERE: 43 suites, 482 tests, 0 skipped, 0 failures, 11m56s (`skipped="0"`
# read off the result XML, not off `BUILD SUCCESSFUL`, per AGENTS.md).
# SplicedMemberWeightsIT is the one that matters: it gives a member a reputation
# of 90 the gate can see and asserts it lands on the same rung as one the reader
# has never heard of, which is the property that would go back silently. The
# store's own CI is green on the same tree: `git diff b19755b 3ecdfae6ee` is
# empty.
#
# DIRECTION: b2be07e168 is a strict ancestor of this (`git merge-base
# --is-ancestor`, not the dates).
#
# LEXICOGRAPHIC: '3ecd…' < 'b2be…' ('3' < 'b'), so this sorts BELOW the pin it
# replaces — the UNSAFE direction, and the first bump in this file to land that
# way. Nothing is wrong: ordering only decides who wins a CONFLICT, and the
# resolved graph below shows there is none. But it is exactly the case the note
# at the top of this file exists for, so if a second asker for this module ever
# appears, Gradle would keep b2be07e168 over this and say nothing. The proof
# stays what it always is — every eventstore line reads 3ecdfae6ee with no `->`:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath | grep -E "quartz|eventstore"
vespaEventStore = "3ecdfae6ee"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.5.1"
# The router mirrors kinds from upstream relays. OkHttp drives the outbound
# websockets (quartz's BasicOkHttpWebSocket) and typesafe-config parses the
# strfry-style `streams { }` HOCON. Both already ride in transitively from
# quartz / vespa-eventstore; pinned here so the router's direct use is explicit.
okhttp = "5.4.0"
typesafeConfig = "1.4.9"
spotless = "8.8.0"
ktlint = "1.8.0"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
# The event store, from JitPack. `store` is the IEventStore + open() front door + the
# ObserverContext/OriginalFilters this relay stamps; it api-exposes the `vespa` engine
# jar transitively (InMemoryEventIndex, EventYql — used by the relay's protocol test).
# Lowercase group on purpose: JitPack caches builds per-spelling, and the
# capitalized `NosFabrica` entry for this commit permanently caches a failed
# infra build. Same repo, same artifacts — different cache key.
vespa-eventstore-store = { module = "com.github.nosfabrica.vespa-eventstore:store", version.ref = "vespaEventStore" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
# NIP-11 tells relays to serve the info doc with CORS headers, and browser-based
# NIP-86 admin tools need the Authorization header preflighted.
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
# gzip/deflate for the pages and ES modules — ~117KB of text over the wire otherwise.
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
# serveRelay bundles the Netty engine (batteries-included) so a consumer — or the
# standalone main() — can bind a port without wiring an engine itself.
# testApplication drives the /web route in-process — the module directory is the
# whole page, so its route, its 304 and its content type are worth asserting
# rather than eyeballing.
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
# Outbound upstream websockets for the router (quartz's BasicOkHttpWebSocket
# takes an OkHttpClient factory) and the HOCON parser for the streams config.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafeConfig" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
