[versions]
#
# A NOTE ON THE TWO JITPACK PINS BELOW, because every comment on them mentions
# how the hash sorts and that is easy to read as more than it is.
#
# A JitPack version is a git commit hash. Hashes carry NO order. `c43339e92b`
# is not newer than `a5507f9a4d`, not ahead of it, not a superset of it — the
# two strings simply sort a particular way, decided by the first hex digit,
# which is uniformly random. A commit from last year sorts above one from today
# roughly half the time.
#
# Gradle does not know that. It sees version STRINGS, and when two parts of the
# graph ask for different ones it keeps the lexicographically higher — so for
# hashes it keeps an arbitrary one, and says nothing. That is the whole reason
# for `resolutionStrategy { force(libs.quartz) }` in every module.
#
# So when a comment below says a bump "sorts the safe way", read it as: THIS
# bump would survive a conflict if one arose. It is not a property of the pin
# and it will not hold for the next bump of the same dependency. And it is not
# evidence the pin took effect — ordering only decides who wins a conflict, not
# whether one happened. The proof of that is always the resolved graph:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath
# with no `->` on the line, checked per module.
#
# The relation that does mean something between two hashes is ancestry, and git
# is the only thing that can answer it: `git merge-base --is-ancestor A B`.
# Dates cannot — a commit authored earlier can land on main later.
#
kotlin = "2.4.0"
# The relay application's version (image tag / --version display).
app = "0.1.0"
# Quartz from JitPack (amethyst @ commit) — the Nostr protocol engine (RelayServerBase).
#
# 1866007e99 = amethyst main through #3908, and the whole six-commit range is
# the `fetchAll` cleanup the previous pin's note flagged as worth watching:
#
#   4b8d143376  drop maxTotalMs from fetchAll and fetchAllWithHooks
#   c5b45a49cc  make the fetchAll drain loop observe cancellation
#   a12dda31e9  return a FetchAllResult instead of three out-parameters
#   94d5f18fef  repair doc rot and dead imports left by that refactor
#   e1ab4d6c56  drop the unused diagnoseSlow drain flag
#
# The first one retires the concern recorded here last bump: `maxTotalMs =
# idleTimeoutMs * 10` was a WALL-CLOCK ceiling on `fetchAll`, and this repo has
# been burned by exactly that shape once already. It is gone, so the "a timeout
# is an idle window, not a deadline" rule now holds on every accessory rather
# than only on `fetchAllPages`.
#
# THIS ONE IS A SOURCE-BREAKING CHANGE, and the only one in the range that
# reaches us. `fetchAllWithHooks` no longer takes `doneOut` / `deadOut` /
# `onTimeout` out-parameters; it returns `FetchAllResult`, carrying `events`,
# `doneReasons` and `stalled`. `AliasProbe.over` is the single call site and is
# migrated to read `result.doneReasons` and `result.events`.
#
# NOTE WHAT IT WAS NOT MIGRATED TO. `FetchAllResult.anyRelayServed` looks like
# the tidy replacement for our predicate and is strictly narrower: it is
# `== DONE_REASON_EOSE`, while the probe must count a relay that answered with a
# CLOSED as having SPOKEN. Measured on `purplepag.es`, which refuses a bare
# filter:
#
#   0 event(s), done=closed:blocked: filters must specify at least one kind
#
# Our predicate (`!startsWith("cannot:")`) reads that as spoke, returns an EMPTY
# list, and `fingerprint`'s empty-page retry drops to FALLBACK_PROBE_PAGE — and
# `leaderPrint`'s kinds fallback then recovers the host. `anyRelayServed` would
# read the same answer as silence, return null, and take every relay that
# refuses a bare filter or caps under DEFAULT_PROBE_PAGE straight back out of
# the fold — 892 urls behind 46 leaders, by the sweep recorded in AGENTS.md.
# The predicate stays ours.
#
# DIRECTION: 1ff1077d58 is a strict ancestor of this (`git merge-base
# --is-ancestor`, not the dates), and the store pin below compiles against
# EXACTLY 1866007e99 — the equality case again. Both pins move together.
#
# LEXICOGRAPHIC: '1866…' < '1ff1…' ('8' < 'f'), so this sorts BELOW the pin it
# replaces — the dangerous direction, as the last quartz bump also was. Nothing
# else on the graph brings quartz in at a different hash (the store asks for
# this one), and `resolutionStrategy { force(libs.quartz) }` in every module is
# what makes that survivable rather than lucky. Ordering settles nothing about
# whether the pin took; only the resolved graph does:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath | grep -E "quartz|eventstore"
quartz = "1866007e99"
# The event store this relay serves, from JitPack (vespa-eventstore @ commit).
#
# e3be81564d = store main through PR #80. Ten commits, two of them merges, and
# unlike the bump it replaces this one MOVES KOTLIN AND THE SCHEMA: `event.sd`
# (+139 lines), FuzzyWordGroup, SchemaFallbacks, EventQuery, EventYql,
# SearchFields, NearText, NostrSemanticsStore. Read off `git log --oneline
# 13326d2ef2..` and `git diff --stat`, not the titles.
#
# WHAT IT ADDS is `search_text_gram` — the BODY's trigram net, and the only
# partial-word reach a note's content or an article's prose has. It is
# PHRASE-matched rather than the AND-of-trigrams the schema's three other gram
# nets use, which is what earns it a place on the 550-point body rung: measured
# 0.0% false positives at every body length, against up to 4.0% for the AND form
# on a 2000-word body (that form matched "vitor" against "Take a vitamin and open
# the editor" — `vit` from vitamin, `ito`/`tor` from editor). Two boundaries
# worth knowing before promising anyone partial-word search: the floor is
# MIN_PHRASE_GRAMS = 2 trigrams, so a query word under 4 characters gets no body
# reach at all — which leaves most two-character CJK vocabulary unreachable — and
# it does not join compounds ("seedphrase" does not find "seed phrase").
#
# IT IS NOT FREE, and every search this relay serves pays it: +18.3%
# (+2.11 ms/query) measured on 26k real events pulled from search-staging. The
# store's own caveat travels with that number — read the ABSOLUTE 2.11 ms, not
# the percentage, because at 26k documents fixed per-query overhead still
# dominates and the ratio will not hold at this relay's corpus size.
#
# NOTHING HERE NEEDED A SOURCE CHANGE. `EventQuery` gains `bodyGramMatching`
# with a default and no interface in the range changed at all, so the four sites
# that construct one (SyncMain, IngestDedupTest, IngestCostBench x2, all with
# named arguments) compile untouched. It is not a knob for us either: the client
# flips it off only as a compatibility demotion against a schema that predates
# the column.
#
# THE CONSEQUENCE THAT IS OURS IS A MIGRATION, and this is the second bump
# running where DEPLOYING IS NOT APPLYING — a different reason from the last
# one, and a different operator action. `search_text_gram` is DERIVED by Vespa at
# INDEX time (`indexing: input search_text | normalize | split "\s+" | index`),
# not fed, so `deployBundledSchema` adds the column and leaves it EMPTY on every
# event already stored while `search_text` keeps serving. No error, no 400, no
# blip — just no body partial-word reach for the entire back catalogue. Vespa
# says so itself in the deploy response: "Non-document field 'search_text_gram'
# added; this may be populated by reindexing".
#
# AND `REINDEX_FTS_ON_START` IS NOT THE REPAIR — which is the trap, because it is
# precisely what this repo's own docs have pointed an operator at after a store
# upgrade. The direction is INVERTED from the near tier: those columns are FED,
# so only a re-put can produce them and FtsReindex is the tool; this one is
# DERIVED, so the re-feed's drift check sees identical search columns and
# identical near arrays, re-puts NOTHING, and the walk reports success having
# repaired nothing. What repairs it is a Vespa REINDEX — `POST
# <config>/reindex?clusterId=content&documentType=event`, asynchronous, so a 200
# means `pending` and not completion — or a full re-feed. FtsReindex.kt and
# docs/configuration.md now say this; the three behaviours are the store's,
# verified there on Vespa 8.
#
# ONE FIX ARRIVES UNASKED ON EVERY SEARCH WE SERVE. The read-side schema fallback
# used to flip `nearFieldsAvailable` on any 400 whose text merely CONTAINED a
# near-field name — and Vespa echoes the query back in some 400s, so a single
# malformed query could end prefix and typo recall for the LIFE of the client
# process. It is now anchored on the parser's literal "Field 'x' does not exist".
#
# THE GATE IS GREEN AT THIS COMMIT — the first time it has been, in this file's
# record. Ten IT classes, 11 tests, ~11.5 min, `skipped="0"` with no failures and
# no errors, read off build/test-results/test/*.xml rather than inferred from a
# green line. Two things resolved since the last pin. `ContainerJvmIT` — red
# there, and diagnosed there as the store's unbounded `(\S+)` capture swallowing
# a closing quote — passes here in 57s, fixed upstream by a394d8b exactly as that
# note predicted, so that concern is closed rather than carried. And the store found
# its integration suite had been SILENTLY SKIPPING in its own CI: testcontainers
# offers Docker Remote API 1.32, Engine 29 refuses anything below 1.40,
# `dockerAvailable()` answers false and `assumeTrue` turns the whole suite green
# having run nothing. That never applied to the readings recorded in this file —
# AGENTS.md starts dockerd with `DOCKER_MIN_API_VERSION=1.24`, which lowers the
# ENGINE's floor instead, so the gate did run here. The store now pins
# `api.version=1.41` on the test task, so it runs either way.
#
# DIRECTION: 13326d2ef2 is a strict ancestor of this (`git merge-base
# --is-ancestor`, not the dates), and the store's own quartz is UNCHANGED at
# 1866007e99 — the hash pinned above. One pin moves again.
#
# LEXICOGRAPHIC: 'e3be…' > '1332…' ('e' > '1'), so this sorts ABOVE the pin it
# replaces — the safe direction, after two dangerous ones. That is the coin at
# the top of this file landing the other way, not a trend; it says nothing about
# the next bump, and it was never evidence the pin took. Only `:common` declares
# the store and nothing else on the graph brings it in, so there is no conflict
# here for ordering to settle. The resolved graph is the proof, per module:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath | grep -E "quartz|eventstore"
#
# Bumping this pin is NOT done until the store's own integration gate has run
# against the commit — see AGENTS.md. `InMemoryEventIndex` cannot see a
# Vespa-only regression.
vespaEventStore = "e3be81564d"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.5.1"
# The router mirrors kinds from upstream relays. OkHttp drives the outbound
# websockets (quartz's BasicOkHttpWebSocket) and typesafe-config parses the
# strfry-style `streams { }` HOCON. Both already ride in transitively from
# quartz / vespa-eventstore; pinned here so the router's direct use is explicit.
okhttp = "5.4.0"
typesafeConfig = "1.4.9"
spotless = "8.8.0"
ktlint = "1.8.0"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
# The event store, from JitPack. `store` is the IEventStore + open() front door + the
# ObserverContext/OriginalFilters this relay stamps; it api-exposes the `vespa` engine
# jar transitively (InMemoryEventIndex, EventYql — used by the relay's protocol test).
# Lowercase group on purpose: JitPack caches builds per-spelling, and the
# capitalized `NosFabrica` entry for this commit permanently caches a failed
# infra build. Same repo, same artifacts — different cache key.
vespa-eventstore-store = { module = "com.github.nosfabrica.vespa-eventstore:store", version.ref = "vespaEventStore" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
# NIP-11 tells relays to serve the info doc with CORS headers, and browser-based
# NIP-86 admin tools need the Authorization header preflighted.
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
# gzip/deflate for the pages and ES modules — ~117KB of text over the wire otherwise.
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
# serveRelay bundles the Netty engine (batteries-included) so a consumer — or the
# standalone main() — can bind a port without wiring an engine itself.
# testApplication drives the /web route in-process — the module directory is the
# whole page, so its route, its 304 and its content type are worth asserting
# rather than eyeballing.
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
# Outbound upstream websockets for the router (quartz's BasicOkHttpWebSocket
# takes an OkHttpClient factory) and the HOCON parser for the streams config.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafeConfig" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
