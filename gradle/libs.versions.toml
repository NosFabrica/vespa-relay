[versions]
kotlin = "2.4.0"
# The relay application's version (image tag / --version display).
app = "0.1.0"
# Quartz from JitPack (amethyst @ commit) — the Nostr protocol engine (RelayServerBase).
#
# IDENTICAL to the quartz the store pin below compiles against, which is the
# state to hold: one quartz on the classpath, and `force` restating the
# resolution rather than overriding it. Equality is the easy case, not the
# required one — the invariant is at or AHEAD, because a store running on a
# quartz OLDER than it compiled to fails at the call site in production and at
# no point during assembly. It was behind for exactly one commit here and
# nothing in either build noticed.
#
# So on any bump of EITHER pin, check the direction. The forces stay regardless:
# they are per-module (:common, :relay, :sync), a new module needs its own, and
# they are what stops a store bump from silently dragging its own quartz in.
#
# a5507f9a4d = amethyst main through PR #3889, 24 commits. It is taken FOR that
# PR: the upstream half of this repo's own paged-walk fix. `fetchAllPages` now
# floors its cursor at epoch 0 and ends a walk `UNPAGEABLE` when a relay answers
# entirely ABOVE the `until` it asked for, instead of stepping one second lower
# and asking the same unanswerable question forever. purplepag.es is what found
# it — twelve kind-10002 events at `created_at = 0` and a relay that reads
# `until <= 0` as no bound at all.
#
# Do NOT let that read as "the workaround can go". `flooredForPaging` in :sync
# stays, and the KDoc there says why at length: quartz's guard is the structural
# one (a `since` cannot bound the step path, so an unguarded walk descends from
# any window floor to 0 regardless), but quartz's guard ALONE ends purplepag.es'
# leg UNPAGEABLE — which settles nothing and re-walks 1.49M events next boot.
# The floor is what makes the same walk end DRAINED with the leg closed.
#
# ADDITIVE at every signature we call: the diff to
# `nip01Core/relay/client/accessories/NostrClientFetchAllPagesExt.kt` across
# 875531afb0..a5507f9a4d is 73 insertions and ZERO deletions, and `UNPAGEABLE`
# was already in `PagedFetchEnd` (the search-filter case), so nothing this
# repo's seven `fetchAllPages` call sites compile against moved. Unlike the
# #3884 bump before it, this one is not source-breaking.
#
# Nothing else in the range reaches us, by two separate arguments — the range is
# 24 commits, not just the 12 that touch `quartz/`:
#   - OUTSIDE quartz/: ~51 files under amethyst/, commons/, nappletHost/, docs/
#     and geode/ (#3886 notification grouping, #3858 NIP-5D). We consume the
#     `quartz` artifact alone, so none of it is on this classpath.
#   - INSIDE quartz/: the remainder is concord — the Control Plane soft-ban
#     audit (#3885) plus AuthorityResolver, EditionFold, ConcordStrandedRecovery,
#     ConcordRefounding. This repo does not compile against concord at all
#     (`grep -r quartz.concord` over every .kt here returns 0).
#
# DIRECTION: 875531afb0 is a strict ancestor of this (`git merge-base
# --is-ancestor`, not the dates), and the store pin below compiles against
# EXACTLY a5507f9a4d — so this is the equality case, not merely at-or-ahead.
#
# LEXICOGRAPHIC: 'a550…' > '8755…', so unlike the pin it replaces this one sorts
# the SAFE way and would win a conflict on version order alone. It has none to
# win: the store requests the same hash, so resolution is equality on both
# counts. Verified rather than assumed — the absence of the arrow is the proof:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath | grep quartz
# → `com.github.vitorpamplona.amethyst:quartz:a5507f9a4d` with no `->` anywhere.
#
# Do not read that as the forces being unnecessary. They are what holds this the
# next time the two pins drift, which is every time one moves without the other,
# and a bump in the other direction fails SILENTLY without them.
quartz = "a5507f9a4d"
# The event store this relay serves, from JitPack (vespa-eventstore @ commit).
#
# 685b059d37 = store main through PR #67, whose own range is its quartz bump to
# a5507f9a4d — the same hash pinned above. The two move TOGETHER this time, so
# equality is held across the bump rather than restored a few commits later.
#
# The range is three PRs and four files, none of them the contract:
#   #65  writer-lock attribution — `IngestStats.timed("remove")` wrapped around
#        `TrustProjection.removeDocs`, and the same in `BulkRecordInsert`. Pure
#        instrumentation; the guarded body is unchanged.
#   #66  a CI fix in `AccessLogIT` — retry traffic dropped by reconfiguration
#        rather than failing on it. benchmark/src/test only, not shipped.
#   #67  the quartz bump.
# `IEventStore`, `SQLiteEventStore`, `IndexableFields` and `SearchFieldExtractor`
# are untouched across e129c094a6..685b059d37 (checked by name against
# `git diff --name-only`), so the store contract, filter semantics and
# searchable-kind table carry through as they have since a308d6723f.
#
# DIRECTION: e129c094a6 is a strict ancestor of this, and its quartz is the hash
# pinned above — equality, the state the top comment calls the one to hold.
#
# LEXICOGRAPHIC: '685b…' < 'e129…', so this pin now sorts BELOW the one it
# replaces — the REVERSE of what the previous comment here recorded, and the
# same trap the quartz pin fell into at 875531afb0. It costs nothing only
# because nothing else on the graph brings the store in, so there is no
# conflict to lose. Do not carry "this one sorts the safe way" forward as a
# property of the store pin; it was a property of that hash.
# `./gradlew :relay:dependencies --configuration runtimeClasspath`
#
# Bumping this pin is NOT done until the store's own integration gate has run
# against the commit — see AGENTS.md. `InMemoryEventIndex` cannot see a
# Vespa-only regression.
#
# Previously a308d6723f = store main through PR #62. Its `IEventStore`,
# `SQLiteEventStore`, `IndexableFields` and `SearchFieldExtractor` were
# byte-identical to 98972c31c2 before it, so the store contract, filter
# semantics and searchable-kind table have carried through untouched across all
# three. #59's container access log is a deployment choice, defaulted off, and
# this relay passes nothing — so it keeps the behaviour it had. #62 also DROPPED
# engine/app/validation-overrides.xml, the stemming override; ours redeploys the
# bundled package on boot, so a Vespa old enough to want it would fail the
# deploy rather than warn.
vespaEventStore = "685b059d37"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.5.1"
# The router mirrors kinds from upstream relays. OkHttp drives the outbound
# websockets (quartz's BasicOkHttpWebSocket) and typesafe-config parses the
# strfry-style `streams { }` HOCON. Both already ride in transitively from
# quartz / vespa-eventstore; pinned here so the router's direct use is explicit.
okhttp = "5.4.0"
typesafeConfig = "1.4.9"
spotless = "8.8.0"
ktlint = "1.8.0"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
# The event store, from JitPack. `store` is the IEventStore + open() front door + the
# ObserverContext/OriginalFilters this relay stamps; it api-exposes the `vespa` engine
# jar transitively (InMemoryEventIndex, EventYql — used by the relay's protocol test).
# Lowercase group on purpose: JitPack caches builds per-spelling, and the
# capitalized `NosFabrica` entry for this commit permanently caches a failed
# infra build. Same repo, same artifacts — different cache key.
vespa-eventstore-store = { module = "com.github.nosfabrica.vespa-eventstore:store", version.ref = "vespaEventStore" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
# NIP-11 tells relays to serve the info doc with CORS headers, and browser-based
# NIP-86 admin tools need the Authorization header preflighted.
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
# gzip/deflate for the pages and ES modules — ~117KB of text over the wire otherwise.
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
# serveRelay bundles the Netty engine (batteries-included) so a consumer — or the
# standalone main() — can bind a port without wiring an engine itself.
# testApplication drives the /web route in-process — the module directory is the
# whole page, so its route, its 304 and its content type are worth asserting
# rather than eyeballing.
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
# Outbound upstream websockets for the router (quartz's BasicOkHttpWebSocket
# takes an OkHttpClient factory) and the HOCON parser for the streams config.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafeConfig" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
