[versions]
#
# A NOTE ON THE TWO JITPACK PINS BELOW, because every comment on them mentions
# how the hash sorts and that is easy to read as more than it is.
#
# A JitPack version is a git commit hash. Hashes carry NO order. `c43339e92b`
# is not newer than `a5507f9a4d`, not ahead of it, not a superset of it — the
# two strings simply sort a particular way, decided by the first hex digit,
# which is uniformly random. A commit from last year sorts above one from today
# roughly half the time.
#
# Gradle does not know that. It sees version STRINGS, and when two parts of the
# graph ask for different ones it keeps the lexicographically higher — so for
# hashes it keeps an arbitrary one, and says nothing. That is the whole reason
# for `resolutionStrategy { force(libs.quartz) }` in every module.
#
# So when a comment below says a bump "sorts the safe way", read it as: THIS
# bump would survive a conflict if one arose. It is not a property of the pin
# and it will not hold for the next bump of the same dependency. And it is not
# evidence the pin took effect — ordering only decides who wins a conflict, not
# whether one happened. The proof of that is always the resolved graph:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath
# with no `->` on the line, checked per module.
#
# The relation that does mean something between two hashes is ancestry, and git
# is the only thing that can answer it: `git merge-base --is-ancestor A B`.
# Dates cannot — a commit authored earlier can land on main later.
#
kotlin = "2.4.0"
# The relay application's version (image tag / --version display).
app = "0.1.0"
# Quartz from JitPack (amethyst @ commit) — the Nostr protocol engine (RelayServerBase).
#
# 029c40ebb4 = amethyst main @ 2026-08-28 (PR #4006). The range over 98f09f29c0
# is 85 commits, ELEVEN of which touch `quartz/`, and unlike the last two bumps
# it is not purely additive: `git diff --shortstat 98f09f29c0..029c40ebb4 --
# quartz/` reads 35 files changed, 1606 insertions, 33 DELETIONS. Four of the
# eleven are the Trusted List family again, and three of those land on surfaces
# this repo calls, so the deletions were read one by one rather than trusted:
#
#   ServiceProviderTag.parse NOW REFUSES a `<kind>:<metric>` entry outside
#     30382-30385, and the constructor throws for one. A Treasure Map is an open
#     tag set — `["client", …]` rides on it, and Tapestry's Trusted Lists hang
#     `3039x:<name>` off the same event — so unbounded, a list delegation parsed
#     as a NIP-85 provider and was handed to code looking for a rank service.
#     [EnrolledSigners] is this repo's only reader of `serviceProviders()`, and
#     what the new bound costs it was MEASURED rather than reasoned: across the
#     337 distinct real 10040s in the staging + tapestry corpus the entries are
#     1166 `30382:<metric>`, 9 `30383:`, 9 `30384:`, 2 `30385:` and 2
#     `30392:k:37515`. Only those last two fall outside the new range, and they
#     were already unreadable — both are two-element tags, and `parse` has
#     always required a relay at index 2. Zero service keys change hands.
#
#   MemberTagFields.score IS NOW A 0..100 PERCENTAGE, dropped rather than
#     clamped when a publisher counts on some other scale (a 950 clamped to 100
#     would outrank every honestly-scored peer), and the builders clamp on write.
#     `SearchReferences` reads membership through `parseKey`, which is
#     byte-identical across the range; no score reaches an expansion decision.
#
#   TrustedListEvent.memberValues() and the three `linked*()` accessors swapped
#     `mapNotNull` for the new `TagArray.fastMapNotNullDense`, which presizes the
#     destination for scans where most tags match. Same results, and this repo
#     calls none of them.
#
# WHAT IT BUYS US, and it is not nothing: the new
# `experimental/trustedLists/treasureMap` package parses the GENERIC BARE-KIND
# Map entry — `["30392", <pubkey>, <relay>]`, one entry delegating every list of
# that kind — which is the shape Tapestry's ADR defines for delegating a Trusted
# List publisher and the shape NIP-85's parser above now explicitly refuses. A
# bare kind has no `:`, so `ServiceType.parse` never returned one either, which
# means [EnrolledSigners] had NO key for the Trusted List half of its gate: those
# kinds could be admitted only by an observer who signed the lists themselves.
# This bump is what makes that readable, and the gate now reads both shapes.
# (Zero bare-kind entries exist in the corpus today — which is exactly why no
# 10040 could be found enrolling the tapestry publisher when this feature was
# built against production data.)
#
# DIRECTION: 98f09f29c0 is a strict ancestor of this (`git merge-base
# --is-ancestor`, not the dates), and so is the store's previous ask. The store
# pin below asks for this commit exactly — the equality case, where forcing
# changes nothing about which jar is used.
#
# LEXICOGRAPHIC: '029c…' < '98f0…' ('0' < '9'), so this sorts BELOW the pin it
# replaces — the UNSAFE direction, and the first bump on this line to have it in
# a while. Nothing is riding on that today: the store is the only other part of
# the graph that asks for quartz, and it asks for this exact string, so there is
# no conflict for ordering to settle. It matters for the NEXT bump: if a store commit
# ever asks for a hash sorting above ours, `resolutionStrategy { force }` is the
# only thing keeping our pin, and a bump that forgets to move this line fails
# silently. The resolved graph is the proof either way, and on this bump every
# quartz line reads 029c40ebb4 with no `->` left anywhere, in all five JVM
# modules:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath | grep -E "quartz|eventstore"
quartz = "029c40ebb4"
# The event store this relay serves, from JitPack (vespa-eventstore @ commit).
#
# 130c2efa56 = store main through PR #85 (`Bump Quartz to 029c40ebb4`). The
# range over eaee359357 is one PR, two commits, and `git diff --stat` reads TWO
# files: the store's own quartz pin and a new `TrustProjectionTest` case. The
# store's Kotlin is byte-identical to the last pin — as it was on the last bump,
# for the same reason. What this carries is the QUARTZ ask, which is why the
# line above moved with it and why the two must land together.
#
# NOTHING TO REINDEX. `SearchExtractors`, `SearchFieldExtractor`,
# `IndexableFields`, `SearchableEvent`, `EventFactory`, `Filter` and
# `SearchQuery` are all byte-identical across the quartz range, so the searchable
# set stays at 130 classes / 133 kind values and every derived column extracts to
# what is already stored. Unlike the last bump there is no fed-field migration
# and no `REINDEX_FTS_ON_START` pass to schedule.
#
# THE STORE IS UNMOVED BY THE ONE BEHAVIOUR CHANGE IN ITS OWN BLAST RADIUS:
# `ProviderMap` reads `serviceProviders()` and then matches only
# `ProviderTypes.rank` / `followerCount`, both 30382, so a `3039x` entry was
# already dropped by that `when` and is now dropped one parser step earlier. The
# store never constructs a `ServiceProviderTag`, so the new `require` cannot fire
# there. That reasoning is the store's own, in its catalog at this commit; it was
# re-derived here rather than taken on trust, because the relay reads
# `serviceProviders()` directly and `ProviderMap` does not cover us.
#
# THE GATE IS GREEN AT THIS COMMIT, per AGENTS.md's rule — the relay's tests run
# on `InMemoryEventIndex` and cannot see a Vespa-only regression:
#   git clone https://github.com/NosFabrica/vespa-eventstore && cd vespa-eventstore
#   git checkout 130c2efa56
#   TESTCONTAINERS_RYUK_DISABLED=true ./gradlew :benchmark:test -Pintegration --no-daemon
# RUN IN FLIGHT AT THIS COMMIT — the numbers land in the follow-up commit that
# replaces this paragraph. Until they do, this pin has NOT cleared the rule and
# must not be treated as though it had.
# No schema movement in this range, so there is nothing for a deploy to do and no
# upgrade path to probe this time either.
#
# DIRECTION: eaee359357 is a strict ancestor of this (`git merge-base
# --is-ancestor`, not the dates). The store's own quartz ask moves 98f09f29c0 ->
# 029c40ebb4 across the range, which is the line above, now equal to it.
#
# LEXICOGRAPHIC: '130c…' < 'eaee…' ('1' < 'e'), so this sorts BELOW the pin it
# replaces — the unsafe direction, and BOTH pins go that way on this bump. Four
# modules declare the store (:common, :relay, :sync, :peers), all through this
# one alias, so there is a single string on the graph and nothing for ordering to
# settle. The resolved graph is still the proof:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath | grep -E "quartz|eventstore"
vespaEventStore = "130c2efa56"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.5.1"
# The router mirrors kinds from upstream relays. OkHttp drives the outbound
# websockets (quartz's BasicOkHttpWebSocket) and typesafe-config parses the
# strfry-style `streams { }` HOCON. Both already ride in transitively from
# quartz / vespa-eventstore; pinned here so the router's direct use is explicit.
okhttp = "5.4.0"
typesafeConfig = "1.4.9"
spotless = "8.8.0"
ktlint = "1.8.0"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
# The event store, from JitPack. `store` is the IEventStore + open() front door + the
# ObserverContext/OriginalFilters this relay stamps; it api-exposes the `vespa` engine
# jar transitively (InMemoryEventIndex, EventYql — used by the relay's protocol test).
# Lowercase group on purpose: JitPack caches builds per-spelling, and the
# capitalized `NosFabrica` entry for this commit permanently caches a failed
# infra build. Same repo, same artifacts — different cache key.
vespa-eventstore-store = { module = "com.github.nosfabrica.vespa-eventstore:store", version.ref = "vespaEventStore" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
# NIP-11 tells relays to serve the info doc with CORS headers, and browser-based
# NIP-86 admin tools need the Authorization header preflighted.
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
# gzip/deflate for the pages and ES modules — ~117KB of text over the wire otherwise.
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
# serveRelay bundles the Netty engine (batteries-included) so a consumer — or the
# standalone main() — can bind a port without wiring an engine itself.
# testApplication drives the /web route in-process — the module directory is the
# whole page, so its route, its 304 and its content type are worth asserting
# rather than eyeballing.
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
# Outbound upstream websockets for the router (quartz's BasicOkHttpWebSocket
# takes an OkHttpClient factory) and the HOCON parser for the streams config.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafeConfig" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
