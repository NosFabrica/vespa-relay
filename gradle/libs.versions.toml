[versions]
kotlin = "2.4.0"
# The relay application's version (image tag / --version display).
app = "0.1.0"
# Quartz from JitPack (amethyst @ commit) — the Nostr protocol engine (RelayServerBase).
#
# c43339e92b = amethyst main through #3891. What this repo actually wanted out
# of the range is #3892, which added the `wantId` predicate to negentropySync /
# negentropySyncOrFetch / negentropySyncFanOut — the hook that lets the router
# decline an id BEFORE the download REQ rather than after the body is on the
# wire. Confirmed present in the ARTIFACT rather than inferred from the commit
# graph, because the graph is not what ends up on the classpath:
#   unzip -l quartz-jvm-c43339e92b.jar | grep NeedGate      → present
#   javap ... NostrClientNegentropySyncExtKt | grep negentropySync
#     → carries `Function1<? super String, Boolean>` between onUnreconcilableWindow
#       and onProgress, which is the predicate.
# Default null, so every call site that does not pass one is byte-identical.
#
# Nothing else in the range reaches us. It is 30 commits and 15 files under
# `quartz/`, and they divide cleanly:
#   - 6 are concord/cord05Invites. This repo does not compile against concord at
#     all (`grep -r quartz.concord` over every .kt here returns 0).
#   - 4 are the negentropy accessories above, plus their 3 tests.
#   - EventFactory.kt gains ONE line, a kind mapping for ConcordInviteListEvent;
#     NostrClientFetchAllWithHooksExt.kt gains 21, all additive. Neither is
#     referenced anywhere in this repo.
# Outside `quartz/`: 34 files in commons/, 31 in amethyst/, 12 in desktopApp/,
# 7 in cli/. We consume the `quartz` artifact alone, so none of that is on this
# classpath.
#
# DIRECTION: a5507f9a4d is a strict ancestor of this (`git merge-base
# --is-ancestor`, not the dates), and the store pin below compiles against
# EXACTLY c43339e92b — the equality case again, not merely at-or-ahead. The two
# pins move together in this bump, which is the state to hold.
#
# LEXICOGRAPHIC: 'c433…' > 'a550…', so this sorts the SAFE way and would win a
# conflict on version order alone. It has none to win — the store requests the
# same hash — but the ordering is checked every time regardless, because the
# failure when it is wrong is silent.
#
# Do not read the equality as the forces being unnecessary. They are what holds
# this the next time the two pins drift, which is every time one moves without
# the other.
quartz = "c43339e92b"
# The event store this relay serves, from JitPack (vespa-eventstore @ commit).
#
# 348e408ebd = store main through PR #68, and that PR is the WHOLE range: one
# commit, `Move Quartz to c43339e92b`, touching one file — its own
# gradle/libs.versions.toml. Verified with `git log --oneline 685b059d37..` and
# `git show --stat`, not assumed from the title.
#
# So there is nothing to say about the store contract this time, because nothing
# in it moved: `IEventStore`, `SQLiteEventStore`, `IndexableFields` and
# `SearchFieldExtractor` are untouched by construction when the diff is a single
# version catalog. The writer-lock instrumentation from #63/#65 and the
# AccessLogIT retry from #66 are all CARRIED — they are ancestors of this hash,
# not things this bump gives up.
#
# DIRECTION: 685b059d37 is a strict ancestor of this, and its quartz IS the hash
# pinned above. Equality on both counts.
#
# LEXICOGRAPHIC: '348e…' < '685b…', so this pin sorts BELOW the one it replaces
# — the dangerous direction, and the second bump running that this pin has done
# so. It costs nothing only because nothing else on the dependency graph brings
# the store in, so there is no conflict for a higher-sorting hash to win. That
# is a fact about the graph, not about the pin, and it is why the resolution is
# checked rather than trusted:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath | grep -E "quartz|eventstore"
# → both at the pinned hashes with no `->` anywhere.
#
# Bumping this pin is NOT done until the store's own integration gate has run
# against the commit — see AGENTS.md. `InMemoryEventIndex` cannot see a
# Vespa-only regression.
vespaEventStore = "348e408ebd"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.5.1"
# The router mirrors kinds from upstream relays. OkHttp drives the outbound
# websockets (quartz's BasicOkHttpWebSocket) and typesafe-config parses the
# strfry-style `streams { }` HOCON. Both already ride in transitively from
# quartz / vespa-eventstore; pinned here so the router's direct use is explicit.
okhttp = "5.4.0"
typesafeConfig = "1.4.9"
spotless = "8.8.0"
ktlint = "1.8.0"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
# The event store, from JitPack. `store` is the IEventStore + open() front door + the
# ObserverContext/OriginalFilters this relay stamps; it api-exposes the `vespa` engine
# jar transitively (InMemoryEventIndex, EventYql — used by the relay's protocol test).
# Lowercase group on purpose: JitPack caches builds per-spelling, and the
# capitalized `NosFabrica` entry for this commit permanently caches a failed
# infra build. Same repo, same artifacts — different cache key.
vespa-eventstore-store = { module = "com.github.nosfabrica.vespa-eventstore:store", version.ref = "vespaEventStore" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
# NIP-11 tells relays to serve the info doc with CORS headers, and browser-based
# NIP-86 admin tools need the Authorization header preflighted.
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
# gzip/deflate for the pages and ES modules — ~117KB of text over the wire otherwise.
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
# serveRelay bundles the Netty engine (batteries-included) so a consumer — or the
# standalone main() — can bind a port without wiring an engine itself.
# testApplication drives the /web route in-process — the module directory is the
# whole page, so its route, its 304 and its content type are worth asserting
# rather than eyeballing.
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
# Outbound upstream websockets for the router (quartz's BasicOkHttpWebSocket
# takes an OkHttpClient factory) and the HOCON parser for the streams config.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafeConfig" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
