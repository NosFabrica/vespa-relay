[versions]
#
# A NOTE ON THE TWO JITPACK PINS BELOW, because every comment on them mentions
# how the hash sorts and that is easy to read as more than it is.
#
# A JitPack version is a git commit hash. Hashes carry NO order. `c43339e92b`
# is not newer than `a5507f9a4d`, not ahead of it, not a superset of it — the
# two strings simply sort a particular way, decided by the first hex digit,
# which is uniformly random. A commit from last year sorts above one from today
# roughly half the time.
#
# Gradle does not know that. It sees version STRINGS, and when two parts of the
# graph ask for different ones it keeps the lexicographically higher — so for
# hashes it keeps an arbitrary one, and says nothing. That is the whole reason
# for `resolutionStrategy { force(libs.quartz) }` in every module.
#
# So when a comment below says a bump "sorts the safe way", read it as: THIS
# bump would survive a conflict if one arose. It is not a property of the pin
# and it will not hold for the next bump of the same dependency. And it is not
# evidence the pin took effect — ordering only decides who wins a conflict, not
# whether one happened. The proof of that is always the resolved graph:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath
# with no `->` on the line, checked per module.
#
# The relation that does mean something between two hashes is ancestry, and git
# is the only thing that can answer it: `git merge-base --is-ancestor A B`.
# Dates cannot — a commit authored earlier can land on main later.
#
kotlin = "2.4.0"
# The relay application's version (image tag / --version display).
app = "0.1.0"
# Quartz from JitPack (amethyst @ commit) — the Nostr protocol engine (RelayServerBase).
#
# 98f09f29c0 = amethyst main @ 2026-08-25 (PR #3983). The range over 159afc0423
# is 66 commits, and exactly THREE of them touch `quartz/` — the Tapestry
# Trusted List family (kinds 30392-30395) landing in three steps:
#
#   c0f812e4  implement the Tapestry Trusted List family (30392-30395)
#   509075ab  guard trusted-list member hints, drop member-scan allocations
#   f5f8f605  index Trusted List titles for NIP-50 search
#
# ADDITIVE, in the strict sense: `git diff --shortstat 159afc0423..98f09f29c0 --
# quartz/` reads 35 files changed, 2646 insertions, ZERO deletions. Thirty-two
# of those files are the new `experimental/trustedLists/` package; the rest is
# four `KIND ->` branches in `EventFactory`, four rows in `KindNames`, and a
# SQLite `SearchTest` case. Nothing this repo compiles against moved, which is
# why this bump costs no source change here — and the whole suite confirms it
# rather than the diff alone.
#
# WHY WE MOVE IT AT ALL, since none of the new kinds are ours: the store pin
# below asks for this exact commit, and `resolutionStrategy { force(libs.quartz)
# }` means OUR pin is what every module resolves. Left at 159afc0423 the store's
# newly searchable kinds would be silently inert — that quartz has no
# `EventFactory` branch for 30392-30395, so `doc.toEvent()` hands back a base
# `Event`, the store's `is SearchableEvent ->` mirror never fires, and the four
# kinds are stored with empty search text. Nothing throws; the titles simply
# never become findable. That silent no-op is exactly the failure mode the force
# can produce, and the reason a store bump that moves the store's own quartz ask
# ABOVE our pin has to move this line too. `TrustedListSearchTest` pins the
# working direction so the pair cannot drift apart unnoticed again, and it was
# confirmed to FAIL on 159afc0423 before this line moved — a pin test that
# cannot fail on the old pin is pinning nothing.
#
# DIRECTION: 159afc0423 is a strict ancestor of this (`git merge-base
# --is-ancestor`, not the dates), and so is 1866007e99, the store's PREVIOUS
# ask. The store now asks for this commit exactly — the equality case, where
# forcing changes nothing about which jar is used.
#
# LEXICOGRAPHIC: '98f0…' > '159a…' ('9' > '1'), so this sorts ABOVE the pin it
# replaces — the safe direction, which the last three bumps on this line did
# not have.
# Ordering settles nothing about whether the pin took; only the resolved graph
# does, and on this bump every quartz line reads 98f09f29c0 with no `->` left
# anywhere, the store's included:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath | grep -E "quartz|eventstore"
quartz = "98f09f29c0"
# The event store this relay serves, from JitPack (vespa-eventstore @ commit).
#
# eaee359357 = store main through PR #84 (`Index Quartz's Trusted Lists`). The
# range over 95ded7b3de is one PR, four commits, and NO store source at all —
# `git diff --stat` reads seven files: this store's own quartz pin, a new
# `TrustedListIndexingTest`, a README row and three imported skill docs. The
# store's Kotlin is byte-identical to the last pin. What the bump carries is
# the QUARTZ ask, and that is why the line above moved with it.
#
# WHAT IT BUYS: kinds 30392-30395 — the Tapestry Trusted List family, a curated
# membership published under one point of view, the bulk form of a NIP-85
# assertion — become SEARCHABLE. `SearchExtractors` mirrors quartz's searchable
# set rather than deciding it, so upstream implementing `SearchableEvent` on
# `TrustedListEvent` (`indexableContent() = title() ?: ""`) is the whole
# mechanism: no store code changed, and the store's test flipped from pinning
# the absence to pinning the title. The searchable set goes 126 classes / 129
# kind values -> 130 / 133. The recall side never needed this — `#p`/`#e`/`#a`/
# `#i` over `tag_index` already served a 2,000-member list entry for entry, and
# the store's own test pins that too.
#
# THE TITLE ALONE is indexed: `metric` names a computation and `d` identifies
# the list, so a search for a common word must not return every list that ran
# the same job; the member tags are hex ids and `content` is a JSON echo of the
# same membership. A titleless list indexes "" rather than throwing —
# `indexableContent()` runs inside the insert transaction.
#
# THE TIER IS NOT THE ONE A TITLED KIND USUALLY GETS, and the store's comment is
# explicit that it is observed rather than endorsed: upstream gave the family no
# `SearchFieldExtractor` branch, so it takes the generic `is SearchableEvent ->`
# fallback, which puts the whole string in the TERTIARY tier — `search_text`,
# the BODY column, not `search_primary`. A list title is therefore weighted like
# note content and reached by trigram substring rather than the prefix/typo
# attributes every other titled kind enjoys: "podcast" finds "Podcaster", a typo
# does not. The fix, if we want one, is one branch UPSTREAM, never a local
# divergence — which tier an accessor lands in is Quartz's call.
#
# A MIGRATION APPLIES, and it is the fed-field one: search text is data we WRITE
# on put, so the four kinds already in the corpus carry none until
# `REINDEX_FTS_ON_START` walks it (new writes are indexed immediately). The
# store's drift check re-puts a document whose extracted columns differ from the
# stored ones, which is precisely this case — unlike `search_text_gram`, the
# derived column that walk cannot repair. Procedure and the distinction:
# docs/migrations.md.
#
# THE GATE IS GREEN AT THIS COMMIT, per this file's rule: `:benchmark:test
# -Pintegration` run HERE against eaee359357 on a real Vespa in Docker — 11
# tests, 0 skipped, 0 failures, 11m05s. No schema movement in this range, so there is
# nothing for a deploy to do and no upgrade path to probe this time.
#
# DIRECTION: 95ded7b3de is a strict ancestor of this (`git merge-base
# --is-ancestor`, not the dates). The store's own quartz ask moves 1866007e99 ->
# 98f09f29c0 across the range (via 509075abde), which is the line above, now
# equal to it.
#
# LEXICOGRAPHIC: 'eaee…' > '95de…' ('e' > '9'), so this sorts ABOVE the pin it
# replaces — the safe direction, and both pins move that way on this bump. Four
# modules declare the store (:common, :relay, :sync, :peers), all through this
# one alias, so there is a single string on the graph and nothing for ordering
# to settle. The resolved graph is still the proof:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath | grep -E "quartz|eventstore"
vespaEventStore = "eaee359357"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.5.1"
# The router mirrors kinds from upstream relays. OkHttp drives the outbound
# websockets (quartz's BasicOkHttpWebSocket) and typesafe-config parses the
# strfry-style `streams { }` HOCON. Both already ride in transitively from
# quartz / vespa-eventstore; pinned here so the router's direct use is explicit.
okhttp = "5.4.0"
typesafeConfig = "1.4.9"
spotless = "8.8.0"
ktlint = "1.8.0"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
# The event store, from JitPack. `store` is the IEventStore + open() front door + the
# ObserverContext/OriginalFilters this relay stamps; it api-exposes the `vespa` engine
# jar transitively (InMemoryEventIndex, EventYql — used by the relay's protocol test).
# Lowercase group on purpose: JitPack caches builds per-spelling, and the
# capitalized `NosFabrica` entry for this commit permanently caches a failed
# infra build. Same repo, same artifacts — different cache key.
vespa-eventstore-store = { module = "com.github.nosfabrica.vespa-eventstore:store", version.ref = "vespaEventStore" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
# NIP-11 tells relays to serve the info doc with CORS headers, and browser-based
# NIP-86 admin tools need the Authorization header preflighted.
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
# gzip/deflate for the pages and ES modules — ~117KB of text over the wire otherwise.
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
# serveRelay bundles the Netty engine (batteries-included) so a consumer — or the
# standalone main() — can bind a port without wiring an engine itself.
# testApplication drives the /web route in-process — the module directory is the
# whole page, so its route, its 304 and its content type are worth asserting
# rather than eyeballing.
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
# Outbound upstream websockets for the router (quartz's BasicOkHttpWebSocket
# takes an OkHttpClient factory) and the HOCON parser for the streams config.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafeConfig" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
