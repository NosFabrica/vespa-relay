[versions]
#
# A NOTE ON THE TWO JITPACK PINS BELOW, because every comment on them mentions
# how the hash sorts and that is easy to read as more than it is.
#
# A JitPack version is a git commit hash. Hashes carry NO order. `c43339e92b`
# is not newer than `a5507f9a4d`, not ahead of it, not a superset of it — the
# two strings simply sort a particular way, decided by the first hex digit,
# which is uniformly random. A commit from last year sorts above one from today
# roughly half the time.
#
# Gradle does not know that. It sees version STRINGS, and when two parts of the
# graph ask for different ones it keeps the lexicographically higher — so for
# hashes it keeps an arbitrary one, and says nothing. That is the whole reason
# for `resolutionStrategy { force(libs.quartz) }` in every module.
#
# So when a comment below says a bump "sorts the safe way", read it as: THIS
# bump would survive a conflict if one arose. It is not a property of the pin
# and it will not hold for the next bump of the same dependency. And it is not
# evidence the pin took effect — ordering only decides who wins a conflict, not
# whether one happened. The proof of that is always the resolved graph:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath
# with no `->` on the line, checked per module.
#
# The relation that does mean something between two hashes is ancestry, and git
# is the only thing that can answer it: `git merge-base --is-ancestor A B`.
# Dates cannot — a commit authored earlier can land on main later.
#
kotlin = "2.4.0"
# The relay application's version (image tag / --version display).
app = "0.1.0"
# Quartz from JitPack (amethyst @ commit) — the Nostr protocol engine (RelayServerBase).
#
# 159afc0423 = amethyst main through #3958. The range over 1866007e99 is wide
# (NIP-19 scanning, PoW mining, Cashu, the content parsers) and almost none of it
# is ours; the two commits that reach this repo are the fix for the pool-registry
# leak we reported as #154:
#
#   ca89b30f  release pool request/count state rows when a sub is removed
#   18bd078a  release the sub row on unsubscribe even while the client is inactive
#
# WHAT WAS WRONG, because the shape matters more than the commit titles.
# `PoolRequests.remove()` dropped a sub from `desiredSubs` and dropped its
# listener, but left its `RequestSubscriptionState` in `relayState` — and
# `onConnecting` / `onDisconnected` / `onCannotConnect` scan that map IN FULL on
# every relay lifecycle event. Every `fetchAll*` mints a fresh `newSubId()`, so
# the map was not "requests we hold", it was "every request either plane has ever
# made", and a connect cost O(all subs ever created). Measured here, driving
# `PoolRequests` through NostrClient's exact subscribe/unsubscribe sequence with
# ZERO live subs the whole time — every entry timed is garbage:
#
#   subs churned        1,000    5,000   20,000   50,000  100,000
#   1866007e99 ms/conn   0.067    0.570    2.063    6.204   21.038
#   159afc0423 ms/conn   0.000    0.002    0.000    0.001    0.001
#
# That is the staging collapse in one line: at ~100 connects/s a registry of that
# size IS the 6.42 of 12 cores the thread dumps found inside the scan, and it is
# why the fitness pass ran 3h09m for zero passes while the probe executor sat at
# 0.0s of CPU. On this pin the registry holds LIVE subs only, so the scan is
# bounded by what we actually hold: 200 open tails cost 0.077 ms per connect.
#
# THE FIX IS NOT THE OBVIOUS ONE-LINER, which is worth knowing before anyone
# "simplifies" it. The row cannot be dropped inside `remove()`: the CLOSE frame is
# decided from the filters that row still holds, so dropping it there stops the
# CLOSE being sent and leaks the subscription ON THE RELAY instead. Quartz
# releases the row after the CLOSE has been handed to the socket, and its
# `PoolRequestsRegistryLeakTest` guards both directions. Our own probe confirmed
# the same on this pin: 100,000 removals, 100,000 CLOSEs still sent.
#
# NOT SOURCE-BREAKING. `PoolRequests.subState` became private — no call site here,
# and none in the store's jars either (checked; the store never touches the pool).
# `INostrClient` gains `registrySizes()` WITH a default, so `FitnessPass.client`
# and `Healer.client` still compile untouched. That accessor exists so a host can
# alarm on registry growth, which is #154's third ask and is still unwired here.
#
# WATCH AT RUNTIME, since the rest of the range was written for an app and we are
# a server: `NostrClient` now ages out `CachingEventDecoder` every 30s while
# active and clears it outright on `disconnect()`. It is a parse-dedup cache, so
# the cost of dropping it is re-parses and never correctness, and nothing here
# reads or configures the decoder.
#
# DIRECTION: 1866007e99 is a strict ancestor of this (`git merge-base
# --is-ancestor`, not the dates). The store pin below is UNCHANGED and asks for
# 1866007e99 — an ancestor this time, not the equality case the last bump had, and
# the only quartz change in the range is one the store never calls.
#
# LEXICOGRAPHIC: '159…' < '186…' ('5' < '8'), so this sorts BELOW the pin it
# replaces — the dangerous direction, as the last two quartz bumps also were, and
# here the store is actively asking for the higher string. `resolutionStrategy {
# force(libs.quartz) }` in every module is what makes that survivable rather than
# lucky. Ordering settles nothing about whether the pin took; only the resolved
# graph does, and on this bump it reads `1866007e99 -> 159afc0423` under the store
# with no unforced line left:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath | grep -E "quartz|eventstore"
quartz = "159afc0423"
# The event store this relay serves, from JitPack (vespa-eventstore @ commit).
#
# 95ded7b3de = store main through PR #83 (`Add a recency term to text
# ranking`). The range over 84664f9ab0 is TWO PRs, ten commits, 41 files
# (+2119/-471) — PR #82, a dead-API sweep plus an audit pass, and PR #83,
# recency in text ranking. Read off `git log --oneline 84664f9ab0..` and
# `git diff --stat`, not the titles. Both halves reach this repo: one costs a
# source change here, the other changes the ORDER of every ranked page we
# serve. No migration and no reindex.
#
# SOURCE-BREAKING, one site. PR #82 deleted `EventIndex.distinctAuthors` —
# `countByAuthor` was always the same grouping with the counts kept, so it
# absorbed it — along with `countDistinctAuthors`, `countByKind`, the store's
# `distinctAuthors(Filter)`/`distinctDTags`, `EventQuery.notKinds` and
# `EventYql.RANK_FILTERED`. Production code here calls NONE of them: the
# stats page never went through the port (`StatsYql` builds and posts its own
# groupings, deliberately). The one call site was `RelayProtocolTest`'s
# RecordingIndex, which overrode `distinctAuthors` to delegate; it overrides
# `countByAuthor` for the same reason now, and StatsYql's KDoc no longer
# names the two builders that went with them.
#
# THE SCHEMA MOVES, and it ships by itself: `deployBundledSchema` deploys the
# store's own application package on EVERY boot, so the jar carries it. Four
# new rank inputs (`now_secs`, `recency_halflife`, `w_recency`,
# `w_recency_text`) and four new functions; `pubkey_gram` and its `grams`
# fieldset gone (a trigram index over every 64-hex pubkey, referenced by
# nothing), `rank_filtered` gone. Nothing to re-feed: the new functions read
# `attribute(created_at)`, already resident, and the dropped field only frees
# its index. A deploy that fails leaves the cluster on the schema it has and
# the process up (the warning says so) — the recency term is query()-side, so
# what that degrades to is the ordering we serve today.
#
# WHAT WE SERVE CHANGES: ranked reads get a recency tiebreak. `w_recency` 0.1
# with a 30-day half-life on the TRUST profiles (the pure-text knob ships
# 0.0), as a `max(1.0, 1 + w*freshness())` multiplier — >= 1 by construction,
# so `rank-score-drop-limit` deletes exactly what it deleted before and the
# match set is bit-identical; only the order moves. The store measured it on
# a real staging slice (4596 events captured read-only, re-fed with their real
# NIP-85 trust): the top-50 for "bitcoin" under a trust lens went from median
# age 993d to 7d at this weight, match counts identical on every row, and when
# the sweep was re-run after the audit dropped the kind-0 exemption every
# pinned position still held. Nothing in THIS repo pins ranked order — the
# relay's tests rank through `InMemoryEventIndex`, which does not rank — so
# the web feed and every `search:` REQ are where this is visible. Age is a
# DISTANCE from the query's clock, which is why the corpus's 2100-dated notes
# read as old rather than maximally fresh, and the store now stamps ONE
# instant per request so sibling filters in a REQ cannot merge scores taken
# from two clocks.
#
# ALSO IN RANGE, all of it ours to use: a REQ carrying a big `limit` is
# served WHOLE instead of erroring. `limit: 5000` came back an ERROR from
# production — the tie-slack overfetch was added BEFORE the profile was
# picked, so past `band - 64` the query moved onto `unranked`, where a
# match-phase-degraded response is refused rather than reconciled; paging
# now walks the band on a created_at cursor instead. That is not a corner
# case for us: since #157 `defaultLimit` IS 5,000, so every REQ naming no
# limit asks the store for exactly the number that errored. Also: multi-filter
# searches no longer interleave scores from two different rank profiles (a REQ
# where one filter resolved an observer and another did not read as one
# scale); NIP-45 COUNT and NIP-09 a-tag deletion fan out bounded-concurrently
# instead of running their filters one at a time under the writer lock. New
# knob: `VESPA_MATCH_PHASE_MAX_HITS` mirrors the schema's max-hits and is PER
# CONTENT NODE — same together-or-not rule as `VESPA_UNBOUNDED_HITS` above.
#
# THE GATE IS GREEN AT THIS COMMIT, per this file's rule that a bump waits
# for the store's own integration gate: `:benchmark:test -Pintegration` run
# HERE against 95ded7b3de on a real Vespa in Docker — 11 tests, 0 skipped,
# 0 failures, 14m47s, RankRegressionIT (the recency claims) among them.
# `InMemoryEventIndex` can see none of this; the schema deploy, the recency
# functions and the paged limit are all Vespa-side.
#
# AND THE UPGRADE PATH, which that gate CANNOT see — it deploys onto an empty
# cluster every time, while ours has a schema and a corpus already. Probed
# here: old package deployed to a live Vespa, one event fed so the dropped
# `pubkey_gram` had data behind it, then the new package on top.
# `prepareandactivate` accepted it with `{"restart": [], "refeed": [],
# "reindex": []}` — no operator action, nothing to re-feed — the container
# kept serving, the doc was still there, and a query naming the new
# `query(now_secs)` input answered.
#
# DIRECTION: 84664f9ab0 is a strict ancestor of this (`git merge-base
# --is-ancestor`, not the dates), and the store's own quartz is UNCHANGED at
# 1866007e99 — its version catalog is untouched across the whole range. One
# pin moves.
#
# LEXICOGRAPHIC: '95de…' > '8466…' ('9' > '8'), so this sorts ABOVE the pin
# it replaces — the SAFE direction for once. Four modules declare the store
# (:common, :relay, :sync, :peers) but all through this one alias, so there
# is a single string on the graph and nothing for ordering to settle. The
# resolved graph is still the proof:
#   ./gradlew :relay:dependencies --configuration runtimeClasspath | grep -E "quartz|eventstore"
vespaEventStore = "95ded7b3de"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.5.1"
# The router mirrors kinds from upstream relays. OkHttp drives the outbound
# websockets (quartz's BasicOkHttpWebSocket) and typesafe-config parses the
# strfry-style `streams { }` HOCON. Both already ride in transitively from
# quartz / vespa-eventstore; pinned here so the router's direct use is explicit.
okhttp = "5.4.0"
typesafeConfig = "1.4.9"
spotless = "8.8.0"
ktlint = "1.8.0"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
# The event store, from JitPack. `store` is the IEventStore + open() front door + the
# ObserverContext/OriginalFilters this relay stamps; it api-exposes the `vespa` engine
# jar transitively (InMemoryEventIndex, EventYql — used by the relay's protocol test).
# Lowercase group on purpose: JitPack caches builds per-spelling, and the
# capitalized `NosFabrica` entry for this commit permanently caches a failed
# infra build. Same repo, same artifacts — different cache key.
vespa-eventstore-store = { module = "com.github.nosfabrica.vespa-eventstore:store", version.ref = "vespaEventStore" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
# NIP-11 tells relays to serve the info doc with CORS headers, and browser-based
# NIP-86 admin tools need the Authorization header preflighted.
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
# gzip/deflate for the pages and ES modules — ~117KB of text over the wire otherwise.
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
# serveRelay bundles the Netty engine (batteries-included) so a consumer — or the
# standalone main() — can bind a port without wiring an engine itself.
# testApplication drives the /web route in-process — the module directory is the
# whole page, so its route, its 304 and its content type are worth asserting
# rather than eyeballing.
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
# Outbound upstream websockets for the router (quartz's BasicOkHttpWebSocket
# takes an OkHttpClient factory) and the HOCON parser for the streams config.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafeConfig" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
