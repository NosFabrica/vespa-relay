[versions]
kotlin = "2.4.0"
# The relay application's version (image tag / --version display).
app = "0.1.0"
# Quartz from JitPack (amethyst @ commit) — the Nostr protocol engine (RelayServerBase).
#
# IDENTICAL to the quartz the store pin below compiles against, which is the
# state to hold: one quartz on the classpath, and `force` restating the
# resolution rather than overriding it. Equality is the easy case, not the
# required one — the invariant is at or AHEAD, because a store running on a
# quartz OLDER than it compiled to fails at the call site in production and at
# no point during assembly. It was behind for exactly one commit here and
# nothing in either build noticed.
#
# So on any bump of EITHER pin, check the direction. The forces stay regardless:
# they are per-module (:common, :relay, :sync), a new module needs its own, and
# they are what stops a store bump from silently dragging its own quartz in.
#
# 875531afb0 = amethyst main through PRs #3882, #3883, #3884 and #3881. Two
# bumps landed on top of each other here and this hash carries both — 4f41f16db5,
# the pin main took for the first two, is an ancestor of it, as is the
# cee2a9ea4b this branch took for #3884 (verified with
# `git merge-base --is-ancestor`, not by reading the dates).
#
# The tip commit adds nothing we compile against: cee2a9ea4b..875531afb0 is
# #3881, a Crowdin translation sync, and `git diff --stat` over
# `nip01Core/relay/client/accessories/` across that range is empty. Taken to stay
# current, not for anything in it.
#
# #3882/#3883 — quartz's NIP-66 monitor was deleting this repo's fold verdicts.
# Kind 30166 is ADDRESSABLE on `d` = the relay url, so quartz's
# `RelayReachabilityStore` and `RelayProber.toDiscoveryEventTemplate` and our
# `RelayAliasRecord` all write the SAME slot for a given relay. All three built
# the record from their own observations alone, so whichever wrote last erased
# the others — measured here as `[d, n, rtt-open]` becoming `[d, redirect]` and
# back again on the next dial. Nothing about the loss is visible: the record is
# still signed, still a valid NIP-66 observation, just saying less than it did.
# Both quartz writers now read the current record and carry across every tag
# they did not themselves measure. ADDITIVE for callers — the new `current`
# parameter defaults to null and no signature this repo calls changed.
#
# #3884 — the upstream half of the drained-leg fix in :sync. `fetchAllPages`
# returns `PagedFetchResult(downloaded, end)` instead of an `Int`, naming every
# way a walk can stop (DRAINED, LIMIT_REACHED, IDLE, CLOSED, CANNOT_CONNECT,
# UNPAGEABLE), and `SyncCoverage.Span` carries its own `complete` so a paged leg
# that drained one kind cannot speak for the others. `SyncCoverage.Band` lost its
# `complete` CONSTRUCTOR parameter and kept the property, derived as
# all-kinds-complete.
#
# SOURCE-BREAKING twice over: for every caller of `fetchAllPages` that reads the
# count (now `.downloaded`), and for anyone constructing a `Band`. Both are this
# repo and geode. The store touches NEITHER — verified against the resolved jars
# rather than inferred, `strings` over every class in store-a308d6723f.jar and
# engine-a308d6723f.jar finds no `fetchAllPages`, `SyncCoverage` or
# `PagedFetchResult`.
#
# DIRECTION: f4640b6ea1 — what the store at a308d6723f compiles against — is an
# ancestor of this, so the store runs on a quartz AHEAD of its build, the safe
# side of the at-or-ahead invariant. The store pin below does not move.
#
# LEXICOGRAPHIC, and the reason to run the check rather than trust this line:
# '8755…' sorts BELOW the 'f464…' the store still drags in transitively, so
# conflict resolution alone would keep the OLD quartz and this bump would do
# nothing — the exact silent no-op the per-module forces exist for. They are what
# makes it land, not a formality. Verified after bumping:
#   ./gradlew :sync:dependencies --configuration runtimeClasspath | grep quartz
# → `com.github.vitorpamplona.amethyst:quartz:f4640b6ea1 -> 875531afb0 (forced)`
quartz = "875531afb0"
# The event store this relay serves, from JitPack (vespa-eventstore @ commit).
#
# a308d6723f = store main through PR #62, whose WHOLE range is that quartz bump:
# two commits, one of them the merge, and no source change in any store module.
# It is pinned here for the direction rule above — taking the new quartz without
# it would leave the store compiled against the old SyncCoverage — not for
# anything the store itself gained. Its `IEventStore`, `SQLiteEventStore`,
# `IndexableFields` and `SearchFieldExtractor` are byte-identical to 98972c31c2,
# so the store contract, filter semantics and searchable-kind table carry over
# untouched.
#
# The integration gate is run against it anyway, per AGENTS.md: a store whose
# only change is a dependency is exactly the shape of bump the relay's own
# InMemoryEventIndex tests cannot see through. What that run found is in the
# commit that made this bump, not here — an outcome is a point in time and a
# comment is not.
#
# Previously 98972c31c2 = store main through PR #61. Carried everything 3efbf16e69 had —
# #56's coverage guard (a response judged by Vespa's own isDegraded(), not by
# its `full`, which disagrees in BOTH directions), #57's quartz alignment, and
# WriterTopology on open(), which this deployment needs because the guard-owner
# cache that skips the NIP-09/NIP-62 probes is exact only for a single writer
# and there are two here (STORE_WRITERS in :common).
#
# What is new is the container access log (#59): a deployment choice rather than
# a constant, injected into services.xml as parsed XML instead of spliced text,
# and defaulted off — this relay passes nothing, so it keeps the behaviour it
# had. #60 made that feature's IT poll for the log rather than race Vespa's
# reconfiguration, and #61 cleared two compiler warnings that were dead code.
#
# It also DROPS engine/app/validation-overrides.xml, the stemming override —
# the store's position is that every deployment has upgraded past needing it.
# Ours redeploys the bundled package on boot, so a Vespa old enough to still
# want that override would fail the deploy rather than warn.
#
# VERIFY the hash resolved rather than reading this line: Gradle breaks a version
# conflict lexicographically, so a hash that sorts below one dragged in
# transitively loses silently and the bump does nothing. This pin sorted the safe
# way when it moved ('a308…' > '98972…'); the quartz pin above no longer does, and
# rides on the forces instead.
# `./gradlew :relay:dependencies --configuration runtimeClasspath`
vespaEventStore = "a308d6723f"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.5.1"
# The router mirrors kinds from upstream relays. OkHttp drives the outbound
# websockets (quartz's BasicOkHttpWebSocket) and typesafe-config parses the
# strfry-style `streams { }` HOCON. Both already ride in transitively from
# quartz / vespa-eventstore; pinned here so the router's direct use is explicit.
okhttp = "5.4.0"
typesafeConfig = "1.4.9"
spotless = "8.8.0"
ktlint = "1.8.0"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
# The event store, from JitPack. `store` is the IEventStore + open() front door + the
# ObserverContext/OriginalFilters this relay stamps; it api-exposes the `vespa` engine
# jar transitively (InMemoryEventIndex, EventYql — used by the relay's protocol test).
# Lowercase group on purpose: JitPack caches builds per-spelling, and the
# capitalized `NosFabrica` entry for this commit permanently caches a failed
# infra build. Same repo, same artifacts — different cache key.
vespa-eventstore-store = { module = "com.github.nosfabrica.vespa-eventstore:store", version.ref = "vespaEventStore" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
# NIP-11 tells relays to serve the info doc with CORS headers, and browser-based
# NIP-86 admin tools need the Authorization header preflighted.
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
# gzip/deflate for the pages and ES modules — ~117KB of text over the wire otherwise.
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
# serveRelay bundles the Netty engine (batteries-included) so a consumer — or the
# standalone main() — can bind a port without wiring an engine itself.
# testApplication drives the /web route in-process — the module directory is the
# whole page, so its route, its 304 and its content type are worth asserting
# rather than eyeballing.
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
# Outbound upstream websockets for the router (quartz's BasicOkHttpWebSocket
# takes an OkHttpClient factory) and the HOCON parser for the streams config.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafeConfig" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
