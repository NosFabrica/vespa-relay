name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # docker.yml calls this, so no image is pushed from a commit whose tests fail.
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Spotless
        run: ./gradlew spotlessCheck

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # `:web:jsTest` runs the browser code's own suite in plain node, and
      # `build` depends on it. The runner image happens to ship a node, but a
      # verification step that works by accident of the image is one that
      # disappears the day the image changes — and it would disappear as a
      # BUILD FAILURE naming a missing binary, or worse, silently if the task
      # were ever made lenient. Pinned here so the version is a decision.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build and test
        run: ./gradlew build
      # The Docker image runs these two dist trees by exact path
      # (/app/relay/bin/vespa-relay, /app/sync/bin/vespa-sync); `build` alone
      # never assembles them, so a renamed applicationName would stay green
      # here and die at `docker compose up`.
      - name: Assemble both distributions
        run: ./gradlew :relay:installDist :sync:installDist
