# The whole thing in one command: a single-node Vespa plus the trust-ranking relay.
#
#   docker compose up --build
#
# The relay deploys the bundled schema to Vespa on first run (AUTO_DEPLOY), then
# serves the NIP-50 websocket, the NIP-11 doc, and the web UI on RELAY_PORT.
# Filling the store from the network (crawl / trust-sync) is a separate service —
# see SoT (github.com/vitorpamplona/sot).

services:
  vespa:
    image: vespaengine/vespa
    container_name: vespa
    hostname: vespa
    # A LIMIT, not a reservation. Without one both containers see the whole
    # Docker VM and each sizes itself against it: the engine settles around 32
    # GiB while the relay's MaxRAMPercentage=45 lets its heap reach 22.7 GiB, so
    # the two are entitled to 55 GiB of a 47 GiB machine. Nothing collides while
    # the relay is idle, and the workload that would collide — several streams
    # holding negentropy id snapshots at once — is the normal one.
    #
    # The engine gets the larger share because losing it is worse: the relay can
    # be restarted in seconds, while a killed content node replays its
    # transaction log for minutes before it serves anything.
    mem_limit: ${VESPA_MEM_LIMIT:-34g}
    ports:
      - "${VESPA_PORT:-8080}:8080" # query / document API
      - "${VESPA_CONFIG_PORT:-19071}:19071" # config server
    volumes:
      - vespa_var:/opt/vespa/var
    healthcheck:
      # A query that returns a CONTENT NODE, not the config server and not a
      # bare HTTP 200. :19071 answers within seconds of the container starting,
      # and a container whose content node is still loading answers a search with
      # 200 and {"documents":0,"nodes":0} — so both weaker probes make
      # `depends_on: service_healthy` mean "Vespa exists" rather than "Vespa has
      # the corpus". Everything the relay does at startup then runs against an
      # apparently empty store: the trust reconcile finds no providers and calls
      # itself consistent, and every dynamic stream finds no relays. Requiring a
      # node still passes on a genuinely empty store, where nodes is 2 and
      # documents is 0.
      test:
        - CMD-SHELL
        - >-
          curl -fSs 'http://localhost:8080/search/?yql=select+*+from+sources+*+where+true&hits=0&timeout=3s'
          | grep -q '"nodes":[1-9]'
      interval: 5s
      timeout: 5s
      # A cold 20M-doc index takes minutes; these bound the wait at ~30, and a
      # relay that starts anyway would only find an empty store.
      retries: 180
      start_period: 120s
    restart: unless-stopped

  relay:
    build: .
    container_name: vespa-relay
    # Heap becomes 45% of this. Sized from what a full fan-out actually uses —
    # the largest observed snapshot phase peaked around 13 GiB across three
    # concurrent streams — with room above it rather than room to take the
    # engine's share.
    mem_limit: ${RELAY_MEM_LIMIT:-12g}
    depends_on:
      vespa:
        condition: service_healthy
    environment:
      # The negentropy reconciliation holds one local id snapshot per stream IN
      # MEMORY, and every stream backfills at once — so the heap has to cover the
      # whole fan-out, not one relay. The JVM default is 25% of the container,
      # which OOM'd at 8.4 GiB the first time every stream asked for full history.
      #
      # 70% because the streams are serialised: the peak is now ONE stream's id
      # set rather than every stream's sum, and the largest single one — 43.7M
      # ids for the assertions filter — is about 5.3 GiB. At 45% of a 12 GiB
      # container the heap was 5.4 GiB, which that set only just fits inside
      # before anything else is allocated.
      #
      # The percentage is of mem_limit below, which is the point of setting one:
      # MaxRAMPercentage reads the cgroup, and without a limit it reads the HOST,
      # so this asked for 22.7 GiB of a machine the engine had already claimed 32
      # GiB of. A bounded heap also makes ingest backpressure do its job instead
      # of letting the relay grow into the engine's memory.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70}
      VESPA_URL: http://vespa:8080
      RELAY_PORT: 7777
      # This relay's own public ws url (NIP-42 identity / NIP-62 vanish scope).
      RELAY_URL: ${RELAY_URL:-ws://localhost:7777}
      # How the relay presents itself in its NIP-11 document. All optional —
      # empty values are omitted from the doc. See .env.example.
      RELAY_NAME: ${RELAY_NAME:-vespa-relay}
      RELAY_DESCRIPTION: ${RELAY_DESCRIPTION:-}
      RELAY_ICON: ${RELAY_ICON:-}
      RELAY_BANNER: ${RELAY_BANNER:-}
      RELAY_CONTACT: ${RELAY_CONTACT:-}
      RELAY_CONTACT_PUBKEY: ${RELAY_CONTACT_PUBKEY:-}
      RELAY_POSTING_POLICY: ${RELAY_POSTING_POLICY:-}
      RELAY_PRIVACY_POLICY: ${RELAY_PRIVACY_POLICY:-}
      RELAY_TERMS_OF_SERVICE: ${RELAY_TERMS_OF_SERVICE:-}
      # 64-hex pubkey whose web of trust ranks anonymous searches; empty = untrusted.
      DEFAULT_OBSERVER: ${DEFAULT_OBSERVER:-}
      # Router (upstream mirror). Off by default. To turn it on, drop a strfry-style
      # streams config next to this file (see router.conf.example) and start with:
      #   ROUTER_CONFIG_FILE=/etc/vespa-relay/router.conf docker compose up --build
      # The volume line below mounts ./router.conf when ROUTER_CONFIG_FILE is set.
      ROUTER_CONFIG_FILE: ${ROUTER_CONFIG_FILE:-}
      # How often (seconds) up/both streams re-reconcile to push new local events.
      ROUTER_UP_INTERVAL_SECONDS: ${ROUTER_UP_INTERVAL_SECONDS:-300}
      # Ingest tuning. Throughput comes from the batch size, not the worker count
      # (the store serializes writes). Lower the batch to cut memory.
      ROUTER_INGEST_BATCH: ${ROUTER_INGEST_BATCH:-1000}
      ROUTER_INGEST_CONCURRENCY: ${ROUTER_INGEST_CONCURRENCY:-2}
      # Defaults for `relaySource = [...]` streams, whose relay list is read out of
      # the store's own events instead of the config (see the `outbox` and
      # `assertions` streams in router.conf.example). Per-stream keys override these.
      ROUTER_DYNAMIC_REFRESH_SECONDS: ${ROUTER_DYNAMIC_REFRESH_SECONDS:-21600}
      ROUTER_DYNAMIC_CONCURRENCY: ${ROUTER_DYNAMIC_CONCURRENCY:-8}
      # For `sync = "auto"` streams: how many events both we and the relay must
      # hold on the stream's filter before a negentropy reconcile is worth its id
      # exchange, and how long the relay gets to answer the NIP-45 COUNT that
      # measures it. Streams that declare `sync` in router.conf ignore both.
      ROUTER_NEG_MIN_EVENTS: ${ROUTER_NEG_MIN_EVENTS:-100000}
      ROUTER_COUNT_TIMEOUT_MS: ${ROUTER_COUNT_TIMEOUT_MS:-5000}
      # Run only these streams (comma-separated), so one part of the sync can be
      # tuned without the rest competing for the same sockets, heap and ingest
      # queue. Empty (the default) runs every stream the config defines. The
      # router prints what it is NOT running on every startup, so a leftover
      # setting can't be mistaken for a stream that is failing.
      #   ROUTER_STREAMS=dataViaOutbox docker compose up -d relay
      ROUTER_STREAMS: ${ROUTER_STREAMS:-}
      # What goes down the wire to upstream relays. Empty (the default) still
      # logs what the relay COMPLAINS about — NOTICE, CLOSED, failed sends —
      # which are the relay telling us why it stopped and were previously
      # discarded. "sent" adds every command we send; "full" adds every message
      # received, which is a line per event and is for a specific investigation.
      ROUTER_WIRE_LOG: ${ROUTER_WIRE_LOG:-}
      # Quartz's own log floor (it defaults to DEBUG, which makes malformed
      QUARTZ_LOG_LEVEL: ${QUARTZ_LOG_LEVEL:-}
      # Opt-in parse audit. Point PARSE_AUDIT_FILE inside /var/lib/vespa-relay,
      # which the volume below maps to PARSE_AUDIT_LOCAL_DIR on the host, so the
      # report is readable without entering the container. Unset ⇒ off.
      # Where the per-(relay, filter) synced created_at band is kept, so a relay
      # without NIP-77 resumes instead of re-reading its corpus every restart.
      # Same mounted volume as the audit below. Unset ⇒ in memory only.
      ROUTER_SYNC_STATE_FILE: ${ROUTER_SYNC_STATE_FILE:-/var/lib/vespa-relay/sync-cursors.json}
      # How long a recorded sync window narrows work before the whole filter is
      # walked again. Nothing is capped — the full pass is periodic, not skipped.
      ROUTER_FULL_RESYNC_SECONDS: ${ROUTER_FULL_RESYNC_SECONDS:-604800}
      # This relay's own keypair: NIP-11 self, NIP-42 auth, NIP-66 monitor.
      # nsec1… or 64 hex. Unset ⇒ the relay acts anonymously. See .env.example.
      RELAY_NSEC: ${RELAY_NSEC:-}
      PARSE_AUDIT_FILE: ${PARSE_AUDIT_FILE:-}
      PARSE_AUDIT_SAMPLES: ${PARSE_AUDIT_SAMPLES:-5}
      PARSE_AUDIT_INTERVAL_SECONDS: ${PARSE_AUDIT_INTERVAL_SECONDS:-60}
    ports:
      - "${RELAY_PORT:-7777}:7777"
    volumes:
      # Mounts your local ./router.conf into the container when the router is on.
      # Harmless when ROUTER_CONFIG_FILE is empty (nothing reads the file).
      - ${ROUTER_CONFIG_LOCAL:-./router.conf.example}:/etc/vespa-relay/router.conf:ro
      # Where PARSE_AUDIT_FILE lands, so the report is readable on the host.
      - ${PARSE_AUDIT_LOCAL_DIR:-./.audit}:/var/lib/vespa-relay
    restart: unless-stopped

volumes:
  vespa_var:
