# The whole thing in one command: a single-node Vespa plus the trust-ranking relay.
#
#   docker compose up --build                  # serve only
#   docker compose --profile sync up --build   # …plus the mirror (see below)
#
# Both processes deploy the bundled schema to Vespa on every boot (AUTO_DEPLOY) —
# first run and schema upgrades alike — then serves the NIP-50 websocket, the
# NIP-11 doc, and the web UI on RELAY_PORT.
#
# Mirroring upstream relays into the same store is the `sync` service — the
# router — its own process so it can be restarted with a new router.conf,
# retuned, or lost to an OOM without the relay dropping a client or Vespa
# replaying a transaction log. It is behind the `sync` profile: the profile IS
# the on-switch (`docker compose --profile sync up -d`), replacing the old
# "SYNC_CONFIG_FILE set on the relay" convention. The relay now refuses to
# boot if a stream config is still aimed at it, so a stale .env fails loud
# instead of silently not mirroring.

services:
  vespa:
    image: vespaengine/vespa
    container_name: vespa
    hostname: vespa
    # A LIMIT, not a reservation. Without one every container sees the whole
    # Docker VM and each sizes itself against it: the engine settles around 32
    # GiB while the JVMs' MaxRAMPercentage lets their heaps take most of it,
    # so together they are entitled to more memory than the machine has.
    # Nothing collides while the JVMs are idle, and the workload that would
    # collide — the sync process holding a negentropy id snapshot — is its
    # normal one.
    #
    # The engine gets the larger share because losing it is worse: either JVM
    # restarts in seconds, while a killed content node replays its
    # transaction log for minutes before it serves anything.
    mem_limit: ${VESPA_MEM_LIMIT:-34g}
    ports:
      # LOOPBACK ONLY. Both of these bypass the relay completely: 8080 reads and
      # DELETES documents through the document API, and 19071 is the config
      # server that deploys the schema. Bound to all interfaces they are
      # reachable from the LAN, and from anything tunnelling this host.
      #
      # The relay's own port is the only one meant to be public — it serves the
      # web pages and the NIP-01/NIP-50 websocket, and nothing else.
      - "127.0.0.1:${VESPA_PORT:-8080}:8080" # query / document API
      - "127.0.0.1:${VESPA_CONFIG_PORT:-19071}:19071" # config server
    volumes:
      - vespa_var:/opt/vespa/var
    healthcheck:
      # A query that returns a CONTENT NODE, not the config server and not a
      # bare HTTP 200. :19071 answers within seconds of the container starting,
      # and a container whose content node is still loading answers a search with
      # 200 and {"documents":0,"nodes":0} — so both weaker probes make
      # `depends_on: service_healthy` mean "Vespa exists" rather than "Vespa has
      # the corpus". Everything the relay does at startup then runs against an
      # apparently empty store: the trust reconcile finds no providers and calls
      # itself consistent, and every dynamic stream finds no relays. Requiring a
      # node still passes on a genuinely empty store, where nodes is 2 and
      # documents is 0.
      test:
        - CMD-SHELL
        - >-
          curl -fSs 'http://localhost:8080/search/?yql=select+*+from+sources+*+where+true&hits=0&timeout=3s'
          | grep -q '"nodes":[1-9]'
      interval: 5s
      timeout: 5s
      # A cold 20M-doc index takes minutes; these bound the wait at ~30, and a
      # relay that starts anyway would only find an empty store.
      retries: 180
      start_period: 120s
    restart: unless-stopped

  relay:
    build: .
    # Named so the sync service reuses the one image instead of building the
    # same context twice.
    image: vespa-relay
    container_name: vespa-relay
    # Serving only, since the mirror moved to the sync service: this heap
    # carries client REQs, the background trust reconcile, and the optional
    # FTS reindex — not the negentropy id snapshots, which were what needed
    # 12g. Those went with the sync process, and this dropped to 6g.
    mem_limit: ${RELAY_MEM_LIMIT:-6g}
    depends_on:
      vespa:
        condition: service_healthy
    environment:
      # Heap is MaxRAMPercentage of mem_limit above — the percentage reads the
      # cgroup, and without a limit it reads the HOST, sizing the heap against
      # memory the engine has already claimed. Per-process override first: the
      # two JVMs are sized 2x apart, so a bare JAVA_TOOL_OPTIONS tuned for the
      # sync's reconcile heap would silently retune the serving relay too.
      JAVA_TOOL_OPTIONS: ${RELAY_JAVA_TOOL_OPTIONS:-${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70}}
      VESPA_URL: http://vespa:8080
      RELAY_PORT: 7777
      # Migration tripwires, not settings: the relay refuses to boot when a
      # stream config is still aimed at it (the mirror is the sync service
      # now). Compose only injects what is mapped, so without these
      # pass-throughs a stale .env would sail past the guard and the mirror
      # would be silently gone. Value never used — presence alone fires it.
      SYNC_CONFIG: ${SYNC_CONFIG:-}
      SYNC_CONFIG_FILE: ${SYNC_CONFIG_FILE:-}
      ROUTER_CONFIG: ${ROUTER_CONFIG:-}
      ROUTER_CONFIG_FILE: ${ROUTER_CONFIG_FILE:-}
      # Deploy the bundled schema on boot (default true; see AUTO_DEPLOY docs).
      AUTO_DEPLOY: ${AUTO_DEPLOY:-}
      # Write authorization and the NIP-86 management API. Documented in
      # docs/configuration.md; previously read by the relay but never passed
      # through, so a .env ban list was silently unenforced under compose.
      ALLOW_PUBKEYS: ${ALLOW_PUBKEYS:-}
      DENY_PUBKEYS: ${DENY_PUBKEYS:-}
      ALLOW_KINDS: ${ALLOW_KINDS:-}
      DENY_KINDS: ${DENY_KINDS:-}
      RELAY_ADMIN_PUBKEYS: ${RELAY_ADMIN_PUBKEYS:-}
      # NIP-86 ban state that must outlive the container — put it in the
      # mounted volume, e.g. /var/lib/vespa-relay/relay-state.json.
      RELAY_STATE_FILE: ${RELAY_STATE_FILE:-}
      REJECT_FUTURE_SECONDS: ${REJECT_FUTURE_SECONDS:-}
      EXPIRATION_SWEEP_SECONDS: ${EXPIRATION_SWEEP_SECONDS:-}
      LOG_CONNECTIONS: ${LOG_CONNECTIONS:-}
      # This relay's own public ws url (NIP-42 identity / NIP-62 vanish scope).
      RELAY_URL: ${RELAY_URL:-ws://localhost:7777}
      # The SECOND address the same relay answers at, when the `onion` profile
      # is on: the hidden service's container mints it and writes it here, and
      # the relay reads it to accept NIP-42 from Tor clients — they sign the
      # address they dialled, which is never RELAY_URL. Harmless with the
      # profile off: nothing writes the file, the relay says nothing, and the
      # mount is an empty volume. RELAY_ONION_URL is for a hidden service run
      # outside this compose file, where no container publishes a hostname.
      RELAY_ONION_HOSTNAME_FILE: ${RELAY_ONION_HOSTNAME_FILE-/var/lib/onion/hostname}
      RELAY_ONION_URL: ${RELAY_ONION_URL:-}
      # The clearnet endpoint NAMES the hidden service in `Onion-Location` on
      # every response, so Tor-capable clients move themselves inside the
      # network and Tor Browser offers the ".onion available" button. `false`
      # for an onion meant to stay unlisted — the relay still authenticates
      # whoever dials it, it just stops handing the address out.
      RELAY_ONION_ADVERTISE: ${RELAY_ONION_ADVERTISE:-}
      # How the relay presents itself in its NIP-11 document. All optional —
      # empty values are omitted from the doc. See .env.example.
      RELAY_NAME: ${RELAY_NAME:-vespa-relay}
      RELAY_DESCRIPTION: ${RELAY_DESCRIPTION:-}
      RELAY_ICON: ${RELAY_ICON:-}
      RELAY_BANNER: ${RELAY_BANNER:-}
      RELAY_CONTACT: ${RELAY_CONTACT:-}
      RELAY_CONTACT_PUBKEY: ${RELAY_CONTACT_PUBKEY:-}
      RELAY_POSTING_POLICY: ${RELAY_POSTING_POLICY:-}
      RELAY_PRIVACY_POLICY: ${RELAY_PRIVACY_POLICY:-}
      RELAY_TERMS_OF_SERVICE: ${RELAY_TERMS_OF_SERVICE:-}
      # Settle the trust projection after boot, in the background — the relay
      # serves immediately either way; ranked search may return thin results
      # until the reconcile finishes (12+ minutes at 36M kind-30382 events).
      # Set false to skip it and leave ranked search unsettled until a
      # reconcile is run some other way.
      TRUST_RECONCILE_ON_START: ${TRUST_RECONCILE_ON_START:-}
      # Re-derive every event's search fields once, in the background. Needed
      # after a store upgrade that changes which kinds are searchable, how they
      # are decomposed, or that adds FED search fields — those are written at
      # put time, so only a re-feed can backfill them and a Vespa reindex
      # cannot. Walks the whole corpus; leave off except for the one boot that
      # performs the migration.
      REINDEX_FTS_ON_START: ${REINDEX_FTS_ON_START:-}
      # DELETE kind-30382 cards from services no stored 10040 names. A by-kind
      # 30382 sync pulls every service publishing on an upstream — 87 on
      # nip85.nosfabrica.com against the handful our 10040s actually name — and
      # those cards rank nothing and are read by nobody. Anything other than
      # `true` is a DRY RUN. Reclaims space only until the same by-kind filter
      # re-downloads it, so it pairs with narrowing that stream.
      SWEEP_ORPHAN_SCORES_ON_START: ${SWEEP_ORPHAN_SCORES_ON_START:-}
      # Where the reindex walk saves its position. In the mounted volume, so a
      # restart resumes instead of redoing the corpus — the store's cursor is
      # resumable by design and holding it only in memory cost 12.2M events
      # when one page failed.
      FTS_CURSOR_FILE: ${FTS_CURSOR_FILE:-/var/lib/vespa-relay/fts-cursor.txt}
      # How often the corpus statistics behind GET /stats.json are recomputed.
      # The grouping queries compete with client reads, so 0 (off) is a
      # legitimate choice on a busy box — the endpoint then serves whatever the
      # state file holds. Runs behind the server either way; a first pass over
      # this corpus is minutes and no restart waits on it.
      STATS_INTERVAL_SECONDS: ${STATS_INTERVAL_SECONDS:-}
      # …and where that document lands. In the mounted volume for the same
      # reason as the cursor above: a deploy would otherwise blank the page for
      # as long as the first rollup takes, and the file is readable on the host.
      STATS_FILE: ${STATS_FILE:-/var/lib/vespa-relay/stats.json}
      # How many engine queries the store's bulk stages keep in flight. The
      # store's default is 4, measured on heavy bulk-stage queries; too high
      # 504s the summary stage ("Summary data is incomplete").
      VESPA_QUERY_FANOUT: ${VESPA_QUERY_FANOUT:-}
      # Quartz's own log floor (it defaults to DEBUG, which makes malformed
      QUARTZ_LOG_LEVEL: ${QUARTZ_LOG_LEVEL:-}
      # This relay's own keypair: NIP-11 self, NIP-42 auth. The sync service
      # gets the same key, so upstream AUTH and the NIP-66 monitor speak as
      # the relay they feed. nsec1… only. Unset ⇒ anonymous. See .env.example.
      RELAY_NSEC: ${RELAY_NSEC:-}
    ports:
      - "${RELAY_PORT:-7777}:7777"
    volumes:
      # Where FTS_CURSOR_FILE lands, so the walk's position survives the
      # container and is readable on the host. Shared with the sync service,
      # which keeps its own files (sync-cursors.json, the parse audit) there.
      - ${PARSE_AUDIT_LOCAL_DIR:-./.audit}:/var/lib/vespa-relay
      # READ ONLY, and only the published hostname — never the hidden service's
      # key directory. This is the internet-facing process; the key that IS the
      # .onion address stays in the container that generates it.
      - onion_addr:/var/lib/onion:ro
    restart: unless-stopped

  # The router, as its own process. Restart it as often as router.conf changes:
  #   docker compose --profile sync restart sync
  # The relay keeps serving throughout, and the sync cursors (SYNC_STATE_FILE)
  # make the re-run resume instead of re-downloading.
  sync:
    build: .
    image: vespa-relay
    entrypoint: ["/app/sync/bin/vespa-sync"]
    container_name: vespa-sync
    profiles: ["sync"]
    # The negentropy reconciliation holds one local id snapshot per stream IN
    # MEMORY — the single biggest allocation either JVM makes, and the reason
    # this limit is the largest. The streams are serialised, so the peak is
    # ONE stream's id set rather than every stream's sum; the largest single
    # one — 43.7M ids for the assertions filter — is about 5.3 GiB, and at 70%
    # of 12g the heap holds it with room to run ingest beside it. (The JVM
    # default of 25% OOM'd at 8.4 GiB the first time every stream asked for
    # full history, back when the mirror shared the relay's container.)
    #
    # With this profile on, check the machine's total against VESPA_MEM_LIMIT
    # + RELAY_MEM_LIMIT + this — the defaults sum to 52g, which the 47 GiB
    # reference box in the docs cannot hold. Trim ~5g from whichever share
    # your deployment can spare (e.g. VESPA_MEM_LIMIT=30g SYNC_MEM_LIMIT=10g;
    # 70% of 10g still holds the 5.3 GiB assertions snapshot with margin).
    mem_limit: ${SYNC_MEM_LIMIT:-12g}
    depends_on:
      vespa:
        condition: service_healthy
      # Started (not healthy — the relay has no healthcheck): lets the relay's
      # boot deploy usually land first and the /pressure feed come up close to
      # ingest. Ordering is best-effort either way; SyncMain retries a lost
      # deploy race and the pressure poller announces a feed that never
      # connects, so this is comfort, not correctness.
      relay:
        condition: service_started
      # Started, NOT healthy. A Tor that never comes up must not hold the
      # clearnet mirror hostage — most of what this process syncs needs no
      # circuit at all. The router probes the SOCKS port itself before each
      # cycle that would dial a hidden service, says which way it answered,
      # and skips those relays without publishing anything about them.
      tor:
        condition: service_started
    environment:
      # Heap is MaxRAMPercentage of mem_limit above; see the relay's note.
      # Per-process override first — this is the JVM the reconcile heap
      # sizing story belongs to.
      JAVA_TOOL_OPTIONS: ${SYNC_JAVA_TOOL_OPTIONS:-${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70}}
      VESPA_URL: http://vespa:8080
      # Deploy the bundled schema on boot (default true) — this process is the
      # one whose writes a drifted schema silently discards.
      AUTO_DEPLOY: ${AUTO_DEPLOY:-}
      # The served relay's ws url — mirrored events are stored as that relay's,
      # whichever process writes them. It is also what a mirrored kind 62 is
      # judged against: a vanish request naming this url (or ALL_RELAYS) sweeps
      # its author's history here, one naming some other relay is stored inert.
      RELAY_URL: ${RELAY_URL:-ws://localhost:7777}
      # The streams to mirror. The profile is the on-switch, so this defaults
      # to the mounted path instead of empty; SYNC_CONFIG_LOCAL (below) picks
      # which local file is mounted there. The nested ROUTER_ fallback stays
      # deliberately: compose only passes through what is mapped here, so
      # without it a .env still on the old name would silently mirror the
      # mounted default instead of the file it names.
      SYNC_CONFIG_FILE: ${SYNC_CONFIG_FILE:-${ROUTER_CONFIG_FILE:-/etc/vespa-relay/router.conf}}
      # Clients first, across the process boundary: the relay serves its mean
      # read latency on GET /pressure and this process throttles ingest on it.
      # Unset it to mirror at full speed regardless of readers.
      SYNC_PRESSURE_URL: ${SYNC_PRESSURE_URL:-http://relay:7777/pressure}
      # Mean read latency (ms) above which ingest starts yielding.
      SERVING_PRESSURE_THRESHOLD_MS: ${SERVING_PRESSURE_THRESHOLD_MS:-}
      # How often (seconds) up/both streams re-reconcile to push new local events.
      SYNC_UP_INTERVAL_SECONDS: ${SYNC_UP_INTERVAL_SECONDS:-${ROUTER_UP_INTERVAL_SECONDS:-300}}
      # Ingest tuning. Throughput comes from the batch size, not the worker count
      # (the store serializes writes). Lower the batch to cut memory.
      SYNC_INGEST_BATCH: ${SYNC_INGEST_BATCH:-${ROUTER_INGEST_BATCH:-1000}}
      SYNC_INGEST_CONCURRENCY: ${SYNC_INGEST_CONCURRENCY:-${ROUTER_INGEST_CONCURRENCY:-2}}
      # Defaults for `relaySource = [...]` streams, whose relay list is read out of
      # the store's own events instead of the config (see the `outbox` and
      # `assertions` streams in router.conf.example). Per-stream keys override these.
      SYNC_DYNAMIC_REFRESH_SECONDS: ${SYNC_DYNAMIC_REFRESH_SECONDS:-${ROUTER_DYNAMIC_REFRESH_SECONDS:-21600}}
      SYNC_DYNAMIC_CONCURRENCY: ${SYNC_DYNAMIC_CONCURRENCY:-${ROUTER_DYNAMIC_CONCURRENCY:-8}}
      # For `sync = "auto"` streams: how many events both we and the relay must
      # hold on the stream's filter before a negentropy reconcile is worth its id
      # exchange, and how long the relay gets to answer the NIP-45 COUNT that
      # measures it. Streams that declare `sync` in router.conf ignore both.
      SYNC_NEG_MIN_EVENTS: ${SYNC_NEG_MIN_EVENTS:-${ROUTER_NEG_MIN_EVENTS:-100000}}
      # Run only these streams (comma-separated), so one part of the sync can be
      # tuned without the rest competing for the same sockets, heap and ingest
      # queue. Empty (the default) runs every stream the config defines. The
      # router prints what it is NOT running on every startup, so a leftover
      # setting can't be mistaken for a stream that is failing.
      #   SYNC_STREAMS=contentViaOutbox docker compose --profile sync up -d sync
      SYNC_STREAMS: ${SYNC_STREAMS:-${ROUTER_STREAMS:-}}
      # What goes down the wire to upstream relays. Empty (the default) still
      # logs what the relay COMPLAINS about — NOTICE, CLOSED, failed sends —
      # which are the relay telling us why it stopped and were previously
      # discarded. "sent" adds every command we send; "full" adds every message
      # received, which is a line per event and is for a specific investigation.
      SYNC_WIRE_LOG: ${SYNC_WIRE_LOG:-${ROUTER_WIRE_LOG:-}}
      # Name one stream to get a line per relay from it: how many authors it was
      # paired with, how many asks that became, how many legs the cursor left,
      # and what came back. A dynamic fan-out is 16k relays wide, so this is a
      # diagnostic run, not a setting to leave on.
      SYNC_DIAGNOSE: ${SYNC_DIAGNOSE:-}
      # Where the per-(relay, filter) synced created_at band is kept, so a relay
      # without NIP-77 resumes instead of re-reading its corpus every restart —
      # and so a `restart sync` after a config edit costs a diff, not a corpus.
      SYNC_STATE_FILE: ${SYNC_STATE_FILE:-${ROUTER_SYNC_STATE_FILE:-/var/lib/vespa-relay/sync-cursors.json}}
      # How long a recorded sync window narrows work before the whole filter is
      # walked again. Nothing is capped — the full pass is periodic, not skipped.
      SYNC_FULL_RESYNC_SECONDS: ${SYNC_FULL_RESYNC_SECONDS:-${ROUTER_FULL_RESYNC_SECONDS:-604800}}
      # Automatic negentropy paging. Past SYNC_NEG_PAGE_TARGET local events on a
      # stream's filter, a backfill reconciles it in created_at windows instead
      # of one whole-filter pass — bounding the id snapshot we build and making
      # a killed sync resumable. The window size is learned per peer (shrunk on
      # a refusal, grown on a clean window) and kept in the sweep state file,
      # which belongs in the volume for the same reason the band file does.
      SYNC_NEG_PAGE_TARGET: ${SYNC_NEG_PAGE_TARGET:-}
      SYNC_NEG_PAGE_SLACK_SECONDS: ${SYNC_NEG_PAGE_SLACK_SECONDS:-}
      SYNC_SWEEP_STATE_FILE: ${SYNC_SWEEP_STATE_FILE:-/var/lib/vespa-relay/sync-sweeps.json}
      # The ids the store has twice refused as permanently unstorable — an older
      # version of a replaceable event, a NIP-09 target, a vanished author's
      # history — so a reconcile stops asking upstreams for them every cycle.
      # UNSET IS OFF: nothing is remembered and nothing is suppressed, which is
      # exactly how the router behaved before this existed. Point it into the
      # volume to turn it on. Per-epoch mmap'd cuckoo filters, so this costs
      # page cache rather than heap; capacity is per created_at quarter and an
      # epoch that fills says so loudly rather than degrading.
      SYNC_REFUSED_DIR: ${SYNC_REFUSED_DIR:-}
      SYNC_REFUSED_EPOCH_SECONDS: ${SYNC_REFUSED_EPOCH_SECONDS:-}
      SYNC_REFUSED_EPOCH_CAPACITY: ${SYNC_REFUSED_EPOCH_CAPACITY:-}
      # How many engine queries the store's bulk stages keep in flight — the
      # dedup preload on this side is an id-only lookup and far lighter than
      # the relay's summaries, so this is worth sweeping on a deployment whose
      # ingest is dedup-bound.
      VESPA_QUERY_FANOUT: ${VESPA_QUERY_FANOUT:-}
      QUARTZ_LOG_LEVEL: ${QUARTZ_LOG_LEVEL:-}
      # Same key as the relay: upstream NIP-42 AUTH and the NIP-66 monitor
      # sign as the relay this process feeds.
      RELAY_NSEC: ${RELAY_NSEC:-}
      # Opt-in parse audit — it rides ingest, so it lives on this side of the
      # split. Point PARSE_AUDIT_FILE inside /var/lib/vespa-relay, which the
      # volume below maps to PARSE_AUDIT_LOCAL_DIR on the host, so the report
      # is readable without entering the container. Unset ⇒ off.
      PARSE_AUDIT_FILE: ${PARSE_AUDIT_FILE:-}
      PARSE_AUDIT_SAMPLES: ${PARSE_AUDIT_SAMPLES:-5}
      PARSE_AUDIT_INTERVAL_SECONDS: ${PARSE_AUDIT_INTERVAL_SECONDS:-60}
      # Where .onion upstreams are dialled. Defaults to the `tor` service
      # below, which the same profile starts — a .onion relay is unreachable
      # without it, and the router refuses to boot on one it cannot dial
      # rather than timing out on it every cycle. Set it empty for a
      # clearnet-only deployment; discovery then drops .onion urls.
      SYNC_TOR_SOCKS: ${SYNC_TOR_SOCKS-tor:9050}
      # Send EVERY upstream through Tor, not only the hidden services. A
      # different deployment, not a stronger default: a 20k-relay cycle over
      # Tor is a fraction of the throughput and some large relays refuse exit
      # traffic outright.
      SYNC_TOR_ALL: ${SYNC_TOR_ALL:-}
      # A circuit and a rendezvous, not a TCP handshake — the clearnet
      # `connectionTimeout = 20` in router.conf is far too short to size this.
      SYNC_TOR_CONNECT_TIMEOUT_SECONDS: ${SYNC_TOR_CONNECT_TIMEOUT_SECONDS:-}
      # Tor builds a circuit per stream; this is not the 1024-socket clearnet
      # budget, and it is deliberately its own dispatcher so onion dials
      # cannot draw the fan-out's slots down.
      SYNC_TOR_MAX_SOCKETS: ${SYNC_TOR_MAX_SOCKETS:-}
    volumes:
      # Mounts your local ./router.conf into the container. Copy the bundled
      # example and point SYNC_CONFIG_LOCAL at your copy.
      - ${SYNC_CONFIG_LOCAL:-${ROUTER_CONFIG_LOCAL:-./router.conf.example}}:/etc/vespa-relay/router.conf:ro
      # Sync cursors + the parse audit report, shared with the relay's mount.
      - ${PARSE_AUDIT_LOCAL_DIR:-./.audit}:/var/lib/vespa-relay
    restart: unless-stopped

  # The Tor transport for .onion upstreams. Its own container, not a daemon
  # inside the sync image: that image carries BOTH processes, so installing Tor
  # in it would put it in the serving relay too, and `restart sync` — a
  # router.conf edit, meant to be cheap — would drop every circuit and
  # re-bootstrap. Here, the router reconnects and Tor never notices.
  #
  # No published port. An open SOCKS proxy on a public interface is an open
  # proxy; this one exists for the sync container and the torrc's SocksPolicy
  # says so a second time.
  tor:
    build: ./tor
    image: vespa-relay-tor
    container_name: vespa-tor
    profiles: ["sync"]
    # A client-only Tor is small — this is a ceiling against a runaway, not a
    # reservation. Count it with the other three when checking the machine's
    # total; it is the only one that rounds to nothing.
    mem_limit: ${TOR_MEM_LIMIT:-256m}
    healthcheck:
      # The SOCKS port LISTENING is what the router probes before it dials any
      # hidden service, so it is what the healthcheck should mean too. It does
      # NOT prove Tor has bootstrapped — `docker compose logs tor` and its
      # "Bootstrapped 100%" line is the check for that.
      #
      # netstat, not `nc -z`: both come from busybox in this image, but the -z
      # scan flag is a build option busybox is not guaranteed to carry, and a
      # healthcheck that fails on a missing flag reports a working Tor as
      # broken. Reading the listening set needs no flag anyone can omit.
      test: ["CMD-SHELL", "netstat -lnt | grep -q ':9050 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # The relay's own front door on Tor: one hidden service, forwarding to the
  # relay's websocket port, so any client that speaks Tor can reach this relay
  # without the clearnet name, a certificate, or a public IP.
  #
  #   docker compose --profile onion up -d
  #   docker compose logs tor-onion | grep 'reachable at'
  #
  # A SECOND Tor container rather than a second job for the `tor` above: that
  # one is the router's client proxy and lives behind the `sync` profile, and
  # the two are wanted independently — a serving-only deployment wants a front
  # door and no mirror; a mirror wants .onion upstreams and need not be on Tor
  # itself. Sharing one daemon would also tie this service's descriptor to
  # `restart sync`, which is meant to be a cheap router.conf edit.
  tor-onion:
    build: ./tor
    image: vespa-relay-tor
    container_name: vespa-tor-onion
    profiles: ["onion"]
    # Same image, the other config: this entrypoint resolves the relay's
    # address, generates the torrc around it, publishes the .onion hostname for
    # the relay to read, and execs tor.
    entrypoint: ["/usr/local/bin/publish-onion"]
    # Root only to hand the volumes to the tor user; the daemon drops to
    # `User tor` from torrc-onion and never runs as root.
    user: root
    mem_limit: ${TOR_MEM_LIMIT:-256m}
    environment:
      # The SAME variable the relay reads, so the two cannot drift: one names
      # where the address is written and the other where it is read, and they
      # are one file on the shared volume.
      ONION_HOSTNAME_FILE: ${RELAY_ONION_HOSTNAME_FILE-/var/lib/onion/hostname}
    depends_on:
      # Started, not healthy (the relay has no healthcheck): the entrypoint has
      # to resolve `relay` on this network before Tor can be configured, and it
      # waits for the name either way.
      relay:
        condition: service_started
    volumes:
      # The service key — the .onion address IS its public half. A named
      # volume, because losing it means coming back at a different address with
      # every client that had the old one pointed at nothing. Mounted here and
      # nowhere else.
      - tor_onion:/var/lib/tor
      # …and the address alone, for the relay to read (see its `:ro` mount).
      - onion_addr:/var/lib/onion
      # Extra torrc lines for this service, appended to the generated config —
      # latency, PoW defenses, introduction points. The bundled example is all
      # comments and changes nothing; ONION_EXTRA_LOCAL points at your copy,
      # the same way SYNC_CONFIG_LOCAL points at your router.conf.
      - ${ONION_EXTRA_LOCAL:-./tor/onion.extra.conf.example}:/etc/tor/onion.extra.conf:ro
    healthcheck:
      # The published hostname, which is what this container exists to produce.
      # It does NOT prove the descriptor reached the network — `docker compose
      # logs tor-onion` and its "Bootstrapped 100%" line is the check for that.
      test: ["CMD-SHELL", "test -s /var/lib/onion/hostname"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  vespa_var:
  # The hidden service's key directory, and the one file the relay reads out of
  # it. Two volumes on purpose: the address is public and the key is not, and
  # only the address is mounted into the internet-facing container.
  tor_onion:
  onion_addr:
